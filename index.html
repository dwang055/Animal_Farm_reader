    {
      "id": 7,
      "title": "Chapter 7",
      "sections": [
        {
          "sectionId": 1,
          "heading": "A Bitter Winter and Deception",
          "paragraphs": [
            {
              "en": "It was a bitter winter. The stormy weather was followed by <span class=\"vocab-trigger\" data-vocab=\"sleet and snow\">sleet and snow<\/span>, and then by a hard frost which did not break till well into February. The animals carried on as best they could with the rebuilding of the windmill, well knowing that the outside world was watching them and that the <span class=\"vocab-trigger\" data-vocab=\"envious\">envious<\/span> human beings would <span class=\"vocab-trigger\" data-vocab=\"rejoice and triumph\">rejoice and triumph<\/span> if the mill were not finished on time.",
              "zh": "那是一个严酷的冬天。暴风雨过后，接着是雨夹雪，然后又是坚硬的霜冻，直到二月过半才开始解冻。动物们竭尽全力继续重建风车，他们很清楚，外面的世界在盯着他们，那些充满嫉妒的人类如果风车不能按时完工，一定会欢欣鼓舞、幸灾乐祸。",
              "simpEn": "It was a very hard winter. After the storms came icy rain and snow, then a deep freeze that lasted until well into February. The animals kept rebuilding the windmill as well as they could, knowing the outside world was watching and that jealous humans would celebrate if they failed.",
              "simpZh": "那个冬天冷得厉害。暴风雨过后是雨夹雪，然后冻得硬邦邦，一直到二月过半才化。动物们尽力继续修风车，知道外面的人在盯着，要是风车不能按时完工，那些眼红的人类肯定高兴得不得了。"
            },
            {
              "en": "Out of spite, the human beings pretended not to believe that it was Snowball who had destroyed the windmill: they said that it had fallen down because the walls were too thin. The animals knew that this was not the case. Still, it had been decided to build the walls three feet thick this time instead of eighteen inches as before, which meant collecting much larger quantities of stone. For a long time the quarry was full of <span class=\"vocab-trigger\" data-vocab=\"snowdrifts\">snowdrifts<\/span> and nothing could be done. Some progress was made in the dry frosty weather that followed, but it was <span class=\"vocab-trigger\" data-vocab=\"cruel work\">cruel work<\/span>, and the animals could not feel so hopeful about it as they had felt before. They were always cold, and usually hungry as well. Only Boxer and Clover never <span class=\"vocab-trigger\" data-vocab=\"lost heart\">lost heart<\/span>. Squealer made excellent speeches on the joy of service and the <span class=\"vocab-trigger\" data-vocab=\"dignity of labour\">dignity of labour<\/span>, but the other animals found more <span class=\"vocab-trigger\" data-vocab=\"inspiration\">inspiration<\/span> in Boxer's strength and his never-failing cry of “I will work harder!”",
              "zh": "出于恶意，人类假装不相信是雪球摧毁了风车：他们说风车倒塌是因为墙壁太薄。动物们知道事实并非如此。不过，这次还是决定把墙建到三英尺厚，而不是先前的十八英寸，这意味着要收集多得多的石料。很长一段时间，采石场堆满了雪堆，什么也干不了。接下来的干冷天气里取得了一些进展，但那活儿非常艰苦，动物们不像先前那样充满希望。他们总是又冷又饿。只有拳击手和苜蓿从不气馁。尖啸者就服务的快乐和劳动的尊严发表了精彩的演说，但其他动物从拳击手的力量和他那永不衰竭的“我要更加努力地干活！”中获得了更多的鼓舞。",
              "simpEn": "Out of spite, humans pretended the windmill fell because the walls were too thin, not because of Snowball. The animals knew this wasn't true. Still, they decided to make the walls three feet thick this time, which meant gathering far more stone. The quarry was full of snow for a long time so nothing could be done. Some work happened in dry cold weather, but it was harsh, and the animals were less hopeful. They were always cold and often hungry. Only Boxer and Clover never gave up. Squealer gave speeches about joy and dignity in work, but the animals drew more strength from Boxer's efforts and his cry 'I will work harder!'",
              "simpZh": "人类出于坏心眼，假装不信是雪球弄倒的风车，说是墙太薄。动物们知道不是。不过这回决定把墙建到三英尺厚，原来才十八英寸，得多采好多石头。石场好久都是雪堆，没法干。干冷天干了点，可太苦了，动物不像以前那样有盼头。他们老是又冷又饿。只有拳击手和苜蓿不泄气。尖啸者大讲服务的快乐和劳动的尊严，可动物们从拳击手的力气和那句“我要更卖力”里更受鼓舞。"
            },
            {
              "en": "In January food fell short. The corn ration was <span class=\"vocab-trigger\" data-vocab=\"drastically reduced\">drastically reduced<\/span>, and it was announced that an extra potato ration would be issued to <span class=\"vocab-trigger\" data-vocab=\"make up for it\">make up for it<\/span>. Then it was discovered that the greater part of the potato crop had been <span class=\"vocab-trigger\" data-vocab=\"frosted in the clamps\">frosted in the clamps<\/span>, which had not been covered thickly enough. The potatoes had become soft and <span class=\"vocab-trigger\" data-vocab=\"discoloured\">discoloured<\/span>, and only a few were edible. For days at a time the animals had nothing to eat but <span class=\"vocab-trigger\" data-vocab=\"chaff and mangels\">chaff and mangels<\/span>. Starvation seemed to <span class=\"vocab-trigger\" data-vocab=\"stare them in the face\">stare them in the face<\/span>.",
              "zh": "到了一月，粮食短缺了。玉米口粮被大幅削减，并宣布额外配发马铃薯以弥补不足。随后却发现，大部分马铃薯因贮藏坑覆盖得不够厚而冻坏了。马铃薯变得软烂变色，只有少数还能吃。动物们一连几天只能吃谷壳和饲用甜菜。饥饿似乎就在眼前。",
              "simpEn": "By January food ran short. Corn rations were cut heavily, and extra potatoes were promised to make up the difference. But then they found that most of the potato crop had frozen in storage because the pits weren't covered well enough. The potatoes were soft and spoiled, few were edible. For days the animals ate nothing but husks and root vegetables. They seemed close to starving.",
              "simpZh": "到了一月粮食不够了。玉米口粮大减，说多给土豆补上。可后来发现大半土豆因为窖盖得不够厚冻坏了。土豆变软变色，没几个能吃。动物们一连几天只能吃谷壳和甜菜。眼看着就要饿死。"
            },
            {
              "en": "It was <span class=\"vocab-trigger\" data-vocab=\"vitally necessary\">vitally necessary<\/span> to <span class=\"vocab-trigger\" data-vocab=\"conceal\">conceal<\/span> this fact from the outside world. <span class=\"vocab-trigger\" data-vocab=\"Emboldened\">Emboldened<\/span> by the collapse of the windmill, the human beings were inventing fresh lies about Animal Farm. Once again it was being <span class=\"vocab-trigger\" data-vocab=\"put about\">put about<\/span> that all the animals were dying of famine and disease, and that they were continually fighting among themselves and had <span class=\"vocab-trigger\" data-vocab=\"resorted to cannibalism and infanticide\">resorted to cannibalism and infanticide<\/span>. Napoleon was well aware of the bad results that might follow if the real facts of the food situation were known, and he decided to make use of Mr. Whymper to spread a contrary impression. <span class=\"vocab-trigger\" data-vocab=\"Hitherto\">Hitherto<\/span> the animals had had little or no contact with Whymper on his weekly visits: now, however, a few selected animals, mostly sheep, were instructed to <span class=\"vocab-trigger\" data-vocab=\"remark casually\">remark casually<\/span> in his hearing that rations had been increased. In addition, Napoleon ordered the almost empty bins in the store-shed to be filled nearly to the brim with sand, which was then covered up with what remained of the grain and meal. On some suitable <span class=\"vocab-trigger\" data-vocab=\"pretext\">pretext<\/span> Whymper was led through the store-shed and allowed to <span class=\"vocab-trigger\" data-vocab=\"catch a glimpse\">catch a glimpse<\/span> of the bins. He was deceived, and continued to report to the outside world that there was no food shortage on Animal Farm.",
              "zh": "对外界隐瞒这一事实是极其必要的。风车的倒塌让人类胆子壮了起来，他们编造了关于动物农场的新谎言。再一次，外界在散布说动物们正死于饥荒和疾病，而且不断内斗，甚至发生了同类相食和杀婴。拿破仑非常清楚，倘若粮食状况的真相被外界知晓，后果会非常糟糕，于是决定利用温珀先生散布相反的印象。在此之前，动物们在温珀每周来访时几乎不和他接触；如今，一些挑选出来的动物，多半是绵羊，被授意在他听得见的地方假装不经意地说口粮增加了。此外，拿破仑还吩咐把储藏室里几乎空了的箱子用沙子装到快满，然后在上面盖一层剩下的谷物和粉料。找了个适当的借口，温珀被领着穿过储藏室，让他匆匆瞥了一眼那些箱子。他被蒙骗了，继续向外界报告说动物农场没有粮食短缺。",
              "simpEn": "It was absolutely necessary to hide this from the outside world. Made bold by the windmill's fall, humans made up new lies about Animal Farm. Stories spread again that animals were dying of hunger and disease, fighting each other, and had turned to eating each other and their young. Napoleon knew the danger if the truth got out, so he used Mr. Whymper to spread a false impression. Until now animals had little contact with Whymper, but now selected ones, mostly sheep, were told to casually mention that food rations had increased. Napoleon also ordered the nearly empty bins in the store to be filled almost to the top with sand, then covered with remaining grain. Under some excuse, Whymper was led through and allowed a quick look at the bins. He was fooled and reported no food shortage.",
              "simpZh": "这事绝不能让外面知道。风车倒了，人类胆子更大了，又编造动物农场的新谎话。又在传动物们饿死、病死，成天打架，还吃同类和幼崽。拿破仑清楚，粮食实情要是露出去后果严重，就利用温珀先生散布假象。以前动物们不怎么跟温珀接触，现在挑了些，多半是羊，让它们装作不经意地在他跟前说口粮增加了。拿破仑还吩咐把储藏室里快空的箱子用沙子装得快要满，上面盖点剩粮食。找个借口领温珀穿过储藏室，让他瞧一眼箱子。他上了当，继续跟外面说动物农场不缺粮。"

          "sectionId": 2,

          "paragraphs": [
            {
              "en": "Nevertheless, towards the end of January it became obvious that it would be necessary to <span class=\"vocab-trigger\" data-vocab=\"procure\">procure<\/span> some more grain from somewhere. In these days Napoleon rarely appeared in public, but spent all his time in the farmhouse, which was guarded at each door by fierce-looking dogs. When he did <span class=\"vocab-trigger\" data-vocab=\"emerge\">emerge<\/span>, it was in a <span class=\"vocab-trigger\" data-vocab=\"ceremonial manner\">ceremonial manner<\/span>, with an <span class=\"vocab-trigger\" data-vocab=\"escort\">escort<\/span> of six dogs who closely surrounded him and growled if anyone came too near. Frequently he did not even appear on Sunday mornings, but issued his orders through one of the other pigs, usually Squealer.",
              "zh": "尽管如此，到了一月底，很显然必须从什么地方再弄些谷物来。这些日子，拿破仑很少公开露面，整天待在农庄住宅里，每个门口都有凶悍的狗把守。他偶尔露面时，也带着一种仪式感，由六条狗紧紧簇拥着，谁靠得太近就咆哮。他常常连星期天早上也不出来，而是通过别的猪——通常是尖啸者——传达命令。",

              "simpZh": "可到了一月底，非得再弄点粮食不可了。这些日子拿破仑很少公开露面，整天待在农庄屋子里，每个门口都有凶狗守着。他偶尔出来时也是大排场，六条狗围得紧紧的，谁靠近就吼。常常星期天早上也不出来，通过别的猪，通常是尖啸者，传命令。"

            {
              "en": "One Sunday morning Squealer announced that the hens, who had just come in to lay again, must <span class=\"vocab-trigger\" data-vocab=\"surrender their eggs\">surrender their eggs<\/span>. Napoleon had accepted, through Whymper, a <span class=\"vocab-trigger\" data-vocab=\"contract\">contract<\/span> for four hundred eggs a week. The price of these would pay for enough grain and meal to keep the farm going till summer came on and conditions were easier.",
              "zh": "一个星期天早上，尖啸者宣布，刚刚恢复下蛋的母鸡们必须交出她们的蛋。拿破仑已经通过温珀接受了一份每周四百个鸡蛋的合同。这些鸡蛋的价钱可以换来足够的谷物和粉料，让农场维持到夏天，状况就会好些。",

            {
              "en": "When the hens heard this, they raised a terrible <span class=\"vocab-trigger\" data-vocab=\"outcry\">outcry<\/span>. They had been warned earlier that this sacrifice might be necessary, but had not believed that it would really happen. They were just getting their <span class=\"vocab-trigger\" data-vocab=\"clutches\">clutches<\/span> ready for the spring <span class=\"vocab-trigger\" data-vocab=\"sitting\">sitting<\/span>, and they protested that to take the eggs away now was murder. For the first time since the expulsion of Jones, there was something <span class=\"vocab-trigger\" data-vocab=\"resembling a rebellion\">resembling a rebellion<\/span>. Led by three young Black Minorca <span class=\"vocab-trigger\" data-vocab=\"pullets\">pullets<\/span>, the hens made a determined effort to <span class=\"vocab-trigger\" data-vocab=\"thwart\">thwart<\/span> Napoleon's wishes. Their method was to fly up to the <span class=\"vocab-trigger\" data-vocab=\"rafters\">rafters<\/span> and there lay their eggs, which smashed to pieces on the floor. Napoleon acted swiftly and <span class=\"vocab-trigger\" data-vocab=\"ruthlessly\">ruthlessly<\/span>. He ordered the hens' rations to be stopped, and <span class=\"vocab-trigger\" data-vocab=\"decreed\">decreed<\/span> that any animal giving so much as a grain of corn to a hen should be punished by death. The dogs <span class=\"vocab-trigger\" data-vocab=\"saw to it\">saw to it<\/span> that these orders were carried out. For five days the hens <span class=\"vocab-trigger\" data-vocab=\"held out\">held out<\/span>, then they <span class=\"vocab-trigger\" data-vocab=\"capitulated\">capitulated<\/span> and went back to their nesting boxes. Nine hens had died in the meantime. Their bodies were buried in the orchard, and it was <span class=\"vocab-trigger\" data-vocab=\"given out\">given out<\/span> that they had died of <span class=\"vocab-trigger\" data-vocab=\"coccidiosis\">coccidiosis<\/span>. Whymper heard nothing of this affair, and the eggs were <span class=\"vocab-trigger\" data-vocab=\"duly delivered\">duly delivered<\/span>, a grocer's van driving up to the farm once a week to take them away.",
              "zh": "母鸡们听到这话，发出了可怕的叫嚷。她们早先被警告过这种牺牲也许是必要的，但从未相信真的会发生。她们刚把一窝窝蛋准备好，等着春天抱窝，她们抗议说现在拿走蛋就是谋杀。自从琼斯被逐以来，头一次出现了类似造反的举动。在三只年轻的黑色米诺卡小母鸡的带领下，母鸡们下了决心要挫败拿破仑的愿望。她们的办法是飞到屋椽上，在那里下蛋，让蛋掉在地上摔得粉碎。拿破仑迅速而无情地采取了行动。他下令停止母鸡们的口粮，并颁布命令：任何动物只要给母鸡哪怕一粒玉米，都将被处以死刑。那些狗负责确保这些命令得到执行。母鸡们坚持了五天，然后投降了，回到了她们的产蛋箱里。在此期间，九只母鸡死了。她们的尸体被埋在果园里，对外宣布她们死于球虫病。温珀对这件事一无所知，鸡蛋按时交付，一辆食品杂货店的货车每周一次开到农场来把蛋拉走。",
              "simpEn": "The hens made a huge outcry when they heard. They'd been warned this sacrifice might be needed but never believed it. They were just getting their nests ready for spring hatching and said taking the eggs was murder. For the first time since Jones left, there was something like a rebellion. Led by three young Black Minorca hens, they tried hard to stop Napoleon. They flew up to the roof beams to lay eggs, which smashed on the floor. Napoleon acted fast and without mercy. He cut off the hens' food and made it a death crime for any animal to give a hen even one grain of corn. The dogs made sure this was followed. The hens held out for five days, then gave up and returned to their nest boxes. Nine hens died. Their bodies were buried and the story given was that they died of a chicken disease. Whymper knew nothing, and the eggs were delivered on time by a grocery van.",
              "simpZh": "母鸡们一听就大闹。早先说过可能要做这牺牲，可她们没当真。她们刚准备好窝要春天抱小鸡，说现在拿走蛋是害命。琼斯走后头一回，有点像造反。三只年轻的黑米诺卡小母鸡领头，母鸡们铁了心要坏拿破仑的事。她们飞到屋顶横梁上下蛋，蛋掉地上摔碎。拿破仑又快又狠地动手了。他停了母鸡们的口粮，下令谁敢给母鸡一粒玉米就处死。狗盯着执行。母鸡们挺了五天，投降回了窝。其间死了九只母鸡。尸体埋在了果园，对外说是得鸡病死了。温珀一点不知道这事，鸡蛋按时交了，每周一辆杂货铺的车来拉走。"

        {

          "paragraphs": [
            {
              "en": "All this while no more had been seen of Snowball. He was rumoured to be hiding on one of the neighbouring farms, either Foxwood or Pinchfield. Napoleon was by this time on slightly better terms with the other farmers than before. It happened that there was in the yard a pile of <span class=\"vocab-trigger\" data-vocab=\"timber\">timber<\/span> which had been stacked there ten years earlier when a beech <span class=\"vocab-trigger\" data-vocab=\"spinney\">spinney<\/span> was cleared. It was well <span class=\"vocab-trigger\" data-vocab=\"seasoned\">seasoned<\/span>, and Whymper had advised Napoleon to sell it; both Mr. Pilkington and Mr. Frederick were anxious to buy it. Napoleon was <span class=\"vocab-trigger\" data-vocab=\"hesitating\">hesitating<\/span> between the two, unable to <span class=\"vocab-trigger\" data-vocab=\"make up his mind\">make up his mind<\/span>. It was noticed that whenever he seemed <span class=\"vocab-trigger\" data-vocab=\"on the point of\">on the point of<\/span> coming to an agreement with Frederick, Snowball was declared to be in hiding at Foxwood, while, when he <span class=\"vocab-trigger\" data-vocab=\"inclined\">inclined<\/span> toward Pilkington, Snowball was said to be at Pinchfield.",
              "zh": "在这段时间里，再也没有谁看见过雪球。传闻他躲在附近哪一个农场里，不是福克斯伍德就是平奇菲尔德。拿破仑这时和其他农场主的关系比从前稍微好了些。碰巧院子里有一堆木材，是十年前清理一片山毛榉矮林时堆在那儿的。木材已经干透了，温珀建议拿破仑卖掉；皮尔金顿先生和弗雷德里克先生都想买。拿破仑在两者之间犹豫不决。大家注意到，每当他似乎要与弗雷德里克达成协议时，就宣称雪球藏在福克斯伍德；而当他倾向于皮尔金顿时，又说雪球在平奇菲尔德。",
              "simpEn": "All this time Snowball was not seen. He was rumored to be hiding on a nearby farm, either Foxwood or Pinchfield. Napoleon was now on slightly better terms with the other farmers. There was a pile of wood in the yard, cut ten years ago from a beech grove and now well dried. Whymper advised selling it; both Pilkington and Frederick wanted to buy. Napoleon couldn't decide. It was noticed that whenever he seemed close to a deal with Frederick, Snowball was said to be at Foxwood; when he leaned toward Pilkington, Snowball was said to be at Pinchfield.",
              "simpZh": "这阵子再没人见过雪球。传说他藏在附近哪个农场，不是福克斯伍德就是平奇菲尔德。拿破仑现在跟其他农场主关系稍微好了点。院子里碰巧有堆木材，是十年前清一片山毛榉小树林时堆的，早就干透了。温珀建议卖掉，皮尔金顿和弗雷德里克都想买。拿破仑拿不定主意。大家注意到，只要他快跟弗雷德里克谈拢了，就说雪球藏在福克斯伍德；要是他偏向皮尔金顿，又说雪球在平奇菲尔德。"
            },
            {
              "en": "Suddenly, early in the spring, an alarming thing was discovered. Snowball was secretly <span class=\"vocab-trigger\" data-vocab=\"frequenting\">frequenting<\/span> the farm by night! The animals were so <span class=\"vocab-trigger\" data-vocab=\"disturbed\">disturbed<\/span> that they could hardly sleep in their stalls. Every night, it was said, he came creeping in <span class=\"vocab-trigger\" data-vocab=\"under cover of darkness\">under cover of darkness<\/span> and performed all kinds of mischief. He stole the corn, he upset the milk-pails, he broke the eggs, he <span class=\"vocab-trigger\" data-vocab=\"trampled the seedbeds\">trampled the seedbeds<\/span>, he <span class=\"vocab-trigger\" data-vocab=\"gnawed the bark\">gnawed the bark<\/span> off the fruit trees. Whenever anything went wrong it became usual to <span class=\"vocab-trigger\" data-vocab=\"attribute it to Snowball\">attribute it to Snowball<\/span>. If a window was broken or a <span class=\"vocab-trigger\" data-vocab=\"drain\">drain<\/span> was blocked up, someone was certain to say that Snowball had come in the night and done it, and when the key of the store-shed was lost, the whole farm was convinced that Snowball had thrown it down the well. Curiously enough, they went on believing this even after the <span class=\"vocab-trigger\" data-vocab=\"mislaid\">mislaid<\/span> key was found under a sack of meal. The cows declared <span class=\"vocab-trigger\" data-vocab=\"unanimously\">unanimously<\/span> that Snowball crept into their stalls and milked them in their sleep. The rats, which had been troublesome that winter, were also said to be <span class=\"vocab-trigger\" data-vocab=\"in league with Snowball\">in league with Snowball<\/span>.",
              "zh": "初春时分，一件令人惊慌的事突然被发现了。雪球竟然每天夜里偷偷潜回农场！动物们如此不安，简直没法在自己厩栏里安睡。据说，他每晚趁着夜色摸进来，干尽了各种坏事。他偷玉米，打翻奶桶，打破鸡蛋，踩踏苗床，啃掉果树上的树皮。不管出了什么岔子，大家习以为常地都归咎于雪球。如果窗子破了或者排水管堵了，准会有人说那是雪球夜里进来干的；当储藏室的钥匙丢了，整个农场都深信是雪球把它扔进了井里。奇怪的是，即使那支放错了地方的钥匙后来在一袋粉料下面找到了，他们仍然继续相信这种说法。母牛们一致宣称，雪球偷偷溜进她们的厩栏，趁她们睡着时挤走了她们的奶。那年冬天闹腾的老鼠，据称也和雪球勾结在了一起。",
              "simpEn": "Suddenly in early spring a scary thing was discovered: Snowball was visiting the farm secretly at night! The animals were so upset they could barely sleep. Every night, it was said, he crept in under cover of dark and did all kinds of mischief. He stole corn, knocked over milk pails, broke eggs, trampled seed beds, and chewed bark off fruit trees. Whenever anything went wrong, it was blamed on Snowball. A broken window or blocked drain was said to be his doing, and when the store-shed key was lost, everyone was sure Snowball threw it down the well. Strangely, they kept believing this even after the misplaced key was found under a sack. The cows all agreed Snowball had crept in and milked them in their sleep. The rats that were a nuisance that winter were also said to be working with Snowball.",
              "simpZh": "初春忽然发现一件吓人的事：雪球竟然每天夜里偷偷溜回农场！动物们吓得在自己的栏里都睡不着。据说他每晚趁黑摸进来干各种坏事。偷玉米，打翻奶桶，打破鸡蛋，踩苗床，啃果树皮。不管出什么岔子，都怪到雪球头上。窗户破了，水管堵了，准有人说雪球夜里干的；储藏室钥匙丢了，全农场都信是雪球扔井里了。奇怪的是，后来钥匙在一袋粉料下找到了，他们还照样信。母牛们一致说雪球偷溜进她们栏里趁睡着挤了奶。那年冬天闹腾的老鼠，也说跟雪球是一伙。"

            {
              "en": "Napoleon <span class=\"vocab-trigger\" data-vocab=\"decreed\">decreed<\/span> that there should be a full <span class=\"vocab-trigger\" data-vocab=\"investigation\">investigation<\/span> into Snowball's activities. With his dogs in attendance he set out and made a careful <span class=\"vocab-trigger\" data-vocab=\"tour of inspection\">tour of inspection<\/span> of the farm buildings, the other animals following at a respectful distance. At every few steps Napoleon stopped and <span class=\"vocab-trigger\" data-vocab=\"snuffed\">snuffed<\/span> the ground for traces of Snowball's footsteps, which, he said, he could <span class=\"vocab-trigger\" data-vocab=\"detect\">detect<\/span> by the smell. He snuffed in every corner, in the barn, in the cow-shed, in the henhouses, in the vegetable garden, and found traces of Snowball almost everywhere. He would put his <span class=\"vocab-trigger\" data-vocab=\"snout\">snout<\/span> to the ground, give several deep sniffs, and exclaim in a terrible voice, “Snowball! He has been here! I can smell him <span class=\"vocab-trigger\" data-vocab=\"distinctly\">distinctly<\/span>!” and at the word “Snowball” all the dogs let out <span class=\"vocab-trigger\" data-vocab=\"blood-curdling growls\">blood-curdling growls<\/span> and showed their side teeth.",
              "zh": "拿破仑下令对雪球的活动进行一次全面调查。他带着那群狗出发，对农场的房屋进行了仔细的巡视，其他动物则敬畏地跟在后面。每走几步，拿破仑就停下来，在地上嗅雪球的足迹，他说他能靠气味分辨出来。他在谷仓、牛棚、鸡舍、菜园的每一个角落都嗅了嗅，几乎到处都找到了雪球的踪迹。他会把鼻子贴到地上，深深地吸几口气，然后用一种可怕的声音喊道：“雪球！他到过这里！我能清清楚楚闻出他来！”一听到“雪球”这两个字，所有的狗便发出一阵令人毛骨悚然的咆哮，亮出它们一侧的牙齿。",
              "simpEn": "Napoleon ordered a full investigation into Snowball's activities. With his dogs he made a careful tour around the farm buildings, the other animals following at a respectful distance. Every few steps Napoleon stopped and sniffed the ground for traces of Snowball's footsteps, which he said he could detect by smell. He sniffed in every corner — the barn, cow-shed, hen houses, vegetable garden — and found traces of Snowball almost everywhere. He put his nose to the ground, took deep sniffs, and cried in a terrible voice, 'Snowball! He has been here! I can smell him clearly!' At the word 'Snowball' all the dogs let out terrifying growls and showed their teeth.",
              "simpZh": "拿破仑下令全面调查雪球的活动。他带着狗，仔细巡视农场各处房子，别的动物敬畏地远远跟着。拿破仑走几步就停下来，在地上闻雪球的脚印，他说他能靠气味辨出来。他在谷仓、牛棚、鸡舍、菜园每个角落都闻了，差不多到处都发现了雪球的痕迹。他把鼻子贴地，深深吸几口气，可怕地喊道：“雪球！他到过这儿！我清清楚楚闻得出来！”一听到“雪球”两个字，所有的狗便发出一阵吓死人的咆哮，露出侧边的牙。"
            }

        {
          "sectionId": 4,
          "heading": "Snowball Revealed as Jones’s Agent",
          "paragraphs": [
            {
              "en": "The animals were thoroughly frightened. It seemed to them as though Snowball were some kind of invisible influence, <span class=\"vocab-trigger\" data-vocab=\"pervading\">pervading<\/span> the air about them and <span class=\"vocab-trigger\" data-vocab=\"menacing\">menacing<\/span> them with all kinds of dangers. In the evening Squealer called them together, and with an alarmed expression on his face told them that he had some serious news to report.",
              "zh": "动物们彻底吓坏了。在他们看来，雪球仿佛是一种无形的魔力，弥漫在他们周围的空气里，用各种各样的危险威胁着他们。傍晚，尖啸者把他们召集起来，脸上带着惊慌的表情，说有严重的事情要报告。",
              "simpEn": "The animals were completely terrified. It felt to them as if Snowball were some invisible force, spreading through the air and threatening them with all kinds of dangers. In the evening Squealer gathered them together, looking very alarmed, and said he had serious news.",
              "simpZh": "动物们全吓坏了。他们觉得雪球好像是个看不见的东西，弥漫在空气里，用各种危险威胁他们。晚上尖啸者把他们叫到一起，一脸慌张，说有要紧事报告。"
            },
            {
              "en": "“Comrades!” cried Squealer, making little nervous skips, “a most terrible thing has been discovered. Snowball has sold himself to Frederick of Pinchfield Farm, who is even now <span class=\"vocab-trigger\" data-vocab=\"plotting\">plotting<\/span> to attack us and take our farm away from us! Snowball is to act as his guide when the attack begins. But there is worse than that. We had thought that Snowball's rebellion was caused simply by his <span class=\"vocab-trigger\" data-vocab=\"vanity and ambition\">vanity and ambition<\/span>. But we were wrong, comrades. Do you know what the real reason was? Snowball was <span class=\"vocab-trigger\" data-vocab=\"in league with Jones\">in league with Jones<\/span> from the very start! He was Jones's <span class=\"vocab-trigger\" data-vocab=\"secret agent\">secret agent<\/span> all the time. It has all been proved by <span class=\"vocab-trigger\" data-vocab=\"documents\">documents<\/span> which he left behind him and which we have only just discovered. To my mind this explains a great deal, comrades. Did we not see for ourselves how he attempted — fortunately without success — to get us defeated and destroyed at the Battle of the Cowshed?”",
              "zh": "“同志们！”尖啸者一边喊，一边紧张地小跳着，“一件最可怕的事情被发现了。雪球已经把自己卖给了平奇菲尔德农场的弗雷德里克，弗雷德里克此刻正在密谋袭击我们，夺走我们的农场！袭击开始时，雪球会充当他的向导。但还有比那更糟糕的。我们本来以为雪球的叛乱仅仅是因为他的虚荣和野心。可是我们错了，同志们。你们知道真正的原因是什么吗？雪球从一开始就和琼斯勾结在一起！他一直是琼斯的秘密奸细。这一切已经由他留下的文件证明了，我们才刚刚发现这些文件。在我看来，这解释了许多事情，同志们。我们不是亲眼看见他在牛棚战役中企图——幸好没有得逞——让我们被打败、被消灭吗？”",
              "simpEn": "'Friends!' cried Squealer, making little nervous jumps, 'a terrible thing has been found out. Snowball has sold himself to Frederick of Pinchfield Farm, who is now plotting to attack us and take our farm! Snowball will be his guide when the attack comes. But worse, we thought Snowball's rebellion was just pride and ambition. We were wrong. The real reason? Snowball was in league with Jones from the very start! He was Jones's secret agent all along. It's all proven by documents he left behind that we just found. This explains so much. Didn't we see how he tried — luckily without success — to get us defeated at the Battle of the Cowshed?'",
              "simpZh": "“同志们！”尖啸者紧张地蹦着，“发现了一件最可怕的事。雪球把自己卖给了平奇菲尔德的弗雷德里克，弗雷德里克正在密谋打我们，抢走农场！雪球会在袭击时给他当向导。更糟的是，我们原以为雪球的叛乱只是因为虚荣和野心。可我们错了。真正原因？雪球从一开始就和琼斯是一伙！他一直是琼斯的秘密奸细。这全由他留下的文件证明了，我们刚刚才发现。这解释了好多事。我们不是亲眼见他在牛棚战役里想——还好没得逞——让我们被打败消灭吗？”"
            },
            {
              "en": "The animals were <span class=\"vocab-trigger\" data-vocab=\"stupefied\">stupefied<\/span>. This was a wickedness far outdoing Snowball's destruction of the windmill. But it was some minutes before they could fully <span class=\"vocab-trigger\" data-vocab=\"take it in\">take it in<\/span>. They all remembered, or thought they remembered, how they had seen Snowball charging ahead of them at the Battle of the Cowshed, how he had <span class=\"vocab-trigger\" data-vocab=\"rallied and encouraged\">rallied and encouraged<\/span> them at every turn, and how he had not paused for an instant even when the pellets from Jones's gun had wounded his back. At first it was a little difficult to see how this <span class=\"vocab-trigger\" data-vocab=\"fitted in with\">fitted in with<\/span> his being on Jones's side. Even Boxer, who seldom asked questions, was puzzled. He lay down, <span class=\"vocab-trigger\" data-vocab=\"tucked his fore hoofs beneath him\">tucked his fore hoofs beneath him<\/span>, shut his eyes, and with a hard effort managed to <span class=\"vocab-trigger\" data-vocab=\"formulate his thoughts\">formulate his thoughts<\/span>.",
              "zh": "动物们惊得目瞪口呆。这比雪球摧毁风车还要恶毒得多。但他们过了好几分钟才完全明白过来。他们都记得，或者自以为记得，在牛棚战役中他们怎样看见雪球冲在他们前头，怎样处处激励鼓舞着他们，而且即使琼斯枪里的子弹伤了他的背，他也一刻没有退缩。起初，这和他站在琼斯一边的说法有点难以吻合。就连很少提问的拳击手也困惑了。他卧下来，把前蹄掖在身子底下，闭上眼睛，费了好大劲才理清了自己的想法。",
              "simpEn": "The animals were stunned. This was far worse than Snowball destroying the windmill. It took them minutes to fully understand. They all remembered — or thought they did — seeing Snowball charge ahead at the Battle of the Cowshed, how he'd rallied and encouraged them, and how he didn't stop even when Jones's gunshot wounded his back. At first it was hard to match this with him being on Jones's side. Even Boxer, who rarely asked, was puzzled. He lay down, tucked his front hooves under him, shut his eyes, and with great effort tried to form his thoughts.",
              "simpZh": "动物们傻了眼。这比雪球毁风车还坏得多。好几分钟才明白过来。他们都记得，或自以为记得，在牛棚战役里雪球冲在前头，处处鼓劲打气，琼斯枪弹打伤了他的背也没停。起初想不通这怎么能和他是琼斯一伙的合得上。连很少疑问的拳击手也糊涂了。他卧下，把前蹄掖在身下，闭上眼，费了好大劲才把想法理清。"
            },
            {
              "en": "“I do not believe that,” he said. “Snowball fought bravely at the Battle of the Cowshed. I saw him myself. Did we not give him ‘Animal Hero, First Class,’ immediately afterwards?”<br>“That was our mistake, comrade. For we know now — it is all written down in the secret documents that we have found — that in reality he was trying to <span class=\"vocab-trigger\" data-vocab=\"lure us to our doom\">lure us to our doom<\/span>.”<br>“But he was wounded,” said Boxer. “We all saw him running with blood.”<br>“That was part of the arrangement!” cried Squealer. “Jones's shot only <span class=\"vocab-trigger\" data-vocab=\"grazed\">grazed<\/span> him. I could show you this in his own writing, if you were able to read it. The plot was for Snowball, at the critical moment, to give the signal for flight and leave the field to the enemy. And he very nearly succeeded — I will even say, comrades, he WOULD have succeeded if it had not been for our <span class=\"vocab-trigger\" data-vocab=\"heroic Leader, Comrade Napoleon\">heroic Leader, Comrade Napoleon<\/span>. Do you not remember how, just at the moment when Jones and his men had got inside the yard, Snowball suddenly turned and fled, and many animals followed him? And do you not remember, too, that it was just at that moment, when <span class=\"vocab-trigger\" data-vocab=\"panic\">panic<\/span> was spreading and all seemed lost, that Comrade Napoleon sprang forward with a cry of ‘Death to Humanity!’ and <span class=\"vocab-trigger\" data-vocab=\"sank his teeth in Jones's leg\">sank his teeth in Jones's leg<\/span>? Surely you remember THAT, comrades?” exclaimed Squealer, <span class=\"vocab-trigger\" data-vocab=\"frisking\">frisking<\/span> from side to side.",
              "zh": "“我不信那个，”他说，“雪球在牛棚战役里打得可勇敢。我亲眼看见的。我们事后不是立刻给了他‘一级动物英雄’吗？”<br>“那是我们弄错了，同志。因为我们现在知道了——发现的所有秘密文件上都写着呢——实际上他是在企图引诱我们走向灭亡。”<br>“可他受了伤，”拳击手说，“我们都看见他流着血跑。”<br>“那是安排好的！”尖啸者嚷道，“琼斯的子弹只是擦伤了他。你要是看得懂，我可以把他亲笔写的东西给你看。这个阴谋是雪球在关键时刻发出逃跑信号，把战场留给敌人。他几乎就得逞了——我甚至想说，同志们，要不是我们英勇的领袖拿破仑同志，他已经得逞了。难道你们不记得，就在琼斯和他手下人冲进院子的时候，雪球突然转身就跑，好多动物也跟着他跑？难道你们不记得，也正是在那一刻，恐慌正在蔓延，一切眼看都完了，拿破仑同志突然冲向前去，高呼‘处死人类！’，一口咬住琼斯的腿？你们肯定记得那个吧，同志们？”尖啸者喊叫着，一边左右欢蹦乱跳。",
              "simpEn": "'I don't believe that,' he said. 'Snowball fought bravely at the Battle of the Cowshed. I saw it myself. Didn't we give him \"Animal Hero, First Class\" right after?' 'That was our mistake, comrade. We now know from secret documents that he was really trying to lead us to destruction.' 'But he was wounded,' said Boxer. 'We all saw him bleeding.' 'That was part of the plan!' cried Squealer. 'Jones's shot only grazed him. I could show you his own writing if you could read. The plot was for Snowball to give the retreat signal at the critical moment and leave the field to the enemy. He almost succeeded — he WOULD have if not for our heroic Leader, Comrade Napoleon. Remember how, just when Jones and his men entered the yard, Snowball turned and fled, and many followed? And how at that moment, when panic spread and all seemed lost, Comrade Napoleon sprang forward shouting \"Death to Humanity!\" and bit Jones's leg? Surely you remember that, comrades?' Squealer exclaimed, jumping around.",
              "simpZh": "“我不信，”他说，“雪球在牛棚战役里很勇敢，我亲眼见的。我们不是当场给了他‘一级动物英雄’吗？”“那是我们错了，同志。现在我们从秘密文件里知道，他其实是想把我们引向灭亡。”“可他受了伤，”拳击手说，“我们都看见他流着血跑。”“那是安排好的！”尖啸者叫道，“琼斯的子弹只擦破了他。你要是能读，我可以给你看他亲笔写的东西。这阴谋是让雪球在紧要关头发逃跑信号，把战场让给敌人。他差点成了——同志们，要不是我们英勇的领袖拿破仑同志，他就真得逞了。你们不记得吗，就在琼斯他们进了院子，雪球突然转身就跑，好多动物跟着？你们不记得，也就在那时候恐慌四起，眼看全完了，拿破仑同志冲上前去高喊‘处死人类！’一口咬住琼斯的腿？你们肯定记得那个吧，同志们？”尖啸者边喊边蹦来蹦去。"
            },
            {
              "en": "Now when Squealer described the scene so <span class=\"vocab-trigger\" data-vocab=\"graphically\">graphically<\/span>, it seemed to the animals that they did remember it. At any rate, they remembered that at the critical moment of the battle Snowball had turned to flee. But Boxer was still a little uneasy.<br>“I do not believe that Snowball was a traitor at the beginning,” he said finally. “What he has done since is different. But I believe that at the Battle of the Cowshed he was a good comrade.”<br>“Our Leader, Comrade Napoleon,” announced Squealer, speaking very slowly and firmly, “has stated <span class=\"vocab-trigger\" data-vocab=\"categorically\">categorically<\/span> — categorically, comrade — that Snowball was Jones's agent from the very beginning — yes, and from long before the Rebellion was ever thought of.”<br>“Ah, that is different!” said Boxer. “If Comrade Napoleon says it, it must be right.”<br>“That is the true spirit, comrade!” cried Squealer, but it was noticed he cast a very ugly look at Boxer with his little twinkling eyes. He turned to go, then paused and added impressively: “I warn every animal on this farm to keep his eyes very wide open. For we have reason to think that some of Snowball's <span class=\"vocab-trigger\" data-vocab=\"secret agents\">secret agents<\/span> are <span class=\"vocab-trigger\" data-vocab=\"lurking\">lurking<\/span> among us at this moment!”",
              "zh": "当尖啸者把那个场面形容得如此活灵活现时，动物们似乎的确记起来了。不管怎么样，他们记得在战役的关键时刻雪球转身逃跑过。但拳击手仍有点不安。<br>“我不信雪球一开始就是叛徒，”他最后说，“他后来的所作所为是另一回事。但我相信他在牛棚战役里是个好同志。”<br>“我们的领袖拿破仑同志，”尖啸者非常缓慢而坚定地宣布，“已经斩钉截铁地——斩钉截铁啊，同志——说过，雪球从一开始就是琼斯的奸细——没错，还在造反压根没人想过之前就是。”<br>“啊，那就另当别论了！”拳击手说，“只要是拿破仑同志说的，那就准没错。”<br>“这才是真正的精神，同志！”尖啸者叫道，但大家注意到他用那双闪闪发亮的小眼睛恶狠狠地瞪了拳击手一眼。他转身要走，又停下来，郑重其事地补充道：“我警告农场里的每一位动物，把眼睛睁得大大的。因为我们有理由认为，此刻雪球的一些暗藏的特务正潜伏在我们中间！”",
              "simpEn": "Now when Squealer described the scene so vividly, the animals seemed to remember it. At least, they remembered Snowball turning to flee at the critical moment. But Boxer was still slightly uneasy. 'I don't believe Snowball was a traitor at the beginning,' he finally said. 'What he's done since is different. But at the Battle of the Cowshed, I believe he was a good comrade.' 'Our Leader, Comrade Napoleon,' announced Squealer slowly and firmly, 'has stated categorically — absolutely, comrade — that Snowball was Jones's agent from the very start — yes, even long before the Rebellion was thought of.' 'Ah, that is different!' said Boxer. 'If Comrade Napoleon says it, it must be right.' 'That's the true spirit, comrade!' cried Squealer, though he gave Boxer a very ugly look with his little shining eyes. He turned to leave, then paused and added seriously: 'I warn every animal to keep eyes wide open. We have reason to think some of Snowball's secret agents are hiding among us right now!'",
              "simpZh": "尖啸者把那情景说得活灵活现，动物们好像真记起来了。至少记得雪球在紧要关头转身跑了。可拳击手还是有点不安。“我不信雪球一开始就是叛徒，”他最后说，“他后来的事另说。可牛棚战役里，我相信他是个好同志。”“我们的领袖拿破仑同志，”尖啸者缓慢而坚定地说，“已经斩钉截铁地——同志，斩钉截铁——说过，雪球从最开始，甚至造反想都没想过之前，就是琼斯的奸细。”“啊，那就不同了！”拳击手说，“拿破仑同志说的，准没错。”“这才是真正的精神，同志！”尖啸者叫道，可是他用那双亮晶晶的小眼睛狠狠瞪了拳击手一眼。他转身要走，又停住，重重地补一句：“我警告农场每个动物，眼睛睁大点。我们有理由认为，雪球的一些暗藏特务此刻就潜伏在我们当中！”"
            }

        {
          "sectionId": 5,

          "paragraphs": [
            {
              "en": "Four days later, in the late afternoon, Napoleon ordered all the animals to assemble in the yard. When they were all gathered together, Napoleon emerged from the farmhouse, wearing both his medals (for he had recently <span class=\"vocab-trigger\" data-vocab=\"awarded himself\">awarded himself<\/span> “Animal Hero, First Class”, and “Animal Hero, Second Class”), with his nine huge dogs <span class=\"vocab-trigger\" data-vocab=\"frisking\">frisking<\/span> round him and uttering growls that sent <span class=\"vocab-trigger\" data-vocab=\"shivers down all the animals’ spines\">shivers down all the animals’ spines<\/span>. They all <span class=\"vocab-trigger\" data-vocab=\"cowered\">cowered<\/span> silently in their places, seeming to know in advance that some terrible thing was about to happen.",
              "zh": "四天后，接近傍晚时分，拿破仑命令所有动物到院子里集合。等大家聚齐了，拿破仑从农庄住宅里走了出来，佩戴着他的两枚勋章（因为不久前他授予了自己“一级动物英雄”和“二级动物英雄”），九条大狗在他身边欢蹦乱跳，发出让所有动物脊背发凉的咆哮声。动物们全都默默地缩在各自的位置上，似乎事先知道有什么可怕的事要发生了。",
              "simpEn": "Four days later, in the late afternoon, Napoleon ordered everyone to gather in the yard. When they were all there, Napoleon came out of the farmhouse wearing both his medals (he'd recently given himself 'Animal Hero, First Class' and 'Animal Hero, Second Class'). His nine huge dogs frisked around him, growling in a way that made chills run down every animal's spine. They all crouched silently, as if knowing something terrible was coming.",
              "simpZh": "四天后，快傍晚时，拿破仑命令所有动物到院子里集合。都聚齐了，拿破仑从住宅出来，戴着两枚勋章（前不久他给自己授了“一级动物英雄”和“二级动物英雄”），九条大狗围着他蹦，发出让所有动物脊背发凉的咆哮。动物们全默默地缩着，好像预先知道有可怕的事要来了。"
            },
            {
              "en": "Napoleon stood <span class=\"vocab-trigger\" data-vocab=\"sternly\">sternly<\/span> surveying his audience; then he <span class=\"vocab-trigger\" data-vocab=\"uttered a high-pitched whimper\">uttered a high-pitched whimper<\/span>. Immediately the dogs bounded forward, seized four of the pigs by the ear and dragged them, squealing with pain and terror, to Napoleon's feet. The pigs' ears were bleeding, the dogs had tasted blood, and for a few moments they appeared to go quite mad. To the amazement of everybody, three of them <span class=\"vocab-trigger\" data-vocab=\"flung themselves upon Boxer\">flung themselves upon Boxer<\/span>. Boxer saw them coming and put out his great hoof, caught a dog in mid-air, and <span class=\"vocab-trigger\" data-vocab=\"pinned him to the ground\">pinned him to the ground<\/span>. The dog <span class=\"vocab-trigger\" data-vocab=\"shrieked for mercy\">shrieked for mercy<\/span> and the other two fled with their tails between their legs. Boxer looked at Napoleon to know whether he should crush the dog to death or let it go. Napoleon appeared to <span class=\"vocab-trigger\" data-vocab=\"change countenance\">change countenance<\/span>, and sharply ordered Boxer to let the dog go, whereat Boxer lifted his hoof, and the dog <span class=\"vocab-trigger\" data-vocab=\"slunk away, bruised and howling\">slunk away, bruised and howling<\/span>.",
              "zh": "拿破仑严厉地审视着他的听众；接着他发出一声尖细的哼哼。那些狗立刻向前扑去，咬住四头猪的耳朵，把他们又疼又怕地尖叫着拖到了拿破仑脚下。猪的耳朵在流血，狗尝到了血，一时之间像发了疯。让所有动物惊愕的是，其中三条狗竟然扑向了拳击手。拳击手看见它们冲过来，伸出大蹄子，在半空截住一条狗，把他按在地上。那条狗尖叫求饶，另外两条夹着尾巴逃开了。拳击手望着拿破仑，想知道是该把那条狗压死还是放他走。拿破仑的脸色似乎变了，厉声命令拳击手把狗放开，拳击手抬起蹄子，那条狗便浑身青肿，嚎叫着溜走了。",
              "simpEn": "Napoleon stood looking sternly over everyone; then he let out a high-pitched cry. Instantly the dogs charged forward, grabbed four pigs by the ears, and dragged them squealing in pain and terror to Napoleon's feet. The pigs' ears bled, the dogs tasted blood, and for a moment they went mad. To everyone's shock, three of them attacked Boxer. Boxer saw them coming, stuck out his huge hoof, caught one dog in midair, and pinned him to the ground. The dog screamed for mercy and the other two ran off with tails tucked. Boxer looked to Napoleon to see whether to crush the dog or release it. Napoleon's expression changed, and he sharply ordered Boxer to let go. Boxer lifted his hoof, and the dog slunk off bruised and howling.",
              "simpZh": "拿破仑严厉地扫视大家，然后发出一声尖利的哼哼。狗立刻冲上去，咬住四头猪的耳朵，把他们拖到拿破仑脚下，猪又疼又怕地尖声叫着。猪耳朵流着血，狗尝了血，一时像疯了。让大伙吓坏的是，有三条狗竟朝拳击手扑去。拳击手见它们冲来，伸出大蹄子，在半空截住一条狗，把他按在地上。狗尖叫求饶，另两条夹着尾巴跑了。拳击手看着拿破仑，不知道是该把狗压死还是放掉。拿破仑脸色变了，厉声命拳击手放开，拳击手抬起蹄子，那狗浑身青肿，嚎叫着溜了。"
            },
            {
              "en": "Presently the <span class=\"vocab-trigger\" data-vocab=\"tumult\">tumult<\/span> died down. The four pigs waited, trembling, with guilt written on every line of their <span class=\"vocab-trigger\" data-vocab=\"countenances\">countenances<\/span>. Napoleon now called upon them to confess their crimes. They were the same four pigs as had protested when Napoleon <span class=\"vocab-trigger\" data-vocab=\"abolished the Sunday Meetings\">abolished the Sunday Meetings<\/span>. Without any further <span class=\"vocab-trigger\" data-vocab=\"prompting\">prompting<\/span> they confessed that they had been secretly in touch with Snowball ever since his <span class=\"vocab-trigger\" data-vocab=\"expulsion\">expulsion<\/span>, that they had collaborated with him in destroying the windmill, and that they had entered into an agreement with him to hand over Animal Farm to Mr. Frederick. They added that Snowball had privately admitted to them that he had been Jones's secret agent for years past. When they had finished their confession, the dogs promptly <span class=\"vocab-trigger\" data-vocab=\"tore their throats out\">tore their throats out<\/span>, and in a terrible voice Napoleon demanded whether any other animal had anything to confess.",
              "zh": "不一会儿，骚动平息了。那四头猪浑身发抖地等着，脸上每一道纹路都写着罪恶。拿破仑现在命令他们招出自己的罪行。这正是当初拿破仑废除星期天大会时抗议过的那四头猪。没费什么催促，他们就招认了，说自从雪球被逐之后，他们一直和他秘密联络，同他合谋摧毁了风车，还和他达成了协议，要把动物农场拱手交给弗雷德里克先生。他们还补充说，雪球曾私下向他们承认，他多年来一直是琼斯的秘密奸细。等他们交代完毕，那些狗立刻咬断了他们的喉咙，拿破仑便用一种可怕的声音问，还有没有别的动物要交代什么。",
              "simpEn": "Soon the noise died down. The four pigs stood trembling, guilt written all over their faces. Napoleon now demanded they confess their crimes. They were the same four pigs who had protested when Napoleon ended the Sunday Meetings. Without much push, they confessed they'd been secretly in contact with Snowball since he was driven out, helped him destroy the windmill, and agreed to hand Animal Farm over to Mr. Frederick. They added that Snowball had privately told them he'd been Jones's secret agent for years. As soon as they finished, the dogs tore out their throats. Napoleon then demanded in a terrible voice if any other animal had something to confess.",
              "simpZh": "骚动很快平息。四头猪哆嗦着等，满脸罪过。拿破仑命他们招供。这正是那四头抗议废除大会的猪。没怎么催，他们就招了，说雪球被逐后他们一直和他秘密联络，合伙毁了风车，还和他约定把动物农场交给弗雷德里克先生。他们还说，雪球私下承认他多年来就是琼斯的秘密奸细。他们招完，狗马上咬断了他们的喉咙。拿破仑厉声问，还有没有谁要招。"
            },
            {
              "en": "The three hens who had been the <span class=\"vocab-trigger\" data-vocab=\"ringleaders\">ringleaders<\/span> in the attempted rebellion over the eggs now came forward and stated that Snowball had appeared to them in a dream and <span class=\"vocab-trigger\" data-vocab=\"incited\">incited<\/span> them to disobey Napoleon's orders. They, too, were slaughtered. Then a goose came forward and confessed to having <span class=\"vocab-trigger\" data-vocab=\"secreted\">secreted<\/span> six ears of corn during the last year's harvest and eaten them in the night. Then a sheep confessed to having <span class=\"vocab-trigger\" data-vocab=\"urinated in the drinking pool\">urinated in the drinking pool<\/span> — urged to do this, so she said, by Snowball — and two other sheep confessed to having murdered an old <span class=\"vocab-trigger\" data-vocab=\"ram\">ram<\/span>, an especially devoted follower of Napoleon, by chasing him round and round a <span class=\"vocab-trigger\" data-vocab=\"bonfire\">bonfire<\/span> when he was suffering from a cough. They were all <span class=\"vocab-trigger\" data-vocab=\"slain on the spot\">slain on the spot<\/span>. And so the tale of confessions and executions went on, until there was a pile of <span class=\"vocab-trigger\" data-vocab=\"corpses\">corpses<\/span> lying before Napoleon's feet and the air was heavy with the smell of blood, which had been unknown there since the expulsion of Jones.",
              "zh": "在反对鸡蛋的事件中领头闹事的那三只母鸡，这时走上前来，说雪球曾在梦里显现，煽动她们违抗拿破仑的命令。她们也被宰杀了。接着一只鹅走上前来，承认在去年的收获中藏了六穗玉米，并且在夜里偷偷吃了。接着一只绵羊承认曾在饮水池里小便——她说是雪球怂恿她这样做的——另外两只绵羊则承认，她们趁一头对拿破仑特别忠心的老阉羊咳嗽时，围着一堆篝火把他追得团团转，害死了他。她们当场全被杀了。交代和处决就这样持续下去，直到拿破仑脚前堆起了一堆尸体，空气里弥漫着自从琼斯被逐以来从未有过的血腥味。",
              "simpEn": "The three hens who led the egg rebellion then came forward and said Snowball had appeared to them in a dream and urged them to disobey Napoleon. They too were killed. Then a goose confessed to hiding six ears of corn during last harvest and eating them at night. A sheep confessed to peeing in the drinking pool — urged by Snowball, she said — and two other sheep confessed to killing an old ram, a devoted follower of Napoleon, by chasing him around a fire when he had a cough. They were all killed on the spot. The confessions and executions went on until there was a pile of dead bodies before Napoleon's feet and the air was thick with the smell of blood, unknown since Jones was expelled.",
              "simpZh": "那三只领头闹蛋的母鸡上前，说雪球在梦里显现，鼓动她们违抗拿破仑的命令。她们也被杀了。一只鹅上前，承认去年收获时藏了六穗玉米，夜里偷吃了。一只羊承认在饮水池里尿了——她说是雪球撺掇的——另两只羊承认害死了一头对拿破仑特别忠心的老阉羊，趁他咳嗽时围着一堆篝火追他。她们全被当场宰了。交代和处死就这么进行下去，直到拿破仑脚前堆起一堆尸体，空气里满是血腥味，自打琼斯被赶走以后还没闻过这种气味。"
            }
          ],

        {
          "sectionId": 6,
          "heading": "Aftermath and the Banning of 'Beasts of England'",
          "paragraphs": [
            {
              "en": "When it was all over, the remaining animals, except for the pigs and dogs, <span class=\"vocab-trigger\" data-vocab=\"crept away in a body\">crept away in a body<\/span>. They were <span class=\"vocab-trigger\" data-vocab=\"shaken and miserable\">shaken and miserable<\/span>. They did not know which was more shocking — the <span class=\"vocab-trigger\" data-vocab=\"treachery\">treachery<\/span> of the animals who had <span class=\"vocab-trigger\" data-vocab=\"leagued themselves with Snowball\">leagued themselves with Snowball<\/span>, or the cruel <span class=\"vocab-trigger\" data-vocab=\"retribution\">retribution<\/span> they had just witnessed. In the old days there had often been scenes of bloodshed equally terrible, but it seemed to all of them that it was far worse now that it was happening among themselves. Since Jones had left the farm, until today, no animal had killed another animal. Not even a rat had been killed. They had made their way on to the little <span class=\"vocab-trigger\" data-vocab=\"knoll\">knoll<\/span> where the half-finished windmill stood, and <span class=\"vocab-trigger\" data-vocab=\"with one accord\">with one accord<\/span> they all lay down as though <span class=\"vocab-trigger\" data-vocab=\"huddling together for warmth\">huddling together for warmth<\/span> — Clover, Muriel, Benjamin, the cows, the sheep, and a whole flock of geese and hens — everyone, indeed, except the cat, who had suddenly disappeared just before Napoleon ordered the animals to assemble. For some time nobody spoke. Only Boxer remained on his feet. He <span class=\"vocab-trigger\" data-vocab=\"fidgeted\">fidgeted<\/span> to and fro, <span class=\"vocab-trigger\" data-vocab=\"swishing his long black tail\">swishing his long black tail<\/span> against his sides and occasionally uttering a little <span class=\"vocab-trigger\" data-vocab=\"whinny\">whinny<\/span> of surprise. Finally he said:",
              "zh": "一切过去之后，剩下的动物，除了猪和狗以外，全都挤作一堆溜走了。他们浑身颤抖，满心凄惨。他们不知道哪一样更令人震惊——是那些与雪球勾结的动物的背叛，还是他们刚刚目睹的残忍报复。在旧时代也常有同样恐怖的血腥场面，但他们全都觉得，如今发生在自己同伴当中，要糟糕得多。自从琼斯离开农场，直到今天，没有一只动物杀害过另一只动物。连老鼠也没有杀过。他们走上那个矗立着半建成风车的小丘，不约而同地都卧了下来，好像要挤在一起取暖似的——苜蓿、穆丽尔、本杰明、奶牛、绵羊，还有整整一群鹅和母鸡——事实上，大家全都在，只除了那只猫，她在拿破仑命令动物集合之前就突然不见了。好一阵子，谁也没有说话。只有拳击手还站着。他烦躁不安地来回走动，长长的黑尾巴在身侧甩来甩去，偶尔发出一小声惊异的嘶鸣。最后他说：",
              "simpEn": "When it was over, the remaining animals, except pigs and dogs, crept away together. They were shaken and miserable, not knowing what was more shocking — the betrayal by animals who had sided with Snowball, or the cruel punishment they'd just seen. In the old days there had been terrible bloodshed too, but it felt far worse now that it was among themselves. Since Jones left, until today, no animal had killed another. Not even a rat. They went to the little hill where the half-built windmill stood and all lay down as if huddling for warmth — Clover, Muriel, Benjamin, the cows, sheep, a flock of geese and hens — everyone except the cat, who'd disappeared just before Napoleon called them. For a while no one spoke. Only Boxer stayed standing. He shifted about restlessly, swishing his tail, sometimes giving a little surprised whinny. Finally he said:",
              "simpZh": "事完了之后，剩下的动物除了猪和狗，全挤成一堆溜了。他们又震又苦，不知道哪样更吓人——是和雪球勾搭的动物的背叛，还是刚看见的残酷报应。过去也有同样可怕的流血场面，可如今发生在自己当中，觉得糟糕得多。琼斯走后到今天，没一个动物杀过别的动物，连老鼠也没杀过。他们走到半截风车立着的小丘上，不约而同全卧了下来，像是挤着取暖——苜蓿、穆丽尔、本杰明、母牛们、绵羊们、整群鹅和母鸡——全都在，除了那只猫，在拿破仑下令集合前就不见了。好一阵谁也没说话。只有拳击手还立着。他烦躁地来回走动，黑色长尾巴在身子两边甩来甩去，偶尔发出一小声惊奇的嘶鸣。最后他说："
            },
            {
              "en": "“I do not understand it. I would not have believed that such things could happen on our farm. It must be due to some fault in ourselves. The solution, as I see it, is to work harder. From now onwards I shall get up a full hour earlier in the mornings.”<br>And he <span class=\"vocab-trigger\" data-vocab=\"moved off at his lumbering trot\">moved off at his lumbering trot<\/span> and made for the quarry. Having got there, he collected two <span class=\"vocab-trigger\" data-vocab=\"successive loads\">successive loads<\/span> of stone and dragged them down to the windmill before <span class=\"vocab-trigger\" data-vocab=\"retiring for the night\">retiring for the night<\/span>.",
              "zh": "“我真不明白。我本来不会相信我们农场会发生这种事。这准是我们自己有什么过错造成的。依我看，解决的办法就是更加努力地干活。从今往后，我每天早晨要提早整整一个钟头起床。”<br>他说着便迈开笨重的小跑，朝采石场走去。到了那里，他连续装了两车石头，把它们拖到了风车跟前，然后才回去歇夜。",
              "simpEn": "'I don't understand it. I wouldn't have believed such things could happen on our farm. It must be our own fault somehow. The answer, I think, is to work harder. From now on I'll get up a full hour earlier each morning.' Then he moved off at his heavy, clumsy trot toward the quarry. There he gathered two loads of stone one after the other and dragged them down to the windmill before going to sleep.",
              "simpZh": "“我不懂。我没法相信我们农场会发生这种事。准是我们自己哪出了毛病。我觉得，办法就是更卖力干活。从今往后，我每天早上要提早足足一个钟头起来。”说完他迈着笨重的碎步朝石场走了。到了那，他接连装了两车石头，拖到风车那，然后才回去歇夜。"
            },
            {
              "en": "The animals huddled about Clover, not speaking. The knoll where they were lying gave them a wide <span class=\"vocab-trigger\" data-vocab=\"prospect\">prospect<\/span> across the countryside. Most of Animal Farm was within their view — the long pasture stretching down to the main road, the hayfield, the spinney, the drinking pool, the ploughed fields where the young wheat was thick and green, and the red roofs of the farm buildings with the smoke <span class=\"vocab-trigger\" data-vocab=\"curling\">curling<\/span> from the chimneys. It was a clear spring evening. The grass and the <span class=\"vocab-trigger\" data-vocab=\"bursting hedges\">bursting hedges<\/span> were <span class=\"vocab-trigger\" data-vocab=\"gilded\">gilded<\/span> by the level rays of the sun. Never had the farm — and with a kind of surprise they remembered that it was their own farm, every inch of it their own property — appeared to the animals so <span class=\"vocab-trigger\" data-vocab=\"desirable a place\">desirable a place<\/span>. As Clover looked down the hillside her eyes filled with tears. If she could have spoken her thoughts, it would have been to say that this was not what they had aimed at when they had set themselves years ago to work for the overthrow of the human race. These scenes of terror and slaughter were not what they had looked forward to on that night when old Major first stirred them to rebellion. If she herself had had any picture of the future, it had been of a society of animals set free from hunger and the whip, all equal, each working according to his capacity, the strong protecting the weak, as she had protected the lost <span class=\"vocab-trigger\" data-vocab=\"brood of ducklings\">brood of ducklings<\/span> with her foreleg on the night of Major's speech. Instead — she did not know why — they had come to a time when no one dared speak his mind, when fierce, growling dogs roamed everywhere, and when you had to watch your comrades <span class=\"vocab-trigger\" data-vocab=\"torn to pieces\">torn to pieces<\/span> after confessing to shocking crimes. There was no thought of rebellion or disobedience in her mind. She knew that, even as things were, they were far <span class=\"vocab-trigger\" data-vocab=\"better off\">better off<\/span> than they had been in the days of Jones, and that before all else it was needful to prevent the return of the human beings. Whatever happened she would remain faithful, work hard, carry out the orders that were given to her, and accept the leadership of Napoleon. But still, it was not for this that she and all the other animals had hoped and toiled. It was not for this that they had built the windmill and faced the bullets of Jones's gun. Such were her thoughts, though she lacked the words to express them.",
              "zh": "动物们围拢在苜蓿身边，谁也没有说话。他们伏卧的那个小丘，能让他们望见大片的田野。动物农场的大部分都映入眼帘——一直延伸到公路边的狭长牧场、干草地、小树林、饮水池、长着绿油油麦苗的耕地，以及农场建筑物的红屋顶，烟囱里炊烟袅袅。那是一个清朗的春夜。青草和萌发中的树篱被落日的平射光线镀上了一层金色。在动物们眼中，这座农场——他们带着一种惊奇意识到这是他们自己的农场，每一寸土地都是他们的财产——从未显得如此令人向往。苜蓿俯视着山坡，眼里充满了泪水。假如她能说出心里的话，她会说，这不是他们多年前立誓要为推翻人类而奋斗时所向往的目标。这些恐怖和屠杀的景象，不是老麦哲当初在谷仓里鼓动他们造反的晚上他们所憧憬的。如果她自己对将来有过什么图景的话，那是一个没有饥饿和皮鞭的动物社会，众生平等，各尽所能，强者保护弱者，就像她在麦哲讲话那晚用前腿护住那群迷路的小鸭子一样。可是——她不明白为什么——如今这日子，谁也不敢说心里话，凶恶咆哮的狗到处乱窜，你只能眼睁睁看着自己的同志在坦白骇人罪行之后被撕成碎片。她脑子里并没有造反或不服从的念头。她知道，就算事情到了这个地步，他们还是比琼斯时代要好得多，而且首要的是必须防止人类卷土重来。不管发生什么，她都会保持忠诚，努力工作，服从命令，接受拿破仑的领导。可是，话说回来，这到底不是她和所有其他动物曾经希望并为之苦苦奋斗的目标。这到底不是他们建造风车和面对琼斯子弹的目的。这便是她的想法，尽管她找不到言语来表达。",
              "simpEn": "The animals huddled around Clover, silent. From the hill they could see far across the countryside. Most of Animal Farm lay before them — the long field down to the road, the hayfield, the little wood, the drinking pool, the plowed fields green with young wheat, and the red-roofed farm buildings with smoke rising from chimneys. It was a clear spring evening. The grass and blooming hedges shone gold in the slanting sunlight. Never had the farm — and they suddenly remembered it was theirs, every inch — seemed such a beautiful place. As Clover looked downhill, tears filled her eyes. If she could speak, she would say this was not what they had aimed for years ago when they set out to overthrow humans. These scenes of terror and killing were not what they dreamed of that night old Major stirred them to rebel. Her picture of the future had been of animals free from hunger and the whip, all equal, each working as they could, the strong helping the weak, just as she had shielded the lost ducklings with her leg. Instead, somehow, they had come to a time when no one dared speak freely, fierce dogs roamed, and you had to watch friends torn apart after confessing to awful crimes. She had no thought of rebelling now. She knew that even so, they were far better off than under Jones, and above all they must keep humans from returning. Whatever happened, she would stay loyal, work hard, obey orders, and accept Napoleon as leader. Yet it was not for this that they had all hoped and worked. It was not for this they had built the windmill and faced Jones's gun. Such were her thoughts, though she had no words.",
              "simpZh": "动物们围着苜蓿挤在一起，不出声。他们趴着的小丘能望见大片田野。动物农场的大部分都在眼下——通到大路的狭长草场、干草地、小树林、饮水池、长着绿油油麦苗的耕地、红屋顶的农场房子，烟囱冒着烟。那是个清朗的春天傍晚。青草和萌发的树篱被夕阳光染成了金色。这农场——他们突然记起这是他们自己的农场，每一寸都是——从来没显得这么美。苜蓿朝坡下望着，眼里满是泪。要是她能说出心里话，她会说，这不是多年前他们立志推翻人类时想的目标。这些恐怖屠杀的景象，不是老麦哲那晚鼓动他们造反时他们盼望的。她自己对未来的想象，是一个没有饥饿和鞭子的动物社会，个个平等，各尽所能，强者护弱，就像她在麦哲讲话那晚用前腿护住那群迷路的小鸭子那样。可是——不知为什么——如今却到了这个地步：谁也不敢说心里话，凶狗到处窜，你只能眼看着同志在招认可怕罪行后被撕碎。她心里没想造反或不服从。她知道就算这样，他们仍比琼斯时好得多，最要紧的是不能让人回来。不管发生什么，她会忠诚，卖力干活，服从命令，接受拿破仑的领导。可是，这终究不是她和所有动物曾盼望和辛苦奋斗的目标。不是为这个建风车、挡琼斯的枪子儿。这就是她的想法，尽管她没有语言表达。"
            },
            {
              "en": "At last, feeling this to be in some way a <span class=\"vocab-trigger\" data-vocab=\"substitute\">substitute<\/span> for the words she was unable to find, she began to sing ‘Beasts of England’. The other animals sitting round her took it up, and they sang it three times over — very <span class=\"vocab-trigger\" data-vocab=\"tunefully\">tunefully<\/span>, but slowly and <span class=\"vocab-trigger\" data-vocab=\"mournfully\">mournfully<\/span>, in a way they had never sung it before.",
              "zh": "最后，她觉得这多少可以替代她无法找到的话语，便开口唱起了《英格兰兽》。围坐在她旁边的其他动物也跟着唱了起来，他们一连唱了三遍——曲调唱得很动听，但是缓慢而哀伤，用了一种从未有过的方式。",
              "simpEn": "At last, feeling this somehow made up for the words she couldn't find, she began to sing 'Beasts of England.' The animals around her joined in, and they sang it three times — very tunefully, but slowly and sadly, in a way they had never sung before.",
              "simpZh": "最后，她觉得这多少能代替她找不出的言语，就唱起了《英格兰野兽》。围着的动物跟着唱，一连唱了三遍——很好听，可又慢又悲伤，从来不曾这样唱过。"
            },
            {
              "en": "They had just finished singing it for the third time when Squealer, attended by two dogs, approached them with the air of having something important to say. He announced that, by a special <span class=\"vocab-trigger\" data-vocab=\"decree\">decree<\/span> of Comrade Napoleon, ‘Beasts of England’ had been <span class=\"vocab-trigger\" data-vocab=\"abolished\">abolished<\/span>. From now onwards it was forbidden to sing it.<br>The animals were <span class=\"vocab-trigger\" data-vocab=\"taken aback\">taken aback<\/span>.<br>“Why?” cried Muriel.<br>“It's no longer needed, comrade,” said Squealer <span class=\"vocab-trigger\" data-vocab=\"stiffly\">stiffly<\/span>. “‘Beasts of England’ was the song of the Rebellion. But the Rebellion is now completed. The execution of the traitors this afternoon was the final act. The enemy both external and internal has been defeated. In ‘Beasts of England’ we expressed our longing for a better society in days to come. But that society has now been established. Clearly this song has no longer any purpose.”",
              "zh": "他们刚唱完第三遍，尖啸者在两条狗的跟随下，带着有一件重要事情要宣布的神情走了过来。他宣布，根据拿破仑同志的一项特别法令，《英格兰兽》已被废止。从今以后禁止唱它。<br>动物们大吃一惊。<br>“为什么？”穆丽尔喊道。<br>“不再需要了，同志，”尖啸者生硬地说，“《英格兰兽》是造反的歌。可造反现在已经完成了。今天下午处决叛徒是最后的一幕。外敌和内奸都已被打败。在《英格兰兽》里，我们表达了对未来美好社会的渴望。可那个社会现在已经建成。这首歌显然不再有任何意义了。”",
              "simpEn": "They'd just finished the third time when Squealer, with two dogs, came up looking as if he had important news. He announced that by a special order of Comrade Napoleon, 'Beasts of England' had been abolished. From now on, singing it was forbidden. The animals were stunned. 'Why?' cried Muriel. 'It's no longer needed, comrade,' Squealer said stiffly. ''Beasts of England' was the song of the Rebellion. But the Rebellion is complete. Today's execution of traitors was the final act. The enemy outside and inside is defeated. In the song we expressed longing for a better future society. But that society is now established. So the song has no more purpose.'",
              "simpZh": "刚唱完第三遍，尖啸者带着两条狗过来了，像是有什么要紧事宣布。他说，根据拿破仑同志的一项特别法令，《英格兰野兽》被废止了。从今往后不准唱。动物们大吃一惊。“为什么？”穆丽尔喊道。“不再需要了，同志，”尖啸者生硬地说，“《英格兰野兽》是造反的歌。可造反已经完成了。今天下午处决叛徒是最后一幕。外敌内奸都打败了。歌里我们表达了对未来更好社会的渴望。可那个社会已经建成。这歌显然没用了。”"
            },
            {
              "en": "Frightened though they were, some of the animals might possibly have protested, but at this moment the sheep set up their usual bleating of “Four legs good, two legs bad,” which went on for several minutes and put an end to the discussion.<br>So ‘Beasts of England’ was heard no more. In its place Minimus, the poet, had composed another song which began:<br>Animal Farm, Animal Farm,<br>Never through me shalt thou come to harm!<br>and this was sung every Sunday morning after the hoisting of the flag. But somehow neither the words nor the tune ever seemed to the animals to <span class=\"vocab-trigger\" data-vocab=\"come up to\">come up to<\/span> ‘Beasts of England’.",
              "zh": "动物们虽然害怕，有几个也许还想抗议，但这时候绵羊又照例咩咩地喊起“四条腿好，两条腿坏”，喊了好几分钟，彻底封住了讨论。<br>从此以后，《英格兰兽》再也听不到了。代替它的是诗人梅尼缪斯作的另一首歌，开头是：<br>动物农场，动物农场，<br>有我在，你就绝不会遭殃！<br>每个星期天早上，升旗之后都要唱这首歌。但不知怎的，在动物们看来，这首歌无论歌词还是曲调，都总比不上《英格兰兽》。",
              "simpEn": "Though scared, some animals might have protested, but just then the sheep started their usual bleating of 'Four legs good, two legs bad,' which went on for minutes and ended the discussion. So 'Beasts of England' was never heard again. In its place, the poet Minimus had written a new song: 'Animal Farm, Animal Farm, Never through me shalt thou come to harm!' This was sung every Sunday after the flag was raised. But somehow neither the words nor the tune ever seemed to the animals to match 'Beasts of England.'",
              "simpZh": "虽然害怕，有几个动物可能还想抗议，可这时绵羊又照常咩咩喊起“四条腿好，两条腿坏”，喊了好几分钟，把讨论彻底堵死了。于是《英格兰野兽》再也听不到了。代替的是诗人米尼姆斯作的另一首歌，开头是：动物农场，动物农场，有我在，你就绝不会遭殃！每星期天升旗后唱这个。可不知怎的，动物们总觉得这歌词和调子怎么也赶不上《英格兰野兽》。"

          "paragraphs": [
            {
              "en": "A few days later, when the terror caused by the executions had died down, some of the animals remembered — or thought they remembered — that the Sixth Commandment decreed “No animal shall kill any other animal.” And though no one cared to mention it in the hearing of the pigs or the dogs, it was felt that the killings which had taken place did not <span class=\"vocab-trigger\" data-vocab=\"square with\">square with<\/span> this. Clover asked Benjamin to read her the Sixth Commandment, and when Benjamin, as usual, said that he refused to <span class=\"vocab-trigger\" data-vocab=\"meddle in such matters\">meddle in such matters<\/span>, she fetched Muriel. Muriel read the Commandment for her. It ran: “No animal shall kill any other animal <span class=\"vocab-trigger\" data-vocab=\"WITHOUT CAUSE\">WITHOUT CAUSE<\/span>.” Somehow or other, the last two words had <span class=\"vocab-trigger\" data-vocab=\"slipped out of the animals’ memory\">slipped out of the animals’ memory<\/span>. But they saw now that the Commandment had not been <span class=\"vocab-trigger\" data-vocab=\"violated\">violated<\/span>; for clearly there was good reason for killing the traitors who had leagued themselves with Snowball.",
              "zh": "几天后，处决造成的恐惧逐渐平息，有些动物记起——或者自以为记起——第六条诫律明明规定“任何动物不得杀害别的动物”。虽然谁也不敢在猪或狗听得见的地方提起，但大家心里都觉得那些杀戮与这条诫律并不相符。苜蓿请本杰明给她念第六条诫律，本杰明一如既往地说他不愿掺和这种事情，苜蓿便找来了穆丽尔。穆丽尔给她念了那一条，上面写着：“任何动物不得无故杀害别的动物。”不知怎的，最后“无故”两个字从动物们的记忆中溜掉了。但现在他们明白了，这条诫律并未被违反；因为显然处死那些与雪球勾结的叛徒是有充分理由的。",
              "simpEn": "A few days after the fear from the killings faded, some animals remembered the Sixth Commandment said, 'No animal shall kill any other animal.' Though no one dared speak near the pigs or dogs, the killings didn't seem to match this. Clover asked Benjamin to read it, but he refused to get involved. Muriel read it: 'No animal shall kill any other animal WITHOUT CAUSE.' The last two words had slipped from their memory. Now they saw the commandment hadn't been broken, since the traitors deserved to die.",
              "simpZh": "过了几天，处决的恐惧过去了，有些动物记得第六条戒律是“任何动物不得杀害别的动物”。虽然没人敢在猪狗跟前提，但都觉得那些杀的事跟这条不合。苜蓿叫本杰明念，本杰明照旧说不管闲事，苜蓿又叫穆丽尔念。上面写着：“任何动物不得无故杀害别的动物。”不知怎么，“无故”两字从记忆里漏了。现在看这戒律没被违反，杀叛徒是有原因的。"
            },
            {
              "en": "Throughout the year the animals worked even harder than they had worked in the previous year. To rebuild the windmill, with walls twice as thick as before, and to finish it by the appointed date, together with the regular work of the farm, was a <span class=\"vocab-trigger\" data-vocab=\"tremendous labour\">tremendous labour<\/span>. There were times when it seemed to the animals that they worked longer hours and fed no better than they had done in Jones’s day. On Sunday mornings Squealer, holding down a long strip of paper with his trotter, would read out to them lists of figures proving that the production of every class of foodstuff had increased by two hundred per cent, three hundred per cent, or five hundred per cent, as the case might be. The animals saw no reason to <span class=\"vocab-trigger\" data-vocab=\"disbelieve\">disbelieve<\/span> him, especially as they could no longer remember very clearly what conditions had been like before the Rebellion. All the same, there were days when they felt that they would sooner have had less figures and more food.",
              "zh": "整整一年，动物们比前一年干得还要卖力。重建风车，墙比原先厚一倍，还要在指定日期完工，加上农场的日常工作，是一项极其艰巨的劳动。有时动物们觉得，他们干活的时间比琼斯时代更长，而吃的却不见得更好。星期天早上，尖啸者用蹄子按住一长条纸，向他们宣读一串串数字，证明各类食物的产量都增加了百分之二百、百分之三百，甚至百分之五百。动物们觉得没有理由不信他，何况他们已经记不太清楚造反前是什么情形了。尽管如此，有些日子里他们还是觉得，宁愿少看些数字，多吃些东西。",
              "simpEn": "All year the animals worked even harder than before. Rebuilding the windmill with double-thick walls by the deadline, plus regular farm work, was a huge effort. Sometimes they felt they worked longer hours and ate no better than under Jones. On Sundays Squealer read out figures on a paper, showing huge increases in food production. The animals believed him since they couldn't remember pre-Rebellion days well. But sometimes they wished for fewer numbers and more food.",

            {
              "en": "All orders were now issued through Squealer or one of the other pigs. Napoleon himself was not seen in public as often as once in a <span class=\"vocab-trigger\" data-vocab=\"fortnight\">fortnight<\/span>. When he did appear, he was attended not only by his <span class=\"vocab-trigger\" data-vocab=\"retinue\">retinue<\/span> of dogs but by a black cockerel who marched in front of him and acted as a kind of <span class=\"vocab-trigger\" data-vocab=\"trumpeter\">trumpeter<\/span>, letting out a loud “cock-a-doodle-doo” before Napoleon spoke. Even in the farmhouse, it was said, Napoleon inhabited separate <span class=\"vocab-trigger\" data-vocab=\"apartments\">apartments<\/span> from the others. He took his meals alone, with two dogs to wait upon him, and always ate from the <span class=\"vocab-trigger\" data-vocab=\"Crown Derby dinner service\">Crown Derby dinner service<\/span> which had been in the glass cupboard in the drawing-room. It was also announced that the gun would be fired every year on Napoleon’s birthday, as well as on the other two anniversaries.",
              "zh": "所有命令现在都通过尖啸者或别的某只猪下达。拿破仑本人两星期也不见得公开露面一次。当他露面时，不仅有一群狗簇拥着，还有一只黑色的小公鸡走在他前面，充当一种号手，在拿破仑讲话前总要高叫一声“喔喔喔”。据说，即使在农庄住宅里，拿破仑也是单独居住，不和别的猪在一起。他独自用膳，有两条狗侍候，而且总是使用原本放在客厅玻璃柜里的那套皇冠德比瓷器。还宣布说，每年除了那两个纪念日外，在拿破仑的生日那天也要鸣枪庆祝。",
              "simpEn": "All orders now came through Squealer or other pigs. Napoleon appeared in public less than once every two weeks. When he did, he was surrounded by his dogs and a black rooster that marched ahead like a trumpet player, crowing loudly before Napoleon spoke. Even in the farmhouse, Napoleon had separate rooms. He ate alone, served by two dogs, and used the fancy Crown Derby china from the glass cupboard. It was also announced that the gun would fire on Napoleon's birthday as well as the other two anniversaries.",
              "simpZh": "现在所有命令都通过尖啸者或别的猪传达。拿破仑难得露面，两星期也见不到一回。露面时，不光一群狗围着，还有只黑公鸡走在前头像吹号手，在拿破仑开口前高声打鸣。据说在住宅里拿破仑也单独住，不和其他猪一起。独自吃饭，两条狗伺候，用的是客厅玻璃柜里的皇冠德比瓷餐具。还宣布每年拿破仑生日那天也要鸣枪，加上另外两个纪念日。"

            {
              "en": "Napoleon was now never spoken of simply as “Napoleon.” He was always referred to in formal style as “our Leader, Comrade Napoleon,” and this pigs liked to invent for him such titles as <span class=\"vocab-trigger\" data-vocab=\"Father of All Animals\">Father of All Animals<\/span>, <span class=\"vocab-trigger\" data-vocab=\"Terror of Mankind\">Terror of Mankind<\/span>, <span class=\"vocab-trigger\" data-vocab=\"Protector of the Sheep-fold\">Protector of the Sheep-fold<\/span>, <span class=\"vocab-trigger\" data-vocab=\"Ducklings’ Friend\">Ducklings’ Friend<\/span>, and the like. In his speeches, Squealer would talk with the tears rolling down his cheeks of Napoleon’s wisdom the goodness of his heart, and the deep love he bore to all animals everywhere, even and especially the unhappy animals who still lived in ignorance and slavery on other farms. It had become usual to give Napoleon the credit for every successful achievement and every <span class=\"vocab-trigger\" data-vocab=\"stroke of good fortune\">stroke of good fortune<\/span>. You would often hear one hen remark to another, “<span class=\"vocab-trigger\" data-vocab=\"Under the guidance of our Leader, Comrade Napoleon\">Under the guidance of our Leader, Comrade Napoleon<\/span>, I have laid five eggs in six days”; or two cows, enjoying a drink at the pool, would exclaim, “Thanks to the leadership of Comrade Napoleon, how excellent this water tastes!” The general feeling on the farm was well expressed in a poem entitled <span class=\"vocab-trigger\" data-vocab=\"Comrade Napoleon\">Comrade Napoleon<\/span>, which was composed by Minimus and which ran as follows:",
              "zh": "如今，拿破仑不再被简单地称为“拿破仑”了。他总是被正式地称呼为“我们的领袖拿破仑同志”，猪们还喜欢为他发明各种头衔，比如全体动物之父、人类的克星、羊圈的守护神、鸭子的朋友，诸如此类。尖啸者在演说中会泪流满面地讲述拿破仑的智慧、他善良的心，以及他对所有动物，尤其是对仍在其他农场过着愚昧奴役生活的不幸动物所怀的深切的爱。如今，已经把每一次成功、每一桩好运都归功于拿破仑，这成了一种惯例。你常常会听见一只母鸡对另一只说：“在我们的领袖拿破仑同志指引下，我六天下了五个蛋”；或者两头牛在池边喝水，会感叹：“多亏了拿破仑同志的领导，这水喝起来多么甜美啊！”农场里这种普遍的感情，被梅尼缪斯作的一首题为《拿破仑同志》的诗表达得淋漓尽致，诗文如下：",
              "simpEn": "Napoleon was never called just 'Napoleon' anymore. He was formally addressed as 'our Leader, Comrade Napoleon,' and the pigs invented titles like Father of All Animals, Terror of Mankind, Protector of the Sheep-fold, and Ducklings' Friend. Squealer gave speeches with tears running down his face, praising Napoleon's wisdom, kindness, and love for all animals, especially those still suffering on other farms. Everything good was credited to Napoleon. Hens would say they laid five eggs in six days thanks to his guidance; cows would exclaim the water tasted excellent because of his leadership. Minimus the poet wrote a poem called 'Comrade Napoleon' to capture this feeling.",
              "simpZh": "拿破仑不再只被叫名字了，总被正式称为“我们的领袖拿破仑同志”。猪们还给他弄了好多头衔，像全体动物之父、人类的克星、羊圈守护神、鸭子的朋友。尖啸者讲话时泪流满面，夸拿破仑智慧、心好，对各地动物都充满爱，尤其那些还在别处受苦的。现在什么好事都归功于拿破仑。母鸡会说多亏领袖指引下了几个蛋，牛会说水好喝全因领袖领导。诗人米尼姆斯写了首《拿破仑同志》的诗表达这种感情。"
            },
            {
              "en": "Friend of fatherless!<br>Fountain of happiness!<br>Lord of the swill-bucket! Oh, how my soul is on<br>Fire when I gaze at thy<br>Calm and commanding eye,<br>Like the sun in the sky,<br>Comrade Napoleon!<br><br>Thou are the giver of<br>All that thy creatures love,<br>Full belly twice a day, clean straw to roll upon;<br>Every beast great or small<br>Sleeps at peace in his stall,<br>Thou watchest over all,<br>Comrade Napoleon!<br><br>Had I a sucking-pig,<br>Ere he had grown as big<br>Even as a pint bottle or as a rolling-pin,<br>He should have learned to be<br>Faithful and true to thee,<br>Yes, his first squeak should be<br>“Comrade Napoleon!”",
              "zh": "孤儿的朋友！<br>幸福的源泉！<br>泔水桶的主宰！啊，当我的灵魂<br>仰望你那<br>沉静而威严的眼睛，<br>就像天上的太阳，<br>我便燃起熊熊火焰，<br>拿破仑同志！<br><br>你是你所造万物<br>所爱一切的赐予者，<br>一日两顿饱餐，净草上打滚；<br>大小兽类<br>在厩栏中安睡，<br>是你把一切看顾，<br>拿破仑同志！<br><br>若我有一头小猪，<br>在他还没有<br>长到一品脱瓶子或擀面杖那么大的时候，<br>他就该学会<br>忠诚于你，<br>没错，他第一声尖叫就该是<br>“拿破仑同志！”",
              "simpEn": "The poem hailed Napoleon as the friend of orphans, fountain of happiness, lord of the feed bucket, whose calm eye was like the sun. It praised him as the giver of full bellies and clean straw, watching over every beast in peaceful sleep. The last stanza said that if the poet had a piglet, it would be taught to be faithful to Napoleon, with its first squeak being 'Comrade Napoleon!'",
              "simpZh": "诗里歌颂拿破仑是孤儿的朋友，幸福的源泉，泔水桶的主宰，眼睛像太阳。说他是赐予者，让大家一日两顿饱，净草打滚，大小兽类安睡，全由他看顾。最后一段说，如果诗人有小猪，要教它忠于拿破仑，第一声尖叫就得是“拿破仑同志”。"
            },
            {
              "en": "Napoleon approved of this poem and caused it to be <span class=\"vocab-trigger\" data-vocab=\"inscribed\">inscribed<\/span> on the wall of the big barn, at the opposite end from the Seven Commandments. It was <span class=\"vocab-trigger\" data-vocab=\"surmounted\">surmounted<\/span> by a portrait of Napoleon, in profile, executed by Squealer in white paint.",
              "zh": "拿破仑对这首诗很满意，命人把它题写在谷仓的墙上，就在七条诫律对面的那一端。诗的上方还配了一幅拿破仑侧面像，是尖啸者用白漆画的。",
              "simpEn": "Napoleon liked the poem and had it written on the barn wall, opposite the Seven Commandments. Above it was a profile portrait of Napoleon, painted by Squealer in white paint.",
              "simpZh": "拿破仑满意这诗，让人写在谷仓墙上，正对着七戒那头。诗上面还有尖啸者用白漆画的拿破仑侧面像。"
            }
          ],
          "quiz": [
