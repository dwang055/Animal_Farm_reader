        },
        {
          "sectionId": 3,
          "heading": "Diplomacy, Timber, and Forgery",
          "paragraphs": [
            {
              "en": "Meanwhile, through the <span class=\"vocab-trigger\" data-vocab=\"agency of Whymper\">agency of Whymper<\/span>, Napoleon was engaged in complicated <span class=\"vocab-trigger\" data-vocab=\"negotiations\">negotiations<\/span> with Frederick and Pilkington. The pile of timber was still unsold. Of the two, Frederick was the more anxious to get hold of it, but he would not offer a reasonable price. At the same time there were renewed rumours that Frederick and his men were <span class=\"vocab-trigger\" data-vocab=\"plotting\">plotting<\/span> to attack Animal Farm and to destroy the windmill, the building of which had aroused furious jealousy in him. Snowball was known to be still <span class=\"vocab-trigger\" data-vocab=\"skulking\">skulking<\/span> on Pinchfield Farm. In the middle of the summer the animals were alarmed to hear that three hens had come forward and confessed that, inspired by Snowball, they had entered into a plot to murder Napoleon. They were executed immediately, and fresh <span class=\"vocab-trigger\" data-vocab=\"precautions\">precautions<\/span> for Napoleon’s safety were taken. Four dogs guarded his bed at night, one at each corner, and a young pig named Pinkeye was given the task of tasting all his food before he ate it, lest it should be poisoned.",
              "zh": "与此同时，通过温珀的代理，拿破仑正与弗雷德里克和皮尔金顿进行着复杂的谈判。那堆木材还没有卖掉。两人中弗雷德里克更想得到它，但却不肯出一个公道的价钱。同时又有新的谣言说，弗雷德里克和他手下正在密谋进攻动物农场，摧毁风车，因为风车的建造激起了他的疯狂嫉妒。据说雪球仍潜伏在平奇菲尔德农场。仲夏时分，动物们惊恐地听说三只母鸡走上前来坦白，她们在雪球的煽动下，曾密谋杀害拿破仑。她们立刻被处决了，并且采取了新的措施来确保拿破仑的安全。夜里，有四条狗守卫在他的床铺四角，一头名叫粉眼的年轻公猪被指定了任务，在拿破仑进餐前先尝过他的所有食物，以防下毒。",
              "simpEn": "Through Whymper, Napoleon was in complicated talks with Frederick and Pilkington. The timber pile was still unsold. Frederick wanted it more but wouldn't pay fairly. Rumors resurfaced that Frederick planned to attack and destroy the windmill, which had made him furiously jealous. Snowball was said to be hiding at Pinchfield. In midsummer, three hens confessed to a plot, inspired by Snowball, to murder Napoleon. They were killed at once, and new safety measures were taken: four dogs guarded Napoleon's bed at night, and a pig named Pinkeye tasted his food for poison.",
              "simpZh": "通过温珀，拿破仑在跟弗雷德里克和皮尔金顿谈复杂的买卖。那堆木材还没卖掉。弗雷德里克更想要，可不肯出公道价。又有传言说他在密谋攻打农场，毁掉风车，因为风车让他嫉妒得要命。雪球据说还藏在平奇菲尔德。仲夏时三只母鸡坦白，在雪球鼓动下密谋杀拿破仑。她们马上被处死，还加了新安全措施：四条狗夜里守床四角，一只叫粉眼的猪先尝拿破仑的食物防毒。"
            },
            {
              "en": "At about the same time it was given out that Napoleon had arranged to sell the pile of timber to Mr. Pilkington; he was also going to enter into a regular agreement for the exchange of certain products between Animal Farm and Foxwood. The relations between Napoleon and Pilkington, though they were only conducted through Whymper, were now almost friendly. The animals <span class=\"vocab-trigger\" data-vocab=\"distrusted\">distrusted<\/span> Pilkington, as a human being, but greatly preferred him to Frederick, whom they both feared and hated. As the summer wore on, and the windmill neared completion, the rumours of an <span class=\"vocab-trigger\" data-vocab=\"impending treacherous attack\">impending treacherous attack<\/span> grew stronger and stronger. Frederick, it was said, intended to bring against them twenty men all armed with guns, and he had already <span class=\"vocab-trigger\" data-vocab=\"bribed the magistrates and police\">bribed the magistrates and police<\/span>, so that if he could once get hold of the <span class=\"vocab-trigger\" data-vocab=\"title-deeds\">title-deeds<\/span> of Animal Farm they would ask no questions. Moreover, terrible stories were <span class=\"vocab-trigger\" data-vocab=\"leaking out\">leaking out<\/span> from Pinchfield about the cruelties that Frederick practised upon his animals. He had <span class=\"vocab-trigger\" data-vocab=\"flogged\">flogged<\/span> an old horse to death, he starved his cows, he had killed a dog by throwing it into the furnace, he amused himself in the evenings by making cocks fight with splinters of razor-blade tied to their spurs. The animals’ blood boiled with rage when they heard of these things being done to their comrades, and sometimes they <span class=\"vocab-trigger\" data-vocab=\"clamoured\">clamoured<\/span> to be allowed to go out in a body and attack Pinchfield Farm, drive out the humans, and set the animals free. But Squealer <span class=\"vocab-trigger\" data-vocab=\"counselled\">counselled<\/span> them to avoid rash actions and trust in Comrade Napoleon’s strategy.",
              "zh": "大约与此同时，有消息说拿破仑已安排把那堆木材卖给皮尔金顿先生；他还将正式签订协议，在动物农场和福克斯伍德之间交换某些产品。拿破仑和皮尔金顿之间的关系，虽然只通过温珀进行，如今几乎是友好的了。动物们作为人类，不信任皮尔金顿，但比起弗雷德里克来，他们更宁愿是他，因为弗雷德里克又让他们害怕又让他们憎恨。随着夏天过去，风车快要建成，关于一场背信弃义的攻击即将来临的谣言也越来越盛。据说弗雷德里克打算带二十个人，全副武装，而且已经贿赂了法官和警察，只要他能把动物农场的地契搞到手，他们就装聋作哑。此外，平奇菲尔德那边不断泄露出弗雷德里克虐待他的动物的可怕故事。他曾把一匹老马鞭打至死，他让他的牛挨饿，他把一条狗扔进炉子里烧死，晚上他拿斗鸡取乐，把剃刀碎片绑在公鸡的脚刺上。听到同志们在遭受这些，动物们怒火中烧，有时他们高声喊着要求让他们全体出动，攻打平奇菲尔德农场，赶走人类，解放那里的动物。但是尖啸者劝他们不要轻举妄动，要相信拿破仑同志的策略。",
              "simpEn": "Around this time it was announced that Napoleon had agreed to sell the timber to Pilkington and would start a regular product exchange with Foxwood. Relations with Pilkington, through Whymper, became almost friendly. The animals distrusted Pilkington but preferred him to Frederick, whom they feared and hated. As summer passed and the windmill neared completion, rumors of a sneaky attack grew. Frederick was said to be bringing twenty armed men and had bribed officials so he could take the farm's ownership papers without trouble. Terrible stories leaked from Pinchfield about Frederick's cruelty: he beat an old horse to death, starved cows, killed a dog in a furnace, and made roosters fight with razor blades tied to their spurs. The animals raged and demanded to attack, but Squealer urged them to avoid rash moves and trust Napoleon's strategy.",
              "simpZh": "差不多这时候，传出消息说拿破仑把那堆木材卖给皮尔金顿了，还要签正式交换产品协议。跟皮尔金顿的关系，虽然只通过温珀，现在几乎友好了。动物们不信任皮尔金顿，可比起又怕又恨的弗雷德里克，他们宁愿是他。风车快建成时，背信弃义进攻的谣言越来越凶。说弗雷德里克要带二十个带枪的人，还贿赂了法官警察，只要拿到地契就不管。还漏出弗雷德里克残忍对待动物的事：鞭死老马、饿牛、把狗扔炉子、在鸡距上绑剃刀片斗鸡。动物们气得要冲出去攻打，尖啸者劝别鲁莽，信拿破仑的策略。"
            },
            {
              "en": "Nevertheless, feeling against Frederick continued to run high. One Sunday morning Napoleon appeared in the barn and explained that he had never at any time <span class=\"vocab-trigger\" data-vocab=\"contemplated\">contemplated<\/span> selling the pile of timber to Frederick; he considered it <span class=\"vocab-trigger\" data-vocab=\"beneath his dignity\">beneath his dignity<\/span>, he said, to have dealings with <span class=\"vocab-trigger\" data-vocab=\"scoundrels of that description\">scoundrels of that description<\/span>. The pigeons who were still sent out to spread tidings of the Rebellion were forbidden to set foot anywhere on Foxwood, and were also ordered to drop their former slogan of “Death to Humanity” in favour of “Death to Frederick.” In the late summer yet another of Snowball’s <span class=\"vocab-trigger\" data-vocab=\"machinations\">machinations<\/span> was laid bare. The wheat crop was full of weeds, and it was discovered that on one of his nocturnal visits Snowball had mixed weed seeds with the seed corn. A gander who had been <span class=\"vocab-trigger\" data-vocab=\"privy to the plot\">privy to the plot<\/span> had confessed his guilt to Squealer and immediately committed suicide by swallowing <span class=\"vocab-trigger\" data-vocab=\"deadly nightshade berries\">deadly nightshade berries<\/span>. The animals now also learned that Snowball had never — as many of them had believed <span class=\"vocab-trigger\" data-vocab=\"hitherto\">hitherto<\/span> — received the order of “Animal Hero, First Class.” This was merely a legend which had been spread some time after the Battle of the Cowshed by Snowball himself. <span class=\"vocab-trigger\" data-vocab=\"So far from being decorated\">So far from being decorated<\/span>, he had been <span class=\"vocab-trigger\" data-vocab=\"censured\">censured<\/span> for showing cowardice in the battle. Once again some of the animals heard this with a certain <span class=\"vocab-trigger\" data-vocab=\"bewilderment\">bewilderment<\/span>, but Squealer was soon able to convince them that their memories had been at fault.",
              "zh": "尽管如此，反对弗雷德里克的激情仍旧高涨。一个星期天早上，拿破仑在谷仓里露面，解释说他在任何时候都从未考虑过把那堆木材卖给弗雷德里克；他说，跟那样的恶棍打交道有失他的尊严。那些仍被派出去传播造反消息的鸽子，被禁止踏上福克斯伍德的一寸土地，并且奉命把先前的口号“处死人类”改为“处死弗雷德里克”。夏末，雪球的又一桩阴谋被揭发。麦田里长满了杂草，原来雪球在某次夜访中把草籽混进了种子玉米里。一只参与了此事的公鹅向尖啸者坦白了自己的罪行，然后立刻吞下致命的颠茄浆果自杀了。动物们现在又得知，雪球从来就——不像许多动物至今相信的那样——没有获得过“一级动物英雄”勋章。那不过是牛棚战役后雪球自己散布的谎言。他不但没有被授勋，还因为在战役中表现怯懦而受到过申斥。有些动物听了这话又一次感到迷惑，但尖啸者很快就说服了他们，是他们的记忆出了差错。",
              "simpEn": "Still, hatred for Frederick ran high. One Sunday Napoleon said he had never considered selling to Frederick; it was beneath his dignity to deal with such scoundrels. Pigeons spreading rebellion news were banned from Foxwood and told to change their slogan from 'Death to Humanity' to 'Death to Frederick.' Late summer, another Snowball plot was exposed: weeds in the wheat were from weed seeds he'd mixed with the seed corn at night. A male goose involved confessed and killed himself with poisonous berries. The animals also learned that Snowball had never actually received the 'Animal Hero, First Class' medal — that was a lie he spread after the Battle of the Cowshed. In fact, he was criticized for cowardice during the battle. Some animals were confused, but Squealer convinced them their memories were wrong.",
              "simpZh": "但反对弗雷德里克的劲头还是很高。一个星期天拿破仑说从来没打算卖给弗雷德里克，跟那种坏蛋打交道掉价。传消息的鸽子不准去福克斯伍德，口号改成“处死弗雷德里克”。夏末又揭出雪球一桩阴谋：麦田杂草是他夜里把草籽混进种子里。一只参与的公鹅坦白后吃毒浆果自杀了。动物们又听说，雪球根本从来没得“一级动物英雄”勋章，那是他战后自己造的谣。他不但没被授勋，还因为临阵怯懦受过批评。有些动物又迷糊了，但尖啸者很快让他们信了是自己记错。"
            },
            {
              "en": "In the autumn, by a tremendous, exhausting effort — for the harvest had to be gathered at almost the same time — the windmill was finished. The machinery had still to be installed, and Whymper was negotiating the purchase of it, but the structure was completed. <span class=\"vocab-trigger\" data-vocab=\"In the teeth of every difficulty\">In the teeth of every difficulty<\/span>, in spite of inexperience, of primitive implements, of bad luck and of Snowball’s <span class=\"vocab-trigger\" data-vocab=\"treachery\">treachery<\/span>, the work had been finished <span class=\"vocab-trigger\" data-vocab=\"punctually to the very day\">punctually to the very day<\/span>! Tired out but proud, the animals walked round and round their <span class=\"vocab-trigger\" data-vocab=\"masterpiece\">masterpiece<\/span>, which appeared even more beautiful in their eyes than when it had been built the first time. Moreover, the walls were twice as thick as before. Nothing short of explosives would lay them low this time! And when they thought of how they had laboured, what discouragements they had overcome, and the enormous difference that would be made in their lives when the sails were turning and the dynamos running — when they thought of all this, their tiredness <span class=\"vocab-trigger\" data-vocab=\"forsook them\">forsook them<\/span> and they <span class=\"vocab-trigger\" data-vocab=\"gambolled\">gambolled<\/span> round and round the windmill, uttering cries of triumph. Napoleon himself, attended by his dogs and his cockerel, came down to inspect the completed work; he personally congratulated the animals on their achievement, and announced that the mill would be named Napoleon Mill.",
              "zh": "秋天，经过艰苦卓绝的努力——因为收割几乎得同时进行——风车终于建成了。机器还没有安装，温珀正在洽谈购买，但是结构已经完成。面对着一切困难，尽管缺乏经验、工具原始、运气不佳，还有雪球的背叛，工程还是在指定的那一天如期完工了！动物们精疲力竭，但满心自豪，围着他们的杰作走了一圈又一圈，在他们眼中，这风车比第一次建成的还要美丽。况且，墙壁比从前厚了一倍。除非用炸药，这回什么也别想把它弄倒了！想到他们怎么苦干，克服了多少挫折，一旦翼板转动、发电机运行，他们的生活将发生多么巨大的变化——想到这一切，他们的疲惫便一扫而光，围着风车欢蹦乱跳，发出胜利的欢呼。拿破仑亲自带着他的狗和公鸡，下来视察完工的工程；他亲自祝贺动物们取得的成就，并宣布这座风车将命名为拿破仑风车。",
              "simpEn": "In the autumn, with a huge, exhausting effort, the windmill was finished. The machinery still had to be bought through Whymper, but the building was done. Despite all difficulties, inexperience, basic tools, bad luck, and Snowball's betrayal, the work was completed right on schedule. Exhausted but proud, the animals circled their masterpiece, thinking it even more beautiful than the first one. The walls were twice as thick. Only explosives could bring it down now. Thinking of their labor and the bright future with electricity, their tiredness vanished and they gambolled around cheering. Napoleon, with his dogs and rooster, inspected the work, congratulated them, and announced it would be called Napoleon Mill.",
              "simpZh": "秋天，拼了大力气，风车建成了。机器还得通过温珀买，但结构已经好了。顶着所有困难，没经验、工具简陋、运气差，加上雪球的背叛，工程还是按期完工！动物们累坏了但很自豪，围着杰作转，觉得比第一次更美。墙厚了一倍，除非炸药，弄不倒它了。想到辛苦和将来有电的好日子，疲倦一扫而光，高兴得围着风车蹦跳欢呼。拿破仑带着狗和公鸡来看了，祝贺大家，宣布这风车叫拿破仑风车。"

              "zh": "与福克斯伍德的一切关系都破裂了；给皮尔金顿送去了侮辱性的信。鸽子们被命令避开平奇菲尔德农场，并把口号从“处死弗雷德里克”改为“处死皮尔金顿”。同时拿破仑向动物们保证，关于即将对动物农场发动袭击的传言完全是不真实的，那些关于弗雷德里克虐待他的动物的说法也被大大夸张了。所有这些谣言大概都是雪球和他的特务制造的。现在看来，雪球毕竟没有藏在平奇菲尔德农场，实际上他这辈子从没去过那里：他正住在——据说相当奢华地——福克斯伍德，而且事实上多年来一直是皮尔金顿所供养的人。",

              "zh": "猪们对拿破仑的谋略欣喜若狂。通过假装与皮尔金顿友好，他逼得弗雷德里克将价格抬高了十二英镑。但尖啸者说，拿破仑心智的卓越更表现在他不信任任何人，连弗雷德里克也不信。弗雷德里克本想用一种叫支票的东西支付木材款，那似乎是一张写了支付承诺的纸。但拿破仑比他更精明。他要求用真正的五英镑钞票付款，而且必须在运走木材之前交付。弗雷德里克已经付清了；而他付出的那笔钱正好够买风车的机器。",

              "zh": "三天后，一阵可怕的喧嚷爆发了。温珀脸色煞白，骑着自行车飞驰而来，把车往院子里一扔，径直冲进了农庄住宅。紧接着，拿破仑的房间里便传出了一声愤怒得透不过气来的咆哮。出事的消息像野火一样迅速传遍了整个农场。钞票是假的！弗雷德里克白白弄走了木材！",
              "simpEn": "Three days later, chaos erupted. Whymper, deadly pale, raced up on his bicycle, threw it down, and rushed into the farmhouse. Moments later, a choking roar of rage came from Napoleon's rooms. The news spread like wildfire: the banknotes were forgeries! Frederick had gotten the timber for nothing!",
              "simpZh": "三天后，一场大乱子爆发了。温珀脸色惨白，骑车冲进来，把车一扔跑进住宅。接着从拿破仑房间传出愤怒得噎住的吼叫。消息像野火一样传开：钞票是假的！弗雷德里克白白骗走了木材！"

            {

              "simpZh": "拿破仑马上集合大家，厉声判弗雷德里克死刑，说抓住就活煮。他警告这事之后最坏的要来了，弗雷德里克随时会打过来。所有路口都放了哨。又派四只鸽子去福克斯伍德，带和解信，想跟皮尔金顿修好。"

            {
              "en": "The very next morning the attack came. The animals were at breakfast when the look-outs came racing in with the news that Frederick and his followers had already come through the five-barred gate. Boldly enough the animals <span class=\"vocab-trigger\" data-vocab=\"sallied forth\">sallied forth<\/span> to meet them, but this time they did not have the easy victory that they had had in the Battle of the Cowshed. There were fifteen men, with half a dozen guns between them, and they opened fire as soon as they got within fifty yards. The animals could not face the terrible explosions and the <span class=\"vocab-trigger\" data-vocab=\"stinging pellets\">stinging pellets<\/span>, and in spite of the efforts of Napoleon and Boxer to <span class=\"vocab-trigger\" data-vocab=\"rally them\">rally them<\/span>, they were soon driven back. A number of them were already wounded. They took refuge in the farm buildings and peeped cautiously out from <span class=\"vocab-trigger\" data-vocab=\"chinks and knot-holes\">chinks and knot-holes<\/span>. The whole of the big pasture, including the windmill, was in the hands of the enemy. For the moment even Napoleon seemed at a loss. He paced up and down without a word, his tail rigid and twitching. Wistful glances were sent in the direction of Foxwood. If Pilkington and his men would help them, the day might yet be won. But at this moment the four pigeons, who had been sent out on the day before, returned, one of them bearing a scrap of paper from Pilkington. On it was pencilled the words: “<span class=\"vocab-trigger\" data-vocab=\"Serves you right\">Serves you right<\/span>.”",
              "zh": "第二天一早，进攻就来了。动物们正在吃早饭，瞭望哨飞跑进来报告，弗雷德里克和他手下已经穿过了五道横木的大门。动物们勇敢地冲出去迎敌，但这一次他们没有像牛棚战役那样轻易取胜。一共有十五个人，带着六条枪，他们刚进入五十码以内就开了火。动物们抵挡不住那些可怕的爆炸和刺痛的子弹，尽管拿破仑和拳击手努力重振队伍，他们还是很快被击退了。许多动物已经受了伤。他们躲进农场房舍里，小心翼翼地从裂缝和节孔中向外窥视。整个大牧场，包括风车在内，都落入了敌人手中。此刻连拿破仑也似乎没了主意。他来回踱步，一言不发，尾巴僵硬地抽搐着。大家朝福克斯伍德的方向投去渴望的目光。如果皮尔金顿和他的人能来帮忙，也许还能打赢。但就在这时，前一天派出去的那四只鸽子飞回来了，其中一只带着皮尔金顿的一小片纸。上面用铅笔写着两个字：“活该。”",
              "simpEn": "The next morning the attack came. The animals were at breakfast when lookouts raced in saying Frederick and his men had come through the gate. The animals bravely went out to fight, but this time there was no easy victory. Fifteen men with six guns fired at fifty yards. The animals couldn't face the explosions and stinging pellets, and despite Napoleon and Boxer trying to rally them, they were pushed back, many wounded. They hid in the farm buildings and peeped through cracks and knotholes. The entire big pasture, including the windmill, was in enemy hands. Even Napoleon seemed lost, pacing silently, tail twitching. They looked toward Foxwood hopefully, but just then the four pigeons returned with a scrap of paper from Pilkington pencilled with 'Serves you right.'",
              "simpZh": "第二天一早进攻就来了。动物们正吃早饭，哨兵跑进来说弗雷德里克带人进了大门。动物们勇敢地冲出去迎战，可这次没有上回那么容易赢。十五个人六条枪，五十码内就开火。动物们顶不住爆炸和刺痛的弹丸，尽管拿破仑和拳击手鼓劲，还是被打了回来，好些受伤。他们躲进农舍，从缝和节孔里往外瞄。整个大草场包括风车都落进敌人手里。连拿破仑也没了主意，来回踱步，尾巴僵着抽动。大家朝福克斯伍德望，盼望皮尔金顿帮忙。可那四只鸽子飞了回来，带了一张纸片，上面铅笔写着：“活该。”"
            },
            {
              "en": "Meanwhile Frederick and his men had halted about the windmill. The animals watched them, and a murmur of dismay went round. Two of the men had produced a <span class=\"vocab-trigger\" data-vocab=\"crowbar and a sledge hammer\">crowbar and a sledge hammer<\/span>. They were going to knock the windmill down.<br>“Impossible!” cried Napoleon. “We have built the walls far too thick for that. They could not knock it down in a week. Courage, comrades!”<br>But Benjamin was watching the movements of the men intently. The two with the hammer and the crowbar were drilling a hole near the base of the windmill. Slowly, and with an air almost of amusement, Benjamin nodded his long muzzle.<br>“I thought so,” he said. “Do you not see what they are doing? In another moment they are going to pack <span class=\"vocab-trigger\" data-vocab=\"blasting powder\">blasting powder<\/span> into that hole.”",
              "zh": "这时弗雷德里克和他的人在风车旁停了下来。动物们注视着他们，一阵惊恐的咕哝声传遍四周。其中两个人拿出了一根撬棍和一把大锤。他们要砸倒风车。<br>“不可能！”拿破仑喊道，“我们把墙建得那么厚，就凭那个可不行。他们一个星期也砸不倒。勇敢点，同志们！”<br>但是本杰明紧盯着那些人的动作。那两个拿着锤子和撬棍的家伙正在风车底部附近钻一个洞。本杰明慢慢地，带着一种近乎觉得好笑的神情，点了点他的长嘴。<br>“我想到了，”他说，“你们没看见他们在干什么吗？再过一会儿，他们就要把炸药塞进那个洞里了。”",
              "simpEn": "Frederick's men stopped near the windmill, and a worried murmur spread. Two men brought out a crowbar and sledge hammer to knock it down. 'Impossible!' cried Napoleon. 'The walls are far too thick. They couldn't knock it down in a week. Courage, comrades!' But Benjamin watched closely. The two were drilling a hole near the base. Slowly, almost amused, Benjamin nodded his long muzzle. 'I thought so,' he said. 'Don't you see what they're doing? In a moment they'll pack blasting powder into that hole.'",
              "simpZh": "弗雷德里克的人在风车那停下了，动物们一阵惊慌嘀咕。两个人拿出撬棍和大锤，要砸倒风车。“不可能！”拿破仑喊道，“墙太厚，他们一星期也砸不倒。勇敢点，同志们！”但本杰明紧盯着。那两人在风车底座附近钻了个洞。本杰明慢慢地、几乎觉得好笑地点点长嘴。“我想到了，”他说，“没看见吗？他们就要把炸药塞进那洞里了。”"
            },
            {
              "en": "Terrified, the animals waited. It was impossible now to venture out of the shelter of the buildings. After a few minutes the men were seen to be running in all directions. Then there was a <span class=\"vocab-trigger\" data-vocab=\"deafening roar\">deafening roar<\/span>. The pigeons swirled into the air, and all the animals, except Napoleon, <span class=\"vocab-trigger\" data-vocab=\"flung themselves flat on their bellies\">flung themselves flat on their bellies<\/span> and hid their faces. When they got up again, a huge cloud of black smoke was hanging where the windmill had been. Slowly the breeze drifted it away. The windmill had ceased to exist!",
              "zh": "动物们恐惧地等待着。现在不可能冒险离开建筑物的遮蔽了。几分钟后，只见那些人四散奔逃。接着是一声震耳欲聋的巨响。鸽子们盘旋着飞向空中，所有的动物，除了拿破仑，全都趴倒在地，把脸藏起来。当他们再站起来时，风车曾经矗立的地方悬着一大团黑烟。微风慢慢把它吹散了。风车已不复存在！",
              "simpEn": "Terrified, the animals waited. It was impossible to leave the shelter of the buildings now. After a few minutes the men ran off in all directions. Then came a deafening roar. Pigeons swirled upward, and all animals except Napoleon threw themselves flat on their bellies and hid their faces. When they got up, a huge black cloud hung where the windmill had been. The breeze slowly blew it away. The windmill had ceased to exist!",
              "simpZh": "动物们吓坏了，等着。现在没法离开房子的掩护了。几分钟后那些人四散跑开。然后一声震耳欲聋的巨响。鸽子盘旋飞起，所有动物除了拿破仑，全趴倒在地捂住脸。再起来时，风车那位置悬着一大团黑烟。微风慢慢吹散。风车已经不存在了！"
            },
            {
              "en": "At this sight the animals’ courage returned to them. The fear and despair they had felt a moment earlier were drowned in their rage against this <span class=\"vocab-trigger\" data-vocab=\"vile, contemptible act\">vile, contemptible act<\/span>. A mighty cry for <span class=\"vocab-trigger\" data-vocab=\"vengeance\">vengeance<\/span> went up, and without waiting for further orders they charged forth in a body and made straight for the enemy. This time they did not heed the cruel pellets that swept over them like hail. It was a <span class=\"vocab-trigger\" data-vocab=\"savage, bitter battle\">savage, bitter battle<\/span>. The men fired again and again, and, when the animals got to close quarters, lashed out with their sticks and their heavy boots. A cow, three sheep, and two geese were killed, and nearly everyone was wounded. Even Napoleon, who was directing operations from the rear, had the tip of his tail <span class=\"vocab-trigger\" data-vocab=\"chipped\">chipped<\/span> by a pellet. But the men did not go <span class=\"vocab-trigger\" data-vocab=\"unscathed\">unscathed<\/span> either. Three of them had their heads broken by blows from Boxer’s hoofs; another was <span class=\"vocab-trigger\" data-vocab=\"gored\">gored<\/span> in the belly by a cow’s horn; another had his trousers nearly torn off by Jessie and Bluebell. And when the nine dogs of Napoleon’s own bodyguard, whom he had instructed to make a <span class=\"vocab-trigger\" data-vocab=\"detour\">detour<\/span> under cover of the hedge, suddenly appeared on the men’s <span class=\"vocab-trigger\" data-vocab=\"flank\">flank<\/span>, <span class=\"vocab-trigger\" data-vocab=\"baying ferociously\">baying ferociously<\/span>, panic overtook them. They saw that they were in danger of being surrounded. Frederick shouted to his men to <span class=\"vocab-trigger\" data-vocab=\"get out while the going was good\">get out while the going was good<\/span>, and the next moment the cowardly enemy was running for dear life. The animals chased them right down to the bottom of the field, and got in some last kicks at them as they forced their way through the thorn hedge.",
              "zh": "看到这情景，动物们的勇气又回来了。先前一刻感到的恐惧和绝望，已被他们对这卑鄙无耻行径的狂怒所淹没。一阵复仇的呐喊冲天而起，动物们不等进一步的命令，便全体冲向前去，直扑敌人。这一次，他们不再理会那些冰雹般扫来的残忍弹丸。那是一场残酷惨烈的战斗。人们不停地开火，等到动物们接近时，又用棍棒和沉重的靴子猛打猛踢。一头母牛、三只绵羊和两只鹅被杀死了，几乎每一个动物都受了伤。就连在后方指挥作战的拿破仑，尾巴尖也被一颗弹丸打掉了一块。但人们也并非毫发无伤。三个人被拳击手的蹄子踢破了脑袋；另一个被母牛的角刺穿了肚子；还有一个的裤子几乎被杰西和蓝铃扯掉。当拿破仑的九条贴身护卫犬，在他指示下沿着树篱隐蔽迂回，突然出现在敌人的侧翼，发出凶猛的咆哮时，恐慌攫住了他们。他们眼看就要被包围了。弗雷德里克冲他的人喊道趁还来得及快跑，转眼之间，这些懦弱的敌人便拼命地逃命了。动物们一直追到田地最尽头，趁他们拼命挤过荆棘树篱时，狠狠地最后踢了他们几脚。",
              "simpEn": "At this sight the animals' courage returned. Their earlier fear and despair were drowned in rage at this vile, contemptible act. A mighty cry for vengeance went up, and without orders they charged straight at the enemy. This time they didn't heed the cruel pellets flying like hail. It was a savage, bitter battle. The men fired repeatedly, then lashed out with sticks and heavy boots. A cow, three sheep, and two geese were killed, and nearly everyone was wounded. Even Napoleon, directing from the rear, had his tail tip chipped by a pellet. But the men didn't escape unharmed. Three had their heads broken by Boxer's hoofs; another was gored by a cow; another had his trousers nearly torn off by the dogs. And when Napoleon's nine guard dogs, sent on a detour behind the hedge, appeared on the men's flank baying ferociously, panic hit them. Seeing they risked being surrounded, Frederick shouted to run while they could. The cowardly enemy fled for their lives. The animals chased them to the bottom of the field and kicked them as they forced through the thorn hedge.",
              "simpZh": "看到这，动物们的勇气回来了。刚才的恐惧绝望全被愤怒盖过，恨这卑鄙无耻的事。一阵复仇呐喊冲天，不等命令就全体冲向敌人。这回不在乎冰雹一样的弹丸了。那是场凶狠惨烈的战斗。人们反复开枪，等动物靠近又用棍子和重靴打。一头牛、三只羊、两只鹅死了，几乎全都受伤。连在后面指挥的拿破仑，尾巴尖也给弹丸打掉一块。可人也没完好。三个被拳击手踢破脑袋，一个被牛角顶穿肚子，一个裤子差点被狗扯掉。拿破仑的九条护卫犬从树篱后迂回，突然出现在敌人侧面凶猛地狂吠，恐慌抓住了他们。眼看要被包围，弗雷德里克喊趁早快跑。这些懦弱的敌人拼命逃命。动物们追到地尽头，趁他们挤过刺篱时狠狠踢了几脚。"
            }
          ],

        },
        {
          "sectionId": 5,
          "heading": "Aftermath of the Battle and the Whisky Incident",
          "paragraphs": [
            {
              "en": "They had won, but they were weary and bleeding. Slowly they began to limp back towards the farm. The sight of their dead comrades stretched upon the grass moved some of them to tears. And for a little while they halted in sorrowful silence at the place where the windmill had once stood. Yes, it was gone; almost the last trace of their labour was gone! Even the foundations were partially destroyed. And in rebuilding it they could not this time, as before, make use of the fallen stones. This time the stones had vanished too. The force of the explosion had flung them to distances of hundreds of yards. It was as though the windmill had never been.",
              "zh": "他们赢了，但是疲惫不堪，浑身淌血。他们慢慢地跛着脚朝农场走回去。看见死去的同志横躺在草地上，有些动物流下了眼泪。他们在风车曾经矗立的地方伤心地默默停了一会儿。是的，风车没有了；他们辛劳的最后一点痕迹几乎都没有了！就连地基也部分毁掉了。而且这次重建，他们再也不能像上回那样利用那些坠落的石头了。这一次，连石头也消失不见了。爆炸的力量把它们抛到了几百码之外。仿佛风车从来就不曾存在过。",
              "simpEn": "They had won but were tired and bleeding. They limped back toward the farm. Seeing their dead comrades on the grass brought some to tears. For a while they stood in sad silence where the windmill had been. Yes, it was gone; almost every trace of their hard work was gone! Even the foundations were partly destroyed. This time they couldn't reuse the fallen stones — the explosion had flung them hundreds of yards away. It was as if the windmill had never existed.",
              "simpZh": "他们赢了，可又累又流血。慢慢跛着脚走回农场。看见死去的同志躺在草地上，有的流了泪。在风车曾立着的地方，他们悲伤地默默停了一会儿。是的，风车没了；他们辛苦的痕迹几乎全没了！连地基也毁了一部分。这次重建不能像上回那样用掉落的石头了，石头也被炸飞到几百码外。好像风车从没存在过。"
            },
            {
              "en": "As they approached the farm Squealer, who had <span class=\"vocab-trigger\" data-vocab=\"unaccountably\">unaccountably<\/span> been absent during the fighting, came skipping towards them, whisking his tail and <span class=\"vocab-trigger\" data-vocab=\"beaming with satisfaction\">beaming with satisfaction<\/span>. And the animals heard, from the direction of the farm buildings, the <span class=\"vocab-trigger\" data-vocab=\"solemn booming\">solemn booming<\/span> of a gun.<br>“What is that gun firing for?” said Boxer.<br>“To celebrate our victory!” cried Squealer.<br>“What victory?” said Boxer. His knees were bleeding, he had lost a shoe and split his hoof, and a dozen pellets had <span class=\"vocab-trigger\" data-vocab=\"lodged themselves\">lodged themselves<\/span> in his hind leg.<br>“What victory, comrade? Have we not driven the enemy off our soil — the <span class=\"vocab-trigger\" data-vocab=\"sacred soil of Animal Farm\">sacred soil of Animal Farm<\/span>?”<br>“But they have destroyed the windmill. And we had worked on it for two years!”<br>“What matter? We will build another windmill. We will build six windmills if we feel like it. You do not appreciate, comrade, the mighty thing that we have done. The enemy was in occupation of this very ground that we stand upon. And now — thanks to the leadership of Comrade Napoleon — we have won every inch of it back again!”<br>“Then we have won back what we had before,” said Boxer.<br>“That is our victory,” said Squealer.",
              "zh": "当他们接近农场时，刚才交战时不知为何不在场的尖啸者，蹦蹦跳跳地朝他们迎来，甩着尾巴，满面笑容。动物们听见从农场房舍那边传来了庄严的隆隆枪声。<br>“那枪是为什么放的？”拳击手问。<br>“庆祝我们的胜利啊！”尖啸者喊道。<br>“什么胜利？”拳击手说。他的膝盖在流血，失去了一只蹄铁，蹄壳也裂了，后腿里还嵌着十几颗弹丸。<br>“什么胜利，同志？我们不是已经把敌人从我们的土地上——从动物农场的神圣土地上赶走了吗？”<br>“可他们把风车给毁了。我们为它苦干了两年哪！”<br>“那有什么？我们再建一座风车。只要我们愿意，建六座也行。同志，你还没有认识到我们完成的壮举。敌人刚才就占领着我们脚下这块土地。而现在——多亏了拿破仑同志的领导——我们把每一寸土地都夺回来了！”<br>“那我们只是夺回了我们从前本来就有的东西，”拳击手说。<br>“那就是我们的胜利，”尖啸者说。",
              "simpEn": "As they neared the farm, Squealer, who had been oddly absent during the fight, came skipping toward them, tail flicking, beaming with satisfaction. The animals heard the solemn boom of a gun. 'What's the gun firing for?' Boxer asked. 'To celebrate our victory!' cried Squealer. 'What victory?' said Boxer, his knees bleeding, a shoe lost, hoof split, and a dozen pellets in his hind leg. 'What victory, comrade? Haven't we driven the enemy off the sacred soil of Animal Farm?' 'But they destroyed the windmill. We worked on it for two years!' 'What does it matter? We'll build another. We'll build six if we want. You don't appreciate the mighty thing we've done. The enemy occupied this very ground. Now, thanks to Comrade Napoleon, we've won every inch back!' 'Then we've won back what we had before,' said Boxer. 'That is our victory,' said Squealer.",
              "simpZh": "走近农场时，刚才打仗时莫名不在的尖啸者，蹦跳着迎来，甩着尾巴，满脸得意。动物们听见农场那传来庄严的枪声。“为什么放枪？”拳击手问。“庆祝我们的胜利！”尖啸者喊。“什么胜利？”拳击手说，他膝盖流血，掉了一只掌，蹄子裂了，后腿嵌了十几颗弹丸。“什么胜利，同志？我们把敌人赶出动物农场神圣土地了！”“可他们毁了风车，我们苦干了两年！”“那有什么？我们再建，想建六座也行。同志，你不明白我们完成的壮举。敌人刚才就占着这块地。现在，多亏拿破仑同志领导，我们每一寸都夺回来了！”“那我们只是夺回了原来就有的东西，”拳击手说。“那就是我们的胜利，”尖啸者说。"
            },
            {
              "en": "They limped into the yard. The pellets under the skin of Boxer’s leg <span class=\"vocab-trigger\" data-vocab=\"smarted painfully\">smarted painfully<\/span>. He saw ahead of him the heavy labour of rebuilding the windmill from the foundations, and already in imagination he <span class=\"vocab-trigger\" data-vocab=\"braced himself\">braced himself<\/span> for the task. But for the first time it occurred to him that he was eleven years old and that perhaps his great muscles were not quite what they had once been.",
              "zh": "他们跛着脚走进了院子。拳击手腿皮下嵌着的弹丸刺得他生疼。他看见前面等着他的是从地基开始重建风车的沉重劳动，他在想象中已经咬紧牙关准备迎接这一任务了。但这是头一次，他想起自己已经十一岁了，也许他那巨大的肌肉已经不太像从前那样了。",
              "simpEn": "They limped into the yard. The pellets under Boxer's skin stung painfully. He saw ahead the heavy work of rebuilding the windmill from scratch, and in his mind he braced himself for the task. But for the first time, it occurred to him that he was eleven years old and perhaps his great muscles were not what they used to be.",
              "simpZh": "他们跛进院子。拳击手腿里的弹丸刺得生疼。他眼前是重建风车的重活要从地基干起，心里已在咬牙准备。可头一回想到自己已经十一岁，那身大肌肉也许不如从前了。"
            },
            {
              "en": "But when the animals saw the green flag flying, and heard the gun firing again — seven times it was fired in all — and heard the speech that Napoleon made, congratulating them on their conduct, it did seem to them after all that they had won a great victory. The animals slain in the battle were given a <span class=\"vocab-trigger\" data-vocab=\"solemn funeral\">solemn funeral<\/span>. Boxer and Clover pulled the wagon which served as a <span class=\"vocab-trigger\" data-vocab=\"hearse\">hearse<\/span>, and Napoleon himself walked at the head of the <span class=\"vocab-trigger\" data-vocab=\"procession\">procession<\/span>. Two whole days were given over to celebrations. There were songs, speeches, and more firing of the gun, and a special gift of an apple was <span class=\"vocab-trigger\" data-vocab=\"bestowed\">bestowed<\/span> on every animal, with two ounces of corn for each bird and three biscuits for each dog. It was announced that the battle would be called the Battle of the Windmill, and that Napoleon had created a new decoration, the <span class=\"vocab-trigger\" data-vocab=\"Order of the Green Banner\">Order of the Green Banner<\/span>, which he had <span class=\"vocab-trigger\" data-vocab=\"conferred\">conferred<\/span> upon himself. In the general rejoicings the unfortunate affair of the banknotes was forgotten.",
              "zh": "但是，当动物们看见那面绿色旗帜在飘扬，又听见鸣枪——一共放了七响——并听了拿破仑的演说，祝贺他们的英勇行为之后，他们终究觉得，他们打了一场大胜仗。战役中死去的动物被给予了隆重的葬礼。拳击手和苜蓿拉着当做灵车的货车，拿破仑亲自走在队伍的前头。整整两天被用来庆祝。又是唱歌，又是演说，又是鸣枪，每个动物还得到一份特殊的礼物：一只苹果，每只鸟额外加二盎司玉米，每条狗三块饼干。这一仗被宣布命名为风车战役，拿破仑还设立了一枚新的勋章——绿旗勋章，并亲自授予了自己。在一片欢庆中，钞票那件倒霉事便被遗忘了。",
              "simpEn": "But when they saw the green flag flying, heard the gun fired seven times, and listened to Napoleon's speech congratulating them, it seemed they had won a great victory after all. The dead were given a solemn funeral. Boxer and Clover pulled the wagon hearse, with Napoleon walking at the head of the procession. Two whole days were spent celebrating with songs, speeches, gunfire, and gifts — an apple for each animal, extra corn for birds, biscuits for dogs. The battle was named the Battle of the Windmill, and Napoleon created a new medal, the Order of the Green Banner, which he awarded to himself. In the general joy, the unfortunate matter of the forged banknotes was forgotten.",
              "simpZh": "可动物们看见绿旗飘扬，听见枪响了七次，又听拿破仑讲话表扬他们的表现，终究觉得他们打了大胜仗。战死的动物举行了隆重葬礼。拳击手和苜蓿拉着当灵车的货车，拿破仑走在队伍前头。整整两天庆祝，唱歌、演说、鸣枪，每个动物额外得一个苹果，鸟加玉米，狗加饼干。这仗被命名为风车战役，拿破仑设立新勋章绿旗勋章，授给了自己。在欢庆中，钞票那倒霉事被忘了。"
            },
            {
              "en": "It was a few days later than this that the pigs came upon a case of whisky in the cellars of the farmhouse. It had been overlooked at the time when the house was first occupied. That night there came from the farmhouse the sound of loud singing, in which, to everyone’s surprise, the strains of ‘Beasts of England’ were mixed up. At about half past nine Napoleon, wearing an old <span class=\"vocab-trigger\" data-vocab=\"bowler hat\">bowler hat<\/span> of Mr. Jones’s, was distinctly seen to emerge from the back door, gallop rapidly round the yard, and disappear indoors again. But in the morning a deep silence hung over the farmhouse. Not a pig appeared to be stirring. It was nearly nine o’clock when Squealer made his appearance, walking slowly and <span class=\"vocab-trigger\" data-vocab=\"dejectedly\">dejectedly<\/span>, his eyes dull, his tail hanging limply behind him, and with every appearance of being seriously ill. He called the animals together and told them that he had a terrible piece of news to <span class=\"vocab-trigger\" data-vocab=\"impart\">impart<\/span>. Comrade Napoleon was dying!",
              "zh": "这之后又过了几天，猪们偶然在农庄住宅的地窖里发现了一箱威士忌。当初刚搬进这房子时把它漏掉了。那天夜里，住宅里传出了响亮的唱歌声，令大家吃惊的是，其中竟然夹杂着《英格兰兽》的调子。大约九点半时，有人清清楚楚地看见拿破仑戴着琼斯先生的一顶旧圆顶礼帽，从后门出来，飞快地绕着院子跑了一圈，又消失在屋里。但是到了早晨，一片死寂笼罩着农庄住宅。没有一头猪露面走动。直到快九点，尖啸者才出现，他步履缓慢，垂头丧气，目光呆滞，尾巴软塌塌地拖在身后，完全是一副得了重病的样子。他把动物们召到一起，说有一件可怕的坏消息要宣布。拿破仑同志快要死了！",
              "simpEn": "A few days later, the pigs discovered a case of whisky in the farmhouse cellars, overlooked when they first moved in. That night loud singing came from the farmhouse, and amazingly, strains of 'Beasts of England' were mixed in. Around half-past nine, Napoleon was clearly seen wearing an old bowler hat of Mr. Jones's, rushing out the back door, galloping around the yard, and disappearing back inside. But in the morning a deep silence hung over the farmhouse. No pig was stirring. Nearly at nine, Squealer appeared, walking slowly and gloomily, eyes dull, tail drooping, looking seriously ill. He gathered the animals and told them terrible news: Comrade Napoleon was dying!",
              "simpZh": "几天后，猪们在地窖发现一箱威士忌，当初搬进来时漏掉的。那晚住宅传出响亮的唱歌声，令人吃惊的是，里面竟夹着《英格兰野兽》的调子。九点半左右，有人清清楚楚看见拿破仑戴着琼斯先生一顶旧圆帽，从后门出来，飞快绕院子跑了一圈又进去了。可早上，住宅一片死寂，没有猪出来活动。快九点，尖啸者才露面，慢慢走着，垂头丧气，眼睛无光，尾巴软塌塌拖着，像得了重病。他召集大家，说有可怕消息宣布：拿破仑同志快死了！"

              "zh": "一阵悲痛的哭喊声爆发出来。农庄住宅门外铺上了干草，动物们走路都踮着脚尖。他们含着眼泪互相询问，如果他们的领袖被夺走了，他们该怎么办。一个谣言传开了，说雪球毕竟还是想办法在拿破仑的食物里下了毒。十一点钟，尖啸者出来宣布了另一件事。作为他在尘世的最后一项法令，拿破仑同志颁布了一条庄严的戒令：饮酒者处死刑。",
              "simpEn": "A cry of lamentation went up. Straw was laid outside the farmhouse doors, and the animals walked on tiptoe. With tears in their eyes they asked each other what they'd do if their Leader were taken. A rumor spread that Snowball had finally managed to poison Napoleon's food. At eleven, Squealer came out with another announcement. As his final act on earth, Comrade Napoleon had decreed: drinking alcohol would be punished by death.",

              "zh": "然而到了傍晚，拿破仑似乎好了一些，第二天早上，尖啸者就能够告诉他们，他正在顺利康复。到那天傍晚，拿破仑已经恢复工作，第二天大家又听说，他指示温珀去威灵顿买几本关于酿造和蒸馏的小册子。一星期后，拿破仑下令，果园后面那块原本打算留给年老退休动物作放牧地的小围场，必须犁掉。对外说是因为牧场耗尽了地力，需要重新播种；但很快大家就知道了，拿破仑是打算在那里种大麦。",
              "simpEn": "By evening, however, Napoleon seemed somewhat better, and the next morning Squealer said he was recovering well. By that evening Napoleon was back at work, and the next day he instructed Whymper to buy some booklets on brewing and distilling in Willingdon. A week later, Napoleon ordered the small paddock behind the orchard, previously meant as a retirement grazing ground, to be ploughed up. It was said the pasture was exhausted and needed re-seeding, but soon it was known Napoleon intended to plant barley.",

              "zh": "大约在这时候，发生了一件几乎谁也弄不明白的怪事。一天夜里大约十二点，院子里传来一声巨响，动物们从厩栏里冲了出来。那是个月明之夜。在大谷仓尽头那面写着七条诫律的墙根下，横着一架断成两截的梯子。尖啸者暂时昏了过去，摊开身子倒在旁边，近旁有一盏提灯、一把刷子和一罐打翻了的白漆。那些狗立刻围着尖啸者站成一圈，等他刚能走路，就护送他回到了农庄住宅。谁也想不出这意味着什么，只有老本杰明，他会意地点了点他的长嘴，似乎心里明白，却什么也不肯说。",
              "simpEn": "Around this time a strange incident occurred that no one could understand. One night around midnight, a loud crash in the yard brought the animals rushing out. The moon was bright. At the foot of the barn wall where the Seven Commandments were written lay a ladder broken in two. Squealer, briefly stunned, was sprawled beside it, with a lantern, paintbrush, and an overturned pot of white paint nearby. The dogs immediately formed a ring around Squealer and escorted him to the farmhouse when he could walk. No animal could make sense of it except old Benjamin, who nodded his muzzle with a knowing look, seeming to understand but saying nothing.",
              "simpZh": "这时出了件怪事，谁也搞不懂。一天夜里大概十二点，院子里一声大响，动物们冲出来。月光很亮。在谷仓尽头写七戒的墙根下，一架梯子断成两截。尖啸者昏过去了，摊在旁边，近处有盏提灯、一把刷子和一罐打翻的白漆。狗马上把尖啸者围起来，他一能走就护送回住宅。动物们谁也想不通，只有老本杰明会意地点点长嘴，像心里明白，却什么也不说。"

            {
              "en": "Boxer's <span class=\"vocab-trigger\" data-vocab=\"split hoof\">split hoof<\/span> was a long time in healing. They had started the rebuilding of the windmill the day after the victory celebrations were ended. Boxer refused to take even a day off work, and made it a <span class=\"vocab-trigger\" data-vocab=\"point of honour\">point of honour<\/span> not to let it be seen that he was in pain. In the evenings he would admit privately to Clover that the hoof troubled him a great deal. Clover treated the hoof with <span class=\"vocab-trigger\" data-vocab=\"poultices of herbs\">poultices of herbs<\/span> which she prepared by chewing them, and both she and Benjamin <span class=\"vocab-trigger\" data-vocab=\"urged Boxer to work less hard\">urged Boxer to work less hard<\/span>. “A horse's lungs do not last for ever,” she said to him. But Boxer would not listen. He had, he said, only one real <span class=\"vocab-trigger\" data-vocab=\"ambition\">ambition<\/span> left — to see the windmill well under way before he reached the age for retirement.",
              "zh": "拳击手开裂的蹄子很久才愈合。胜利庆祝一结束，他们就开始重建风车。拳击手连一天工也不肯歇，还把它当成一桩荣誉，不让人看出他疼。晚上他会私下向苜蓿承认那蹄子实在疼得厉害。苜蓿用嚼烂的草药制成敷剂给他敷蹄子，她和本杰明都劝拳击手少干些活。“马的肺不是永远用不坏的，”她对他说。但拳击手不肯听。他说，他只剩下一个真正的抱负——在退休年龄到来之前，看到风车顺利建造起来。",
              "simpEn": "Boxer's cracked hoof took a long time to heal. They began rebuilding the windmill right after the victory celebrations. Boxer wouldn't take even one day off and made it a matter of pride to hide his pain. At night he told Clover the hoof hurt badly. Clover made herb wraps for it by chewing the plants, and both she and Benjamin urged him to work less. 'A horse's lungs don't last forever,' she said. But Boxer wouldn't listen. He said his only remaining dream was to see the windmill well underway before he reached retirement age.",
              "simpZh": "拳击手裂开的蹄子很久才好。庆祝胜利刚完，他们就开始重建风车。拳击手一天也不歇，硬撑着不让看出疼。晚上他跟苜蓿说蹄子很疼。苜蓿把草药嚼烂给他敷，和本杰明都劝他少干点。“马的肺不是永远不坏的，”她说。拳击手不听。他说自己只剩一个愿望：退休前看到风车顺利造起来。"

              "zh": "起初，当动物农场的法律最初制定时，规定的退休年龄是：马和猪十二岁，牛十四岁，狗九岁，羊七岁，母鸡和鹅五岁。优厚的养老金制度也是当时议定的。至今还没有哪个动物真正领过养老金，但近来这个话题讨论得越来越多了。既然果园那边的那个小田地已经被划出来种大麦，有传言说，大牧场的一角也将被围起来，作为年老退休动物的放牧地。对马来说，据说养老金将是每天五磅玉米，冬天外加十五磅干草，逢公共假日还有一根胡萝卜或一只苹果。拳击手的十二岁生日将在来年夏末到来。",

          "sectionId": 2,
          "heading": "Hardships, Ration 'Readjustments', and Pig Privileges",
          "paragraphs": [
            {
              "en": "Meanwhile life was hard. The winter was as cold as the last one had been, and food was even shorter. Once again all rations were reduced, except those of the pigs and the dogs. A too rigid equality in rations, Squealer explained, would have been <span class=\"vocab-trigger\" data-vocab=\"contrary to the principles of Animalism\">contrary to the principles of Animalism<\/span>. In any case he had no difficulty in proving to the other animals that they were NOT in reality short of food, whatever the appearances might be. For the time being, certainly, it had been found necessary to make a <span class=\"vocab-trigger\" data-vocab=\"readjustment of rations\">readjustment of rations<\/span> (Squealer always spoke of it as a “readjustment,” never as a “reduction”), but in comparison with the days of Jones, the improvement was <span class=\"vocab-trigger\" data-vocab=\"enormous\">enormous<\/span>. Reading out the figures in a <span class=\"vocab-trigger\" data-vocab=\"shrill, rapid voice\">shrill, rapid voice<\/span>, he proved to them in detail that they had more oats, more hay, more turnips than they had had in Jones's day, that they worked shorter hours, that their drinking water was of better quality, that they lived longer, that a larger proportion of their young ones survived infancy, and that they had more straw in their stalls and suffered less from fleas. The animals believed every word of it. Truth to tell, Jones and all he stood for had almost <span class=\"vocab-trigger\" data-vocab=\"faded out of their memories\">faded out of their memories<\/span>. They knew that life nowadays was <span class=\"vocab-trigger\" data-vocab=\"harsh and bare\">harsh and bare<\/span>, that they were often hungry and often cold, and that they were usually working when they were not asleep. But doubtless it had been worse in the old days. They were glad to believe so. Besides, in those days they had been slaves and now they were free, and that made all the difference, as Squealer did not fail to point out.",
              "zh": "这期间日子过得很苦。冬天和去年一样冷，食物却更少了。所有的口粮再一次被削减，只有猪和狗的口粮没减。尖啸者解释说，口粮上的过分平均主义是违背动物主义原则的。不管怎样，他毫不费力地向其他动物证明，他们实际上并不缺粮，不管表面现象如何。的确，目前暂时有必要对口粮做一次“调整”（尖啸者总是说“调整”，从不说“削减”），但与琼斯时代相比，改善是巨大的。他用尖利急促的声音念出数字，详细地向他们证明，他们比琼斯时代有了更多的燕麦、干草、萝卜，工作时间更短，饮水质量更高，活得更长，幼崽存活率更高，厩栏里的干草更多，跳蚤也更少。动物们句句都信了。说实话，琼斯和他代表的一切几乎已从他们的记忆中淡去。他们知道现在的日子苦，常常挨饿受冻，只要不睡觉就几乎总是在干活。但毫无疑问，旧时代更糟。他们乐于相信这一点。再说，在那些日子他们是奴隶，现在却是自由的，这就完全不同了，这一点尖啸者总是不失时机地指出。",
              "simpEn": "Life was hard. The winter was as cold as the last, and food was even shorter. All rations were reduced except for pigs and dogs. Squealer explained that too much equality in food went against Animalism's ideas. He easily convinced the animals they weren't really short of food, no matter how it looked. He called ration cuts 'readjustments' never 'reductions', and with quick, high-pitched voice read figures showing they had more oats, hay, turnips, worked less, drank better water, lived longer, had more young survive, more straw, and fewer fleas than under Jones. The animals believed him. Jones and the old days had almost faded from memory. They knew life now was harsh, they were often hungry and cold, always working when not asleep. But surely it had been worse before. They were happy to believe that. And as Squealer never failed to say, they used to be slaves and now were free.",
              "simpZh": "日子很苦。冬天和去年一样冷，食物更少。口粮又全减了，除了猪和狗。尖啸者说，口粮上太平均就违反动物主义了。他轻而易举让大家信了其实并不缺粮。他管这叫“调整”不说“削减”，尖声念数字，说比琼斯时燕麦多、干草多、萝卜多、工时短、水好、活得长、幼崽活得多、干草多、跳蚤少。动物们全信了。说实在的，琼斯和旧日子差不多从记忆里淡没了。他们知道现在日子苦，常挨饿受冻，不睡觉就老在干活。但肯定过去更糟，他们乐意信。而且尖啸者总说，那时是奴隶，现在是自由的，完全不同。"

              "en": "There were many more mouths to feed now. In the autumn the four sows had all <span class=\"vocab-trigger\" data-vocab=\"littered\">littered<\/span> about simultaneously, producing thirty-one young pigs between them. The young pigs were <span class=\"vocab-trigger\" data-vocab=\"piebald\">piebald<\/span>, and as Napoleon was the only <span class=\"vocab-trigger\" data-vocab=\"boar\">boar<\/span> on the farm, it was possible to guess at their <span class=\"vocab-trigger\" data-vocab=\"parentage\">parentage<\/span>. It was announced that later, when bricks and timber had been purchased, a schoolroom would be built in the farmhouse garden. For the time being, the young pigs were given their instruction by Napoleon himself in the farmhouse kitchen. They took their exercise in the garden, and were <span class=\"vocab-trigger\" data-vocab=\"discouraged\">discouraged<\/span> from playing with the other young animals. About this time, too, it was <span class=\"vocab-trigger\" data-vocab=\"laid down as a rule\">laid down as a rule<\/span> that when a pig and any other animal met on the path, the other animal must stand aside: and also that all pigs, of whatever degree, were to have the <span class=\"vocab-trigger\" data-vocab=\"privilege\">privilege<\/span> of wearing green ribbons on their tails on Sundays.",
              "zh": "现在要喂的嘴更多了。秋天，四头母猪差不多同时下了崽，一共生了三十一头小猪。这些猪崽是花斑色的，因为拿破仑是农场里唯一的公猪，可以猜到它们的血统。通告说，将来等砖瓦木料买来，要在农庄住宅的花园里建一间学堂。目前，这些小猪由拿破仑亲自在厨房里授课。他们在花园里活动，并且被禁止和其他幼小动物一起玩耍。大约也就在这时，又定下了一条规矩：当一头猪和任何别的动物在路上相遇时，别的动物必须站到一旁让路；另外，不论等级高低，所有的猪都有权在星期天在尾巴上系绿色缎带。",

            {
              "en": "The farm had had a fairly successful year, but was still short of money. There were the bricks, sand, and lime for the schoolroom to be purchased, and it would also be necessary to begin saving up again for the machinery for the windmill. Then there were lamp oil and candles for the house, sugar for Napoleon's own table (he forbade this to the other pigs, <span class=\"vocab-trigger\" data-vocab=\"on the ground that it made them fat\">on the ground that it made them fat<\/span>), and all the usual <span class=\"vocab-trigger\" data-vocab=\"replacements\">replacements<\/span> such as tools, nails, string, coal, wire, <span class=\"vocab-trigger\" data-vocab=\"scrap-iron\">scrap-iron<\/span>, and dog biscuits. A <span class=\"vocab-trigger\" data-vocab=\"stump of hay\">stump of hay<\/span> and part of the potato crop were sold off, and the contract for eggs was increased to six hundred a week, so that that year the hens <span class=\"vocab-trigger\" data-vocab=\"barely hatched enough chicks\">barely hatched enough chicks<\/span> to keep their numbers at the same level. Rations, reduced in December, were reduced again in February, and lanterns in the stalls were forbidden to save oil. But the pigs seemed comfortable enough, and in fact were <span class=\"vocab-trigger\" data-vocab=\"putting on weight\">putting on weight<\/span> if anything. One afternoon in late February a warm, rich, <span class=\"vocab-trigger\" data-vocab=\"appetising scent\">appetising scent<\/span>, such as the animals had never smelt before, <span class=\"vocab-trigger\" data-vocab=\"wafted\">wafted<\/span> itself across the yard from the little <span class=\"vocab-trigger\" data-vocab=\"brew-house\">brew-house<\/span>, which had been <span class=\"vocab-trigger\" data-vocab=\"disused\">disused<\/span> in Jones's time, and which stood beyond the kitchen. Someone said it was the smell of cooking barley. The animals sniffed the air hungrily and wondered whether a warm <span class=\"vocab-trigger\" data-vocab=\"mash\">mash<\/span> was being prepared for their supper. But no warm mash appeared, and on the following Sunday it was announced that from now onwards all barley would be <span class=\"vocab-trigger\" data-vocab=\"reserved for the pigs\">reserved for the pigs<\/span>. The field beyond the orchard had already been sown with barley. And the news soon <span class=\"vocab-trigger\" data-vocab=\"leaked out\">leaked out<\/span> that every pig was now receiving a ration of a <span class=\"vocab-trigger\" data-vocab=\"pint of beer\">pint of beer<\/span> daily, with half a gallon for Napoleon himself, which was always served to him in the Crown Derby <span class=\"vocab-trigger\" data-vocab=\"soup tureen\">soup tureen<\/span>.",
              "zh": "农场这一年收成还算不错，但仍旧缺钱。建学堂用的砖、沙、石灰都需要买，而且又得重新开始攒钱买风车的机器。此外，房子里要点灯油和蜡烛，拿破仑自己餐桌上要糖（他禁止别的猪吃糖，理由是那会使它们发胖），还有各种日常的消耗，比如工具、钉子、绳子、煤、铁丝、废铁和狗饼干。剩下的干草和一部分马铃薯被卖掉了，鸡蛋的合同也增加到了每周六百个，结果那一年母鸡孵出的小鸡仅仅勉强够维持原来的数目。口粮在十二月份减了一次，二月份又减了一次，为省灯油，厩栏里的提灯也不准再点。可是猪们似乎过得相当舒服，而且事实上还胖了起来。二月末的一天下午，一股热乎乎、浓烈诱人的气味，是动物们从未闻过的，从小小的酿酒房那边飘过院子。那酿酒房在琼斯时代就已废弃不用，位于厨房后面。有人说那是煮大麦的气味。动物们使劲吸着空气，心想是不是给他们准备的热糊糊当晚饭。可是并没有热糊糊出现，而到了下一个星期天，上面宣布说，从今以后所有的大麦都要留给猪。果园那边的地已经种了大麦。不久消息便泄露出来，每头猪现在每天都能得到一品脱啤酒的配给，拿破仑自己则是半加仑，总是用那只皇冠德比带盖汤碗盛给他。",
              "simpEn": "The farm had a decent year but was still short of money. Bricks, sand, and lime for the schoolroom needed to be bought, and they had to save again for the windmill machinery. Then there were lamp oil, candles, sugar for Napoleon's table (he stopped other pigs from having it, saying it made them fat), and regular supplies like tools, nails, string, coal, wire, scrap metal, and dog biscuits. The leftover hay and some potatoes were sold, and the egg contract was raised to six hundred a week, so that year the hens barely hatched enough chicks to keep up their numbers. Rations were cut in December and again in February, and lanterns in stalls were banned to save oil. But the pigs seemed comfortable and were even gaining weight. One afternoon in late February, a warm, rich, delicious smell no animal had ever known drifted across the yard from the little brew-house, unused since Jones's time, behind the kitchen. It was the smell of cooking barley. The animals sniffed hungrily, hoping for a warm mash supper. But no mash came, and the next Sunday it was announced that all barley would be kept for the pigs. The field beyond the orchard was already planted with barley. Soon it leaked out that every pig now got a pint of beer daily, and Napoleon got half a gallon, served in the Crown Derby soup tureen.",
              "simpZh": "农场收成还行，可还是缺钱。学堂的砖沙石灰要买，还得重新攒风车机器的钱。还有灯油、蜡烛、拿破仑自己的糖（他不让别的猪吃，说会发胖），以及工具、钉子、绳子、煤、铁丝、废铁、狗饼干这些日常消耗。剩下的干草和部分土豆卖了，鸡蛋合同加到每周六百个，母鸡那年几乎孵不出足够小鸡维持数目。十二月口粮减了，二月又减，为省油厩栏里不准点灯。可猪们过得挺舒服，反倒胖了。二月末一天下午，一股动物们从没闻过的热乎乎浓烈香味从小酿酒房飘过院子。那酿酒房在琼斯时早不用了，在厨房后面。有人说是煮大麦的味。动物们饿着肚子猛吸，心想是不是给他们做热糊糊晚饭。可糊糊没出现，下个星期天宣布，所有大麦留给猪。果园那边地已种大麦。很快又漏出消息，每头猪每天得一品脱啤酒，拿破仑半加仑，总用皇冠德比汤碗盛给他。"

              "en": "But if there were hardships to be borne, they were partly <span class=\"vocab-trigger\" data-vocab=\"offset\">offset<\/span> by the fact that life nowadays had a greater <span class=\"vocab-trigger\" data-vocab=\"dignity\">dignity<\/span> than it had had before. There were more songs, more speeches, more processions. Napoleon had commanded that once a week there should be held something called a <span class=\"vocab-trigger\" data-vocab=\"Spontaneous Demonstration\">Spontaneous Demonstration<\/span>, the object of which was to celebrate the struggles and triumphs of Animal Farm. At the appointed time the animals would leave their work and march round the <span class=\"vocab-trigger\" data-vocab=\"precincts\">precincts<\/span> of the farm in military formation, with the pigs leading, then the horses, then the cows, then the sheep, and then the <span class=\"vocab-trigger\" data-vocab=\"poultry\">poultry<\/span>. The dogs <span class=\"vocab-trigger\" data-vocab=\"flanked the procession\">flanked the procession<\/span> and at the head of all marched Napoleon's black cockerel. Boxer and Clover always carried between them a green banner marked with the hoof and the horn and the caption, “Long live Comrade Napoleon!” Afterwards there were <span class=\"vocab-trigger\" data-vocab=\"recitations\">recitations<\/span> of poems composed in Napoleon's honour, and a speech by Squealer giving <span class=\"vocab-trigger\" data-vocab=\"particulars\">particulars<\/span> of the latest increases in the production of foodstuffs, and on occasion a shot was fired from the gun. The sheep were the greatest <span class=\"vocab-trigger\" data-vocab=\"devotees\">devotees<\/span> of the Spontaneous Demonstration, and if anyone complained (as a few animals sometimes did, when no pigs or dogs were near) that they wasted time and meant a lot of standing about in the cold, the sheep were sure to silence him with a tremendous bleating of “Four legs good, two legs bad!” But <span class=\"vocab-trigger\" data-vocab=\"by and large\">by and large<\/span> the animals enjoyed these celebrations. They found it comforting to be reminded that, after all, they were truly their own masters and that the work they did was for their own benefit. So that, what with the songs, the processions, Squealer's lists of figures, the thunder of the gun, the crowing of the cockerel, and the fluttering of the flag, they were able to forget that their bellies were empty, at least part of the time.",
              "zh": "不过，虽说有种种艰辛要忍受，但如今的日子比起从前，到底多了一份尊严，倒也抵消了一部分困苦。有了更多的歌声，更多的演说，更多的游行。拿破仑命令每周举行一次所谓的“自发示威”，其宗旨是庆祝动物农场的斗争与胜利。在指定时间，动物们会放下工作，排成军事队形，绕农场的区域游行，最前面是猪，接着是马，然后是牛，再后面是羊，最后是家禽。狗在队伍两侧护卫，而走在整个队伍最前头的，是拿破仑的黑色小公鸡。拳击手和苜蓿总是合力举着一面绿旗，上面画着蹄子和角，题着“拿破仑同志万岁！”的字样。随后是朗诵赞美拿破仑的诗歌，尖啸者发表讲话，公布各类食品产量最新增长的详情，有时还会鸣枪一响。绵羊是自发示威的最热心参加者，如果有谁抱怨（有些动物在猪和狗不在旁边时偶尔会发牢骚）说这是浪费时间，害得大家在冷天里站那么久，绵羊们准会用雷鸣般的“四条腿好，两条腿坏！”把他镇住。不过总的来说，动物们还是喜欢这些庆祝活动的。归根结底，能提醒他们自己真正是自己的主人，所做的工作都是为了自己的利益，这让他们感到安慰。就这样，因为有了歌声、游行、尖啸者的数字清单、枪声、公鸡的啼鸣和旗帜的飘扬，他们至少在某些时候能够忘记肚子还是空的。",
              "simpEn": "But if there were hardships, they were partly balanced by the fact that life now had more dignity than before. There were more songs, speeches, and processions. Napoleon had ordered a weekly 'Spontaneous Demonstration' to celebrate the struggles and victories of Animal Farm. At the set time, the animals would leave work and march around the farm in military order: pigs first, then horses, cows, sheep, and poultry. Dogs flanked the procession, and at the very front marched Napoleon's black rooster. Boxer and Clover always carried a green banner with the hoof and horn and the words 'Long live Comrade Napoleon!' Afterwards there were poem recitals for Napoleon, a speech by Squealer on the latest food production increases, and sometimes a gunshot. The sheep were the biggest fans of the Demonstration. If anyone grumbled (as a few did when no pigs or dogs were near) that it wasted time and meant standing in the cold, the sheep silenced them with loud bleating of 'Four legs good, two legs bad!' But generally the animals liked these events. It comforted them to be reminded that they were their own masters and working for themselves. With the songs, parades, Squealer's figures, the gun thunder, the rooster's crowing, and the fluttering flag, they could forget their empty bellies, at least some of the time.",

              "en": "In April, Animal Farm was <span class=\"vocab-trigger\" data-vocab=\"proclaimed a Republic\">proclaimed a Republic<\/span>, and it became necessary to elect a President. There was only one candidate, Napoleon, who was elected <span class=\"vocab-trigger\" data-vocab=\"unanimously\">unanimously<\/span>. On the same day it was given out that fresh documents had been discovered which revealed further details about Snowball's <span class=\"vocab-trigger\" data-vocab=\"complicity\">complicity<\/span> with Jones. It now appeared that Snowball had not, as the animals had previously imagined, merely attempted to lose the Battle of the Cowshed by means of a <span class=\"vocab-trigger\" data-vocab=\"stratagem\">stratagem<\/span>, but had been openly fighting on Jones's side. In fact, it was he who had actually been the leader of the human forces, and had charged into battle with the words “Long live Humanity!” on his lips. The wounds on Snowball's back, which a few of the animals still remembered to have seen, had been <span class=\"vocab-trigger\" data-vocab=\"inflicted\">inflicted<\/span> by Napoleon's teeth.",
              "zh": "四月，动物农场被宣告为共和国，因此有必要选举一位总统。候选人只有拿破仑一个，他以全票当选。同一天，有消息说发现了新的文件，暴露了雪球与琼斯勾结的更多细节。现在看起来，雪球并不像动物们以前想象的那样，仅仅企图用计策输掉牛棚战役，而是曾经公开站在琼斯一边作战。事实上，正是他实际上是人类部队的头领，并且是喊着“人类万岁！”投入战斗的。雪球背上那些伤口，有几个动物仍然记得看见过，原来都是拿破仑的牙齿留下的。",
              "simpEn": "In April, Animal Farm was proclaimed a Republic and a President had to be elected. There was only one candidate: Napoleon, elected unanimously. That same day it was announced that new documents had been found revealing more about Snowball's plotting with Jones. Now it appeared that Snowball hadn't just tried to lose the Battle of the Cowshed by a trick, but had openly fought on Jones's side. In fact, he had been the leader of the human forces, charging into battle shouting 'Long live Humanity!' The wounds on Snowball's back, which a few animals still remembered seeing, had been made by Napoleon's teeth.",
              "simpZh": "四月，动物农场宣布成为共和国，得选总统。只有拿破仑一个候选人，全票当选。同一天又公布发现新文件，揭出雪球跟琼斯勾结的更多细节。现在说雪球不只是用计想让牛棚战役打输，而是公开站在琼斯那边打。实际上他才是人类部队的头，喊着“人类万岁”冲进战斗。雪球背上那些伤，有几个动物还记得看见过，原来是拿破仑的牙咬的。"

            {
              "en": "In the middle of the summer Moses the raven suddenly reappeared on the farm, after an absence of several years. He was quite unchanged, still did no work, and talked in the same <span class=\"vocab-trigger\" data-vocab=\"strain\">strain<\/span> as ever about Sugarcandy Mountain. He would <span class=\"vocab-trigger\" data-vocab=\"perch\">perch<\/span> on a stump, flap his black wings, and talk by the hour to anyone who would listen. “Up there, comrades,” he would say <span class=\"vocab-trigger\" data-vocab=\"solemnly\">solemnly<\/span>, pointing to the sky with his large beak — “up there, just on the other side of that dark cloud that you can see — there it lies, Sugarcandy Mountain, that happy country where we poor animals shall rest for ever from our labours!” He even claimed to have been there on one of his higher flights, and to have seen the everlasting fields of clover and the linseed cake and lump sugar growing on the hedges. Many of the animals believed him. Their lives now, they <span class=\"vocab-trigger\" data-vocab=\"reasoned\">reasoned<\/span>, were hungry and <span class=\"vocab-trigger\" data-vocab=\"laborious\">laborious<\/span>; was it not right and just that a better world should exist somewhere else? A thing that was difficult to determine was the attitude of the pigs towards Moses. They all declared <span class=\"vocab-trigger\" data-vocab=\"contemptuously\">contemptuously<\/span> that his stories about Sugarcandy Mountain were lies, and yet they allowed him to remain on the farm, not working, with an <span class=\"vocab-trigger\" data-vocab=\"allowance\">allowance<\/span> of a <span class=\"vocab-trigger\" data-vocab=\"gill of beer\">gill of beer<\/span> a day.",
              "zh": "仲夏时分，渡鸦摩西在失踪数年之后突然重新出现在农场。他一点没变，还是不干活，讲的还是老一套关于糖果山的话。他会蹲在一截树桩上，拍着黑翅膀，对任何一个愿意听的动物一谈就是好几个钟头。“在那上面，同志们，”他会庄严地指着天空，用他的大喙说——“就在那上面，你们看见的那片乌云的另一面——糖果山就在那里，那是我们可怜的动物得以永远摆脱劳苦的幸福国度！”他甚至声称，有次高飞时曾到过那里，亲眼见到了永恒的苜蓿地，还有长在树篱上的亚麻籽饼和方糖。许多动物都信他。他们心里琢磨，如今的生活又饿又累，在别的什么地方存在着一个更好的世界，难道不是应该的吗？难以断定的是猪对摩西的态度。他们全都不屑地宣称他那些糖果山的故事全是谎话，却又允许他留在农场，不干活，每天还有一及耳的啤酒配给。",
              "simpEn": "In midsummer, Moses the raven suddenly returned after several years away. He was completely unchanged, still did no work, and spoke in the same old way about Sugarcandy Mountain. He would sit on a stump, flap his black wings, and talk for hours to anyone who'd listen. 'Up there, comrades,' he'd say solemnly, pointing to the sky with his big beak, 'just past that dark cloud you see — there lies Sugarcandy Mountain, that happy country where we poor animals shall rest forever from our labors!' He even claimed to have flown there once and seen endless fields of clover, linseed cake, and lump sugar growing on the hedges. Many animals believed him. They reasoned that their lives were now hungry and full of hard labor; wasn't it right that a better world existed somewhere else? What was hard to figure out was the pigs' attitude toward Moses. They all declared scornfully that his Sugarcandy Mountain stories were lies, yet they let him stay on the farm, not working, with a daily allowance of a gill of beer.",
              "simpZh": "仲夏时，渡鸦摩西失踪几年后突然又回来了。一点没变，不干活，讲的还是糖果山那老一套。他蹲在树桩上，拍着黑翅膀，对愿意听的动物一讲几个钟头。“那上面，同志们，”他庄严地指着天空，大喙子指着，“就那片乌云那面，就是糖果山，咱们可怜的动物永远歇了劳苦的幸福地方！”他甚至说有一回高飞到过那，看见了没完没了的苜蓿地，树篱上长着油籽饼和方糖。好多动物信他。他们想，如今的日子又饿又累，别处有个更好的世界，难道不应该吗？难猜的是猪对摩西的态度。他们都不屑地说他糖果山的故事是谎话，却让他留在农场不干活，每天还给一及耳啤酒。"
            },
            {
              "en": "After his hoof had healed up, Boxer worked harder than ever. Indeed, all the animals worked like slaves that year. Apart from the regular work of the farm, and the rebuilding of the windmill, there was the schoolhouse for the young pigs, which was started in March. Sometimes the long hours on <span class=\"vocab-trigger\" data-vocab=\"insufficient food\">insufficient food<\/span> were hard to bear, but Boxer never <span class=\"vocab-trigger\" data-vocab=\"faltered\">faltered<\/span>. In nothing that he said or did was there any sign that his strength was not what it had been. It was only his appearance that was a little altered; his hide was less shiny than it had used to be, and his great <span class=\"vocab-trigger\" data-vocab=\"haunches\">haunches<\/span> seemed to have <span class=\"vocab-trigger\" data-vocab=\"shrunken\">shrunken<\/span>. The others said, “Boxer will pick up when the spring grass comes on”; but the spring came and Boxer grew no fatter. Sometimes on the slope leading to the top of the quarry, when he <span class=\"vocab-trigger\" data-vocab=\"braced his muscles\">braced his muscles<\/span> against the weight of some vast <span class=\"vocab-trigger\" data-vocab=\"boulder\">boulder<\/span>, it seemed that nothing kept him on his feet except the <span class=\"vocab-trigger\" data-vocab=\"will to continue\">will to continue<\/span>. At such times his lips were seen to form the words, “I will work harder”; he had no voice left. Once again Clover and Benjamin warned him to take care of his health, but Boxer paid no attention. His twelfth birthday was approaching. He did not care what happened so long as a good store of stone was <span class=\"vocab-trigger\" data-vocab=\"accumulated\">accumulated<\/span> before he went on pension.",
              "zh": "蹄子愈合后，拳击手干得比以往更卖力了。真的，这一年所有的动物都像奴隶一样干活。除了农场的日常工作和重建风车，还要给小猪盖学堂，这项工程三月份就开始了。有时长时间干活却吃不饱，实在难熬，但拳击手从不退缩。他的言语和行动中，没有一丝迹象显示他的力量不如从前。只是外表略有改变：他的皮毛不如以前光亮，那宽阔的臀部似乎也有些干瘪了。别的动物说：“等春天青草长出来，拳击手就会恢复的。”可是春天来了，拳击手并没有长膘。有时，在通往采石场顶部的斜坡上，当他绷紧肌肉顶住某块巨石时，似乎除了继续下去的决心之外，再没有什么能支撑住他了。在这种时候，看得见他的嘴唇在翕动，做出“我要更加努力干活”的字形，但嗓子已经发不出声音。苜蓿和本杰明又一次提醒他注意身体，可拳击手毫不理会。他的十二岁生日快到了。只要在他领养老金之前能攒够石料，别的他什么也不在乎。",
              "simpEn": "After his hoof healed, Boxer worked harder than ever. Indeed, all the animals worked like slaves that year. Besides regular farm work and rebuilding the windmill, there was the schoolhouse for the young pigs, started in March. Sometimes the long hours on too little food were hard to take, but Boxer never gave up. Nothing he said or did showed any loss of strength. Only his looks changed a little: his coat was less shiny, and his big haunches seemed smaller. The others said, 'Boxer will get better when the spring grass comes,' but spring came and he didn't gain weight. Sometimes on the slope up to the quarry top, when he strained against a huge boulder, it seemed only his will kept him standing. His lips would form the words 'I will work harder,' but no voice came. Once more Clover and Benjamin warned him about his health, but Boxer ignored them. His twelfth birthday was coming. He didn't care what happened as long as a good pile of stone was ready before he retired.",
              "simpZh": "蹄子好后，拳击手干得更猛了。真的，那年所有动物都像奴隶干活。除了农活和重建风车，还有给小猪盖学堂，三月就动了工。有时吃不饱干重活真难熬，可拳击手从不松劲。说话做事看不出力气变小，只是外表有点变：皮不亮堂了，大后腿也像小了。别人说“开春吃青草拳击手就缓过来”，可春天来了他没长肉。有时在石场坡上，拼命顶住大石头，好像全凭一股硬撑的劲。这时嘴唇动着在说“我要更卖力”，可嗓子没声了。苜蓿和本杰明又提醒他注意身体，拳击手不理。十二岁生日快到了，他不在乎别的，只求在退休前攒够石头。"
            }
          ],
          "quiz": [
            {
              "text": "Napoleon was elected President unanimously.",
              "answer": true
            },
            {
              "text": "The pigs drove Moses away from the farm.",
              "answer": false
            },
            {
              "text": "Boxer grew fatter when the spring grass came.",
              "answer": false
