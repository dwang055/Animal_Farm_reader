          "sectionId": 4,
          "heading": "Old Major's Speech — The Miserable Life of Animals",
          "paragraphs": [
            {
              "en": "“<span class=\"vocab-trigger\" data-vocab=\"comrades\">Comrades<\/span>, you have heard already about the strange dream that I had last night. But I will come to the dream later. I have something else to say first. I do not think, comrades, that I shall be with you for many months longer, and before I die, I feel it my duty to pass on to you such <span class=\"vocab-trigger\" data-vocab=\"wisdom\">wisdom<\/span> as I have <span class=\"vocab-trigger\" data-vocab=\"acquired\">acquired<\/span>. I have had a long life, I have had much time for thought as I lay alone in my stall, and I think I may say that I understand the nature of life on this earth as well as any animal now living. It is about this that I wish to speak to you.",
              "zh": "“同志们，你们已经听说我昨晚做的那个怪梦了。不过梦的事我回头再说。我有别的话要先讲。同志们，我想我跟你们在一起的日子不多了，在我死之前，我觉得有责任把我获得的智慧传给你们。我活了一辈子，独自躺在圈里时想了很多很多，我想我可以说，我和如今活着的任何动物一样，把这个世界上的生活本质看透了。我要对你们说的，正是这个。",
              "simpEn": "“Friends, you already heard about my strange dream. But I’ll talk about the dream later. I have something else to say first. I don’t think I will live much longer. Before I die, I must share the knowledge I have gained. I have had a long life, and I have spent many hours thinking alone in my pen. I believe I understand life as well as any animal alive now. This is what I want to talk about.",
              "simpZh": "“朋友们，你们已经听说了我做的怪梦。但是梦等下再说。我有些别的事情要先讲。我觉得我活不了多久了。在我死之前，我得把我学到的东西告诉你们。我活了很久，自己在圈里躺着的时候想了很多。我想我跟现在活着的任何动物一样，明白这辈子是怎么回事。我要讲的就是这个。"
            },
            {
              "en": "“Now, comrades, what is the nature of this life of ours? Let us face it: our lives are miserable, <span class=\"vocab-trigger\" data-vocab=\"laborious\">laborious<\/span>, and short. We are born, we are given just so much food as will keep the breath in our bodies, and those of us who are capable of it are forced to work to the last <span class=\"vocab-trigger\" data-vocab=\"atom of our strength\">atom of our strength<\/span>; and the very instant that our usefulness has come to an end we are slaughtered with <span class=\"vocab-trigger\" data-vocab=\"hideous cruelty\">hideous cruelty<\/span>. No animal in England knows the meaning of happiness or <span class=\"vocab-trigger\" data-vocab=\"leisure\">leisure<\/span> after he is a year old. No animal in England is free. The life of an animal is <span class=\"vocab-trigger\" data-vocab=\"misery and slavery\">misery and slavery<\/span>: that is the <span class=\"vocab-trigger\" data-vocab=\"plain truth\">plain truth<\/span>.",
              "zh": "“现在，同志们，我们这种生活是怎么回事？我们来面对现实吧：我们的生命凄惨、劳累而又短暂。我们一生下来，得到的那点食物只够勉强维持一口气，我们当中那些还有力气的，就被逼着把最后一丝力气都使出来；而一到我们没用了，立刻就会遭到惨无人道的屠杀。英格兰没有一头动物满了一岁之后还知道什么叫幸福或闲暇。英格兰没有一头动物是自由的。动物的生命就是苦难和奴役——这是明摆着的事实。",
              "simpEn": "“Now, friends, what is our life really like? Let's be honest: our lives are full of suffering, hard work, and they are short. We are born, we get just enough food to stay alive, and those of us who can work have to work until we have no strength left. As soon as we are no longer useful, we are killed in a very cruel way. No animal in England knows happiness or free time after it is one year old. No animal in England is free. The life of an animal is pain and slavery — that is the simple truth.",
              "simpZh": "“现在，朋友们，我们的日子到底是什么样的？我们老实说吧：我们过得又苦又累又短。我们一出生，就只给那么点吃的，够喘口气。能干活儿的就被逼着一直干到没一点力气。等我们没用了，马上就被残忍地杀掉。在英格兰，动物过了一岁就不知道什么是快乐和休息。没有动物是自由的。动物的生活就是受苦和当奴隶，这是明摆着的事实。"

          "sectionId": 5,
          "heading": "Old Major's Speech — Man is the Enemy",
          "paragraphs": [
            {
              "en": "“But is this simply part of the <span class=\"vocab-trigger\" data-vocab=\"order of nature\">order of nature<\/span>? Is it because this land of ours is so poor that it cannot afford a decent life to those who <span class=\"vocab-trigger\" data-vocab=\"dwell upon\">dwell upon<\/span> it? No, comrades, a thousand times no! The soil of England is <span class=\"vocab-trigger\" data-vocab=\"fertile\">fertile<\/span>, its climate is good, it is capable of affording food in <span class=\"vocab-trigger\" data-vocab=\"abundance\">abundance<\/span> to an enormously greater number of animals than now inhabit it. This single farm of ours would support a dozen horses, twenty cows, hundreds of sheep — and all of them living in a comfort and a dignity that are now almost beyond our imagining. Why then do we continue in this miserable condition? Because nearly the whole of the <span class=\"vocab-trigger\" data-vocab=\"produce of our labour\">produce of our labour<\/span> is stolen from us by human beings. There, comrades, is the answer to all our problems. It is summed up in a single word — Man. Man is the only real enemy we have. Remove Man from the scene, and the <span class=\"vocab-trigger\" data-vocab=\"root cause\">root cause<\/span> of hunger and overwork is <span class=\"vocab-trigger\" data-vocab=\"abolished\">abolished<\/span> for ever.",
              "zh": "“然而，难道这只是自然的法则吗？难道是因为我们这块土地太贫瘠，没法让住在上面的生灵过上像样的日子吗？不，同志们，一千个不！英格兰的土壤是肥沃的，气候是好的，它完全能够出产大量的食物，养活比现在多得多的动物。单是我们这个农场，就能养活十二匹马、二十头牛、几百只羊——而且个个都能过上如今我们几乎无法想象的舒适而有尊严的生活。那为什么我们一直处在这种悲惨的境地里呢？因为我们劳动所得的几乎全部产品都被人类偷走了。同志们，我们所有问题的答案就在这里。归纳起来就是一个字——人。人是唯一真正的敌人。只要把人类从这个世上赶走，饥饿和过劳的根源就永远铲除了。",
              "simpEn": "“But is this just the way nature works? Is our land too poor to give a good life to those who live on it? No, friends, absolutely not! England's soil is rich, its weather is good, and it can grow more than enough food for many more animals than live here now. Our farm alone could feed twelve horses, twenty cows, hundreds of sheep — all living comfortably and with self-respect, in a way we can hardly imagine today. So why are we still suffering? Because humans steal almost everything we produce. That, friends, is the answer. It comes down to one word — Man. Man is our only true enemy. Get rid of Man, and the main cause of hunger and too much work is gone forever.",

          "paragraphs": [

              "en": "“Man is the only creature that <span class=\"vocab-trigger\" data-vocab=\"consumes without producing\">consumes without producing<\/span>. He does not give milk, he does not lay eggs, he is too weak to pull the <span class=\"vocab-trigger\" data-vocab=\"plough\">plough<\/span>, he cannot run fast enough to catch rabbits. Yet he is <span class=\"vocab-trigger\" data-vocab=\"lord of all the animals\">lord of all the animals<\/span>. He sets them to work, he gives back to them the <span class=\"vocab-trigger\" data-vocab=\"bare minimum\">bare minimum<\/span> that will prevent them from starving, and the rest he keeps for himself. Our labour <span class=\"vocab-trigger\" data-vocab=\"tills the soil\">tills the soil<\/span>, our <span class=\"vocab-trigger\" data-vocab=\"dung\">dung<\/span> <span class=\"vocab-trigger\" data-vocab=\"fertilises\">fertilises<\/span> it, and yet there is not one of us that owns more than his bare skin.",
              "zh": "“人是唯一只消费而不生产的生物。他不产奶，不下蛋，弱得拉不动犁，跑不快连兔子都抓不住。可他却是所有动物的主子。他逼着动物干活，只把刚够让他们不饿死的那一丁点儿还给他们，剩下的全归自己。我们劳作耕田，我们的粪便肥田，可是我们中间谁都没有一样东西，除了身上这张皮。",

              "simpZh": "“人是唯一只用东西不生产的。他不产奶，不下蛋，弱得拉不动犁，跑不快抓不到兔子。可他却统治所有动物。他让动物干活，只给一点点吃的，饿不死就行，剩下的全拿走。我们耕地，我们的粪便让地变肥，可我们除了自己这张皮，什么都不拥有。"

            {
              "en": "“You cows that I see before me, how many thousands of gallons of milk have you given during this last year? And what has happened to that milk which should have been breeding up <span class=\"vocab-trigger\" data-vocab=\"sturdy calves\">sturdy calves<\/span>? Every drop of it has gone down the <span class=\"vocab-trigger\" data-vocab=\"throats of our enemies\">throats of our enemies<\/span>. And you hens, how many eggs have you laid in this last year, and how many of those eggs ever <span class=\"vocab-trigger\" data-vocab=\"hatched\">hatched<\/span> into chickens? The rest have all gone to market to bring in money for Jones and his men. And you, Clover, where are those four foals you <span class=\"vocab-trigger\" data-vocab=\"bore\">bore<\/span>, who should have been the support and pleasure of your old age? Each was sold at a year old — you will never see one of them again. In return for your four <span class=\"vocab-trigger\" data-vocab=\"confinements\">confinements<\/span> and all your labour in the fields, what have you ever had except your <span class=\"vocab-trigger\" data-vocab=\"bare rations\">bare rations<\/span> and a <span class=\"vocab-trigger\" data-vocab=\"stall\">stall<\/span>?",
              "zh": "“我面前的这些奶牛，去年一年你们产了好几千加仑的奶吧？那些本该用来哺育健壮牛犊的奶，都到哪儿去了呢？每一滴都流进了我们敌人的喉咙。还有你们这些母鸡，去年你们下了多少蛋，又有多少蛋孵成了小鸡？剩下的全都拿到市场上，给琼斯和他那帮人换了钱。还有你，苜蓿，你生下的那四匹小马驹呢，它们本该是你晚年的依靠和安慰，可它们现在在哪儿？每一匹都在一岁时就被卖掉了——你再也不会见到它们了。你经历了四次怀胎分娩，加上在田里的所有劳作，换来了什么呢？除了那点糊口的配给口粮和一个马厩，你还有什么？",
              "simpEn": "“You cows, how much milk did you give last year? And where did that milk go — the milk that should have made young calves strong? Every drop was drunk by our enemies. And you hens, how many eggs did you lay, and how many of those eggs became chickens? The rest were sold at the market to bring money to Jones and his workers. And Clover, where are your four baby horses that you gave birth to? They should be helping you and making you happy now that you are older. Each one was sold when it was one year old — you will never see them again. For all your four times of giving birth and all your hard work in the fields, what have you gotten except just enough food and a place to stand?",
              "simpZh": "“你们这些母牛，去年产了多少奶？那些奶本应该把小牛养壮，结果都去哪儿了？每一滴都被敌人喝掉了。还有你们这些母鸡，下了多少蛋，有几个蛋变成小鸡了？剩下的都拿到市场上去给琼斯他们换钱了。苜蓿，你生的那四匹小马呢？它们本来该在你老了的时候帮你、让你开心的。每一匹在一岁时就被卖了——你再也见不到它们了。你经历了四次怀胎和下地干活的辛苦，除了那点吃的和一个马栏，你得到什么了？"

        {
          "sectionId": 7,
          "heading": "Old Major's Speech — The Fate of All Animals and the Rules of Rebellion",
          "paragraphs": [
            {
              "en": "“And even the miserable lives we lead are not allowed to reach their <span class=\"vocab-trigger\" data-vocab=\"natural span\">natural span<\/span>. For myself I do not <span class=\"vocab-trigger\" data-vocab=\"grumble\">grumble<\/span>, for I am one of the lucky ones. I am twelve years old and have had over four hundred children. Such is the natural life of a pig. But no animal escapes the cruel knife in the end. You young <span class=\"vocab-trigger\" data-vocab=\"porkers\">porkers<\/span> who are sitting in front of me, every one of you will scream your lives out at the <span class=\"vocab-trigger\" data-vocab=\"block\">block<\/span> within a year. To that horror we all must come — cows, pigs, hens, sheep, everyone. Even the horses and the dogs have no better fate. You, Boxer, the very day that those great muscles of yours lose their power, Jones will sell you to the <span class=\"vocab-trigger\" data-vocab=\"knacker\">knacker<\/span>, who will cut your throat and boil you down for the <span class=\"vocab-trigger\" data-vocab=\"foxhounds\">foxhounds<\/span>. As for the dogs, when they grow old and toothless, Jones ties a brick round their necks and drowns them in the nearest pond.",
              "zh": "“就连我们这种悲惨的生活，都不让我们活到自然该有的寿命。我自己倒没什么可抱怨的，因为我算是幸运的一个。我十二岁了，有了四百多个儿女。猪的自然生活就是如此。但没有哪一个动物最后能逃过那残忍的刀子。你们这些坐在我面前的小猪，不出一年，个个都会在砧板上尖声嚎叫，直到断气。我们统统要走到那恐怖的结局——牛、猪、母鸡、绵羊，一个也逃不掉。就连马和狗，命运也好不了多少。你，拳击手，等到你那一身了不起的肌肉失去力气的那一天，琼斯就会把你卖给屠马贩子，那个贩子会割开你的喉咙，把你煮了喂猎狐的狗。至于那些狗，等他们老了，牙掉光了，琼斯就在他们脖子上拴块砖头，丢进最近的池塘里淹死。",
              "simpEn": "“And we are not even allowed to live out our natural lives. I don't complain for myself, because I have been lucky. I am twelve years old and have had more than four hundred children. That is a pig's natural life. But in the end, no animal escapes the cruel knife. You young pigs sitting in front of me, every one of you will scream your life out on the butcher's block within a year. That terrible end comes to all of us — cows, pigs, hens, sheep, everyone. Even horses and dogs have no better future. Boxer, the day your strong muscles become weak, Jones will sell you to a person who kills horses, who will cut your throat and cook your body to feed the hunting dogs. And when the dogs get old and lose their teeth, Jones ties a brick to their neck and drowns them in a pond.",
              "simpZh": "“我们连惨淡的一辈子都不让活完。我自己倒不抱怨，因为我算运气好。我十二岁了，有四百多个孩子。猪的自然生活就是这样。但是最后，没有哪个动物能躲过那把残忍的刀。你们这些在我面前的小猪，一年之内，个个都要在屠宰台上惨叫着死去。那可怕的下场，我们全都逃不过——牛、猪、母鸡、羊，谁都一样。就算是马和狗，也没什么好命。拳击手，等你那身大肌肉没了力气，琼斯就会把你卖给杀马的人，那人会割开你的喉咙，把你煮了喂猎狗。狗老了、没牙了，琼斯就往他们脖子上拴块砖头，扔进最近的池塘淹死。"
            },
            {
              "en": "“Is it not <span class=\"vocab-trigger\" data-vocab=\"crystal clear\">crystal clear<\/span>, then, comrades, that all the evils of this life of ours spring from the <span class=\"vocab-trigger\" data-vocab=\"tyranny\">tyranny<\/span> of human beings? Only get rid of Man, and the produce of our labour would be our own. Almost overnight we could become rich and free. What then must we do? Why, work night and day, body and soul, for the <span class=\"vocab-trigger\" data-vocab=\"overthrow\">overthrow<\/span> of the human race! That is my message to you, comrades: <span class=\"vocab-trigger\" data-vocab=\"Rebellion\">Rebellion<\/span>! I do not know when that Rebellion will come, it might be in a week or in a hundred years, but I know, as surely as I see this straw beneath my feet, that sooner or later justice will be done. Fix your eyes on that, comrades, throughout the short remainder of your lives! And above all, pass on this message of mine to those who come after you, so that future generations shall carry on the struggle until it is victorious.",
              "zh": "“那么，同志们，难道还不清楚吗？我们生活里的一切苦难，根源都在于人类的暴虐。只要消灭了人，我们的劳动成果就全是自己的。几乎一夜之间，我们就能变得富裕自由。那么，我们该做什么呢？那就是日日夜夜、竭尽全力为推翻人类而奋斗！同志们，这就是我要对你们说的话：造反！我不知道造反什么时候会到来，也许是一星期以后，也许是一百年以后，但我就像看得见我脚下的这些干草一样，确信正义迟早会得到伸张。同志们，在你们所剩不多的有生之年，要盯紧这个目标！最重要的，要把我这些话传给你们的后代，好让子子孙孙都继续斗争，直到取得胜利。",
              "simpEn": "“So, friends, isn't it very clear that all the bad things in our life come from the cruel rule of humans? Just get rid of Man, and everything we make by working would be ours. Almost immediately we could be rich and free. So what must we do? We must work with all our strength, day and night, to defeat and remove humans! That is my message: Rebellion! I don't know when it will happen — maybe in a week, maybe in a hundred years — but I am as sure as I see the straw under my feet that justice will come one day. Keep your eyes on that goal for the rest of your short lives. Most importantly, pass this message to the next generations so they can keep fighting until we win.",
              "simpZh": "“所以，朋友们，难道还不明白吗？我们生活里的一切痛苦，都是因为人类的暴政。只要把人赶走，我们干活的成果就全是自己的了。几乎一下子我们就能又富又自由。那我们该怎么办？就是要没日没夜、用尽全力去推翻人类！这就是我要说的：造反！我不知道造反什么时候会来，可能一个星期，也可能一百年，但我就像看到脚下的草一样肯定，正义迟早会来。你们剩下的时间不多了，要一直盯着这个目标。最重要的是，把我这些话传给后代，让他们继续斗争，直到胜利。"
            },
            {
              "en": "“And remember, comrades, your <span class=\"vocab-trigger\" data-vocab=\"resolution\">resolution<\/span> must never <span class=\"vocab-trigger\" data-vocab=\"falter\">falter<\/span>. No argument must <span class=\"vocab-trigger\" data-vocab=\"lead you astray\">lead you astray<\/span>. Never listen when they tell you that Man and the animals have a <span class=\"vocab-trigger\" data-vocab=\"common interest\">common interest<\/span>, that the <span class=\"vocab-trigger\" data-vocab=\"prosperity\">prosperity<\/span> of the one is the prosperity of the others. It is all lies. Man serves the interests of no creature except himself. And among us animals let there be perfect <span class=\"vocab-trigger\" data-vocab=\"unity\">unity<\/span>, perfect <span class=\"vocab-trigger\" data-vocab=\"comradeship\">comradeship<\/span> in the struggle. All men are enemies. All animals are comrades.”",
              "zh": "“记住，同志们，你们的决心绝不能动摇。任何争论都不能把你们引入歧途。绝不要听人家说什么人和动物有着共同的利益，说什么一方的繁荣就是另一方的繁荣。那全是谎话。人类除了自己，不为任何生灵的利益着想。而在我们动物之间，要有完美的团结，在这场斗争中要有完美的同志情谊。所有的人都是敌人。所有的动物都是同志。”",
              "simpEn": "“And remember, friends, you must never lose your determination. Don't let any argument trick you. Never believe them when they say that humans and animals share the same interests, that what is good for one is good for the other. That is all lies. Man only cares about himself. Let there be perfect agreement and friendship among us animals in this struggle. All humans are enemies. All animals are friends.”",
              "simpZh": "“记住，朋友们，你们决不能动摇。别让任何说法把你们骗了。永远不要听他们说人和动物有共同的利益，说对一方好就是对另一方好。那全是谎话。人除了自己谁也不关心。我们动物之间要完全团结，在斗争里要有真正的伙伴情谊。所有的人都是敌人。所有的动物都是朋友。”"
            }

          "sectionId": 8,
          "heading": "The Vote on Rats",
          "paragraphs": [
            {
              "en": "At this moment there was a tremendous <span class=\"vocab-trigger\" data-vocab=\"uproar\">uproar<\/span>. While Major was speaking four large rats had crept out of their holes and were sitting on their <span class=\"vocab-trigger\" data-vocab=\"hindquarters\">hindquarters<\/span>, listening to him. The dogs had suddenly caught sight of them, and it was only by a swift dash for their holes that the rats saved their lives. Major raised his <span class=\"vocab-trigger\" data-vocab=\"trotter\">trotter<\/span> for silence.",
              "zh": "这时响起了一阵大骚动。麦哲讲话的时候，四只大老鼠从洞里爬了出来，蹲坐在后腿上听他讲。狗突然看见了它们，老鼠们一阵风似的窜回洞里，才保住了性命。麦哲抬起蹄子，示意安静。",
              "simpEn": "Just then there was a big noise. While Major was speaking, four large rats came out of their holes and sat on their back legs, listening. The dogs suddenly saw them, and the rats only saved themselves by running quickly back into their holes. Major lifted his front foot to ask for quiet.",
              "simpZh": "这时候一阵大乱。麦哲正讲着，四只大老鼠从洞里钻出来，用后腿坐着听。狗忽然发现了它们，老鼠飞快跑回洞里才没被抓住。麦哲抬起一只前蹄叫大家安静。"
            },
            {
              "en": "“Comrades,” he said, “here is a point that must be <span class=\"vocab-trigger\" data-vocab=\"settled\">settled<\/span>. The wild creatures, such as rats and rabbits — are they our friends or our enemies? Let us put it to the vote. I propose this question to the meeting: Are rats comrades?”",
              "zh": "“同志们，”他说，“有一个问题必须定下来。那些野生的动物，像老鼠、兔子——他们是我们的朋友，还是敌人？我们来表决一下吧。我向会议提出这个问题：老鼠是不是同志？”",
              "simpEn": "“Friends,” he said, “here is a matter we must decide. Wild animals like rats and rabbits — are they our friends or our enemies? Let's vote on it. I ask the meeting this question: Are rats comrades?”",
              "simpZh": "“朋友们，”他说，“有件事情得定下来。像老鼠、兔子这些野物——它们是我们的朋友，还是敌人？咱们来投票。我问大家：老鼠算同志吗？”"
            },
            {
              "en": "The vote was taken at once, and it was agreed by an <span class=\"vocab-trigger\" data-vocab=\"overwhelming majority\">overwhelming majority<\/span> that rats were comrades. There were only four <span class=\"vocab-trigger\" data-vocab=\"dissentients\">dissentients<\/span>, the three dogs and the cat, who was afterwards discovered to have voted on both sides. Major continued:",
              "zh": "表决立刻进行，结果以压倒多数通过：老鼠是同志。只有四票反对，那就是三条狗和那只猫，事后发现猫投了双方面。麦哲接着讲：",
              "simpEn": "They voted right away, and most animals agreed that rats were friends. Only four voted differently: the three dogs and the cat, who was later found to have voted on both sides. Major went on:",
              "simpZh": "马上投票，绝大多数同意老鼠是同志。只有四票不同意：三条狗和那只猫，后来发现猫两边都投了。麦哲接着说："

          "sectionId": 9,
          "heading": "The Commandments of Animalism",
          "paragraphs": [
            {
              "en": "“I have little more to say. I merely repeat, remember always your duty of <span class=\"vocab-trigger\" data-vocab=\"enmity\">enmity<\/span> towards Man and all his ways. Whatever goes upon two legs is an enemy. Whatever goes upon four legs, or has wings, is a friend. And remember also that in fighting against Man, we must not come to <span class=\"vocab-trigger\" data-vocab=\"resemble\">resemble<\/span> him. Even when you have conquered him, do not adopt his <span class=\"vocab-trigger\" data-vocab=\"vices\">vices<\/span>. No animal must ever live in a house, or sleep in a bed, or wear clothes, or drink alcohol, or smoke tobacco, or touch money, or engage in trade. All the habits of Man are evil. And, above all, no animal must ever <span class=\"vocab-trigger\" data-vocab=\"tyrannise\">tyrannise<\/span> over his own kind. Weak or strong, clever or simple, we are all brothers. No animal must ever kill any other animal. All animals are equal.”",
              "zh": "“我没有多少要说的了。我只是再重复一遍，永远牢记你们对人类及其所有作风的敌意。凡是两条腿的，都是敌人。凡是四条腿的，或者长翅膀的，都是朋友。还有，记住同人类斗争的时候，我们绝不能学他们的样。即便打败了他们，也别沾染他们的恶习。任何动物都不得住房子、睡床铺、穿衣服、喝酒、抽烟、碰钱、做买卖。人类的一切习惯都是邪恶的。最重要的是，任何动物都不得欺压自己的同类。无论强弱，无论聪明还是愚钝，我们都是兄弟。任何动物都不得杀害别的动物。所有动物一律平等。”",
              "simpEn": "“I don't have much more to say. I just repeat: always remember to hate Man and everything he does. Anything that walks on two legs is an enemy. Anything on four legs, or with wings, is a friend. Also, while we fight Man, we must not become like him. Even after we win, don't take up his bad habits. No animal must ever live in a house, sleep in a bed, wear clothes, drink alcohol, smoke, use money, or do business. All human habits are bad. Most importantly, no animal must ever act like a cruel ruler over another animal. Strong or weak, smart or simple, we are all brothers. No animal must ever kill another animal. All animals are equal.”",
              "simpZh": "“我没太多要讲了。我只重复：永远记住恨人和他的一切做法。用两条腿走路的都是敌人。四条腿的、有翅膀的，都是朋友。还有，和人类斗的时候，我们不能变得像他们。就算赢了，也别学他们的坏毛病。动物绝不能住房子、睡床、穿衣服、喝酒、抽烟、碰钱、做买卖。人的习惯全是坏的。最要紧的，动物绝不能欺负同类。不管是强是弱，聪明还是笨，我们都是兄弟。动物绝不能杀害别的动物。所有动物一律平等。”"
            }

        {
          "sectionId": 10,
          "heading": "The Song 'Beasts of England'",
          "paragraphs": [
            {
              "en": "“And now, comrades, I will tell you about my dream of last night. I cannot describe that dream to you. It was a dream of the earth as it will be when Man has <span class=\"vocab-trigger\" data-vocab=\"vanished\">vanished<\/span>. But it reminded me of something that I had long forgotten. Many years ago, when I was a little pig, my mother and the other <span class=\"vocab-trigger\" data-vocab=\"sows\">sows<\/span> used to sing an old song of which they knew only the tune and the first three words. I had known that tune in my <span class=\"vocab-trigger\" data-vocab=\"infancy\">infancy<\/span>, but it had long since passed out of my mind. Last night, however, it came back to me in my dream. And what is more, the words of the song also came back-words, I am certain, which were sung by the animals of long ago and have been lost to memory for generations. I will sing you that song now, comrades. I am old and my voice is <span class=\"vocab-trigger\" data-vocab=\"hoarse\">hoarse<\/span>, but when I have taught you the tune, you can sing it better for yourselves. It is called ‘<span class=\"vocab-trigger\" data-vocab=\"Beasts of England\">Beasts of England<\/span>’.”",
              "zh": "“现在，同志们，我要讲讲昨晚的梦。那梦我无法形容。那是一个关于人类消失之后大地面貌的梦。但它让我想起了一件早已忘却的事。好多年前，我还是一头小猪的时候，我妈妈和别的母猪常常唱一首老歌，她们只记得曲调和开头的三个字。我小时候也记得那个调子，但后来早就忘了。然而，昨夜在梦里它又回到了我的脑子里。不仅如此，连歌词也回来了——我敢肯定，那是古时候动物们唱过的歌词，已经失传了好几代。同志们，我现在就把那首歌唱给你们听。我老了，嗓子也哑了，不过等我把调子教会你们，你们自己可以唱得更好。歌名叫做《英格兰兽》。",
              "simpEn": "“Now, friends, I'll tell you about my dream from last night. I can't really describe it. It was a dream of how the world will look after Man is gone. But it made me remember something I had forgotten long ago. Many years ago, when I was a baby pig, my mother and the other female pigs used to sing an old song. They only knew the music and the first three words. I knew that music when I was very young, but I forgot it a long time ago. Last night, it came back to me in my dream. And what's more, the words came back too — words that I am sure were sung by animals long ago and have been forgotten for many generations. I will sing that song for you now, friends. I'm old and my voice is rough, but after I teach you the music, you can sing it better. It's called ‘Beasts of England’.”",
              "simpZh": "“现在，朋友们，我给你们讲讲昨晚的梦。那个梦我讲不清楚。梦里我看见人类消失以后世界的样子。可它让我想起了一件早就忘了的事。很多年前，我还是小猪的时候，我妈妈和别的母猪常唱一首老歌，她们只记得调子和开头的三个字。我小时候也会那个调子，但是早就忘了。昨晚在梦里我又想起来了。而且连歌词也想起来了——肯定是古时候动物唱的，已经忘了好几代了。朋友们，我现在就唱给你们听。我老了，嗓子哑，但是我教完调子，你们能唱得更好。歌名叫《英格兰的野兽》。"
            },
            {
              "en": "Old Major cleared his throat and began to sing. As he had said, his voice was hoarse, but he sang well enough, and it was a <span class=\"vocab-trigger\" data-vocab=\"stirring tune\">stirring tune<\/span>, something between ‘Clementine’ and ‘La Cucaracha’. The words ran:",
              "zh": "老麦哲清了清嗓子，唱了起来。正如他说的，他的嗓子是哑的，可他唱得还算不错，那是一支激动人心的曲调，有点像《克莱门汀》和《蟑螂歌》之间的调子。歌词如下：",
              "simpEn": "Old Major cleared his throat and started to sing. Just as he said, his voice was rough, but he sang quite well, and the music was exciting and strong — something like a mix between the songs ‘Clementine’ and ‘La Cucaracha’. The words went:",
              "simpZh": "老麦哲清清嗓子开始唱。就像他说的，嗓音沙哑，但是唱得挺好听，曲调很激动人心，有点像《克莱门汀》和《蟑螂歌》中间的调子。歌词是这样："
            },
            {
              "en": "Beasts of England, beasts of Ireland,<br>Beasts of every land and <span class=\"vocab-trigger\" data-vocab=\"clime\">clime<\/span>,<br><span class=\"vocab-trigger\" data-vocab=\"Hearken\">Hearken<\/span> to my joyful <span class=\"vocab-trigger\" data-vocab=\"tidings\">tidings<\/span><br>Of the golden future time.<br><br>Soon or late the day is coming,<br>Tyrant Man shall be <span class=\"vocab-trigger\" data-vocab=\"o'erthrown\">o'erthrown<\/span>,<br>And the fruitful fields of England<br>Shall be <span class=\"vocab-trigger\" data-vocab=\"trod\">trod<\/span> by beasts alone.<br><br>Rings shall vanish from our noses,<br>And the <span class=\"vocab-trigger\" data-vocab=\"harness\">harness<\/span> from our back,<br><span class=\"vocab-trigger\" data-vocab=\"Bit and spur\">Bit and spur<\/span> shall rust forever,<br>Cruel whips no more shall crack.<br><br>Riches more than mind can picture,<br>Wheat and barley, oats and hay,<br>Clover, beans, and <span class=\"vocab-trigger\" data-vocab=\"mangel-wurzels\">mangel-wurzels<\/span><br>Shall be ours upon that day.<br><br>Bright will shine the fields of England,<br>Purer shall its waters be,<br>Sweeter yet shall blow its breezes<br>On the day that sets us free.<br><br>For that day we all must labour,<br>Though we die before it break;<br>Cows and horses, geese and turkeys,<br>All must <span class=\"vocab-trigger\" data-vocab=\"toil\">toil<\/span> for <span class=\"vocab-trigger\" data-vocab=\"freedom's sake\">freedom's sake<\/span>.<br><br>Beasts of England, beasts of Ireland,<br>Beasts of every land and clime,<br>Hearken well and spread my tidings<br>Of the golden future time.",
              "zh": "英格兰兽，爱尔兰兽，<br>所有地方的兽，<br>请聆听我欢乐的佳音，<br>关于那黄金的未来。<br><br>那一天迟早要来到，<br>暴虐的人类终将推翻，<br>英格兰富饶的田野，<br>将只有兽类来踏遍。<br><br>鼻上的铁环会消失，<br>背上的挽具不再有，<br>嚼子和马刺永远锈蚀，<br>残忍的鞭子不再响。<br><br>财富多过头脑所能想，<br>小麦大麦，燕麦干草，<br>苜蓿豆子和饲用甜菜，<br>那一天全归我们所有。<br><br>英格兰田野将闪闪发光，<br>水流会更加纯净，<br>微风会吹得更甜美，<br>在我们获得自由的那天。<br><br>为了那天我们全得出力，<br>哪怕等不到它来临就死去；<br>牛和马，鹅和火鸡，<br>为了自由都须辛劳。<br><br>英格兰兽，爱尔兰兽，<br>所有地方的兽，<br>仔细听，传开我的佳音，<br>关于那黄金的未来。",
              "simpEn": "Animals of England, animals of Ireland, animals of every land and climate, listen to my happy news about the wonderful future time. Sooner or later the day will come when cruel Man is defeated, and the rich fields of England will be walked on only by animals. Rings will disappear from our noses, and the straps from our backs. The metal bit and the sharp spur will rust away forever, and the sound of cruel whips will never be heard again. We will have more riches than we can imagine — wheat, barley, oats, hay, clover, beans, and big root vegetables. The fields of England will shine brightly, its waters will be cleaner, and the winds will blow more sweetly on the day that makes us free. We must all work for that day, even if we die before it comes. Cows, horses, geese, turkeys — everyone must work hard for freedom. Animals of England, animals of Ireland, animals everywhere, listen and spread my happy news about the golden future.",
              "simpZh": "英格兰的野兽，爱尔兰的野兽，到处所有的野兽，听我带来这个好消息，讲那黄金的未来。总有一天，残暴的人会被打倒，英格兰肥沃的田地只有野兽来踩。我们鼻子上的铜环会不见，背上的皮带也会消失。马嚼子和尖马刺永远生锈，凶狠的鞭子再也不会响。我们的财富多得想都想不到——小麦大麦、燕麦干草、苜蓿、豆子和大的根菜。英格兰的田地会闪闪发亮，水流会变干净，微风会吹得更甜，在那自由的一天。我们要为那一天出力，哪怕没等到就死掉。牛、马、鹅、火鸡，都必须为自由苦干。英格兰的野兽，爱尔兰的野兽，所有地方的野兽，好好听，把我这好消息传开去，讲那黄金的未来。"
            }

        {
          "sectionId": 11,
          "heading": "The Singing and the Uproar",
          "paragraphs": [
            {
              "en": "The singing of this song threw the animals into the <span class=\"vocab-trigger\" data-vocab=\"wildest excitement\">wildest excitement<\/span>. Almost before Major had reached the end, they had begun singing it for themselves. Even the stupidest of them had already picked up the tune and a few of the words, and as for the clever ones, such as the pigs and dogs, they had the entire song <span class=\"vocab-trigger\" data-vocab=\"by heart\">by heart<\/span> within a few minutes. And then, after a few <span class=\"vocab-trigger\" data-vocab=\"preliminary tries\">preliminary tries<\/span>, the whole farm burst out into ‘Beasts of England’ in <span class=\"vocab-trigger\" data-vocab=\"tremendous unison\">tremendous unison<\/span>. The cows <span class=\"vocab-trigger\" data-vocab=\"lowed\">lowed<\/span> it, the dogs <span class=\"vocab-trigger\" data-vocab=\"whined\">whined<\/span> it, the sheep <span class=\"vocab-trigger\" data-vocab=\"bleated\">bleated<\/span> it, the horses <span class=\"vocab-trigger\" data-vocab=\"whinnied\">whinnied<\/span> it, the ducks <span class=\"vocab-trigger\" data-vocab=\"quacked\">quacked<\/span> it. They were so delighted with the song that they sang it right through five times <span class=\"vocab-trigger\" data-vocab=\"in succession\">in succession<\/span>, and might have continued singing it all night if they had not been interrupted.",
              "zh": "这首歌把动物们卷入了最狂热的激动之中。麦哲还没唱完，他们自己就跟着唱起来了。就连最笨的动物也很快就学会了曲调和几句歌词，至于那些聪明的，像猪和狗，几分钟之内就把整首歌背得滚瓜烂熟。接着，试着唱了几遍之后，整个农场轰然齐唱《英格兰兽》，声音无比洪亮。母牛哞哞地唱，狗汪汪地唱，羊咩咩地唱，马嘶嘶地唱，鸭子嘎嘎地唱。他们喜欢这歌喜欢得不得了，一口气连唱了五遍，要不是被打断，也许会唱上一整夜。",
              "simpEn": "The song made the animals extremely excited. Before Major had even finished, they started singing it themselves. Even the least clever ones quickly learned the music and some words, and the smart ones like the pigs and dogs knew the whole song perfectly after a few minutes. Then, after a few practice tries, the whole farm loudly sang ‘Beasts of England’ all together. The cows sang it with their low sounds, the dogs with their whines, the sheep with their bleats, the horses with their neighs, and the ducks with their quacks. They loved the song so much that they sang it all the way through five times without stopping, and they might have kept singing all night if they hadn't been stopped.",
              "simpZh": "这首歌让动物们激动得不得了。麦哲还没唱完，他们就自己开始唱了。连最笨的也很快学会了调子和几句歌词，像猪和狗这些聪明的，几分钟就把整首歌记得牢牢的。试了几次以后，整个农场一起大声唱起了《英格兰的野兽》。母牛哞哞地唱，狗汪汪地唱，羊咩咩地唱，马嘶嘶地唱，鸭子嘎嘎地唱。他们太喜欢这首歌了，一口气唱了五遍，要不是被打断，可能唱一整夜。"
            },
            {
              "en": "Unfortunately, the <span class=\"vocab-trigger\" data-vocab=\"uproar\">uproar<\/span> awoke Mr. Jones, who <span class=\"vocab-trigger\" data-vocab=\"sprang out of bed\">sprang out of bed<\/span>, <span class=\"vocab-trigger\" data-vocab=\"making sure\">making sure<\/span> that there was a fox in the yard. He seized the gun which always stood in a corner of his bedroom, and <span class=\"vocab-trigger\" data-vocab=\"let fly a charge\">let fly a charge<\/span> of number 6 <span class=\"vocab-trigger\" data-vocab=\"shot\">shot<\/span> into the darkness. The <span class=\"vocab-trigger\" data-vocab=\"pellets\">pellets<\/span> <span class=\"vocab-trigger\" data-vocab=\"buried themselves\">buried themselves<\/span> in the wall of the barn and the meeting broke up hurriedly. Everyone fled to his own sleeping-place. The birds jumped on to their <span class=\"vocab-trigger\" data-vocab=\"perches\">perches<\/span>, the animals <span class=\"vocab-trigger\" data-vocab=\"settled down\">settled down<\/span> in the straw, and the whole farm was asleep in a moment.",
              "zh": "不幸的是，这阵喧闹惊醒了琼斯先生。他从床上一跃而起，认定院子里有狐狸。他抓起一直搁在卧室墙角的那支枪，朝着黑暗开了一发六号霰弹。弹丸嵌进了谷仓的墙壁，集会顿时一哄而散。个个都逃回自己睡觉的地方。鸟儿跳回栖木，动物们卧倒在草堆里，整个农场刹那间就睡着了。",
              "simpEn": "Sadly, the loud noise woke up Mr. Jones. He jumped out of bed, sure there was a fox in the yard. He grabbed his gun from the bedroom corner and fired a shot into the dark. The small metal balls hit the barn wall, and the meeting quickly ended. Everyone ran to their sleeping spots. The birds flew back to their wooden bars, the animals lay down in the straw, and the whole farm was asleep almost at once.",
              "simpZh": "可惜这阵吵闹把琼斯先生吵醒了。他从床上跳起来，认定院子里有狐狸。他抓起卧室角落的猎枪，朝黑处开了一枪。小弹珠打中了谷仓的墙，聚会立刻散了。大家跑回自己睡觉的地方。鸟飞回木棍上，动物躺回草里，整个农场一下就睡着了。"
            }

              "zh": "这是三月初的事。在接下来的三个月里，有很多秘密活动。麦哲的讲话让农场里比较聪明的动物对生活有了全新的看法。他们不知道麦哲所预言的那场造反什么时候发生，也没有理由认为会在自己的有生之年发生，但他们清楚地看到，为它做好准备是他们的责任。教导和组织其他动物的工作自然而然地落到了猪的身上，它们被公认是动物中最聪明的。",

            {
              "en": "These three had <span class=\"vocab-trigger\" data-vocab=\"elaborated\">elaborated<\/span> old Major's teachings into a <span class=\"vocab-trigger\" data-vocab=\"complete system of thought\">complete system of thought<\/span>, to which they gave the name of <span class=\"vocab-trigger\" data-vocab=\"Animalism\">Animalism<\/span>. Several nights a week, after Mr. Jones was asleep, they held <span class=\"vocab-trigger\" data-vocab=\"secret meetings\">secret meetings<\/span> in the barn and <span class=\"vocab-trigger\" data-vocab=\"expounded the principles\">expounded the principles<\/span> of Animalism to the others. At the beginning they <span class=\"vocab-trigger\" data-vocab=\"met with much stupidity and apathy\">met with much stupidity and apathy<\/span>. Some of the animals talked of the <span class=\"vocab-trigger\" data-vocab=\"duty of loyalty\">duty of loyalty<\/span> to Mr. Jones, whom they referred to as “<span class=\"vocab-trigger\" data-vocab=\"Master\">Master<\/span>,” or made <span class=\"vocab-trigger\" data-vocab=\"elementary remarks\">elementary remarks<\/span> such as “Mr. Jones feeds us. If he were gone, we should <span class=\"vocab-trigger\" data-vocab=\"starve to death\">starve to death<\/span>.” Others asked such questions as “Why should we care what happens after we are dead?” or “If this Rebellion is to happen anyway, <span class=\"vocab-trigger\" data-vocab=\"what difference does it make\">what difference does it make<\/span> whether we work for it or not?”, and the pigs had great difficulty in making them see that this was <span class=\"vocab-trigger\" data-vocab=\"contrary to the spirit of Animalism\">contrary to the spirit of Animalism<\/span>.",
              "zh": "这三头猪把老麦哲的教诲精心发展成了一套完整的思想体系，并把它命名为“动物主义”。每周有好几个晚上，趁琼斯先生睡着之后，他们就在大谷仓里举行秘密会议，向其他动物宣讲动物主义的原理。开始时他们碰到了许多愚昧和冷淡。有些动物谈起要对琼斯先生尽忠，管他叫“主人”，或者提出一些浅薄的说法，比如“琼斯先生喂我们，他要是走了，我们就会饿死”。还有些动物问：“我们死后发生什么，关我们什么事？”或者“既然造反反正要发生，我们干不干又有什么分别？”猪费了好大的劲，才让他们明白这种想法是违背动物主义精神的。",
              "simpEn": "These three pigs had developed Major's ideas into a full set of ideas, which they called Animalism. A few nights each week, after Mr. Jones slept, they held secret meetings in the barn and explained the rules of Animalism to the others. In the beginning they faced a lot of dullness and lack of interest. Some animals spoke about being loyal to Mr. Jones, whom they called 'Master,' or said simple things like 'Mr. Jones gives us food. Without him we would die of hunger.' Others asked, 'Why should we care what happens after we die?' or 'If the Rebellion will happen anyway, why does it matter if we work for it?' The pigs had a very hard time showing them that these ideas were against the true meaning of Animalism.",
              "simpZh": "这三只猪把麦哲的道理发展成了一套完整的思想，叫动物主义。每周有几天晚上，等琼斯先生睡了，他们就在谷仓秘密开会，给别的动物讲动物主义的道理。一开始他们碰到很多愚笨和没兴趣的。有些动物说要忠于琼斯先生，叫他“主人”，还说些简单的话，比如“琼斯先生喂我们，没了他我们就饿死了”。还有的问“我们死后怎样关我们什么事？”或者“反正造反会来，我们干不干有什么不同？”猪费了很大力气才让他们明白，这些想法是违背动物主义精神的。"
            },
            {
              "en": "The stupidest questions of all were asked by Mollie, the white mare. The very first question she asked Snowball was: “Will there still be <span class=\"vocab-trigger\" data-vocab=\"sugar\">sugar<\/span> after the Rebellion?”<br>“No,” said Snowball firmly. “We have no <span class=\"vocab-trigger\" data-vocab=\"means of making sugar\">means of making sugar<\/span> on this farm. Besides, you do not need sugar. You will have all the oats and hay you want.”<br>“And shall I still be allowed to wear <span class=\"vocab-trigger\" data-vocab=\"ribbons in my mane\">ribbons in my mane<\/span>?” asked Mollie.<br>“<span class=\"vocab-trigger\" data-vocab=\"Comrade\">Comrade<\/span>,” said Snowball, “those ribbons that you are so devoted to are the <span class=\"vocab-trigger\" data-vocab=\"badge of slavery\">badge of slavery<\/span>. Can you not understand that <span class=\"vocab-trigger\" data-vocab=\"liberty is worth more than ribbons\">liberty is worth more than ribbons<\/span>?”<br>Mollie agreed, but she did not sound very <span class=\"vocab-trigger\" data-vocab=\"convinced\">convinced<\/span>.",
              "zh": "最愚蠢的问题出自那匹白母马莫丽。她向雪球提出的第一个问题就是：“造反以后还有糖吗？”<br>“没有，”雪球断然说道，“我们农场没办法制糖。再说，你也不需要糖。你要多少燕麦和干草都有。”<br>“那我还可不可以鬃毛里扎缎带呢？”莫丽问。<br>“同志，”雪球说，“你那么喜欢的那些缎带，是奴役的标志。难道你不明白，自由比缎带更宝贵吗？”<br>莫丽同意了，可听上去并不怎么信服。",

          "heading": "Moses and Sugarcandy Mountain",
          "paragraphs": [
            {
              "en": "The pigs had an even harder struggle to <span class=\"vocab-trigger\" data-vocab=\"counteract the lies\">counteract the lies<\/span> <span class=\"vocab-trigger\" data-vocab=\"put about by Moses\">put about by Moses<\/span>, the <span class=\"vocab-trigger\" data-vocab=\"tame raven\">tame raven<\/span>. Moses, who was Mr. Jones's especial pet, was a <span class=\"vocab-trigger\" data-vocab=\"spy and a tale-bearer\">spy and a tale-bearer<\/span>, but he was also a <span class=\"vocab-trigger\" data-vocab=\"clever talker\">clever talker<\/span>. He claimed to know of the existence of a <span class=\"vocab-trigger\" data-vocab=\"mysterious country\">mysterious country<\/span> called <span class=\"vocab-trigger\" data-vocab=\"Sugarcandy Mountain\">Sugarcandy Mountain<\/span>, to which all animals went when they died. It was <span class=\"vocab-trigger\" data-vocab=\"situated somewhere up in the sky\">situated somewhere up in the sky<\/span>, a little distance beyond the clouds, Moses said. In Sugarcandy Mountain it was Sunday seven days a week, <span class=\"vocab-trigger\" data-vocab=\"clover was in season\">clover was in season<\/span> <span class=\"vocab-trigger\" data-vocab=\"all the year round\">all the year round<\/span>, and <span class=\"vocab-trigger\" data-vocab=\"lump sugar and linseed cake\">lump sugar and linseed cake<\/span> grew on the hedges. The animals hated Moses because he <span class=\"vocab-trigger\" data-vocab=\"told tales\">told tales<\/span> and did no work, but some of them <span class=\"vocab-trigger\" data-vocab=\"believed in Sugarcandy Mountain\">believed in Sugarcandy Mountain<\/span>, and the pigs had to argue very hard to <span class=\"vocab-trigger\" data-vocab=\"persuade\">persuade<\/span> them that there was no such place.",
              "zh": "猪还要更费力地去抵消摩西散布的谎言。摩西是那只驯化的渡鸦，也是琼斯先生的特别宠物。他是个密探加长舌，但同时也很会说话。他声称知道有一个神秘的地方叫“糖果山”，所有动物死后都到那里去。摩西说，那个地方就在天上某处，离云层不远。在糖果山，一周七天都是星期天，苜蓿一年四季都在生长，方糖和亚麻籽饼就长在树篱上。动物们恨摩西，因为他搬弄是非，又什么活也不干，但其中还是有些信了糖果山，猪不得不费尽唇舌来说服他们根本没这么个地方。",
              "simpEn": "The pigs had an even harder time fighting the lies spread by Moses, the pet black bird. Moses was a spy and told stories about others, but he was also a smooth talker. He said there was a strange land called Sugarcandy Mountain, where all animals go after they die. He said it was high up in the sky, a little past the clouds. There, it was like a holiday every day, clover grew all year, and sugar lumps and special cake grew on the bushes. The animals hated Moses because he told secrets and never worked, but some still believed in Sugarcandy Mountain, and the pigs had to argue very hard to convince them it wasn't real.",
              "simpZh": "猪要更费劲地对付摩西散播的谎话。摩西是那只驯养的乌鸦，琼斯先生特别宠他。他是个探子和搬弄是非的，但也很会说。他说有一个神秘的地方叫糖果山，所有动物死后都去那里。他说那地方在天上，离云不远。在那儿每天都像星期天，苜蓿全年都长，方糖和一种油籽饼就长在树篱上。动物们恨摩西，因为他打小报告又不干活，但有些还是信了糖果山。猪只好费很大力气说服他们没那个地方。"
            },
            {
              "en": "Their most <span class=\"vocab-trigger\" data-vocab=\"faithful disciples\">faithful disciples<\/span> were the two <span class=\"vocab-trigger\" data-vocab=\"cart-horses\">cart-horses<\/span>, Boxer and Clover. These two had great difficulty in <span class=\"vocab-trigger\" data-vocab=\"thinking anything out for themselves\">thinking anything out for themselves<\/span>, but having once accepted the pigs as their teachers, they <span class=\"vocab-trigger\" data-vocab=\"absorbed everything that they were told\">absorbed everything that they were told<\/span>, and <span class=\"vocab-trigger\" data-vocab=\"passed it on\">passed it on<\/span> to the other animals by <span class=\"vocab-trigger\" data-vocab=\"simple arguments\">simple arguments<\/span>. They were <span class=\"vocab-trigger\" data-vocab=\"unfailing in their attendance\">unfailing in their attendance<\/span> at the secret meetings in the barn, and led the singing of ‘<span class=\"vocab-trigger\" data-vocab=\"Beasts of England\">Beasts of England<\/span>’, with which the meetings always ended.",
              "zh": "最忠实的信徒是那两匹拉车的马，拳击手和苜蓿。这两头马动脑筋很吃力，可一旦接受了猪做老师，就把教给他们的一切全盘吸收，再用简单的道理转告给别的动物。他们从不缺席谷仓里的秘密集会，并且每次都带头唱起《英格兰兽》，那首每次集会结束时都要唱的歌。",
              "simpEn": "Their most loyal followers were the two working horses, Boxer and Clover. These two found it very hard to figure things out on their own, but once they accepted the pigs as their teachers, they took in everything they were told and passed it to the others using simple explanations. They never missed a secret meeting in the barn, and they always led the singing of 'Beasts of England,' which ended every meeting.",
              "simpZh": "他们最忠心的追随者是那两匹拉车马，拳击手和苜蓿。他们两个自己想事情很困难，可是一旦认猪当老师，就全盘接受所有教的，再用简单的道理传给别的动物。他们从没缺过一次谷仓的秘密集会，而且总带头唱起《英格兰野兽》，这是每次集会结束时唱的。"

        {
          "sectionId": 4,
          "heading": "The Rebellion Begins",
          "paragraphs": [
            {
              "en": "Now, <span class=\"vocab-trigger\" data-vocab=\"as it turned out\">as it turned out<\/span>, the Rebellion was <span class=\"vocab-trigger\" data-vocab=\"achieved much earlier\">achieved much earlier<\/span> and more easily than anyone had expected. In past years Mr. Jones, although a <span class=\"vocab-trigger\" data-vocab=\"hard master\">hard master<\/span>, had been a <span class=\"vocab-trigger\" data-vocab=\"capable farmer\">capable farmer<\/span>, but <span class=\"vocab-trigger\" data-vocab=\"of late he had fallen on evil days\">of late he had fallen on evil days<\/span>. He had become much <span class=\"vocab-trigger\" data-vocab=\"disheartened\">disheartened<\/span> after losing money in a <span class=\"vocab-trigger\" data-vocab=\"lawsuit\">lawsuit<\/span>, and had <span class=\"vocab-trigger\" data-vocab=\"taken to drinking more than was good for him\">taken to drinking more than was good for him<\/span>. For whole days at a time he would <span class=\"vocab-trigger\" data-vocab=\"lounge in his Windsor chair\">lounge in his Windsor chair<\/span> in the kitchen, reading the newspapers, drinking, and occasionally feeding Moses on <span class=\"vocab-trigger\" data-vocab=\"crusts of bread soaked in beer\">crusts of bread soaked in beer<\/span>. His men were <span class=\"vocab-trigger\" data-vocab=\"idle and dishonest\">idle and dishonest<\/span>, the fields were full of weeds, the buildings <span class=\"vocab-trigger\" data-vocab=\"wanted roofing\">wanted roofing<\/span>, the hedges were <span class=\"vocab-trigger\" data-vocab=\"neglected\">neglected<\/span>, and the animals were <span class=\"vocab-trigger\" data-vocab=\"underfed\">underfed<\/span>.",
              "zh": "说来也巧，造反来得比所有人预料的早得多，也容易得多。过去这些年，琼斯先生虽然是个严苛的主人，倒还算个能干的庄稼人，可是近来他时运不济，走了背运。一场官司赔了钱之后，他变得灰心丧气，喝酒喝得过了头。常常整天整天地瘫坐在厨房那把温莎椅里，看报纸、喝酒，偶尔拿浸了啤酒的面包皮喂摩西。他手下的雇工又懒又不老实，地里长满了野草，屋子该修屋顶了，树篱没人打理，动物们也吃不饱。",
              "simpEn": "As things happened, the Rebellion came far sooner and more easily than anyone thought. In past years Mr. Jones, though a tough boss, had been a good farmer. But lately he had come on hard times. He was very discouraged after losing money in a court case, and had started drinking far too much. For whole days he would lie back in his comfortable chair in the kitchen, reading newspapers, drinking, and sometimes feeding Moses bread soaked in beer. His workers were lazy and dishonest, the fields were full of weeds, the buildings needed new roofs, the hedges were not cared for, and the animals did not get enough food.",
              "simpZh": "结果，造反来得比大家想的早得多，也容易得多。过去琼斯先生虽然很凶，但是个能干的农场主，可近来他日子不好过了。他打官司输了钱，非常灰心，酒喝得太多了。整天整天地靠在厨房他那把大椅子上，看报纸，喝酒，偶尔拿啤酒泡面包皮喂摩西。他的雇工又懒又不老实，地里都是野草，房子要修屋顶，树篱也没人管，动物吃不饱。"
            },
            {
              "en": "June came and the hay was almost ready for cutting. On <span class=\"vocab-trigger\" data-vocab=\"Midsummer’s Eve\">Midsummer’s Eve<\/span>, which was a Saturday, Mr. Jones went into Willingdon and <span class=\"vocab-trigger\" data-vocab=\"got so drunk\">got so drunk<\/span> at the Red Lion that he did not come back till midday on Sunday. The men had <span class=\"vocab-trigger\" data-vocab=\"milked the cows\">milked the cows<\/span> in the early morning and then had <span class=\"vocab-trigger\" data-vocab=\"gone out rabbiting\">gone out rabbiting<\/span>, <span class=\"vocab-trigger\" data-vocab=\"without bothering to feed the animals\">without bothering to feed the animals<\/span>. When Mr. Jones got back he immediately went to sleep on the drawing-room sofa with the News of the World over his face, so that when evening came, the animals were <span class=\"vocab-trigger\" data-vocab=\"still unfed\">still unfed<\/span>. At last they <span class=\"vocab-trigger\" data-vocab=\"could stand it no longer\">could stand it no longer<\/span>. One of the cows <span class=\"vocab-trigger\" data-vocab=\"broke in the door of the store-shed\">broke in the door of the store-shed<\/span> with her horn and all the animals began to <span class=\"vocab-trigger\" data-vocab=\"help themselves from the bins\">help themselves from the bins<\/span>.",
              "zh": "到了六月，牧草几乎可以收割了。仲夏夜那天是个星期六，琼斯先生去了威灵顿，在红狮酒馆喝得烂醉，直到星期天中午才回来。雇工们一早就挤了牛奶，然后跑出去打兔子去了，根本懒得喂动物。琼斯先生回来后，立刻倒在客厅沙发上，把《世界新闻报》盖在脸上睡着了，到了晚上，动物们还是没人喂。最后他们再也受不了了。一头母牛用角撞开了储藏室的门，所有的动物都跟着从饲料箱里自己取食。",
              "simpEn": "June arrived and the hay was nearly ready to cut. On Midsummer's Eve, a Saturday, Mr. Jones went to the village and got so drunk that he didn't come home until Sunday midday. The workers had milked the cows early in the morning and then went off to hunt rabbits, not caring to feed the animals. When Mr. Jones returned, he fell asleep on the couch with a newspaper over his face. By evening, the animals still had no food. Finally, they couldn't take it any longer. One cow broke open the door of the food store with her horn, and all the animals began helping themselves from the containers.",
              "simpZh": "六月到了，干草差不多能割了。仲夏前夜是个星期六，琼斯先生去村里，在红狮酒馆喝得太醉，直到星期天中午才回来。雇工一早挤了牛奶，然后跑去打兔子，根本不管喂动物。琼斯先生回来倒在客厅沙发上，拿报纸盖住脸睡着了，到了晚上动物还是没吃的。最后他们忍不下去了。一头母牛用角撞破了储藏室的门，所有动物都开始从箱子里自己拿吃的。"
            },
            {
              "en": "It was just then that Mr. Jones woke up. The next moment he and his four men were in the store-shed with whips in their hands, <span class=\"vocab-trigger\" data-vocab=\"lashing out in all directions\">lashing out in all directions<\/span>. This was <span class=\"vocab-trigger\" data-vocab=\"more than the hungry animals could bear\">more than the hungry animals could bear<\/span>. <span class=\"vocab-trigger\" data-vocab=\"With one accord\">With one accord<\/span>, though nothing of the kind had been planned beforehand, they <span class=\"vocab-trigger\" data-vocab=\"flung themselves upon their tormentors\">flung themselves upon their tormentors<\/span>. Jones and his men suddenly found themselves being <span class=\"vocab-trigger\" data-vocab=\"butted and kicked from all sides\">butted and kicked from all sides<\/span>. The situation was quite <span class=\"vocab-trigger\" data-vocab=\"out of their control\">out of their control<\/span>. They had never seen animals behave like this before, and this sudden <span class=\"vocab-trigger\" data-vocab=\"uprising\">uprising<\/span> of creatures whom they were used to <span class=\"vocab-trigger\" data-vocab=\"thrashing and maltreating\">thrashing and maltreating<\/span> just as they chose, frightened them almost <span class=\"vocab-trigger\" data-vocab=\"out of their wits\">out of their wits<\/span>. After only a moment or two they gave up trying to defend themselves and <span class=\"vocab-trigger\" data-vocab=\"took to their heels\">took to their heels<\/span>. A minute later all five of them were <span class=\"vocab-trigger\" data-vocab=\"in full flight\">in full flight<\/span> down the <span class=\"vocab-trigger\" data-vocab=\"cart-track\">cart-track<\/span> that led to the main road, with the animals <span class=\"vocab-trigger\" data-vocab=\"pursuing them in triumph\">pursuing them in triumph<\/span>.",
              "zh": "正在这时，琼斯先生醒了。一转眼，他和四个雇工已经站在储藏室里，手里拿着鞭子，朝四面八方乱抽。饥饿的动物可受不了这个。他们不约而同地——虽然事前谁也没计划过——朝着那些折磨他们的人猛扑过去。琼斯和他手下突然发现自己被从四面八方又撞又踢。局面完全失去了控制。他们从没见过动物这样，这些一向任由他们随意鞭打虐待的牲畜忽然暴动起来，把他们吓得魂飞魄散。只一两下功夫，他们就放弃招架，撒腿便逃。一分钟后，五个人全沿着通往大路的马车道夺命飞跑，动物们在后面乘胜追击。",
              "simpEn": "Right then Mr. Jones woke up. Immediately, he and his four men were in the store shed with whips, hitting out wildly in all directions. This was too much for the hungry animals. All together, though nothing had been planned, they threw themselves at the people who made them suffer. Jones and his men suddenly found themselves pushed and kicked from every side. The situation was completely beyond their control. They had never seen animals act this way, and this sudden rebellion of creatures they were used to beating and mistreating as they pleased scared them almost senseless. After just a moment or two, they stopped trying to fight back and ran away. A minute later all five were running fast down the farm road toward the main road, with the animals chasing them happily.",
              "simpZh": "就在这时琼斯先生醒了。马上他和四个雇工就拿着鞭子冲进储藏室，到处乱抽。饥饿的动物再也受不了了。大家不约而同，虽然事先没商量，一齐扑向那些欺负他们的人。琼斯和雇工们突然被从四面八方又撞又踢。场面完全没法控制了。他们从没见过动物这样，这些一向随便他们打骂的牲口突然造反，吓得他们魂都没了。才一会儿，他们就不想还手了，拔腿就跑。一分钟不到，五个人全沿着马车道往大路上拼命跑，动物们胜利地追在后面。"
            },
            {
              "en": "Mrs. Jones looked out of the bedroom window, saw what was happening, hurriedly <span class=\"vocab-trigger\" data-vocab=\"flung a few possessions into a carpet bag\">flung a few possessions into a carpet bag<\/span>, and <span class=\"vocab-trigger\" data-vocab=\"slipped out of the farm by another way\">slipped out of the farm by another way<\/span>. Moses <span class=\"vocab-trigger\" data-vocab=\"sprang off his perch\">sprang off his perch<\/span> and <span class=\"vocab-trigger\" data-vocab=\"flapped after her, croaking loudly\">flapped after her, croaking loudly<\/span>. Meanwhile the animals had chased Jones and his men out on to the road and <span class=\"vocab-trigger\" data-vocab=\"slammed the five-barred gate\">slammed the five-barred gate<\/span> behind them. And so, almost before they knew what was happening, the Rebellion had been successfully carried through: Jones was <span class=\"vocab-trigger\" data-vocab=\"expelled\">expelled<\/span>, and the Manor Farm was theirs.",
              "zh": "琼斯太太从卧室窗户往外一看，知道出事了，连忙把几样东西塞进毡制手提包里，从另一条路溜出了农场。摩西从栖木上跳下来，拍着翅膀跟在后面，呱呱大叫。这时动物们已经把琼斯和他的雇工追到大路上，并随手关上了那扇五道横木的大门。于是，几乎还没等他们弄清楚是怎么回事，造反就已经成功了：琼斯被赶跑了，庄园农场归他们了。",
              "simpEn": "Mrs. Jones saw from the bedroom window what was going on. She quickly threw some things into a travel bag and slipped away from the farm by a different path. Moses jumped off his resting bar and flew after her, making loud cawing sounds. The animals had chased Jones and his men onto the road and shut the big five-barred gate behind them. And so, almost before they fully understood it, the Rebellion was successfully done: Jones was thrown out, and Manor Farm was theirs.",
              "simpZh": "琼斯太太从卧室窗子看见出了什么事，赶紧把几样东西塞进一个旅行袋，从另一条路悄悄溜出了农场。摩西从栖木上跳下来，扑棱扑棱跟在她后面，呱呱大叫。动物们已经把琼斯他们追到大路上，砰地关上了那扇有五道杠的大门。就这样，几乎还没弄明白呢，造反就顺利完成了：琼斯被赶走，庄园农场是他们的了。"
            }

        {
          "sectionId": 5,
          "heading": "Destroying the Reminders of Man",
          "paragraphs": [
            {
              "en": "For the first few minutes the animals could hardly believe in their <span class=\"vocab-trigger\" data-vocab=\"good fortune\">good fortune<\/span>. Their first act was to <span class=\"vocab-trigger\" data-vocab=\"gallop in a body\">gallop in a body<\/span> right round the <span class=\"vocab-trigger\" data-vocab=\"boundaries of the farm\">boundaries of the farm<\/span>, as though to make quite sure that no human being was hiding anywhere upon it; then they raced back to the farm buildings to <span class=\"vocab-trigger\" data-vocab=\"wipe out the last traces\">wipe out the last traces<\/span> of Jones's <span class=\"vocab-trigger\" data-vocab=\"hated reign\">hated reign<\/span>. The <span class=\"vocab-trigger\" data-vocab=\"harness-room\">harness-room<\/span> at the end of the stables was broken open; the <span class=\"vocab-trigger\" data-vocab=\"bits\">bits<\/span>, the <span class=\"vocab-trigger\" data-vocab=\"nose-rings\">nose-rings<\/span>, the <span class=\"vocab-trigger\" data-vocab=\"dog-chains\">dog-chains<\/span>, the cruel knives with which Mr. Jones had been used to <span class=\"vocab-trigger\" data-vocab=\"castrate\">castrate<\/span> the pigs and lambs, were all <span class=\"vocab-trigger\" data-vocab=\"flung down the well\">flung down the well<\/span>. The <span class=\"vocab-trigger\" data-vocab=\"reins\">reins<\/span>, the <span class=\"vocab-trigger\" data-vocab=\"halters\">halters<\/span>, the <span class=\"vocab-trigger\" data-vocab=\"blinkers\">blinkers<\/span>, the <span class=\"vocab-trigger\" data-vocab=\"degrading nosebags\">degrading nosebags<\/span>, were thrown on to the <span class=\"vocab-trigger\" data-vocab=\"rubbish fire\">rubbish fire<\/span> which was burning in the yard. So were the whips. All the animals <span class=\"vocab-trigger\" data-vocab=\"capered with joy\">capered with joy<\/span> when they saw the whips going up in flames. Snowball also threw on to the fire the <span class=\"vocab-trigger\" data-vocab=\"ribbons\">ribbons<\/span> with which the horses' manes and tails had usually been decorated on market days.",
              "zh": "开头那几分钟，动物们简直不敢相信自己的好运。他们做的第一件事，就是成群结队绕着农场的边界飞跑了一圈，像是要弄确实没有一个人躲在什么地方；然后他们冲回棚舍，把琼斯那可恨统治的最后痕迹消灭干净。马厩尽头的挽具房被砸开了；嚼子、鼻环、狗链子，还有琼斯先生平常阉猪和阉羊羔用的那些残忍的刀子，全被扔进了井里。缰绳、笼头、眼罩，还有那些带侮辱性的鼻袋，都被扔到院子里烧着的那堆垃圾火里。鞭子也扔了进去。动物们看见鞭子在火焰里烧起来，全都高兴得乱蹦乱跳。雪球还把马鬃和马尾上那些赶集日常用的饰带也扔进了火里。",
              "simpEn": "For the first few minutes the animals could hardly believe how lucky they were. Their very first action was to race all together around the edges of the farm, as if to be completely certain no human was hiding anywhere. Then they hurried back to the farm buildings to remove every last sign of Jones's hated rule. They broke open the equipment room at the end of the stable. The metal mouthpieces, nose rings, dog chains, and the cruel knives Jones had used to cut the sex organs of pigs and lambs were all thrown down the well. The leather straps, the ropes for leading, the eye covers, and the shameful feed bags were thrown onto the garbage fire burning in the yard. So were the whips. The animals jumped about happily when they saw the whips burning. Snowball also threw onto the fire the ribbons that were used to decorate the horses' manes and tails on market days.",
              "simpZh": "头几分钟，动物们几乎不敢相信自己运气这么好。他们做的第一件事，就是大家一起飞快地绕着农场边界跑了一圈，好像要确定没有一个人藏在里面。然后跑回农场房子，把琼斯可恨统治的最后痕迹都消灭干净。马厩尽头的挽具房被砸开，嚼子、鼻环、狗链，还有琼斯用来阉猪和阉羊羔的残忍刀子，全被扔下井。缰绳、笼头、眼罩，那些丢脸的鼻袋，都扔进了院子里的垃圾火堆。鞭子也扔了。动物们看到鞭子烧起来，高兴得乱蹦。雪球还把赶集日给马鬃马尾装饰的缎带也扔进火里。"
            },
            {
              "en": "“Ribbons,” he said, “should be considered as <span class=\"vocab-trigger\" data-vocab=\"clothes\">clothes<\/span>, which are the mark of a human being. All animals should <span class=\"vocab-trigger\" data-vocab=\"go naked\">go naked<\/span>.”<br>When Boxer heard this he <span class=\"vocab-trigger\" data-vocab=\"fetched the small straw hat\">fetched the small straw hat<\/span> which he wore in summer to keep the flies out of his ears, and flung it on to the fire with the rest.",
              "zh": "“缎带，”他说，“应该当作衣服看待，而衣服是人的标志。所有动物都应该赤身露体。”<br>拳击手听了，便把他夏天戴的那顶防苍蝇进耳朵的小草帽拿了过来，跟其他东西一起扔进了火里。",
              "simpEn": "'Ribbons,' he said, 'should be seen as clothing, which is a sign of humans. All animals should be naked.' When Boxer heard this, he went and got his small straw hat that he wore in summer to keep flies out of his ears, and threw it onto the fire with the other things.",
              "simpZh": "“缎带，”他说，“应该当衣服看，衣服是人的记号。动物都应该光着身子。”拳击手听见了，就去拿了他夏天戴来挡苍蝇进耳朵的小草帽，也扔进火堆里。"
            },
            {
              "en": "In a very little while the animals had destroyed everything that reminded them of Mr. Jones. Napoleon then led them back to the store-shed and <span class=\"vocab-trigger\" data-vocab=\"served out a double ration of corn\">served out a double ration of corn<\/span> to everybody, with two biscuits for each dog. Then they sang ‘Beasts of England’ from end to end seven times running, and after that they <span class=\"vocab-trigger\" data-vocab=\"settled down for the night\">settled down for the night<\/span> and slept <span class=\"vocab-trigger\" data-vocab=\"as they had never slept before\">as they had never slept before<\/span>.",
              "zh": "不大一会儿，动物们就把所有能让他们想起琼斯先生的东西全毁掉了。接着拿破仑领他们回到储藏室，给每个动物发了两份口粮的玉米，每条狗还加了两块饼干。然后他们把《英格兰兽》从头到尾连唱了七遍，之后便安顿下来过夜，那一觉睡得从来不曾那么踏实。",
              "simpEn": "Very quickly the animals had destroyed everything that reminded them of Mr. Jones. Napoleon then led them back to the food store and gave everyone twice the usual amount of corn, with two biscuits for each dog. Then they sang 'Beasts of England' all the way through seven times without stopping. After that, they lay down for the night and slept more deeply than they ever had before.",
              "simpZh": "不一会，动物就把所有让他们想起琼斯先生的东西全毁了。然后拿破仑带他们回到储藏室，给每个发了双份的玉米，每条狗还额外给两块饼干。接着他们把《英格兰野兽》从头到尾连唱了七遍。然后他们躺下来过夜，从来没睡得那么香过。"

        {

          "paragraphs": [
            {
              "en": "But they woke at dawn as usual, and suddenly remembering the <span class=\"vocab-trigger\" data-vocab=\"glorious thing\">glorious thing<\/span> that had happened, they all raced out into the <span class=\"vocab-trigger\" data-vocab=\"pasture\">pasture<\/span> together. A little way down the pasture there was a <span class=\"vocab-trigger\" data-vocab=\"knoll\">knoll<\/span> that <span class=\"vocab-trigger\" data-vocab=\"commanded a view\">commanded a view<\/span> of most of the farm. The animals rushed to the top of it and <span class=\"vocab-trigger\" data-vocab=\"gazed round them\">gazed round them<\/span> in the clear morning light. Yes, it was theirs — everything that they could see was theirs! In the <span class=\"vocab-trigger\" data-vocab=\"ecstasy of that thought\">ecstasy of that thought<\/span> they <span class=\"vocab-trigger\" data-vocab=\"gambolled\">gambolled<\/span> round and round, they <span class=\"vocab-trigger\" data-vocab=\"hurled themselves into the air\">hurled themselves into the air<\/span> in great leaps of excitement. They rolled in the <span class=\"vocab-trigger\" data-vocab=\"dew\">dew<\/span>, they <span class=\"vocab-trigger\" data-vocab=\"cropped mouthfuls\">cropped mouthfuls<\/span> of the sweet summer grass, they kicked up <span class=\"vocab-trigger\" data-vocab=\"clods\">clods<\/span> of the black earth and <span class=\"vocab-trigger\" data-vocab=\"snuffed its rich scent\">snuffed its rich scent<\/span>. Then they made a <span class=\"vocab-trigger\" data-vocab=\"tour of inspection\">tour of inspection<\/span> of the whole farm and <span class=\"vocab-trigger\" data-vocab=\"surveyed with speechless admiration\">surveyed with speechless admiration<\/span> the <span class=\"vocab-trigger\" data-vocab=\"ploughland\">ploughland<\/span>, the hayfield, the orchard, the pool, the <span class=\"vocab-trigger\" data-vocab=\"spinney\">spinney<\/span>. It was as though they had never seen these things before, and even               "zh": "不过他们还是像往常一样天一亮就醒了，突然想起那桩了不起的大事，便一齐冲进牧场。沿着牧场往下走不远，有个小丘，在那里可以俯瞰大半个农场。动物们冲上丘顶，在清朗的晨光中环顾四周。不错，那是他们的——他们目光所及的一切都是他们的了！他们陶醉在这念头里，欢腾地绕着圈子又蹦又跳，激动得高高腾跃。他们在露水上打滚，大口大口嚼着甜美的夏草，踢起一块块黑土，使劲吸着那浓郁的泥土味儿。然后他们巡视了整个农场，用无言的赞叹望着耕地、草场、果园、池塘、矮树林。仿佛以前从来没看见过这些东西似的，而且哪怕现在，他们仍然不敢相信这一切全都属于自己。",
              "simpEn": "But they woke up at sunrise as always, and suddenly remembered the wonderful event that had taken place. They all ran out together into the grass field. A little way into the field there was a small hill that gave a view over most of the farm. The animals rushed to the top and looked all around in the bright morning light. Yes, it was theirs — everything they could see was theirs! In the wild joy of that idea they jumped and played in circles, they threw themselves into the air with huge excited leaps. They rolled in the wet grass, they bit off mouthfuls of the sweet summer grass, they kicked up lumps of black earth and smelled its rich smell deeply. Then they went on a careful walk around the whole farm and looked with silent wonder at the ploughed land, the hay field, the fruit-tree field, the pool, the small wood. It was like they had never seen these places before, and even now they could hardly believe it all belonged to them.",
              "simpZh": "可他们还是像平常一样天刚亮就醒了，突然想起那件了不起的事，就一起冲进了草场。草场过去一点有个小丘，从上面能看到农场的大半。动物们冲上丘顶，在清亮的晨光里往四处望。没错，是他们的——看到的全都是他们的了！他们高兴得发了狂，转着圈儿又蹦又跳，兴奋地高高跳起。在露水里打滚，大口咬甜美的夏草，踢起一块块黑土，使劲闻那浓烈的泥土味。然后他们仔仔细细把整个农场走了一遍，默默惊叹地看着耕地、干草地、果园、池塘和小树林。好像以前从没见过这些东西似的，甚至这时候都还不敢相信全是自己的。"

            {
              "en": "Then they <span class=\"vocab-trigger\" data-vocab=\"filed back\">filed back<\/span> to the farm buildings and <span class=\"vocab-trigger\" data-vocab=\"halted in silence\">halted in silence<\/span> outside the door of the <span class=\"vocab-trigger\" data-vocab=\"farmhouse\">farmhouse<\/span>. That was theirs too, but they were frightened to go inside. After a moment, however, Snowball and Napoleon <span class=\"vocab-trigger\" data-vocab=\"butted the door open\">butted the door open<\/span> with their shoulders and the animals entered <span class=\"vocab-trigger\" data-vocab=\"in single file\">in single file<\/span>, walking with the <span class=\"vocab-trigger\" data-vocab=\"utmost care\">utmost care<\/span> <span class=\"vocab-trigger\" data-vocab=\"for fear of disturbing anything\">for fear of disturbing anything<\/span>. They <span class=\"vocab-trigger\" data-vocab=\"tiptoed from room to room\">tiptoed from room to room<\/span>, afraid to <span class=\"vocab-trigger\" data-vocab=\"speak above a whisper\">speak above a whisper<\/span> and gazing with a kind of <span class=\"vocab-trigger\" data-vocab=\"awe\">awe<\/span> at the <span class=\"vocab-trigger\" data-vocab=\"unbelievable luxury\">unbelievable luxury<\/span>, at the beds with their <span class=\"vocab-trigger\" data-vocab=\"feather mattresses\">feather mattresses<\/span>, the <span class=\"vocab-trigger\" data-vocab=\"looking-glasses\">looking-glasses<\/span>, the <span class=\"vocab-trigger\" data-vocab=\"horsehair sofa\">horsehair sofa<\/span>, the <span class=\"vocab-trigger\" data-vocab=\"Brussels carpet\">Brussels carpet<\/span>, the <span class=\"vocab-trigger\" data-vocab=\"lithograph of Queen Victoria\">lithograph of Queen Victoria<\/span> over the drawing-room <span class=\"vocab-trigger\" data-vocab=\"mantelpiece\">mantelpiece<\/span>. They were just coming down the stairs when Mollie was discovered to be missing. Going back, the others found that she had remained behind in the best bedroom. She had taken a piece of blue ribbon from Mrs. Jones's dressing-table, and was holding it against her shoulder and <span class=\"vocab-trigger\" data-vocab=\"admiring herself in the glass\">admiring herself in the glass<\/span> <span class=\"vocab-trigger\" data-vocab=\"in a very foolish manner\">in a very foolish manner<\/span>. The others <span class=\"vocab-trigger\" data-vocab=\"reproached her sharply\">reproached her sharply<\/span>, and they went outside.",
              "zh": "然后他们排着队走回农场棚舍，在农庄住宅的门外默默地停了下来。那儿也是他们的，可他们不敢进去。不过过了一会儿，雪球和拿破仑用肩膀把门撞开了，动物们排成单行走了进去，极度小心，生怕弄乱了什么东西。他们踮着脚尖从一个房间走到另一个房间，大气不敢出，怀着一种敬畏，看着屋子里那些难以置信的奢侈品，看着铺着羽毛褥垫的床、穿衣镜、马毛沙发、布鲁塞尔地毯、客厅壁炉架上方的维多利亚女王石版画像。他们正下楼时发现莫丽不见了。折回去一看，她竟然留在最漂亮的那间卧室里没出来。她从琼斯太太的梳妆台上拿了一条蓝色缎带，贴在肩头照着镜子，那模样蠢极了。别的动物狠狠斥责了她一顿，然后一同走出屋去。",
              "simpEn": "Then they walked in a line back to the farm buildings and stopped silently outside the door of the farmhouse. That was theirs too, but they were scared to go in. After a moment, however, Snowball and Napoleon pushed the door open with their shoulders, and the animals went in one behind the other, walking very carefully so as not to move anything out of place. They walked on their toes from room to room, afraid to talk louder than a whisper, and stared with wonder at the unbelievable richness — the beds with soft feather-filled mattresses, the mirrors, the sofa made of horse hair, the fancy carpet, the printed picture of Queen Victoria over the fireplace. They were just coming down the stairs when someone noticed Mollie was missing. Going back, they found she had stayed behind in the best bedroom. She had taken a piece of blue ribbon from Mrs. Jones's table and was holding it near her shoulder, admiring herself in the mirror in a very silly way. The others scolded her angrily, and they all went outside.",
              "simpZh": "然后他们排着队走回农场房子，在住宅门外一声不响地停住了。那房子也是他们的，但他们不敢进去。过了一会，雪球和拿破仑用肩膀把门顶开，动物们一个跟着一个进去，走得特别小心，生怕碰乱什么东西。他们踮着脚从一个房间走到另一个房间，不敢大声说话，满心敬畏地看着那些想都想不到的豪华东西——铺着羽毛床垫的床、镜子、马毛沙发、布鲁塞尔地毯、壁炉上方维多利亚女王的大画像。他们正下楼时发现莫丽不见了。回去找，发现她一直待在最好的卧室里。她从琼斯太太的梳妆台上拿了条蓝缎带，贴在肩上照镜子，样子傻透了。别的动物狠狠骂了她，然后都出去了。"

              "en": "The animals had their breakfast, and then Snowball and Napoleon called them together again.<br>“Comrades,” said Snowball, “it is half-past six and we have a long day before us. Today we begin the <span class=\"vocab-trigger\" data-vocab=\"hay harvest\">hay harvest<\/span>. But there is another <span class=\"vocab-trigger\" data-vocab=\"matter that must be attended to first\">matter that must be attended to first<\/span>.”",

              "simpZh": "动物们吃了早饭，雪球和拿破仑又把他们叫到一起。“朋友们，”雪球说，“现在六点半，今天一天很长。今天开始收干草。可还有一件事得先处理。”"

              "en": "The pigs now <span class=\"vocab-trigger\" data-vocab=\"revealed\">revealed<\/span> that during the past three months they had <span class=\"vocab-trigger\" data-vocab=\"taught themselves to read and write\">taught themselves to read and write<\/span> from an old <span class=\"vocab-trigger\" data-vocab=\"spelling book\">spelling book<\/span> which had belonged to Mr. Jones's children and which had been <span class=\"vocab-trigger\" data-vocab=\"thrown on the rubbish heap\">thrown on the rubbish heap<\/span>. Napoleon <span class=\"vocab-trigger\" data-vocab=\"sent for pots of black and white paint\">sent for pots of black and white paint<\/span> and led the way down to the <span class=\"vocab-trigger\" data-vocab=\"five-barred gate\">five-barred gate<\/span> that <span class=\"vocab-trigger\" data-vocab=\"gave on to the main road\">gave on to the main road<\/span>. Then Snowball (for it was Snowball who was best at writing) took a brush between the two <span class=\"vocab-trigger\" data-vocab=\"knuckles\">knuckles<\/span> of his <span class=\"vocab-trigger\" data-vocab=\"trotter\">trotter<\/span>, <span class=\"vocab-trigger\" data-vocab=\"painted out\">painted out<\/span> MANOR FARM from the top bar of the gate and in its place painted ANIMAL FARM. This was to be the name of the farm <span class=\"vocab-trigger\" data-vocab=\"from now onwards\">from now onwards<\/span>.",
              "zh": "猪这时才透露，在过去三个月里，他们靠着琼斯先生孩子的一本旧拼字课本教会了自己读写，那本书原来是被扔在垃圾堆上的。拿破仑吩咐拿几罐黑白油漆来，带头走到通向大路的那扇五道横木的大门跟前。然后雪球（因为雪球字写得最好）用蹄子的两个关节夹住刷子，把门顶那条横木上的“庄园农场”涂掉，改成了“动物农场”。从此以后，这就是农场的名字。",
              "simpEn": "The pigs now told everyone that during the past three months they had learned to read and write using an old spelling book that had belonged to Mr. Jones's children and had been thrown on the trash pile. Napoleon asked for pots of black and white paint and led the way to the five-barred gate that opened onto the main road. Then Snowball, who was best at writing, held a brush between the two knobs of his pig foot, painted over the words MANOR FARM on the top bar, and painted ANIMAL FARM instead. This was to be the farm's name from that time on.",
              "simpZh": "猪现在告诉大家，在过去三个月里，他们用一本琼斯先生孩子的旧拼字书自己学会了读写，那本书是扔在垃圾堆上的。拿破仑叫人拿来几罐黑白漆，带头走到通向大路那扇五道杠门前。然后字写得最好的雪球，用猪蹄的两块关节夹住刷子，把门顶上的“庄园农场”涂掉，写上了“动物农场”。从今以后这就是农场的名字。"

              "en": "After this they went back to the farm buildings, where Snowball and Napoleon sent for a <span class=\"vocab-trigger\" data-vocab=\"ladder\">ladder<\/span> which they caused to be set against the end wall of the big barn. They explained that by their studies of the past three months the pigs had succeeded in <span class=\"vocab-trigger\" data-vocab=\"reducing the principles of Animalism\">reducing the principles of Animalism<\/span> to <span class=\"vocab-trigger\" data-vocab=\"Seven Commandments\">Seven Commandments<\/span>. These Seven Commandments would now be <span class=\"vocab-trigger\" data-vocab=\"inscribed on the wall\">inscribed on the wall<\/span>; they would form an <span class=\"vocab-trigger\" data-vocab=\"unalterable law\">unalterable law<\/span> by which all the animals on Animal Farm must live for ever after. With some difficulty (for it is not easy for a pig to balance himself on a ladder) Snowball climbed up and <span class=\"vocab-trigger\" data-vocab=\"set to work\">set to work<\/span>, with Squealer a few rungs below him holding the paint-pot. The Commandments were written on the <span class=\"vocab-trigger\" data-vocab=\"tarred wall\">tarred wall<\/span> in great white letters that could be read thirty yards away. They ran thus:<br><br>THE SEVEN COMMANDMENTS<br>1. Whatever goes upon two legs is an enemy.<br>2. Whatever goes upon four legs, or has wings, is a friend.<br>3. No animal shall wear clothes.<br>4. No animal shall sleep in a bed.<br>5. No animal shall drink alcohol.<br>6. No animal shall kill any other animal.<br>7. All animals are equal.",
              "zh": "随后他们走回棚舍，雪球和拿破仑吩咐人拿一架梯子来，把它靠在大谷仓的尽头墙上。他们解释说，通过这三个月的学习，猪已经成功地把动物主义的原理简化成了七条诫律。这七条诫律现在就要题写在墙上；它们将成为不可更改的法典，动物农场所有的动物从此以后必须永远遵照生活。雪球费了点儿劲（因为猪在梯子上保持平衡并不容易）爬了上去，动手干起来，尖啸者在他下面几级的梯级上提着油漆罐。诫律是用斗大的白字写在刷过柏油的墙上的，三十码外都能看得见。内容如下：<br><br>七 诫<br>1. 凡两条腿走路的都是敌人。<br>2. 凡四条腿走路，或者长翅膀的，都是朋友。<br>3. 任何动物不得穿衣服。<br>4. 任何动物不得睡床铺。<br>5. 任何动物不得喝酒。<br>6. 任何动物不得杀害别的动物。<br>7. 所有动物一律平等。",
              "simpEn": "After that they returned to the farm buildings, where Snowball and Napoleon asked for a ladder to be placed against the end wall of the big barn. They explained that through their studies the pigs had managed to reduce the main ideas of Animalism into Seven Commandments. These Seven Commandments would now be written on the wall; they would be a never-changing law that all animals on Animal Farm must follow forever. With some trouble — it's not easy for a pig to stay balanced on a ladder — Snowball climbed up and began the work, with Squealer a few steps below him holding the paint can. The Commandments were written on the black, tar-covered wall in large white letters that could be seen from far away. They said: THE SEVEN COMMANDMENTS<br>1. Whatever walks on two legs is an enemy.<br>2. Whatever walks on four legs, or has wings, is a friend.<br>3. No animal shall wear clothes.<br>4. No animal shall sleep in a bed.<br>5. No animal shall drink alcohol.<br>6. No animal shall kill any other animal.<br>7. All animals are equal.",
              "simpZh": "然后他们回到农场房子，雪球和拿破仑叫人搬来一架梯子，靠在大谷仓的尽头墙上。他们解释说，通过这几个月的学习，猪已经能把动物主义的道理简化成七条戒律。这七条戒律现在要写在墙上，成为不可改变的法律，动物农场所有动物都必须永远遵守。雪球费了点劲——猪在梯子上站稳不容易——爬上去开始干，尖啸者在他下面几格拎着漆罐。戒律用大白字写在涂了柏油的黑墙上，很远都能看见。写的是：七戒<br>1. 两条腿走路的都是敌人。<br>2. 四条腿走路或有翅膀的都是朋友。<br>3. 动物不许穿衣服。<br>4. 动物不许睡床。<br>5. 动物不许喝酒。<br>6. 动物不许杀害别的动物。<br>7. 所有动物一律平等。"

            {
              "en": "“Now, comrades,” cried Snowball, throwing down the paint-brush, “to the hayfield! Let us make it a <span class=\"vocab-trigger\" data-vocab=\"point of honour\">point of honour<\/span> to <span class=\"vocab-trigger\" data-vocab=\"get in the harvest\">get in the harvest<\/span> more quickly than Jones and his men could do.”<br>But at this moment the three cows, who had seemed uneasy for some time past, <span class=\"vocab-trigger\" data-vocab=\"set up a loud lowing\">set up a loud lowing<\/span>. They had not been milked for twenty-four hours, and their <span class=\"vocab-trigger\" data-vocab=\"udders\">udders<\/span> were almost bursting. After a little thought, the pigs sent for <span class=\"vocab-trigger\" data-vocab=\"buckets\">buckets<\/span> and milked the cows fairly successfully, their <span class=\"vocab-trigger\" data-vocab=\"trotters\">trotters<\/span> being <span class=\"vocab-trigger\" data-vocab=\"well adapted to this task\">well adapted to this task<\/span>. Soon there were five buckets of <span class=\"vocab-trigger\" data-vocab=\"frothing creamy milk\">frothing creamy milk<\/span> at which many of the animals looked with <span class=\"vocab-trigger\" data-vocab=\"considerable interest\">considerable interest<\/span>.",
              "zh": "“好了，同志们，”雪球把刷子往地上一扔，喊道，“到草场上去！咱们争口气，收割要比琼斯和他手下那帮人干得更快！”<br>正在这时，刚才一直显得不大对劲的三头母牛大声哞哞叫了起来。它们已经有二十四小时没挤奶了，乳房快要胀破了。猪想了想，叫人拿桶来，用蹄子挤奶，干得还挺成功，因为它们的前蹄天生很适合这个活儿。很快就挤了五桶翻着白沫的乳白色牛奶，许多动物都相当感兴趣地看着。",
              "simpEn": "'Now, friends,' cried Snowball, throwing down the paintbrush, 'to the hay field! Let's make it a matter of pride to bring in the harvest faster than Jones and his men ever did.' But right then the three cows, who had looked uncomfortable for a while, began to make loud mooing sounds. They hadn't been milked for a full day, and their milk-filled bags were almost ready to burst. After thinking a bit, the pigs ordered buckets and milked the cows quite well, as their pig feet were naturally suited for the job. Soon there were five buckets of bubbling, creamy milk, which many animals looked at with a lot of interest.",
              "simpZh": "“好了，朋友们，”雪球扔掉刷子大声说，“到干草场去！我们要争气，收割得比琼斯他们更快！”可这时那三头母牛，已经不安了一阵子，大声哞哞叫起来。它们二十四个小时没挤奶了，乳房都快胀破了。猪想了想，叫人拿来水桶，自己挤奶，干得还不错，因为它们的蹄子正好适合这活儿。很快就有了五桶冒白泡的稠牛奶，好多动物都挺有兴趣地看着。"
            },
            {
              "en": "“What is going to happen to all that milk?” said someone.<br>“Jones used sometimes to mix some of it in our <span class=\"vocab-trigger\" data-vocab=\"mash\">mash<\/span>,” said one of the hens.<br>“<span class=\"vocab-trigger\" data-vocab=\"Never mind the milk\">Never mind the milk<\/span>, comrades!” cried Napoleon, placing himself in front of the buckets. “<span class=\"vocab-trigger\" data-vocab=\"That will be attended to\">That will be attended to<\/span>. The harvest is more important. Comrade Snowball will lead the way. I shall follow in a few minutes. Forward, comrades! The hay is waiting.”<br>So the animals <span class=\"vocab-trigger\" data-vocab=\"trooped down\">trooped down<\/span> to the hayfield to begin the harvest, and when they came back in the evening it was noticed that the milk had disappeared.",
              "zh": "“那些牛奶会怎么处理？”有个动物问。<br>“琼斯有时候会把一点点兑在我们的糊饲料里。”一只母鸡说。<br>“别管牛奶，同志们！”拿破仑站到奶桶前面大声说，“那个会处理好的。收割更要紧。雪球同志带路。我过几分钟就跟上来。前进，同志们！干草在等着呢。”<br>于是动物们成群结队到草场上去收割了，等他们傍晚回来时，大家注意到牛奶已经不见了。",
              "simpEn": "'What's going to happen to all that milk?' someone asked. 'Jones used to mix some of it into our feed sometimes,' said one hen. 'Don't worry about the milk, friends!' cried Napoleon, standing in front of the buckets. 'That will be taken care of. The harvest is more important. Comrade Snowball will lead. I'll follow in a few minutes. Forward, friends! The hay is waiting.' So the animals went together to the hay field to start the harvest, and when they returned in the evening, it was noticed that the milk had disappeared.",
              "simpZh": "“这些牛奶会怎样？”有动物问。“琼斯以前有时候会掺一些到我们的糊糊里。”一只母鸡说。“别管牛奶，朋友们！”拿破仑站在桶前大声说，“那个会处理的。收割更要紧。雪球同志带头，我过几分钟跟上。前进，朋友们！干草等着呢。”于是动物们一起到干草场开始收割，等傍晚回来时，发现牛奶不见了。"

          "heading": "The Harvest — A Triumph of Labour",
          "paragraphs": [
            {
              "en": "How they <span class=\"vocab-trigger\" data-vocab=\"toiled and sweated\">toiled and sweated<\/span> to get the hay in! But their efforts were <span class=\"vocab-trigger\" data-vocab=\"rewarded\">rewarded<\/span>, for the harvest was an even bigger success than they had hoped.",
              "zh": "他们流了多少汗、出了多少力，才把干草收了进来！但他们的努力得到了回报，因为收成比他们原先期望的还要好。",
              "simpEn": "They worked very hard and sweated a lot to bring in the hay, but their hard work paid off — the harvest was even bigger than they had hoped for.",
              "simpZh": "他们拼命干活、流了很多汗才把干草收进来，可努力没白费，收成比他们想的还要好。"
