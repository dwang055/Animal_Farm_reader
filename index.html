            {
              "en": "Sometimes the work was hard; the <span class=\"vocab-trigger\" data-vocab=\"implements\">implements<\/span> had been designed for human beings and not for animals, and it was a great <span class=\"vocab-trigger\" data-vocab=\"drawback\">drawback<\/span> that no animal was able to use any tool that involved standing on his hind legs. But the pigs were so clever that they could think of a way round every difficulty. As for the horses, they knew every inch of the field, and in fact understood the business of <span class=\"vocab-trigger\" data-vocab=\"mowing and raking\">mowing and raking<\/span> far better than Jones and his men had ever done. The pigs did not actually work, but directed and <span class=\"vocab-trigger\" data-vocab=\"supervised\">supervised<\/span> the others. With their <span class=\"vocab-trigger\" data-vocab=\"superior knowledge\">superior knowledge<\/span> it was natural that they should <span class=\"vocab-trigger\" data-vocab=\"assume the leadership\">assume the leadership<\/span>.",
              "zh": "有时活儿很重；农具是为人而不是为动物设计的，而且没有一个动物能用那些需要后腿站立才能使用的工具，这是一个极大的缺陷。但猪非常聪明，总能想出办法绕过每一道难关。至于那些马，他们对田里的每一寸土地都了如指掌，实际上对割草和耙草这套活计比琼斯和他手下那帮人懂行得多。猪并不实际动手干活，而是指挥和监督别的动物。凭着自己更胜一筹的学识，他们理所当然地承担起领导的责任。",
              "simpEn": "Sometimes the work was tough. The tools were made for humans, not animals. It was a big problem that no animal could use tools that needed standing on back legs. But the pigs were so smart they found ways around every difficulty. The horses knew the fields perfectly and understood cutting and gathering hay better than Jones's men ever did. The pigs didn't work physically; they guided and watched over the others. Because they knew more, it was natural for them to become the leaders.",
              "simpZh": "有时活儿很苦。工具是给人用的，不是给动物的。很大的问题是，动物没法用那些要后腿站着才能用的家伙。可猪很聪明，总有办法解决难题。马对田地一清二楚，割草耙草比琼斯那帮人强得多。猪不真正干活，只指挥监督。他们懂得多，自然就当上了领导。"
            },
            {
              "en": "Boxer and Clover would <span class=\"vocab-trigger\" data-vocab=\"harness themselves\">harness themselves<\/span> to the <span class=\"vocab-trigger\" data-vocab=\"cutter or the horse-rake\">cutter or the horse-rake<\/span> (no <span class=\"vocab-trigger\" data-vocab=\"bits or reins\">bits or reins<\/span> were needed in these days, of course) and <span class=\"vocab-trigger\" data-vocab=\"tramp steadily\">tramp steadily<\/span> round and round the field with a pig walking behind and calling out “<span class=\"vocab-trigger\" data-vocab=\"Gee up, comrade\">Gee up, comrade<\/span>!” or “<span class=\"vocab-trigger\" data-vocab=\"Whoa back, comrade\">Whoa back, comrade<\/span>!” as the case might be. And every animal down to the <span class=\"vocab-trigger\" data-vocab=\"humblest\">humblest<\/span> worked at turning the hay and gathering it. Even the ducks and hens toiled to and fro all day in the sun, carrying tiny <span class=\"vocab-trigger\" data-vocab=\"wisps\">wisps<\/span> of hay in their beaks. In the end they finished the harvest in two days’ less time than it had usually taken Jones and his men. Moreover, it was the biggest harvest that the farm had ever seen. There was no <span class=\"vocab-trigger\" data-vocab=\"wastage\">wastage<\/span> whatever; the hens and ducks with their sharp eyes had gathered up the very last stalk. And not an animal on the farm had stolen so much as a mouthful.",
              "zh": "拳击手和苜蓿会自己套上割草机或马拉耙（当然，如今不再需要嚼子和缰绳了），稳稳健健地绕着田地兜圈子，一只猪跟在后面，根据需要喊着“驾，同志！”或“吁，同志！”。每一只动物，直到最卑微的，都参与了翻晒干草和收集草料的工作。连鸭子和母鸡也整天顶着太阳来回奔忙，用嘴衔着一小绺一小绺的干草。最后，他们完成收割所用的时间比琼斯和他手下平时用的少了整整两天。再说，这也是农场从未有过的大丰收。一丁点儿浪费都没有；母鸡和鸭子眼光敏锐，把最后一根草秆都捡了起来。农场里没有一只动物偷过哪怕一口粮食。",
              "simpEn": "Boxer and Clover would put the straps on themselves and pull the cutting or raking machine. No mouthpieces or leather straps were needed anymore. They walked steadily around the field while a pig behind called out 'Go, friend!' or 'Stop, friend!' Every animal, even the smallest, helped turn and gather the hay. Ducks and hens worked all day in the sun, carrying tiny bits of hay in their beaks. They finished the harvest two days faster than Jones's men ever did. And it was the biggest harvest the farm had ever seen. Nothing was wasted; the hens and ducks with their sharp eyes found every last piece. Not one animal stole even a bite.",
              "simpZh": "拳击手和苜蓿自己套上割草或耙草的家伙往前拉。后面一只猪喊着“走，伙计！”或“停，伙计！”他们稳稳地绕着圈。每个动物，就算最不起眼的，都帮着翻晒和收集干草。鸭子和母鸡也在太阳下跑一整天，嘴巴衔着一点点草。他们比琼斯那帮人少花两天就收完了，还是农场有史以来最大的收成。一点都没糟蹋，母鸡和鸭子眼睛尖，连最后一根秆都拣起来了。农场里没一只动物偷过一口吃的。"

        {
          "sectionId": 2,
          "heading": "A Summer of Happiness and Boxer’s Motto",
          "paragraphs": [
            {
              "en": "All through that summer the work of the farm went like <span class=\"vocab-trigger\" data-vocab=\"clockwork\">clockwork<\/span>. The animals were happy as they had never <span class=\"vocab-trigger\" data-vocab=\"conceived it possible\">conceived it possible<\/span> to be. Every mouthful of food was an <span class=\"vocab-trigger\" data-vocab=\"acute positive pleasure\">acute positive pleasure<\/span>, now that it was truly their own food, produced by themselves and for themselves, not <span class=\"vocab-trigger\" data-vocab=\"doled out\">doled out<\/span> to them by a <span class=\"vocab-trigger\" data-vocab=\"grudging master\">grudging master<\/span>. With the worthless <span class=\"vocab-trigger\" data-vocab=\"parasitical human beings\">parasitical human beings<\/span> gone, there was more for everyone to eat. There was more <span class=\"vocab-trigger\" data-vocab=\"leisure\">leisure<\/span> too, inexperienced though the animals were. They met with many difficulties — for instance, later in the year, when they harvested the corn, they had to <span class=\"vocab-trigger\" data-vocab=\"tread it out\">tread it out<\/span> in the ancient style and blow away the <span class=\"vocab-trigger\" data-vocab=\"chaff\">chaff<\/span> with their breath, since the farm possessed no <span class=\"vocab-trigger\" data-vocab=\"threshing machine\">threshing machine<\/span> — but the pigs with their cleverness and Boxer with his <span class=\"vocab-trigger\" data-vocab=\"tremendous muscles\">tremendous muscles<\/span> always <span class=\"vocab-trigger\" data-vocab=\"pulled them through\">pulled them through<\/span>.",
              "zh": "整整一个夏天，农场的工作运转得有如钟表。动物们幸福极了，这幸福他们以前连想都不敢想。每一口食物都是一种实实在在的赏心乐事，如今那真正是他们自己的食物，由他们自己生产，为自己而生产，而不是由一个吝啬的主人施舍给他们的。那些毫无用处的寄生物——人类——滚蛋之后，大家能吃的东西更多了。尽管动物们缺乏经验，闲暇时间也变多了。他们遇到了不少难题——比如，到了那年晚些时候收玉米时，由于农场没有脱粒机，他们只能用古老的办法把玉米踩出来，再用嘴把壳吹掉——但是凭着猪的聪明和拳击手那身了不起的肌肉，他们总能渡过难关。",
              "simpEn": "That whole summer the farm work ran smoothly and perfectly. The animals were happier than they had ever thought possible. Every bite of food was a deep, sharp joy because it was truly their own, made by them and for them, not handed out by a mean owner. With the useless, sponge-like humans gone, there was more for everyone to eat. There was also more free time, even though the animals lacked experience. They faced many problems — for example, when they gathered the grain later, they had to walk on it to separate the seeds and then blow away the light seed covers, because the farm had no machine for that — but the pigs' cleverness and Boxer's great strength always got them through.",
              "simpZh": "一整个夏天农场活儿都顺顺当当。动物们幸福得想都没想过。每口吃的都格外香，因为那是他们自己的，自己产的、为自己，不是小气的主人赏的。没用的寄生虫人类走了，大家能吃的更多了。空闲也多了，虽然动物没经验。他们碰到好多难处——比如后来收玉米，没有脱粒机，只好用老法子踩出来，再用嘴把壳子吹掉——可猪的聪明加上拳击手的大力气总能帮他们挺过去。"

              "en": "But everyone worked according to his <span class=\"vocab-trigger\" data-vocab=\"capacity\">capacity<\/span>. The hens and ducks, for instance, saved five <span class=\"vocab-trigger\" data-vocab=\"bushels\">bushels<\/span> of corn at the harvest by gathering up the <span class=\"vocab-trigger\" data-vocab=\"stray grains\">stray grains<\/span>. Nobody stole, nobody <span class=\"vocab-trigger\" data-vocab=\"grumbled over his rations\">grumbled over his rations<\/span>, the <span class=\"vocab-trigger\" data-vocab=\"quarrelling and biting and jealousy\">quarrelling and biting and jealousy<\/span> which had been normal features of life in the old days had almost disappeared. Nobody <span class=\"vocab-trigger\" data-vocab=\"shirked\">shirked<\/span> — or almost nobody. Mollie, it was true, was not good at getting up in the mornings, and had a way of leaving work early <span class=\"vocab-trigger\" data-vocab=\"on the ground that there was a stone in her hoof\">on the ground that there was a stone in her hoof<\/span>. And the behaviour of the cat was somewhat <span class=\"vocab-trigger\" data-vocab=\"peculiar\">peculiar<\/span>. It was soon noticed that when there was work to be done the cat could never be found. She would <span class=\"vocab-trigger\" data-vocab=\"vanish for hours on end\">vanish for hours on end<\/span>, and then reappear at meal-times, or in the evening after work was over, as though nothing had happened. But she always made such <span class=\"vocab-trigger\" data-vocab=\"excellent excuses\">excellent excuses<\/span>, and <span class=\"vocab-trigger\" data-vocab=\"purred affectionately\">purred affectionately<\/span>, that it was impossible not to believe in her <span class=\"vocab-trigger\" data-vocab=\"good intentions\">good intentions<\/span>.",

              "en": "Old Benjamin, the donkey, seemed quite unchanged since the Rebellion. He did his work in the same slow <span class=\"vocab-trigger\" data-vocab=\"obstinate way\">obstinate way<\/span> as he had done it in Jones's time, never shirking and never <span class=\"vocab-trigger\" data-vocab=\"volunteering for extra work\">volunteering for extra work<\/span> either. About the Rebellion and its results he would <span class=\"vocab-trigger\" data-vocab=\"express no opinion\">express no opinion<\/span>. When asked whether he was not happier now that Jones was gone, he would say only “Donkeys live a long time. None of you has ever seen a dead donkey,” and the others had to be content with this <span class=\"vocab-trigger\" data-vocab=\"cryptic answer\">cryptic answer<\/span>.",

            {
              "en": "On Sundays there was no work. Breakfast was an hour later than usual, and after breakfast there was a <span class=\"vocab-trigger\" data-vocab=\"ceremony\">ceremony<\/span> which was <span class=\"vocab-trigger\" data-vocab=\"observed every week without fail\">observed every week without fail<\/span>. First came the <span class=\"vocab-trigger\" data-vocab=\"hoisting of the flag\">hoisting of the flag<\/span>. Snowball had found in the <span class=\"vocab-trigger\" data-vocab=\"harness-room\">harness-room<\/span> an old green <span class=\"vocab-trigger\" data-vocab=\"tablecloth\">tablecloth<\/span> of Mrs. Jones's and had painted on it a hoof and a horn in white. This was <span class=\"vocab-trigger\" data-vocab=\"run up the flagstaff\">run up the flagstaff<\/span> in the farmhouse garden every Sunday morning. The flag was green, Snowball explained, to represent the green fields of England, while the hoof and horn <span class=\"vocab-trigger\" data-vocab=\"signified\">signified<\/span> the future <span class=\"vocab-trigger\" data-vocab=\"Republic of the Animals\">Republic of the Animals<\/span> which would arise when the human race had been finally <span class=\"vocab-trigger\" data-vocab=\"overthrown\">overthrown<\/span>.",

              "simpEn": "On Sundays there was no work. Breakfast was an hour later than usual, and after breakfast there was a ceremony that happened every week without exception. First the flag was raised. Snowball had found an old green tablecloth of Mrs. Jones's in the equipment room and painted a white hoof and horn on it. This was pulled up the flagpole in the farmhouse garden every Sunday morning. The green stood for the fields of England, Snowball said, and the hoof and horn represented the future Animal Republic that would come when humans were completely defeated.",
              "simpZh": "星期天不干活。早饭比平时晚一个钟头，吃完早饭有一个每周必办的仪式。先是升旗。雪球在挽具房找了琼斯太太一块旧绿桌布，上面画了白蹄子和白角。每个星期天早上就在住宅花园的旗杆上升起来。雪球说，绿色代表英格兰的田野，蹄子和角代表将来人类被打倒后成立的动物共和国。"

            {
              "en": "After the hoisting of the flag all the animals <span class=\"vocab-trigger\" data-vocab=\"trooped into\">trooped into<\/span> the big barn for a <span class=\"vocab-trigger\" data-vocab=\"general assembly\">general assembly<\/span> which was known as <span class=\"vocab-trigger\" data-vocab=\"the Meeting\">the Meeting<\/span>. Here the work of the coming week was planned out and <span class=\"vocab-trigger\" data-vocab=\"resolutions were put forward and debated\">resolutions were put forward and debated<\/span>. It was always the pigs who put forward the resolutions. The other animals understood how to vote, but could never think of any resolutions of their own. Snowball and Napoleon were by far the most active in the debates. But it was noticed that these two were never in agreement: whatever suggestion either of them made, the other could be <span class=\"vocab-trigger\" data-vocab=\"counted on to oppose it\">counted on to oppose it<\/span>. Even when it was resolved — a thing no one could <span class=\"vocab-trigger\" data-vocab=\"object to in itself\">object to in itself<\/span> — to set aside the small <span class=\"vocab-trigger\" data-vocab=\"paddock\">paddock<\/span> behind the orchard as a home of rest for animals who were past work, there was a <span class=\"vocab-trigger\" data-vocab=\"stormy debate\">stormy debate<\/span> over the correct retiring age for each class of animal. The Meeting always ended with the singing of ‘<span class=\"vocab-trigger\" data-vocab=\"Beasts of England\">Beasts of England<\/span>’, and the afternoon was given up to <span class=\"vocab-trigger\" data-vocab=\"recreation\">recreation<\/span>.",
              "zh": "升旗之后，所有动物排着队走进大谷仓，参加一个称为“大会议”的全体大会。会上要安排未来一周的工作，提出并讨论决议。提出决议的总是猪。别的动物懂得怎样投票，但从来也想不出他们自己的什么决议。雪球和拿破仑是会上辩论最活跃的两个。可是大家注意到，他们两个从来没有一致过：不管哪一个提了什么建议，另一个肯定会反对。即便是议决——这件事本身谁也不会反对——把果园后面那块小围场留出来，作为年老退休动物的养老所，也为了每一类动物的恰当退休年龄而激烈辩论了一场。大会议总是以唱《英格兰兽》结束，下午的时间则留作娱乐。",

              "en": "The pigs had set aside the <span class=\"vocab-trigger\" data-vocab=\"harness-room\">harness-room<\/span> as a <span class=\"vocab-trigger\" data-vocab=\"headquarters\">headquarters<\/span> for themselves. Here, in the evenings, they studied <span class=\"vocab-trigger\" data-vocab=\"blacksmithing\">blacksmithing<\/span>, <span class=\"vocab-trigger\" data-vocab=\"carpentering\">carpentering<\/span>, and other <span class=\"vocab-trigger\" data-vocab=\"necessary arts\">necessary arts<\/span> from books which they had brought out of the farmhouse. Snowball also busied himself with organising the other animals into what he called <span class=\"vocab-trigger\" data-vocab=\"Animal Committees\">Animal Committees<\/span>. He was <span class=\"vocab-trigger\" data-vocab=\"indefatigable\">indefatigable<\/span> at this. He formed the Egg Production Committee for the hens, the Clean Tails League for the cows, the Wild Comrades’ Re-education Committee (the object of this was to tame the rats and rabbits), the Whiter Wool Movement for the sheep, and various others, besides <span class=\"vocab-trigger\" data-vocab=\"instituting classes in reading and writing\">instituting classes in reading and writing<\/span>. On the whole, these projects were a failure. The attempt to tame the wild creatures, for instance, broke down almost immediately. They continued to behave very much as before, and when treated with generosity, simply <span class=\"vocab-trigger\" data-vocab=\"took advantage of it\">took advantage of it<\/span>. The cat joined the Re-education Committee and was very active in it for some days. She was seen one day sitting on a roof and talking to some <span class=\"vocab-trigger\" data-vocab=\"sparrows\">sparrows<\/span> who were just out of her reach. She was telling them that all animals were now comrades and that any sparrow who chose could come and <span class=\"vocab-trigger\" data-vocab=\"perch on her paw\">perch on her paw<\/span>; but the sparrows <span class=\"vocab-trigger\" data-vocab=\"kept their distance\">kept their distance<\/span>.",
              "zh": "猪把挽具房留出来，做了他们自己的总部。晚上，他们就在这里研习从农庄住宅里拿来的书本，学习打铁、木工和其他必需的技艺。雪球还忙活着把别的动物组织起来，搞了许多他所谓的“动物委员会”。他干这个真是孜孜不倦。他为母鸡组织了“产蛋委员会”，为母牛组织了“洁净尾巴联盟”，还成立了“野生动物再教育委员会”（目的是驯化老鼠和兔子），为绵羊组织了“更白羊毛运动”，此外还办了各种读书写字班。总的来看，这些计划都失败了。比如说，驯化野生动物的尝试几乎立刻就垮了台。它们的行为大致还是老样子，而且一旦受到善待，就只会趁机占便宜。猫也加入了再教育委员会，头几天还相当积极。有一天大家看见她坐在屋顶上，跟几只恰好够不着的麻雀说话。她对它们说，如今所有动物都是同志了，任何一只麻雀，只要愿意，都可以飞到她的爪子上去；可是麻雀们始终和她保持着距离。",
              "simpEn": "The pigs kept the equipment room as their own base. In the evenings they studied metalworking, woodworking, and other needed skills from books taken from the farmhouse. Snowball also worked on organizing the other animals into what he called Animal Committees. He never tired of this. He made an Egg Production Committee for the hens, a Clean Tails League for the cows, a Wild Comrades' Re-education Committee to tame rats and rabbits, a Whiter Wool Movement for the sheep, and many others, plus setting up reading and writing classes. Overall, these plans failed. The effort to tame wild animals, for example, fell apart almost at once. They acted much as before and, when treated kindly, simply used it for their own benefit. The cat joined the Re-education Committee and was very busy at it for a few days. One day she was seen on a roof talking to sparrows just beyond her reach. She told them all animals were now friends and any sparrow could come and sit on her foot; but the sparrows stayed well away.",

              "en": "As for the pigs, they could already read and write perfectly. The dogs learned to read fairly well, but were not interested in reading anything except the Seven Commandments. Muriel, the goat, could read somewhat better than the dogs, and sometimes used to read to the others in the evenings from <span class=\"vocab-trigger\" data-vocab=\"scraps of newspaper\">scraps of newspaper<\/span> which she found on the <span class=\"vocab-trigger\" data-vocab=\"rubbish heap\">rubbish heap<\/span>. Benjamin could read as well as any pig, but never <span class=\"vocab-trigger\" data-vocab=\"exercised his faculty\">exercised his faculty<\/span>. So far as he knew, he said, there was nothing worth reading. Clover learnt the whole alphabet, but could not put words together. Boxer could not get beyond the letter D. He would <span class=\"vocab-trigger\" data-vocab=\"trace out\">trace out<\/span> A, B, C, D, in the dust with his great hoof, and then would stand staring at the letters with his ears back, sometimes shaking his <span class=\"vocab-trigger\" data-vocab=\"forelock\">forelock<\/span>, trying with all his might to remember what came next and never succeeding. On several occasions, indeed, he did learn E, F, G, H, but by the time he knew them, it was always discovered that he had forgotten A, B, C, and D. Finally he decided to be content with the first four letters, and used to write them out once or twice every day to <span class=\"vocab-trigger\" data-vocab=\"refresh his memory\">refresh his memory<\/span>. Mollie refused to learn any but the six letters which spelt her own name. She would form these very neatly out of pieces of <span class=\"vocab-trigger\" data-vocab=\"twig\">twig<\/span>, and would then decorate them with a flower or two and walk round them admiring them.",

              "en": "“Comrades!” he cried. “You do not imagine, I hope, that we pigs are doing this in a spirit of <span class=\"vocab-trigger\" data-vocab=\"selfishness and privilege\">selfishness and privilege<\/span>? Many of us actually dislike milk and apples. I dislike them myself. Our <span class=\"vocab-trigger\" data-vocab=\"sole object\">sole object<\/span> in taking these things is to <span class=\"vocab-trigger\" data-vocab=\"preserve our health\">preserve our health<\/span>. Milk and apples (this has been proved by Science, comrades) contain <span class=\"vocab-trigger\" data-vocab=\"substances\">substances<\/span> absolutely necessary to the <span class=\"vocab-trigger\" data-vocab=\"well-being\">well-being<\/span> of a pig. We pigs are <span class=\"vocab-trigger\" data-vocab=\"brainworkers\">brainworkers<\/span>. The whole <span class=\"vocab-trigger\" data-vocab=\"management and organisation\">management and organisation<\/span> of this farm depend on us. Day and night we are <span class=\"vocab-trigger\" data-vocab=\"watching over your welfare\">watching over your welfare<\/span>. It is for YOUR sake that we drink that milk and eat those apples. Do you know what would happen if we pigs <span class=\"vocab-trigger\" data-vocab=\"failed in our duty\">failed in our duty<\/span>? Jones would come back! Yes, Jones would come back! Surely, comrades,” cried Squealer almost <span class=\"vocab-trigger\" data-vocab=\"pleadingly\">pleadingly<\/span>, skipping from side to side and <span class=\"vocab-trigger\" data-vocab=\"whisking his tail\">whisking his tail<\/span>, “surely there is no one among you who wants to see Jones come back?”",

            {
              "en": "By the late summer the news of what had happened on Animal Farm had spread across half the county. Every day Snowball and Napoleon sent out <span class=\"vocab-trigger\" data-vocab=\"flights of pigeons\">flights of pigeons<\/span> whose instructions were to <span class=\"vocab-trigger\" data-vocab=\"mingle with\">mingle with<\/span> the animals on neighbouring farms, tell them the story of the Rebellion, and teach them the tune of ‘<span class=\"vocab-trigger\" data-vocab=\"Beasts of England\">Beasts of England<\/span>’.",
              "zh": "到了夏末，动物农场上发生的事情已经传遍了半个郡。雪球和拿破仑每天派出一批批鸽子，指令它们到邻近农场的动物当中去，混在一起，把造反的故事讲给他们听，并教他们唱《英格兰兽》的调子。",

            {
              "en": "Most of this time Mr. Jones had spent sitting in the <span class=\"vocab-trigger\" data-vocab=\"taproom\">taproom<\/span> of the Red Lion at Willingdon, complaining to anyone who would listen of the <span class=\"vocab-trigger\" data-vocab=\"monstrous injustice\">monstrous injustice<\/span> he had suffered in being turned out of his property by a <span class=\"vocab-trigger\" data-vocab=\"pack of good-for-nothing animals\">pack of good-for-nothing animals<\/span>. The other farmers <span class=\"vocab-trigger\" data-vocab=\"sympathised in principle\">sympathised in principle<\/span>, but they did not at first give him much help. <span class=\"vocab-trigger\" data-vocab=\"At heart\">At heart<\/span>, each of them was secretly wondering whether he could not somehow turn Jones's misfortune to his own advantage. It was lucky that the owners of the two farms which <span class=\"vocab-trigger\" data-vocab=\"adjoined\">adjoined<\/span> Animal Farm were on permanently bad terms.",
              "zh": "这段时间，琼斯先生大部分工夫都泡在威灵顿红狮酒馆的酒吧间里，跟任何一个愿意听的人诉苦，说他被一群废物畜生赶出了自己的产业，遭到了骇人听闻的不公正对待。别的农场主在原则上对他表示同情，可起初并没有给他太多帮助。他们心里都在暗自盘算，能不能设法利用琼斯的倒霉给自己捞点好处。碰巧的是，和动物农场毗邻的两个农场的主人一直关系很坏。",
              "simpEn": "Mr. Jones spent most of this time in the bar of the Red Lion pub, complaining to anyone who would listen about the terrible unfairness of being thrown off his own land by worthless animals. Other farmers felt sorry for him in theory, but didn't help much at first. Secretly, each wondered how he could turn Jones's bad luck to his own benefit. Luckily, the owners of the two farms next to Animal Farm were always on bad terms.",
              "simpZh": "琼斯先生多半时间泡在红狮酒馆里，跟愿意听的人抱怨，说他被废物畜生赶出家门，受了天大的冤屈。别的农场主嘴上同情，开始没太帮忙。心里都在想怎么借琼斯的倒霉自己得点好处。凑巧的是，挨着动物农场的两个农场主人关系一直很差。"

        {
          "sectionId": 2,
          "heading": "Rumours, Fear, and Rebelliousness Spread",
          "paragraphs": [
            {
              "en": "Nevertheless, they were both thoroughly frightened by the rebellion on Animal Farm, and very anxious to prevent their own animals from learning too much about it. At first they pretended to <span class=\"vocab-trigger\" data-vocab=\"laugh to scorn\">laugh to scorn<\/span> the idea of animals managing a farm for themselves. The whole thing would be over in a <span class=\"vocab-trigger\" data-vocab=\"fortnight\">fortnight<\/span>, they said. They <span class=\"vocab-trigger\" data-vocab=\"put it about\">put it about<\/span> that the animals on the Manor Farm (they insisted on calling it the Manor Farm; they would not <span class=\"vocab-trigger\" data-vocab=\"tolerate\">tolerate<\/span> the name “Animal Farm”) were <span class=\"vocab-trigger\" data-vocab=\"perpetually fighting among themselves\">perpetually fighting among themselves<\/span> and were also rapidly starving to death. When time passed and the animals had evidently not starved to death, Frederick and Pilkington <span class=\"vocab-trigger\" data-vocab=\"changed their tune\">changed their tune<\/span> and began to talk of the terrible wickedness that now <span class=\"vocab-trigger\" data-vocab=\"flourished\">flourished<\/span> on Animal Farm. It was given out that the animals there practised <span class=\"vocab-trigger\" data-vocab=\"cannibalism\">cannibalism<\/span>, tortured one another with <span class=\"vocab-trigger\" data-vocab=\"red-hot horseshoes\">red-hot horseshoes<\/span>, and had their females <span class=\"vocab-trigger\" data-vocab=\"in common\">in common<\/span>. This was what came of rebelling against the laws of Nature, Frederick and Pilkington said.",
              "zh": "尽管如此，他们俩都被动物农场的造反吓坏了，急着要防止自己的动物知道太多。起初他们假装嘲笑动物自己管理农场的想法。他们说，整个事情不出两个星期就会完蛋。他们散布说，庄园农场（他们坚持叫庄园农场，不肯容忍“动物农场”这个名字）的动物们不断地互相斗殴，而且马上就要饿死了。过了一段时间，那些动物显然没有饿死，弗雷德里克和皮尔金顿就换了调子，开始谈论如今在动物农场盛行起来的可怕的邪恶。据称，那里的动物同类相食，用烧红的马蹄铁彼此折磨，并且共妻。他们说，这就是反抗自然法则的下场。",
              "simpEn": "Still, both were deeply scared by the Animal Farm rebellion and wanted to stop their own animals learning about it. At first they acted as if the idea of animals running a farm was laughable. The whole thing would be done in two weeks, they said. They spread stories that the Manor Farm animals (they refused to say 'Animal Farm') were always fighting and quickly starving. When time passed and the animals clearly hadn't starved, they changed their story and talked about terrible evil now growing on Animal Farm. They claimed the animals ate each other, used hot metal shoes to cause pain, and shared females. This, they said, is what happens when you rebel against nature's laws.",
              "simpZh": "可两人都被动物农场吓坏了，急着不让自家动物知道太多。起先假装嘲笑动物自己管农场的想法。说这事两个礼拜就完。他们散布说庄园农场（他们死不改口叫动物农场）的动物们成天打架，快饿死了。过了一阵动物明明没饿死，两人就改口，说动物农场现在邪风盛行。声称那里动物吃动物，用烧红马蹄铁折磨彼此，还共妻。说这就是反抗自然律的下场。"
            },
            {
              "en": "However, these stories were never fully believed. <span class=\"vocab-trigger\" data-vocab=\"Rumours\">Rumours<\/span> of a wonderful farm, where the human beings had been turned out and the animals managed their own affairs, continued to <span class=\"vocab-trigger\" data-vocab=\"circulate\">circulate<\/span> in <span class=\"vocab-trigger\" data-vocab=\"vague and distorted forms\">vague and distorted forms<\/span>, and throughout that year a wave of <span class=\"vocab-trigger\" data-vocab=\"rebelliousness\">rebelliousness<\/span> ran through the countryside. Bulls which had always been <span class=\"vocab-trigger\" data-vocab=\"tractable\">tractable<\/span> suddenly turned <span class=\"vocab-trigger\" data-vocab=\"savage\">savage<\/span>, sheep broke down hedges and <span class=\"vocab-trigger\" data-vocab=\"devoured the clover\">devoured the clover<\/span>, cows <span class=\"vocab-trigger\" data-vocab=\"kicked the pail over\">kicked the pail over<\/span>, hunters <span class=\"vocab-trigger\" data-vocab=\"refused their fences\">refused their fences<\/span> and <span class=\"vocab-trigger\" data-vocab=\"shot their riders on to the other side\">shot their riders on to the other side<\/span>. Above all, the tune and even the words of ‘Beasts of England’ were known everywhere. It had spread with <span class=\"vocab-trigger\" data-vocab=\"astonishing speed\">astonishing speed<\/span>. The human beings could not <span class=\"vocab-trigger\" data-vocab=\"contain their rage\">contain their rage<\/span> when they heard this song, though they pretended to think it merely <span class=\"vocab-trigger\" data-vocab=\"ridiculous\">ridiculous<\/span>. They could not understand, they said, how even animals could bring themselves to sing such <span class=\"vocab-trigger\" data-vocab=\"contemptible rubbish\">contemptible rubbish<\/span>. Any animal caught singing it was given a <span class=\"vocab-trigger\" data-vocab=\"flogging\">flogging<\/span> on the sp               "zh": "不过，这些说法从来没有谁完全相信过。关于一个奇妙农场的传闻继续以模糊而歪曲的形式流传着，那农场里人被赶跑了，动物自己在管理事务。这一整年，一股叛逆的浪潮席卷乡间。一向温顺的公牛突然变得凶暴，绵羊撞破树篱，猛吃苜蓿，母牛踢翻奶桶，猎马不肯跳栏，把骑手甩到障碍的另一边去。尤其重要的是，《英格兰兽》的曲调甚至歌词已经到处都知道了。它以惊人的速度传播开来。人类听到这首歌时，尽管假装认为这不过是荒唐可笑的，却掩盖不住内心的狂怒。他们说，简直不懂就连动物怎么会唱得出这样可鄙的废话。任何动物被逮住在唱这支歌，当场就要遭到鞭打。然而，这首歌是压制不住的。乌鸫在树篱上吹着它的调子，鸽子在榆树上咕咕地哼着它，它渗进了铁匠铺的叮当声和教堂钟声的旋律。人类听到它的时候，心里都在秘密地发抖，从中听到了他们未来劫数的预言。",
              "simpEn": "But these stories were never fully believed. Stories of an amazing farm where humans were thrown out and animals ran things kept going around in unclear and twisted versions. All that year a spirit of rebellion moved through the countryside. Bulls that were usually easy to handle became wild, sheep broke through hedges and ate the clover, cows kicked over the milk bucket, hunting horses stopped at fences and threw their riders over. Most of all, the tune and words of 'Beasts of England' were known everywhere, spreading amazingly fast. Humans couldn't hide their anger when they heard it, though they acted as if it was just silly. They said they couldn't understand how animals could sing such worthless nonsense. Any animal caught singing it was beaten immediately. Yet the song couldn't be stopped. Blackbirds sang it in the hedges, pigeons cooed it in the trees, it mixed with the noise of blacksmith workshops and the sound of church bells. When humans heard it, they secretly shook with fear, hearing in it a warning of their coming destruction.",
              "simpZh": "可这些说法从没完全被信过。有个奇妙农场的传闻一直含含糊糊、走样地流传着，说那里人给赶跑了，动物自己管事。这一整年，一股不服管的浪潮扫过乡间。一直温顺的公牛忽然变野，羊撞破树篱猛吃苜蓿，母牛踢翻奶桶，猎马不跳栏把骑手摔过去。最要命的是《英格兰野兽》的调子连歌词到处都知道了，传得快得惊人。人类听了气得要命，却假装只觉得可笑。他们说真不懂动物怎么能唱这么下作的废话。哪个动物被逮住在唱，当场就挨鞭子。可这歌就是压不住。黑鸟在树篱里吹，鸽子在榆树上咕，传进打铁铺的叮当声和教堂钟声里。人类听了暗暗发抖，听出那是自己未来完蛋的预言。"

          "paragraphs": [
            {
              "en": "Early in October, when the corn was cut and <span class=\"vocab-trigger\" data-vocab=\"stacked\">stacked<\/span> and some of it was already <span class=\"vocab-trigger\" data-vocab=\"threshed\">threshed<\/span>, a flight of pigeons came <span class=\"vocab-trigger\" data-vocab=\"whirling through the air\">whirling through the air<\/span> and <span class=\"vocab-trigger\" data-vocab=\"alighted\">alighted<\/span> in the yard of Animal Farm in the <span class=\"vocab-trigger\" data-vocab=\"wildest excitement\">wildest excitement<\/span>. Jones and all his men, with half a dozen others from Foxwood and Pinchfield, had entered the <span class=\"vocab-trigger\" data-vocab=\"five-barred gate\">five-barred gate<\/span> and were coming up the <span class=\"vocab-trigger\" data-vocab=\"cart-track\">cart-track<\/span> that led to the farm. They were all carrying sticks, except Jones, who was <span class=\"vocab-trigger\" data-vocab=\"marching ahead\">marching ahead<\/span> with a gun in his hands. Obviously they were going to attempt the <span class=\"vocab-trigger\" data-vocab=\"recapture\">recapture<\/span> of the farm.",
              "zh": "十月初，玉米已经收割、堆好，一部分已经脱了粒。一天，一群鸽子在空中飞旋而来，无比激动地降落在动物农场的院子里。琼斯和他手下所有的雇工，再加上福克斯伍德和平奇菲尔德来的另外六个帮手，已经进了那扇五道横木的大门，正沿着通向农场的马车道走来。他们人人都拿着棍棒，只有琼斯走在前头，手里端着一支枪。显然，他们要试图夺回农场了。",

          "paragraphs": [
            {
              "en": "As the human beings approached the farm buildings, Snowball launched his first attack. All the pigeons, to the number of thirty-five, flew to and fro over the men's heads and <span class=\"vocab-trigger\" data-vocab=\"muted upon them\">muted upon them<\/span> from mid-air; and while the men were <span class=\"vocab-trigger\" data-vocab=\"dealing with\">dealing with<\/span> this, the geese, who had been hiding behind the hedge, rushed out and <span class=\"vocab-trigger\" data-vocab=\"pecked viciously at the calves of their legs\">pecked viciously at the calves of their legs<\/span>. However, this was only a <span class=\"vocab-trigger\" data-vocab=\"light skirmishing manoeuvre\">light skirmishing manoeuvre<\/span>, intended to create a little disorder, and the men easily <span class=\"vocab-trigger\" data-vocab=\"drove the geese off\">drove the geese off<\/span> with their sticks. Snowball now launched his second line of attack. Muriel, Benjamin, and all the sheep, with Snowball at the head of them, rushed forward and <span class=\"vocab-trigger\" data-vocab=\"prodded and butted\">prodded and butted<\/span> the men from every side, while Benjamin turned around and <span class=\"vocab-trigger\" data-vocab=\"lashed at them\">lashed at them<\/span> with his small hoofs. But once again the men, with their sticks and their <span class=\"vocab-trigger\" data-vocab=\"hobnailed boots\">hobnailed boots<\/span>, were too strong for them; and suddenly, at a <span class=\"vocab-trigger\" data-vocab=\"squeal\">squeal<\/span> from Snowball, which was the signal for retreat, all the animals turned and fled through the gateway into the yard.",
              "zh": "等那些人走近农场房舍，雪球发动了第一波攻击。三十五只鸽子全部出动，在那些人头上飞来飞去，从半空中朝他们拉屎；趁那些人应付这阵轰炸的当口，一直藏在树篱后面的鹅群冲了出来，对着他们的小腿肚子狠狠啄去。然而，这只是一次制造混乱的轻微前哨战，那些人轻易就用棍棒把鹅赶跑了。雪球随即发动了第二道攻势。穆丽尔、本杰明和所有的绵羊，由雪球打头，朝前猛冲，从四面八方又刺又顶，本杰明则转过身来，用小蹄子朝他们猛踢。可那些人仗着棍棒和钉靴，又一次占了上风；突然，雪球发出一声尖叫，这是撤退的信号，所有动物便转身逃过院门，退进了院子。",
              "simpEn": "As the humans got near the farm buildings, Snowball started his first attack. All thirty-five pigeons flew over the men's heads and dropped mess on them from the air. While the men were busy with this, the geese, who had been hiding behind the hedge, ran out and pecked sharply at the men's lower legs. But this was just a small, light fight to cause confusion, and the men easily chased the geese away with sticks. Snowball then sent his second wave. Muriel, Benjamin, and all the sheep, led by Snowball, ran forward and pushed and hit the men from all sides, while Benjamin turned and kicked out with his small hoofs. But again the men with their sticks and heavy nailed boots were stronger. Suddenly, at a high cry from Snowball, the retreat signal, all animals turned and ran back through the gate into the yard.",
              "simpZh": "等人靠近农场房子，雪球发动第一波攻击。三十五只鸽子在那些人头顶飞来飞去，从空中往下拉屎；那些人忙着对付时，藏在树篱后的鹅冲出来，狠狠啄他们的小腿肚。但这只是小打小闹的骚扰，为的是弄乱阵脚。那些人轻易用棍子把鹅赶跑了。雪球接着出第二波。穆丽尔、本杰明和所有羊，由雪球带头冲上去，从四面八方又戳又撞，本杰明转过来用后蹄猛踢。可那些人靠棍子和钉了钉子的靴子又占了上风。忽然雪球一声尖叫，那是撤退信号，动物全转身逃进院门，退到院子里。"
            },
            {
              "en": "The men gave a <span class=\"vocab-trigger\" data-vocab=\"shout of triumph\">shout of triumph<\/span>. They saw, as they imagined, their enemies <span class=\"vocab-trigger\" data-vocab=\"in flight\">in flight<\/span>, and they rushed after them <span class=\"vocab-trigger\" data-vocab=\"in disorder\">in disorder<\/span>. This was just what Snowball had intended. As soon as they were well inside the yard, the three horses, the three cows, and the rest of the pigs, who had been lying <span class=\"vocab-trigger\" data-vocab=\"in ambush\">in ambush<\/span> in the cowshed, suddenly <span class=\"vocab-trigger\" data-vocab=\"emerged in their rear\">emerged in their rear<\/span>, <span class=\"vocab-trigger\" data-vocab=\"cutting them off\">cutting them off<\/span>. Snowball now gave the signal for the <span class=\"vocab-trigger\" data-vocab=\"charge\">charge<\/span>. He himself <span class=\"vocab-trigger\" data-vocab=\"dashed straight for Jones\">dashed straight for Jones<\/span>. Jones saw him coming, raised his gun and fired. The <span class=\"vocab-trigger\" data-vocab=\"pellets\">pellets<\/span> <span class=\"vocab-trigger\" data-vocab=\"scored bloody streaks\">scored bloody streaks<\/span> along Snowball's back, and a sheep dropped dead. <span class=\"vocab-trigger\" data-vocab=\"Without halting for an instant\">Without halting for an instant<\/span>, Snowball <span class=\"vocab-trigger\" data-vocab=\"flung his fifteen stone\">flung his fifteen stone<\/span> against Jones's legs. Jones was <span class=\"vocab-trigger\" data-vocab=\"hurled\">hurled<\/span> into a pile of <span class=\"vocab-trigger\" data-vocab=\"dung\">dung<\/span> and his gun flew out of his hands. But the most <span class=\"vocab-trigger\" data-vocab=\"terrifying spectacle\">terrifying spectacle<\/span> of all was Boxer, <span class=\"vocab-trigger\" data-vocab=\"rearing up on his hind legs\">rearing up on his hind legs<\/span> and striking out with his great <span class=\"vocab-trigger\" data-vocab=\"iron-shod hoofs\">iron-shod hoofs<\/span> like a <span class=\"vocab-trigger\" data-vocab=\"stallion\">stallion<\/span>. His very first blow took a <span class=\"vocab-trigger\" data-vocab=\"stable-lad\">stable-lad<\/span> from Foxwood on the <span class=\"vocab-trigger\" data-vocab=\"skull\">skull<\/span> and <span class=\"vocab-trigger\" data-vocab=\"stretched him lifeless\">stretched him lifeless<\/span> in the mud. At the sight, several men dropped their sticks and tried to run. <span class=\"vocab-trigger\" data-vocab=\"Panic overtook them\">Panic overtook them<\/span>, and the next moment all the animals together were chasing them round and round the yard. They were <span class=\"vocab-trigger\" data-vocab=\"gored\">gored<\/span>, kicked, bitten, <span class=\"vocab-trigger\" data-vocab=\"trampled on\">trampled on<\/span>. There was not an animal on the farm that did not take <span class=\"vocab-trigger\" data-vocab=\"vengeance\">vengeance<\/span> on them after his own fashion. Even the cat suddenly leapt off a roof onto a <span class=\"vocab-trigger\" data-vocab=\"cowman\">cowman<\/span>'s shoulders and <span class=\"vocab-trigger\" data-vocab=\"sank her claws in his neck\">sank her claws in his neck<\/span>, at which he yelled horribly. At a moment when the opening was clear, the men were glad enough to rush out of the yard and <span class=\"vocab-trigger\" data-vocab=\"make a bolt for\">make a bolt for<\/span> the main road. And so within five minutes of their <span class=\"vocab-trigger\" data-vocab=\"invasion\">invasion<\/span> they were in <span class=\"vocab-trigger\" data-vocab=\"ignominious retreat\">ignominious retreat<\/span> by the same way as they had come, with a <span class=\"vocab-trigger\" data-vocab=\"flock of geese hissing after them\">flock of geese hissing after them<\/span> and pecking at their calves all the way.",
              "zh": "那些人发出了胜利的欢呼。他们以为敌人溃逃了，便乱哄哄地追了上去。这正是雪球预料之中的。他们刚进到院子里面，一直埋伏在牛棚里的三匹马、三头牛和其余的猪突然出现在他们身后，切断了退路。雪球这时发出了冲锋的信号。他自己径直朝琼斯冲了过去。琼斯看见他冲来，举起枪开了火。弹丸在雪球背上划出几道血淋淋的口子，一只绵羊倒下死了。雪球一刻也没停，把自己十五英石重的身体朝琼斯的双腿猛砸过去。琼斯被砸进了粪堆里，枪也从手中飞了出去。然而最吓人的景象是拳击手，他用后腿站立起来，像匹种马一样用那两只钉了铁掌的大蹄子猛踢猛打。第一下就踢中了一个来自福克斯伍德的马僮的脑袋，让他一动不动地躺在泥里。看见这情形，好几个人丢下棍棒就想逃。恐慌攫住了他们，转眼之间所有的动物都把他们追得在院子里乱窜。他们被角顶、被蹄踢、被牙咬、被脚踩。农场里没有一个动物不按自己的方式向他们讨还血债。连猫也突然从屋顶上跳到一个牛倌的肩膀上，把爪子插进他的脖子里，疼得他发出一声惨叫。眼看出口没有阻挡了，那些人赶紧冲出院子，朝大路拼命奔逃。就这样，他们入侵不到五分钟，就沿着原路可耻地退却了，身后一群鹅一路嘶嘶叫着，不停啄着他们的小腿。",
              "simpEn": "The men shouted in victory. They thought the animals were running away and chased after them in a messy rush. This was exactly what Snowball wanted. Once they were deep in the yard, the three horses, three cows, and the rest of the pigs, who had been hiding in the cow shed, suddenly came out behind them, blocking their escape. Snowball gave the attack signal. He himself ran straight at Jones. Jones saw him coming, lifted his gun, and fired. The small metal balls made bloody lines across Snowball's back, and a sheep fell dead. Without stopping for a moment, Snowball threw his whole heavy body against Jones's legs. Jones was knocked into a manure pile and his gun flew from his hands. But the most frightening sight was Boxer, standing up on his back legs and kicking out with his huge iron-shoed hoofs like a male horse. His first hit caught a young stable worker from Foxwood on the head and laid him still in the mud. Seeing this, several men dropped their sticks and tried to run. Fear took them completely, and all the animals chased them around the yard. They were stabbed by horns, kicked, bitten, stepped on. Every animal got revenge in their own way. Even the cat jumped from a roof onto a cow worker's shoulders and dug her claws into his neck, making him scream terribly. When the way was open, the men were happy to race out of the yard and run for the main road. Within five minutes of their attack, they were shamefully running back the way they came, with a group of geese hissing and pecking at their legs all the way.",
              "simpZh": "那些人胜利大喊。他们以为敌人跑了，乱哄哄追上去。这正是雪球要的。他们一进了院子，藏在牛棚里的三匹马、三头牛和剩下的猪忽然从后面冒出来，断他们的退路。雪球发冲锋信号，自己直冲琼斯。琼斯见他过来，举枪开火。弹丸在雪球背上划出血道，一只羊倒地死了。雪球一刻没停，把自己沉甸甸的身子朝琼斯腿上撞过去。琼斯跌进粪堆，枪脱了手。最吓人的是拳击手，他后腿站立起来，像公马一样用钉了铁掌的大蹄子猛踢。第一下踢中福克斯伍德一个马僮的脑袋，把他撂在泥里不动了。看见这个，好几个人扔掉棍子想逃。恐慌抓住了他们，转眼动物们把他们追得满院子转。被角顶、被踢、被咬、被踩。农场没一个动物不照自己的方式报仇。连猫也从屋顶跳到牛倌肩膀上，爪子插进他脖子，他惨声大叫。等出口没挡了，那些人赶紧冲出院子，拼命往大路跑。入侵不到五分钟，他们顺着原路丢脸地逃了，一群鹅一路嘶嘶叫着啄他们的小腿。"
            }

        {
          "sectionId": 5,
          "heading": "Aftermath — Boxer's Remorse and Mollie's Cowardice",
          "paragraphs": [
            {
              "en": "All the men were gone except one. Back in the yard Boxer was <span class=\"vocab-trigger\" data-vocab=\"pawing\">pawing<\/span> with his hoof at the <span class=\"vocab-trigger\" data-vocab=\"stable-lad\">stable-lad<\/span> who lay face down in the mud, trying to turn him over. The boy did not <span class=\"vocab-trigger\" data-vocab=\"stir\">stir<\/span>.<br>“He is dead,” said Boxer <span class=\"vocab-trigger\" data-vocab=\"sorrowfully\">sorrowfully<\/span>. “I had no intention of doing that. I forgot that I was wearing iron shoes. Who will believe that I did not do this <span class=\"vocab-trigger\" data-vocab=\"on purpose\">on purpose<\/span>?”<br>“<span class=\"vocab-trigger\" data-vocab=\"No sentimentality\">No sentimentality<\/span>, comrade!” cried Snowball from whose wounds the blood was still dripping. “<span class=\"vocab-trigger\" data-vocab=\"War is war\">War is war<\/span>. The only good human being is a dead one.”<br>“I have no wish to take life, not even human life,” repeated Boxer, and his eyes were full of tears.",
              "zh": "所有人都跑了，只少了一个。院子里，拳击手正用蹄子扒拉着那个脸朝下躺在泥里的马僮，想把他翻过身来。那小伙子一动不动。<br>“他死了，”拳击手伤心地说，“我并没有想这样。我忘了我穿着铁掌鞋。谁肯相信我不是故意干的呢？”<br>“别来那套温情脉脉，同志！”雪球喊道，他背上的伤口还在滴血，“打仗就是打仗。好人类只有死了的人类。”<br>“我不想害命，连人命也不想害。”拳击手重复说了一遍，眼里噙满了泪水。",
              "simpEn": "All the men were gone but one. Boxer was in the yard pushing with his hoof at the young stable worker lying face down in the mud, trying to roll him over. The boy didn't move. 'He is dead,' said Boxer sadly. 'I didn't mean to do that. I forgot I was wearing iron shoes. Who will believe I didn't do it on purpose?' 'No soft feelings, friend!' cried Snowball, whose wounds were still bleeding. 'War is war. The only good human is a dead one.' 'I don't want to take life, not even human life,' Boxer repeated, and his eyes were full of tears.",
              "simpZh": "人都跑了，只剩一个。拳击手在院子里用蹄子扒那个脸朝下躺在泥里的马僮，想把他翻过来。小伙子不动。“他死了，”拳击手伤心地说，“我没想这样。忘了自己穿铁掌了。谁会信我不是成心的？”“别软心肠，同志！”雪球背上还在淌血，喊道，“打仗就是打仗。好人类只有死人类。”“我不想害命，连人命也不想。”拳击手又说一遍，眼里全是眼泪。"
            },
            {
              "en": "“Where is Mollie?” exclaimed somebody.<br>Mollie in fact was missing. For a moment there was great <span class=\"vocab-trigger\" data-vocab=\"alarm\">alarm<\/span>; it was feared that the men might have harmed her in some way, or even carried her off with them. In the end, however, she was found hiding in her <span class=\"vocab-trigger\" data-vocab=\"stall\">stall<\/span> with her head buried among the hay in the <span class=\"vocab-trigger\" data-vocab=\"manger\">manger<\/span>. She had <span class=\"vocab-trigger\" data-vocab=\"taken to flight\">taken to flight<\/span> as soon as the gun went off. And when the others came back from looking for her, it was to find that the stable-lad, who in fact was only <span class=\"vocab-trigger\" data-vocab=\"stunned\">stunned<\/span>, had already recovered and <span class=\"vocab-trigger\" data-vocab=\"made off\">made off<\/span>.",
              "zh": "“莫丽呢？”有人喊了起来。<br>莫丽果然不见了。大家顿时大为惊慌；惟恐那些人用什么法子伤了她，甚至把她掳走了。然而，最后发现她躲在自己的厩栏里，把头埋在食槽的干草中间。她一听枪响就吓跑了。等到别的动物找了她回来，却发现那个马僮，其实只是被打昏了过去，这时候已经苏醒，溜走了。",
              "simpEn": "'Where's Mollie?' someone shouted. Mollie was indeed missing. For a moment everyone was very scared; they feared the men might have hurt her or even taken her away. But finally she was found hiding in her stable space, her head pushed into the hay in the feed box. She had run away as soon as the gun was fired. And when the others returned from searching for her, they found that the young stable worker, who had really only been knocked out, had woken up and escaped.",
              "simpZh": "“莫丽呢？”有人喊。莫丽真不见了。大家一阵慌，怕那些人伤了她，或者掳走了。最后发现她躲在自己栏里，头埋在食槽干草里。她一听枪响就吓跑了。等大家找了她回来，才发现那马僮只是打昏了，已经醒了跑掉了。"

        {
          "sectionId": 6,
          "heading": "Celebration, Decorations, and Naming the Battle",
          "paragraphs": [
            {
              "en": "The animals had now <span class=\"vocab-trigger\" data-vocab=\"reassembled\">reassembled<\/span> in the wildest excitement, each <span class=\"vocab-trigger\" data-vocab=\"recounting\">recounting<\/span> his own <span class=\"vocab-trigger\" data-vocab=\"exploits\">exploits<\/span> in the battle at the top of his voice. An <span class=\"vocab-trigger\" data-vocab=\"impromptu\">impromptu<\/span> celebration of the victory was held immediately. The flag was <span class=\"vocab-trigger\" data-vocab=\"run up\">run up<\/span> and ‘Beasts of England’ was sung a number of times, then the sheep who had been killed was given a <span class=\"vocab-trigger\" data-vocab=\"solemn funeral\">solemn funeral<\/span>, a <span class=\"vocab-trigger\" data-vocab=\"hawthorn bush\">hawthorn bush<\/span> being planted on her grave. At the <span class=\"vocab-trigger\" data-vocab=\"graveside\">graveside<\/span> Snowball made a little speech, <span class=\"vocab-trigger\" data-vocab=\"emphasising\">emphasising<\/span> the need for all animals to be ready to die for Animal Farm if need be.",
              "zh": "动物们重新聚在一起，情绪激昂到了极点，个个都在扯着嗓子述说自己在战斗中的英勇事迹。他们当场举办了一场即兴的胜利庆祝会。旗帜升了起来，把《英格兰兽》唱了好几遍，随后为死去的那只绵羊举行了隆重的葬礼，在它的坟上栽了一棵山楂树。雪球在墓前发表了一篇简短的演说，强调所有动物如果需要，都应该准备为动物农场献出生命。",
              "simpEn": "The animals gathered again in huge excitement, each one shouting out stories of their brave acts in the battle. A sudden, unplanned victory celebration was held right away. The flag was raised and 'Beasts of England' was sung several times. Then the dead sheep was given a serious and respectful funeral, and a hawthorn bush was planted on her grave. At the graveside, Snowball made a short speech, stressing that all animals must be ready to die for Animal Farm if it was needed.",
              "simpZh": "动物们重又聚拢，激动得了不得，个个高声讲自己打仗的英勇事迹。马上就地办了个即兴胜利庆祝。旗升起来，《英格兰野兽》唱了好几遍，然后给死了的羊办了隆重的葬礼，坟上种了棵山楂树。雪球在坟边说了段话，强调每个动物如果需要，都得准备为动物农场去死。"
            },
            {
              "en": "The animals decided <span class=\"vocab-trigger\" data-vocab=\"unanimously\">unanimously<\/span> to create a <span class=\"vocab-trigger\" data-vocab=\"military decoration\">military decoration<\/span>, “<span class=\"vocab-trigger\" data-vocab=\"Animal Hero, First Class\">Animal Hero, First Class<\/span>,” which was <span class=\"vocab-trigger\" data-vocab=\"conferred\">conferred<\/span> there and then on Snowball and Boxer. It consisted of a <span class=\"vocab-trigger\" data-vocab=\"brass medal\">brass medal<\/span> (they were really some old <span class=\"vocab-trigger\" data-vocab=\"horse-brasses\">horse-brasses<\/span> which had been found in the harness-room), to be worn on Sundays and holidays. There was also “<span class=\"vocab-trigger\" data-vocab=\"Animal Hero, Second Class\">Animal Hero, Second Class<\/span>,” which was conferred <span class=\"vocab-trigger\" data-vocab=\"posthumously\">posthumously<\/span> on the dead sheep.",
              "zh": "动物们一致决定设立一枚军功勋章——“一级动物英雄”，当即授予了雪球和拳击手。这勋章是一枚铜质奖章（其实是从挽具房里找到的一些旧马饰），规定在星期天和节庆日佩戴。另外还设有“二级动物英雄”，追授给了那只死去的绵羊。",
              "simpEn": "The animals all agreed to create a military award, 'Animal Hero, First Class,' which was given immediately to Snowball and Boxer. It was a brass medal (really some old horse decorations found in the equipment room), to be worn on Sundays and holidays. There was also 'Animal Hero, Second Class,' given after death to the dead sheep.",
              "simpZh": "动物们一致决定设一个军功章——“一级动物英雄”，当场授予雪球和拳击手。这是个铜奖章（其实是挽具房找出来的旧马饰），星期天和节日戴。还有“二级动物英雄”，追授给死去的羊。"
            },
            {
              "en": "There was much discussion as to what the battle should be called. In the end, it was named <span class=\"vocab-trigger\" data-vocab=\"the Battle of the Cowshed\">the Battle of the Cowshed<\/span>, since that was where the <span class=\"vocab-trigger\" data-vocab=\"ambush had been sprung\">ambush had been sprung<\/span>. Mr. Jones's gun had been found lying in the mud, and it was known that there was a supply of <span class=\"vocab-trigger\" data-vocab=\"cartridges\">cartridges<\/span> in the farmhouse. It was decided to <span class=\"vocab-trigger\" data-vocab=\"set the gun up\">set the gun up<\/span> at the foot of the Flagstaff, like a <span class=\"vocab-trigger\" data-vocab=\"piece of artillery\">piece of artillery<\/span>, and to fire it twice a year — once on <span class=\"vocab-trigger\" data-vocab=\"October the twelfth\">October the twelfth<\/span>, the <span class=\"vocab-trigger\" data-vocab=\"anniversary\">anniversary<\/span> of the Battle of the Cowshed, and once on <span class=\"vocab-trigger\" data-vocab=\"Midsummer Day\">Midsummer Day<\/span>, the anniversary of the Rebellion.",
              "zh": "关于这场战役该叫什么名字，讨论了很久。最后，它被命名为“牛棚战役”，因为那正是伏兵发起的地方。琼斯先生的枪也在泥里找到了，大家还知道农庄住宅里存有一批子弹。于是决定把那支枪架在旗杆底下，就像一门炮一样，每年鸣放两次——一次在十月十二日，牛棚战役的纪念日，一次在仲夏节，造反的纪念日。",
              "simpEn": "There was much debate about what to name the battle. In the end it was called the Battle of the Cowshed, because that was where the surprise attack had started. Mr. Jones's gun was found in the mud, and they knew there were more bullets in the farmhouse. They decided to place the gun at the bottom of the flagpole, like a cannon, and to shoot it twice a year — once on October the twelfth, the yearly remembrance of the Battle of the Cowshed, and once on Midsummer Day, the yearly remembrance of the Rebellion.",

        {
          "sectionId": 1,
          "heading": "Mollie’s Desertion",
          "paragraphs": [
            {
              "en": "As winter drew on, Mollie became more and more <span class=\"vocab-trigger\" data-vocab=\"troublesome\">troublesome<\/span>. She was late for work every morning and excused herself by saying that she had overslept, and she complained of mysterious pains, although her appetite was excellent. On every kind of <span class=\"vocab-trigger\" data-vocab=\"pretext\">pretext<\/span> she would run away from work and go to the drinking pool, where she would stand foolishly gazing at her own reflection in the water. But there were also rumours of something more serious. One day, as Mollie <span class=\"vocab-trigger\" data-vocab=\"strolled blithely\">strolled blithely<\/span> into the yard, <span class=\"vocab-trigger\" data-vocab=\"flirting her long tail\">flirting her long tail<\/span> and chewing at a stalk of hay, Clover took her aside.",
              "zh": "随着冬天临近，莫丽变得越来越麻烦。她每天早上都迟到，借口说自己睡过了头，还抱怨身上莫名其妙地疼，尽管她的胃口好得不得了。她会找各种借口逃避工作，跑到饮水的池子边，傻乎乎地站在那里端详水中的倒影。不过也有一些更严重的风言风语。一天，莫丽兴冲冲地晃悠进院子，甩着长尾巴，嘴里嚼着根干草，苜蓿把她拉到了一边。",
              "simpEn": "As winter came closer, Mollie caused more and more trouble. Every morning she was late and said she overslept. She complained of strange pains even though she ate well. She used any excuse to leave work and go to the drinking pool, where she foolishly stared at herself in the water. But there were also stories of something worse. One day, when Mollie walked happily into the yard, swinging her long tail and chewing a piece of hay, Clover pulled her aside.",
              "simpZh": "冬天近了，莫丽越来越烦人。每天早晨迟到，说睡过了头，身上这不疼那疼，吃得却很多。她总能找借口不干活，跑到水塘边傻看自己的倒影。可还有更难听的传言。一天，莫丽高高兴兴晃进院子，甩着长尾巴嚼干草，苜蓿把她拉到一边。"
            },
            {
              "en": "“Mollie,” she said, “I have something very serious to say to you. This morning I saw you looking over the hedge that divides Animal Farm from Foxwood. One of Mr. Pilkington’s men was standing on the other side of the hedge. And — I was a long way away, but I am almost certain I saw this — he was talking to you and you were allowing him to <span class=\"vocab-trigger\" data-vocab=\"stroke your nose\">stroke your nose<\/span>. What does that mean, Mollie?”<br>“He didn’t! I wasn’t! It isn’t true!” cried Mollie, beginning to <span class=\"vocab-trigger\" data-vocab=\"prance about\">prance about<\/span> and paw the ground.<br>“Mollie! Look me in the face. Do you give me your <span class=\"vocab-trigger\" data-vocab=\"word of honour\">word of honour<\/span> that that man was not stroking your nose?”<br>“It isn’t true!” repeated Mollie, but she could not look Clover in the face, and the next moment she <span class=\"vocab-trigger\" data-vocab=\"took to her heels\">took to her heels<\/span> and galloped away into the field.",
              "zh": "“莫丽，”她说，“我有件很严肃的事要跟你讲。今天早上我看见你隔着动物农场和福克斯伍德之间的树篱往外望。皮尔金顿先生的一个伙计就站在树篱那一边。而且——我虽然离得很远，可我几乎敢肯定我看见了——他在跟你说话，你也在让他摸你的鼻子。这是什么意思，莫丽？”<br>“他没有！我没有！那不是真的！”莫丽叫着，一边又蹦又跳，用蹄子刨着地。<br>“莫丽！看着我的脸。你能以名誉向我保证，那个人没有摸你的鼻子吗？”<br>“不是真的！”莫丽重复了一遍，但她不敢正视苜蓿的脸，紧接着撒腿就跑，飞奔到牧场上去了。",
              "simpEn": "'Mollie,' she said, 'I have something very serious to tell you. This morning I saw you looking over the hedge between Animal Farm and Foxwood. One of Mr. Pilkington's men was on the other side. And — I was far away, but I'm almost sure — he was talking to you and you let him rub your nose. What does that mean, Mollie?' 'He didn't! I wasn't! It's not true!' cried Mollie, jumping about and scratching the ground. 'Mollie! Look me in the face. Do you promise on your honour that man was not rubbing your nose?' 'It's not true!' Mollie repeated, but she couldn't look at Clover, and then she ran off and galloped into the field.",
              "simpZh": "“莫丽，”苜蓿说，“我有很要紧的话跟你说。今早我看见你隔着动物农场和福克斯伍德的树篱望。皮尔金顿的一个伙计站在那边。我离得远，可差不多能肯定——他在跟你说话，你让他摸鼻子。那是什么意思，莫丽？”“他没有！我没！不是真的！”莫丽又叫又跳刨地。“莫丽！看着我。你敢用名誉保证那人没摸你鼻子吗？”“不是真的！”莫丽又说，可不敢看苜蓿的脸，转身撒腿就跑，飞奔到草场去了。"
            },
            {
              "en": "A thought struck Clover. Without saying anything to the others, she went to Mollie’s stall and turned over the straw with her hoof. Hidden under the straw was a little pile of <span class=\"vocab-trigger\" data-vocab=\"lump sugar\">lump sugar<\/span> and several bunches of ribbon of different colours.<br>Three days later Mollie disappeared. For some weeks nothing was known of her <span class=\"vocab-trigger\" data-vocab=\"whereabouts\">whereabouts<\/span>, then the pigeons reported that they had seen her on the other side of Willingdon. She was between the <span class=\"vocab-trigger\" data-vocab=\"shafts\">shafts<\/span> of a smart <span class=\"vocab-trigger\" data-vocab=\"dogcart\">dogcart<\/span> painted red and black, which was standing outside a <span class=\"vocab-trigger\" data-vocab=\"public-house\">public-house<\/span>. A fat red-faced man in <span class=\"vocab-trigger\" data-vocab=\"check breeches and gaiters\">check breeches and gaiters<\/span>, who looked like a <span class=\"vocab-trigger\" data-vocab=\"publican\">publican<\/span>, was stroking her nose and feeding her with sugar. Her coat was newly <span class=\"vocab-trigger\" data-vocab=\"clipped\">clipped<\/span> and she wore a scarlet ribbon round her <span class=\"vocab-trigger\" data-vocab=\"forelock\">forelock<\/span>. She appeared to be enjoying herself, so the pigeons said. None of the animals ever mentioned Mollie again.",
              "zh": "苜蓿心里一动。她没有对别的动物说什么，走到莫丽的厩栏里，用蹄子翻开干草。草下面藏着一小堆方糖和好几束五颜六色的缎带。<br>三天后，莫丽失踪了。一连好几个星期，谁也不知道她的下落，后来鸽子们回报说，它们在威灵顿的另一头看见了她。她被套在一辆漆成红黑两色的漂亮单匹马车的前面，车子停在一家酒馆外面。一个穿着格子马裤打着皮绑腿的胖红脸汉子，样子像个酒馆老板，正在摸她的鼻子，给她糖吃。她的毛新剪过，额毛上系了一条猩红色的缎带。看样子她挺自得其乐，鸽子们这么说。从此，动物们再也没有提起过莫丽。",
              "simpEn": "An idea came to Clover. Without telling the others, she went to Mollie's stall and used her hoof to turn over the straw. Hidden underneath was a little pile of sugar cubes and several bunches of ribbon in different colours. Three days later Mollie disappeared. For a few weeks nobody knew where she was. Then the pigeons reported they had seen her on the other side of Willingdon. She was harnessed between the two poles of a fancy two-wheeled carriage painted red and black, parked outside a pub. A fat, red-faced man in patterned trousers and leg coverings, looking like a pub owner, was rubbing her nose and feeding her sugar. Her coat was newly cut and she wore a bright red ribbon on her forehead hair. She seemed to be having a good time, the pigeons said. After that, none of the animals ever mentioned Mollie again.",
              "simpZh": "苜蓿心头一亮。没跟别人说，去莫丽的栏里用蹄子翻开干草。草下藏着一小堆方糖和好几束彩带子。三天后莫丽不见了。几个星期没人知道她在哪儿。后来鸽子回报，在威灵顿那头看见了她。她套在一辆漂漂亮亮红黑两色的两轮马车前面，车停在一家酒馆外面。一个穿格子裤打皮绑腿的红脸胖子，像个酒馆老板，正摸她鼻子给她糖吃。毛新剪过，额毛上系着红带子。看样子她挺快活，鸽子这么说。以后动物们再也没提过莫丽。"

        {
          "sectionId": 2,
          "heading": "Disputes Between Snowball and Napoleon",
          "paragraphs": [
            {
              "en": "In January there came bitterly hard weather. The earth was like iron, and nothing could be done in the fields. Many meetings were held in the big barn, and the pigs occupied themselves with planning out the work of the coming season. It had come to be accepted that the pigs, who were <span class=\"vocab-trigger\" data-vocab=\"manifestly\">manifestly<\/span> cleverer than the other animals, should decide all questions of farm <span class=\"vocab-trigger\" data-vocab=\"policy\">policy<\/span>, though their decisions had to be <span class=\"vocab-trigger\" data-vocab=\"ratified\">ratified<\/span> by a majority vote. This arrangement would have worked well enough if it had not been for the <span class=\"vocab-trigger\" data-vocab=\"disputes\">disputes<\/span> between Snowball and Napoleon. These two disagreed at every point where disagreement was possible. If one of them suggested <span class=\"vocab-trigger\" data-vocab=\"sowing a bigger acreage with barley\">sowing a bigger acreage with barley<\/span>, the other was certain to demand a bigger acreage of oats, and if one of them said that such and such a field was just right for cabbages, the other would declare that it was useless for anything except roots. Each had his own <span class=\"vocab-trigger\" data-vocab=\"following\">following<\/span>, and there were some violent debates.",
              "zh": "到了一月，天气酷寒。地冻得像铁一样硬，田野里什么活也没法干。大谷仓里开了很多会，猪把时间都用在规划下一季的工作上。大家已经接受了这样一个事实：猪显然比其他动物聪明，因此农场政策的所有问题都应该由猪决定，尽管他们的决定还得经过多数票批准。要是没有雪球和拿破仑之间的争执，这种安排本来可以运转得相当好。这两个在每一个可能产生分歧的地方都会意见相左。一个提议多种一些大麦，另一个就一定要求多种些燕麦；一个说某块地正好适合种卷心菜，另一个就会宣称那块地除了种块根饲料外毫无用处。他们各自都有一批拥护者，常常发生激烈辩论。",
              "simpEn": "In January the weather turned extremely cold and hard. The ground was like iron, and no fieldwork was possible. Many meetings took place in the big barn, and the pigs spent time planning the next season's work. It was now accepted that the pigs, who were clearly cleverer, should decide all farm policy questions, although their decisions still needed approval by a majority vote. This would have worked well if not for the arguments between Snowball and Napoleon. They disagreed on every single point possible. If one wanted to plant more barley, the other demanded more oats. If one said a field was perfect for cabbages, the other claimed it was only good for root vegetables. Each had his own group of supporters, and the debates could be fierce.",
              "simpZh": "一月天气冷极了，地硬得像铁，地里干不了活。大谷仓开了很多会，猪忙着规划下季活计。大家已经接受猪明显更聪明，所有农场政策该由猪定，不过还得多数票通过。要不是雪球和拿破仑总吵，这安排本来不错。他们在每个能吵的地方都吵。一个说多种大麦，另一个准要多种燕麦；一个说这块地适合卷心菜，另一个就说除了根菜什么也种不了。各有各的支持者，经常大吵。"
            },
            {
              "en": "At the Meetings Snowball often won over the majority by his brilliant speeches, but Napoleon was better at <span class=\"vocab-trigger\" data-vocab=\"canvassing support\">canvassing support<\/span> for himself in between times. He was especially successful with the sheep. Of late the sheep had taken to bleating “Four legs good, two legs bad” both in and out of season, and they often interrupted the Meeting with this. It was noticed that they were especially <span class=\"vocab-trigger\" data-vocab=\"liable to break into\">liable to break into<\/span> “Four legs good, two legs bad” at crucial moments in Snowball’s speeches. Snowball had made a close study of some <span class=\"vocab-trigger\" data-vocab=\"back numbers\">back numbers<\/span> of the ‘Farmer and Stockbreeder’ which he had found in the farmhouse, and was full of plans for <span class=\"vocab-trigger\" data-vocab=\"innovations and improvements\">innovations and improvements<\/span>. He talked <span class=\"vocab-trigger\" data-vocab=\"learnedly\">learnedly<\/span> about <span class=\"vocab-trigger\" data-vocab=\"field drains\">field drains<\/span>, <span class=\"vocab-trigger\" data-vocab=\"silage\">silage<\/span>, and <span class=\"vocab-trigger\" data-vocab=\"basic slag\">basic slag<\/span>, and had worked out a complicated scheme for all the animals to drop their dung directly in the fields, at a different spot every day, to save the labour of <span class=\"vocab-trigger\" data-vocab=\"cartage\">cartage<\/span>. Napoleon produced no schemes of his own, but said quietly that Snowball’s would <span class=\"vocab-trigger\" data-vocab=\"come to nothing\">come to nothing<\/span>, and seemed to be <span class=\"vocab-trigger\" data-vocab=\"biding his time\">biding his time<\/span>. But of all their <span class=\"vocab-trigger\" data-vocab=\"controversies\">controversies<\/span>, none was so bitter as the one that took place over the windmill.",
              "zh": "在大会上，雪球常凭雄辩的口才赢得多数，但在会下活动拉拢支持方面，拿破仑更胜一筹。他对绵羊尤其成功。近来绵羊不论什么场合都爱咩咩地喊“四条腿好，两条腿坏”，还经常用这打断会议。大家注意到，每逢雪球的演讲到了关键时刻，他们就特别容易喊出“四条腿好，两条腿坏”。雪球在农庄住宅里找到的几本过期的《农场主与畜牧家》杂志，仔细研读了一番，满脑子都是革新和改良的计划。他头头是道地谈论着田间排水、青贮饲料和碱性炉渣，还设计了一套复杂的方案，让所有动物把粪便直接拉到田里，每天换一个地方，以节省运粪的人工。拿破仑自己什么方案也不提，只是不动声色地说雪球的方案都会落空，似乎正在等待时机。而在他们所有的论战里，还没有哪一次像围绕风车发生的那场那样激烈。",
              "simpEn": "At the Meetings, Snowball often won over the majority with his powerful speeches, but Napoleon was better at secretly gathering support during the rest of the time. He was especially good with the sheep. Lately the sheep had started bleating 'Four legs good, two legs bad' at all times, often interrupting Meetings. They were especially likely to start this at key moments in Snowball's speeches. Snowball had carefully studied old copies of a farming magazine found in the house and was full of plans for new ideas and better ways. He talked like an expert about water channels in fields, stored fermented grass, and a type of fertilizer. He had even designed a complex plan for animals to drop their waste right onto the fields in a different spot each day, saving the work of moving it. Napoleon offered no plans of his own, just quietly said Snowball's would fail, and seemed to be waiting for the right moment. But of all their fights, none was as fierce as the one about the windmill.",
              "simpZh": "大会上雪球常凭好口才赢得多数，可拿破仑更会在私下活动拉支持。他尤其会笼络绵羊。近来绵羊不管什么时候都喊“四条腿好，两条腿坏”，常打断会议。一到雪球讲话的关键时刻，它们就特别容易叫。雪球仔细研读过住宅里找出的过期农刊，脑子里全是新花样。他像行家一样谈田间排水、青贮饲料和一种肥料，还设计了复杂的方案，让动物们每天往田里不同地方直接拉粪，省了搬运的力气。拿破仑自己没方案，只不紧不慢地说雪球的会白费，像是在等时机。可在他们所有的争执中，没有哪一回像风车这件事吵得那么凶。"

        {
          "sectionId": 3,
          "heading": "Snowball’s Windmill Plans",
          "paragraphs": [
            {
              "en": "In the long pasture, not far from the farm buildings, there was a small <span class=\"vocab-trigger\" data-vocab=\"knoll\">knoll<\/span> which was the highest point on the farm. After surveying the ground, Snowball declared that this was just the place for a windmill, which could be made to operate a <span class=\"vocab-trigger\" data-vocab=\"dynamo\">dynamo<\/span> and supply the farm with electrical power. This would light the stalls and warm them in winter, and would also run a <span class=\"vocab-trigger\" data-vocab=\"circular saw\">circular saw<\/span>, a <span class=\"vocab-trigger\" data-vocab=\"chaff-cutter\">chaff-cutter<\/span>, a <span class=\"vocab-trigger\" data-vocab=\"mangel-slicer\">mangel-slicer<\/span>, and an electric milking machine. The animals had never heard of anything of this kind before (for the farm was an old-fashioned one and had only the most <span class=\"vocab-trigger\" data-vocab=\"primitive machinery\">primitive machinery<\/span>), and they listened in astonishment while Snowball <span class=\"vocab-trigger\" data-vocab=\"conjured up pictures\">conjured up pictures<\/span> of fantastic machines which would do their work for them while they <span class=\"vocab-trigger\" data-vocab=\"grazed at their ease\">grazed at their ease<\/span> in the fields or improved their minds with reading and conversation.",
              "zh": "在长长的牧场上，离农场房舍不远，有一个小丘，那是全农场的最高点。雪球踏勘了地形之后宣布，这正是建造风车的绝佳地点，可以驱动一台发电机，为农场提供电力。电可以用来照亮厩栏、冬季供暖，还能带动圆锯、铡草机、甜菜切片机以及电动挤奶机。动物们以前从没听说过这种东西（因为这是个老式农场，只有最原始的机械），他们惊愕地听着雪球描摹出一幅幅神奇机器的图景，那些机器会替他们干活，他们却可以在田野里悠闲地吃草，或者靠读书和交谈来提高修养。",
              "simpEn": "In the long grass field, near the farm buildings, there was a small hill, the highest point on the farm. After studying the land, Snowball said this was the perfect spot for a windmill, which could run a generator and give electricity to the farm. This would provide light and heat in the stalls in winter, and power a round saw, a hay chopper, a root-vegetable slicer, and an electric milking machine. The animals had never heard of such things (the farm was old-fashioned with only basic tools), and they listened in amazement as Snowball painted pictures of wonderful machines doing their work while they ate grass comfortably in the fields or improved their minds with reading and talking.",
              "simpZh": "在长长的草场里，挨着农场房子不远，有个小丘，是农场最高点。雪球看过地势后说，这地方正适合建风车，能带动一台发电机，给农场供电。电可以照亮厩栏、冬天供暖，还能开动圆锯、切草机、甜菜切片机和电动挤奶器。动物们以前听都没听过（农场老式，只有最简陋的机器），他们听得目瞪口呆，雪球描绘出神奇机器的图景，说那些机器会替他们干活，他们可以舒舒服服在田里吃草，或者读书聊天长知识。"
            },
            {
              "en": "Within a few weeks Snowball’s plans for the windmill were fully worked out. The mechanical details came mostly from three books which had belonged to Mr. Jones — ‘One Thousand Useful Things to Do About the House’, ‘Every Man His Own Bricklayer’, and ‘Electricity for Beginners’. Snowball used as his study a shed which had once been used for <span class=\"vocab-trigger\" data-vocab=\"incubators\">incubators<\/span> and had a smooth wooden floor, suitable for drawing on. He was <span class=\"vocab-trigger\" data-vocab=\"closeted there for hours at a time\">closeted there for hours at a time<\/span>. With his books held open by a stone, and with a piece of chalk gripped between the <span class=\"vocab-trigger\" data-vocab=\"knuckles\">knuckles<\/span> of his <span class=\"vocab-trigger\" data-vocab=\"trotter\">trotter<\/span>, he would move rapidly to and fro, drawing in line after line and <span class=\"vocab-trigger\" data-vocab=\"uttering little whimpers of excitement\">uttering little whimpers of excitement<\/span>. Gradually the plans grew into a complicated mass of <span class=\"vocab-trigger\" data-vocab=\"cranks and cog-wheels\">cranks and cog-wheels<\/span>, covering more than half the floor, which the other animals found completely <span class=\"vocab-trigger\" data-vocab=\"unintelligible\">unintelligible<\/span> but very impressive. All of them came to look at Snowball’s drawings at least once a day. Even the hens and ducks came, and were <span class=\"vocab-trigger\" data-vocab=\"at pains not to tread on the chalk marks\">at pains not to tread on the chalk marks<\/span>. Only Napoleon <span class=\"vocab-trigger\" data-vocab=\"held aloof\">held aloof<\/span>. He had declared himself against the windmill from the start. One day, however, he arrived unexpectedly to examine the plans. He walked heavily round the shed, looked closely at every detail of the plans and <span class=\"vocab-trigger\" data-vocab=\"snuffed at them\">snuffed at them<\/span> once or twice, then stood for a little while <span class=\"vocab-trigger\" data-vocab=\"contemplating them out of the corner of his eye\">contemplating them out of the corner of his eye<\/span>; then suddenly he lifted his leg, <span class=\"vocab-trigger\" data-vocab=\"urinated over the plans\">urinated over the plans<\/span>, and walked out without uttering a word.",
              "zh": "不出几个星期，雪球的风车设计图便全部完成了。机械方面的细节主要来自琼斯先生的三本书——《家庭实用千事通》、《人人自家当瓦匠》和《电学入门》。雪球把一间原先用于孵蛋的棚子当书房，那里有光滑的木地板，适合画图。他常常一连几个钟头关在里面。他用石头把书压着打开，在蹄子的两节关节之间夹一支粉笔，快速地在棚子里走来走去，画了一条又一条线，兴奋得发出小小的哼哼声。逐渐地，设计图发展成了一个布满曲柄和齿轮的复杂组合体，覆盖了大半个地板，其他动物看了，完全搞不懂，但觉得十分了不起。他们每天至少都要来看一次雪球的图。连母鸡和鸭子也来了，而且都小心翼翼不去踩到粉笔印子。只有拿破仑始终置身事外。他从一开始就宣布反对风车。可是有一天，他出其不意地跑来检查图纸。他绕着棚子沉重地走了一圈，仔细看了图纸的每一个细节，还凑上去闻了一两回，然后歪着脑袋，用眼角余光端详了一阵；接着突然一抬腿，对着图纸撒了一泡尿，一句话没说就走了出去。",
              "simpEn": "Within a few weeks Snowball's windmill plans were complete. The technical details came mostly from three books that had belonged to Mr. Jones: a home handyman book, a bricklaying guide, and an electricity beginner's manual. Snowball used an old hatching shed with a smooth wooden floor as his study. He would shut himself in there for hours. With a stone holding his books open and a piece of chalk held between the joints of his pig foot, he moved back and forth quickly, drawing line after line and making little excited sounds. Slowly the plans became a mess of bent bars and toothed wheels covering over half the floor, which the other animals found impossible to understand but very impressive. They all came to look at least once a day. Even the hens and ducks came and were careful not to step on the chalk marks. Only Napoleon kept away. He had been against the windmill from the beginning. One day, however, he came without warning to look at the plans. He walked heavily around the shed, studied every detail closely, sniffed them once or twice, then stood for a bit looking at them sideways; then suddenly he lifted his leg, peed on the plans, and walked out without a word.",
              "simpZh": "几星期内雪球的风车图全画好了。机械方面的细节主要来自琼斯先生的三本书：《家庭实用千事通》、《人人当瓦匠》和《电学入门》。雪球把一间孵蛋棚当书房，那有平滑的木地板好画图。他把自己关在里面一待就是几个钟头。用石头压着打开的书，蹄子关节间夹根粉笔，快速地走来走去，画了一条又一条线，嘴里兴奋地哼哼。渐渐地图纸变成曲柄和齿轮的复杂大堆，铺了大半个地板，别的动物看了完全不懂，但觉得很了不起。大家每天至少来看一次。连鸡鸭也来，还小心翼翼不踩粉笔道道。只有拿破仑不理不睬。他从一开始就反对风车。可有一天，他冷不丁跑来查看图纸。他绕着棚子重重走了一圈，仔细看了每个细节，还凑上去闻了一两回，然后歪着脑袋用眼角瞄了一会；忽然一抬腿，对着图纸撒了泡尿，一声不响走了。"
            }

          "sectionId": 4,
          "heading": "Division over the Windmill and Defence",
          "paragraphs": [
            {
              "en": "The whole farm was deeply divided on the subject of the windmill. Snowball did not deny that to build it would be a difficult business. Stone would have to be carried and built up into walls, then the <span class=\"vocab-trigger\" data-vocab=\"sails\">sails<\/span> would have to be made and after that there would be need for dynamos and cables. (How these were to be <span class=\"vocab-trigger\" data-vocab=\"procured\">procured<\/span>, Snowball did not say.) But he maintained that it could all be done in a year. And thereafter, he declared, so much labour would be saved that the animals would only need to work three days a week. Napoleon, on the other hand, argued that the great need of the moment was to increase food production, and that if they wasted time on the windmill they would all starve to death. The animals formed themselves into two <span class=\"vocab-trigger\" data-vocab=\"factions\">factions<\/span> under the <span class=\"vocab-trigger\" data-vocab=\"slogan\">slogan<\/span>, “Vote for Snowball and the three-day week” and “Vote for Napoleon and the full manger.” Benjamin was the only animal who did not <span class=\"vocab-trigger\" data-vocab=\"side with\">side with<\/span> either faction. He refused to believe either that food would become more plentiful or that the windmill would save work. Windmill or no windmill, he said, life would go on as it had always gone on — that is, badly.",
              "zh": "整个农场在风车问题上分裂成了两派。雪球不否认，建风车是一件艰巨的工程。要搬运石头砌墙，然后要造风车的翼板，接下来还需要发电机和电缆。（这些东西要怎么搞到，雪球没有说。）但他坚持认为，这一切一年之内就能完成。他还宣布，到那时会节省下大量的劳动力，动物们每周只需工作三天就够了。拿破仑则针锋相对地论证说，当前最紧迫的需求是增加粮食生产，要是把时间浪费在风车上，大家都会饿死。动物们分成了两派，各自喊出了口号：“投雪球的票，每周三天工作”和“投拿破仑的票，槽满食粮”。本杰明是唯一不站在任何一派的动物。他既不信食物会变得更丰足，也不信风车能节省劳力。风车也罢，没风车也罢，他说，日子总会像历来那样过下去——也就是，糟糕地过下去。",
              "simpEn": "The whole farm was deeply split over the windmill. Snowball admitted building it would be hard. They would need to carry stones and build walls, then make the blades, and after that get generators and wires. (Snowball didn't explain how they'd get these.) But he insisted it could all be done in a year. After that, he said, so much work would be saved that animals would only have to work three days a week. Napoleon, however, argued that the most important thing right now was to grow more food, and wasting time on the windmill would starve them all. The animals split into two groups with sayings: 'Vote for Snowball and the three-day week' and 'Vote for Napoleon and the full feed trough.' Benjamin was the only one who took no side. He didn't believe food would increase or the windmill would save work. Windmill or not, he said, life would go on as it always had — that is, badly.",
              "simpZh": "全农场在风车问题上分成了两派。雪球承认建风车很难。得搬运石头砌墙，然后造翼板，之后还要发电机和电缆。（这些怎么弄来，雪球没说。）可他坚持说一年就能全干完。到那时，他说，省下那么多工夫，动物每周只要干三天活。拿破仑则说眼前最要紧的是多产粮食，把时间花在风车上大家都会饿死。动物们分成两派，一派喊“投雪球，每周三天班”，一派喊“投拿破仑，槽满食粮”。本杰明是唯一不站边的。他既不信食物会变多，也不信风车能省力。有没有风车，他说，日子都会像一直那样过——也就是，糟地过下去。"
            },
            {
              "en": "Apart from the disputes over the windmill, there was the question of the defence of the farm. It was fully realised that though the human beings had been defeated in the Battle of the Cowshed they might make another and more determined attempt to recapture the farm and <span class=\"vocab-trigger\" data-vocab=\"reinstate Mr. Jones\">reinstate Mr. Jones<\/span>. They had all the more reason for doing so because the news of their defeat had spread across the countryside and made the animals on the neighbouring farms more <span class=\"vocab-trigger\" data-vocab=\"restive\">restive<\/span> than ever. As usual, Snowball and Napoleon were in disagreement. According to Napoleon, what the animals must do was to <span class=\"vocab-trigger\" data-vocab=\"procure firearms\">procure firearms<\/span> and train themselves in the use of them. According to Snowball, they must send out more and more pigeons and <span class=\"vocab-trigger\" data-vocab=\"stir up rebellion\">stir up rebellion<\/span> among the animals on the other farms. The one argued that if they could not defend themselves they were <span class=\"vocab-trigger\" data-vocab=\"bound to be conquered\">bound to be conquered<\/span>, the other argued that if rebellions happened everywhere they would have no need to defend themselves. The animals listened first to Napoleon, then to Snowball, and could not <span class=\"vocab-trigger\" data-vocab=\"make up their minds\">make up their minds<\/span> which was right; indeed, they always found themselves in agreement with the one who was speaking at the moment.",
              "zh": "除了风车的争执，还有农场的防御问题。大家充分认识到，尽管人类在牛棚战役中被打败了，他们可能还会发起另一场更加坚决的进攻，企图夺回农场并让琼斯先生复辟。他们有更多理由这样做，因为他们战败的消息已经传遍了乡间，让邻近农场的动物们比以往更不安分。跟往常一样，雪球和拿破仑意见不一。按拿破仑的说法，动物们该做的是去搞到枪炮，训练自己掌握使用它们的方法。按雪球的说法，他们必须派更多的鸽子出去，煽动其他农场的动物起来造反。一个论证说，如果他们不能自卫，就注定会被征服；另一个则论证说，如果各地都发生了造反，他们就不需要自卫了。动物们先听拿破仑，再听雪球，拿不准哪一个是对的；说真的，他们总是觉得正在说话的那个是对的。",
              "simpEn": "Besides the windmill fight, there was the matter of farm defence. Everyone understood that although the humans had lost the Battle of the Cowshed, they might try again harder to take back the farm and put Jones back in charge. They had even more reason because news of their defeat had spread and made animals on nearby farms even more unwilling to be controlled. As always, Snowball and Napoleon disagreed. Napoleon said the animals must get guns and learn to use them. Snowball said they must send more pigeons to encourage rebellion on other farms. One said if they couldn't defend themselves they would surely be beaten; the other said if rebellions happened everywhere they wouldn't need to defend themselves. The animals listened first to Napoleon, then to Snowball, and couldn't decide who was right; in fact, they always agreed with whoever was speaking at the moment.",
              "simpZh": "除了风车，还有农场防御的事。大家都明白，虽然人被打败了，他们可能更拼命地来夺回农场，让琼斯复位。他们更有理由这样做了，因为战败的消息传遍乡间，邻近农场的动物更躁动了。跟以往一样，雪球和拿破仑意见不同。拿破仑说动物们必须弄枪炮来学着用。雪球说必须派更多鸽子出去鼓动别处动物造反。一个说不能自卫就一定被打败，另一个说别处都造反了就用不着自卫。动物们先听拿破仑，再听雪球，拿不准谁对；说真的，他们总觉着正在讲话的那个对。"
