        {
          "sectionId": 5,
          "heading": "The Meeting and Snowball’s Expulsion",
          "paragraphs": [
            {
              "en": "At last the day came when Snowball’s plans were completed. At the Meeting on the following Sunday the question of whether or not to begin work on the windmill was to be put to the vote. When the animals had assembled in the big barn, Snowball stood up and, though occasionally interrupted by bleating from the sheep, set forth his reasons for <span class=\"vocab-trigger\" data-vocab=\"advocating\">advocating<\/span> the building of the windmill. Then Napoleon stood up to reply. He said very quietly that the windmill was nonsense and that he advised nobody to vote for it, and promptly sat down again; he had spoken for barely thirty seconds, and seemed almost <span class=\"vocab-trigger\" data-vocab=\"indifferent\">indifferent<\/span> as to the effect he produced. At this Snowball <span class=\"vocab-trigger\" data-vocab=\"sprang to his feet\">sprang to his feet<\/span>, and shouting down the sheep, who had begun bleating again, <span class=\"vocab-trigger\" data-vocab=\"broke into a passionate appeal\">broke into a passionate appeal<\/span> in favour of the windmill. Until now the animals had been about equally divided in their sympathies, but in a moment Snowball’s <span class=\"vocab-trigger\" data-vocab=\"eloquence\">eloquence<\/span> had carried them away. In <span class=\"vocab-trigger\" data-vocab=\"glowing sentences\">glowing sentences<\/span> he painted a picture of Animal Farm as it might be when <span class=\"vocab-trigger\" data-vocab=\"sordid labour\">sordid labour<\/span> was lifted from the animals’ backs. His imagination had now run far beyond chaff-cutters and turnip-slicers. Electricity, he said, could operate threshing machines, ploughs, <span class=\"vocab-trigger\" data-vocab=\"harrows\">harrows<\/span>, rollers, and <span class=\"vocab-trigger\" data-vocab=\"reapers and binders\">reapers and binders<\/span>, besides supplying every stall with its own electric light, hot and cold water, and an electric heater. By the time he had finished speaking, there was no doubt as to which way the vote would go. But just at this moment Napoleon stood up and, <span class=\"vocab-trigger\" data-vocab=\"casting a peculiar sidelong look\">casting a peculiar sidelong look<\/span> at Snowball, <span class=\"vocab-trigger\" data-vocab=\"uttered a high-pitched whimper\">uttered a high-pitched whimper<\/span> of a kind no one had ever heard him utter before.",
              "zh": "雪球的设计图完成的那一天终于来了。到了接下来的星期天，在大会上，是否要开工建造风车的问题将付诸表决。动物们在大谷仓里集合后，雪球站了起来，尽管不时被绵羊的咩咩声打断，还是陈述了他主张建造风车的理由。接着拿破仑站起来答辩。他轻描淡写地说风车是胡扯，劝谁都别投赞成票，随即又坐了下去；他总共只说了不到半分钟，而且似乎对自己造成的效果毫不在意。这时雪球跳起身来，压住又开始咩咩叫的绵羊，发表了一通热情洋溢的讲话，力挺风车。在这之前，动物们的同情心差不多旗鼓相当，可一瞬间，雪球的口才就把大家统统迷住了。他用热情绚烂的语句描绘了动物农场在摆脱了污秽苦役之后可能呈现的景象。他的想象力如今早已超越了铡草机和切片机。他说，电可以开动脱粒机、犁、耙、碾压机以及收割机和打捆机，还可以为每个厩栏供应电灯、冷热水和电暖炉。到他说完的时候，表决结果已经毫无悬念了。可就在这个当口，拿破仑站了起来，朝雪球投去一种古怪的斜眼，发出了一声谁也没听他用过的高音调哼哼。",
              "simpEn": "At last the day arrived when Snowball's plans were complete. The next Sunday's Meeting would vote on whether to start building the windmill. Once the animals gathered in the barn, Snowball stood up. Even though the sheep interrupted him with bleating, he explained his reasons for supporting the windmill. Then Napoleon stood to reply. He said very calmly that the windmill was nonsense and advised no one to vote for it, then sat back down. He spoke barely thirty seconds and seemed not to care what effect he had. At this, Snowball jumped up, shouted over the sheep who started bleating again, and made an emotional, excited speech for the windmill. Until then, support had been about equal, but Snowball's powerful speaking quickly won them over. With wonderful words he described a future Animal Farm free from dirty, hard labour. His imagination now went far beyond choppers and slicers. Electricity, he said, could run threshing machines, ploughs, soil breakers, rollers, and harvesting machines, plus give each stall its own light, hot and cold water, and a heater. When he finished, the vote's result was clear. But just then Napoleon stood up, gave Snowball a strange sideways look, and made a high-pitched cry no one had heard before.",
              "simpZh": "雪球的图终于全画完了。下个星期天大会要投票决定动不动工造风车。动物们在谷仓聚齐，雪球站起来，虽然绵羊不断咩咩打断，他还是摆出了支持风车的理由。接着拿破仑站起来回话。他不动声色地说风车是瞎扯，叫谁也别投赞成票，说完又坐下；总共说了不到半分钟，像是满不在乎。雪球蹦了起来，压住又在咩咩的羊，激情四射地替风车呼吁。在这之前两边支持差不多，可雪球的口才一下就把大家迷住了。他用绚烂的字句描绘动物农场摆脱肮脏苦活后的未来。他的想象早超过了切草机和切片机。电，他说，能开动脱粒机、犁、耙、碾压机、收割打捆机，还给每个厩栏供应电灯、冷热水和电暖炉。等他说完，表决结果没悬念了。可就在这时，拿破仑站起来，斜眼怪怪地看了看雪球，发出一声谁也没听他用过的高声哼哼。"
            },
            {
              "en": "At this there was a terrible <span class=\"vocab-trigger\" data-vocab=\"baying\">baying<\/span> sound outside, and nine enormous dogs wearing <span class=\"vocab-trigger\" data-vocab=\"brass-studded collars\">brass-studded collars<\/span> came bounding into the barn. They dashed straight for Snowball, who only sprang from his place just in time to escape their <span class=\"vocab-trigger\" data-vocab=\"snapping jaws\">snapping jaws<\/span>. In a moment he was out of the door and they were after him. Too amazed and frightened to speak, all the animals crowded through the door to watch the chase. Snowball was racing across the long pasture that led to the road. He was running as only a pig can run, but the dogs were close on his heels. Suddenly he slipped and it seemed certain that they had him. Then he was up again, running faster than ever, then the dogs were gaining on him again. One of them <span class=\"vocab-trigger\" data-vocab=\"all but closed his jaws on Snowball’s tail\">all but closed his jaws on Snowball’s tail<\/span>, but Snowball <span class=\"vocab-trigger\" data-vocab=\"whisked it free\">whisked it free<\/span> just in time. Then he <span class=\"vocab-trigger\" data-vocab=\"put on an extra spurt\">put on an extra spurt<\/span> and, with a <span class=\"vocab-trigger\" data-vocab=\"few inches to spare\">few inches to spare<\/span>, slipped through a hole in the hedge and was seen no more.",
              "zh": "话音刚落，外面响起一阵可怕的犬吠，九条戴着镶铜钉项圈的巨型狗冲进了谷仓。它们直扑雪球而去，雪球才从座位上蹦开，堪堪躲过那咬合的利齿。一瞬间他已经出了门，那些狗紧追不舍。动物们全吓傻了，一句话也说不出来，挤在门口看那追赶。雪球飞奔着穿过那块通向大路的长牧场。他以只有猪才能达到的速度奔跑，可那些狗紧咬着脚跟。忽然他滑了一下，眼看就要被逮住了。接着他又爬了起来，跑得比刚才更快，而狗却再次逼近。其中一条几乎已经把嘴巴咬到雪球的尾巴上，但雪球刚好一甩尾巴挣脱了。接着他又加了一把劲，仅以一丁点儿差距，钻过树篱上的一个洞，就此消失不见了。",
              "simpEn": "Right then, a terrible deep barking came from outside, and nine huge dogs with brass-studded collars came running into the barn. They went straight for Snowball, who just jumped from his spot in time to escape their biting mouths. In a moment he was through the door with the dogs after him. Too shocked and scared to speak, all the animals pushed through the door to watch the chase. Snowball raced across the long grass field toward the road. He ran as only a pig can, but the dogs were close behind. Suddenly he slipped, and it looked like they had him. Then he was up again, running faster, but the dogs got closer again. One almost caught his tail in its mouth, but Snowball pulled it free just in time. Then he made a final burst of speed and, with just a few inches to spare, slipped through a hole in the hedge and was never seen again.",
              "simpZh": "这时外面传来一阵可怕的狂吠，九条戴铜钉项圈的巨狗冲进谷仓。它们直扑雪球，雪球刚跳开，才没被咬住嘴。转眼他出了门，狗在后面追。动物们全吓呆了，说不出话，挤在门口看。雪球飞奔着穿过通马路的长草场。他跑得像猪一样快，可狗紧咬着脚后跟。突然他滑了一下，眼看要被抓住了。接着又爬起来，跑得更快，狗又逼近了。一条狗几乎咬着了他的尾巴，可雪球刚好甩开。他再加了一把劲，只差一点点，钻过树篱上的洞，再没看见了。"
            }
          ],
          "quiz": [

        {
          "sectionId": 6,
          "heading": "Napoleon Takes Power",
          "paragraphs": [
            {
              "en": "Silent and terrified, the animals crept back into the barn. In a moment the dogs came bounding back. At first no one had been able to imagine where these creatures came from, but the problem was soon solved: they were the puppies whom Napoleon had taken away from their mothers and reared privately. Though not yet full-grown, they were huge dogs, and as fierce-looking as wolves. They kept close to Napoleon. It was noticed that they wagged their tails to him in the same way as the other dogs had been used to do to Mr. Jones.",
              "zh": "动物们又惊又怕，鸦雀无声地溜回了谷仓。不一会，那群狗也蹦了回来。起初谁也想不出这些家伙是从哪里来的，但谜底很快揭开了：它们正是拿破仑从母亲身边带走、私下里养大的那些小狗。它们还没有完全长大，却已经是些庞然大物，模样凶得像狼。它们寸步不离地挨着拿破仑。大家注意到，它们朝拿破仑摇尾巴的样子，就跟从前别的狗朝琼斯先生摇尾巴一模一样。",
              "simpEn": "Quiet and terrified, the animals went back into the barn. Soon the dogs came running back. At first nobody could figure out where they came from, but the answer was quickly found: they were the puppies Napoleon had taken from their mothers and raised in secret. Though not yet fully grown, they were huge and as frightening as wolves. They stayed close to Napoleon. It was clear they wagged their tails for him just as the other dogs used to do for Mr. Jones.",
              "simpZh": "动物们又怕又静地溜回谷仓。一会儿狗也跑回来了。起初谁也想不出它们从哪来，可答案很快有了：它们就是拿破仑从妈妈身边带走私下养大的那些狗崽。还没完全长大，却已经是大个子，凶得像狼。它们紧跟着拿破仑。大家注意到，它们朝拿破仑摇尾巴的样子，就跟从前别的狗朝琼斯先生摇尾巴一样。"
            },
            {
              "en": "Napoleon, with the dogs following him, now mounted on to the raised portion of the floor where Major had previously stood to deliver his speech. He announced that from now on the Sunday-morning Meetings would come to an end. They were unnecessary, he said, and wasted time. In future all questions relating to the working of the farm would be settled by a special committee of pigs, <span class=\"vocab-trigger\" data-vocab=\"presided over\">presided over<\/span> by himself. These would meet in private and afterwards communicate their decisions to the others. The animals would still assemble on Sunday mornings to <span class=\"vocab-trigger\" data-vocab=\"salute the flag\">salute the flag<\/span>, sing ‘Beasts of England’, and receive their orders for the week; but there would be no more debates.",
              "zh": "拿破仑在群犬簇拥下，登上从前麦哲发表演说时站过的那块高出来的地板。他宣布，从今往后，星期天早上的大会议不再举行了。他说，那没必要，白浪费时间。将来一切有关农场运作的问题，都将由一个由他亲自主持的猪特别委员会来决定。这个委员会将私下开会，然后再把他们的决定传达给其他动物。动物们星期天早上仍然要集合，向旗帜致敬，唱《英格兰兽》，领受一周的指令；但再也不会有辩论了。",
              "simpEn": "Napoleon, with the dogs at his side, now climbed onto the raised floor where Major had once given his speech. He announced that from now on the Sunday-morning Meetings were finished. They were not needed, he said, and wasted time. In the future, all decisions about how the farm ran would be made by a special group of pigs, led by himself. They would meet in private and later tell the others their decisions. The animals would still gather on Sundays to honour the flag, sing 'Beasts of England,' and get their weekly orders, but there would be no more discussions.",
              "simpZh": "拿破仑在狗跟着下，登上以前麦哲讲话的那块高台。他宣布，从今往后星期天早上的大会不开了。他说那没必要，费工夫。以后农场怎么运作的问题，都交给他主持的一个猪特别委员会定。他们私下开会，再把决定通知大家。动物们星期天早上还得集合向旗敬礼，唱《英格兰野兽》，领一周命令；可再没辩论了。"
            },
            {
              "en": "In spite of the shock that Snowball’s <span class=\"vocab-trigger\" data-vocab=\"expulsion\">expulsion<\/span> had given them, the animals were <span class=\"vocab-trigger\" data-vocab=\"dismayed\">dismayed<\/span> by this announcement. Several of them would have protested if they could have found the right arguments. Even Boxer was <span class=\"vocab-trigger\" data-vocab=\"vaguely troubled\">vaguely troubled<\/span>. He set his ears back, shook his <span class=\"vocab-trigger\" data-vocab=\"forelock\">forelock<\/span> several times, and tried hard to <span class=\"vocab-trigger\" data-vocab=\"marshal his thoughts\">marshal his thoughts<\/span>; but in the end he could not think of anything to say. Some of the pigs themselves, however, were more <span class=\"vocab-trigger\" data-vocab=\"articulate\">articulate<\/span>. Four young porkers in the front row uttered shrill squeals of disapproval, and all four of them sprang to their feet and began speaking at once. But suddenly the dogs sitting round Napoleon let out deep, <span class=\"vocab-trigger\" data-vocab=\"menacing growls\">menacing growls<\/span>, and the pigs fell silent and sat down again. Then the sheep broke out into a tremendous bleating of “Four legs good, two legs bad!” which went on for nearly a quarter of an hour and put an end to any chance of discussion.",
              "zh": "尽管雪球的被逐已经让他们十分震骇，这番宣布还是让动物们沮丧不已。有几个动物本想抗议，只是找不出恰当的言辞。就连拳击手也隐约感到不安。他耷拉着耳朵，甩了好几下额毛，拼命想理清思路，但最终还是想不出该说什么。不过，有几头猪倒是比较能言善辩。前排的四只年轻肉猪发出了尖声的不赞成哼哼，四个全都蹦起来，同时开口说话。可是，蹲坐在拿破仑周围的那些狗突然发出深沉而狰狞的咆哮，那几只猪立刻不出声了，重新坐了下去。接着绵羊们爆发出一阵雷鸣般的“四条腿好，两条腿坏！”，持续了将近一刻钟，彻底断送了任何讨论的可能。",
              "simpEn": "Even though Snowball's removal had shocked them, the animals were upset by this news. A few wanted to protest but couldn't find the right words. Even Boxer felt a little worried. He laid his ears back, shook his forehead hair, and tried very hard to organize his thoughts, but in the end couldn't find anything to say. Some of the pigs, however, could speak more clearly. Four young meat pigs in the front row made high, sharp sounds of disagreement and all jumped up, starting to talk at once. But suddenly the dogs around Napoleon made deep, threatening growls, and the pigs fell quiet and sat down. Then the sheep burst into loud bleating of 'Four legs good, two legs bad!' which went on for nearly fifteen minutes and stopped any chance of discussion.",
              "simpZh": "虽然雪球被赶走已让大家惊骇，这个宣布还是让动物们很丧气。有几个想抗议，可想不出恰当的话。连拳击手也隐隐不安。他耷拉着耳朵，甩几把额毛，拼命想理清想法，可到头想不出说什么。不过有几头猪倒是会说。前排四只年轻肉猪发出尖锐的反对哼哼，全跳起来同时开口。可拿破仑旁边的狗突然发出低沉吓人的咆哮，那几头猪马上哑了声坐下了。接着绵羊爆发出震耳的“四条腿好，两条腿坏！”连喊了快一刻钟，把讨论的可能全堵死了。"
            },
            {
              "en": "Afterwards Squealer was sent round the farm to explain the new arrangement to the others.<br>“Comrades,” he said, “I trust that every animal here <span class=\"vocab-trigger\" data-vocab=\"appreciates the sacrifice\">appreciates the sacrifice<\/span> that Comrade Napoleon has made in taking this extra labour upon himself. Do not imagine, comrades, that leadership is a pleasure! On the contrary, it is a <span class=\"vocab-trigger\" data-vocab=\"deep and heavy responsibility\">deep and heavy responsibility<\/span>. No one believes more firmly than Comrade Napoleon that all animals are equal. He would be only too happy to let you make your decisions for yourselves. But sometimes you might make the wrong decisions, comrades, and then where should we be? Suppose you had decided to follow Snowball, with his <span class=\"vocab-trigger\" data-vocab=\"moonshine of windmills\">moonshine of windmills<\/span> — Snowball, who, as we now know, was <span class=\"vocab-trigger\" data-vocab=\"no better than a criminal\">no better than a criminal<\/span>?”<br>“He fought bravely at the Battle of the Cowshed,” said somebody.<br>“Bravery is not enough,” said Squealer. “<span class=\"vocab-trigger\" data-vocab=\"Loyalty and obedience\">Loyalty and obedience<\/span> are more important. And as to the Battle of the Cowshed, I believe the time will come when we shall find that Snowball’s part in it was much <span class=\"vocab-trigger\" data-vocab=\"exaggerated\">exaggerated<\/span>. Discipline, comrades, <span class=\"vocab-trigger\" data-vocab=\"iron discipline\">iron discipline<\/span>! That is the <span class=\"vocab-trigger\" data-vocab=\"watchword\">watchword<\/span> for today. One false step, and our enemies would be upon us. Surely, comrades, you do not want Jones back?”<br>Once again this argument was <span class=\"vocab-trigger\" data-vocab=\"unanswerable\">unanswerable<\/span>. Certainly the animals did not want Jones back; if the holding of debates on Sunday mornings was liable to bring him back, then the debates must stop. Boxer, who had now had time to think things over, <span class=\"vocab-trigger\" data-vocab=\"voiced the general feeling\">voiced the general feeling<\/span> by saying: “If Comrade Napoleon says it, it must be right.” And from then on he adopted the maxim, “Napoleon is always right,” in addition to his private motto of “I will work harder.”",
              "zh": "会后，尖啸者被派到农场各处去向其他动物解释这个新安排。<br>“同志们，”他说，“我相信这儿的每一位动物都理解拿破仑同志把这份额外的担子挑在自己肩上，是做出了怎样的牺牲。同志们，别以为领导地位是种享受！恰恰相反，那是一份沉重而深远的责任。没有谁比拿破仑同志更坚信所有的动物一律平等。他巴不得能让你们自己做决定呢。可是，同志们，有时候你们也许会做出错误的决定，那时我们可怎么办？假如你们当初决定跟着雪球，信他那些风车的鬼话——而雪球，我们现在已经知道，简直跟罪犯没什么两样？”<br>“他在牛棚战役中打得可勇敢。”有个动物说。<br>“光勇敢还不够，”尖啸者说，“忠诚和服从更重要。至于牛棚战役嘛，我相信将来有一天，我们会发现雪球在那场战役里所起的作用被大大夸大了。纪律，同志们，铁的纪律！这就是今天的口号。走错一步，敌人就会扑到我们头上。想必同志们谁也不想要琼斯回来吧？”<br>又一次，这个论点是无法反驳的。动物们当然不愿意琼斯回来；如果星期天早上的辩论会有可能让他回来，那么辩论就必须停止。拳击手这会儿已经细细想过了，说出了大家普遍的感受：“只要拿破仑同志说了，那就准没错。”从那以后，他除了自己那“我要更加努力干活”的座右铭之外，又添上了一条格言：“拿破仑永远正确。”",
              "simpEn": "Afterward, Squealer was sent around the farm to explain the new system. 'Friends,' he said, 'I'm sure every animal here understands the sacrifice Napoleon made by taking on this extra work. Don't think leadership is fun! No, it's a very serious and heavy duty. No one believes more than Napoleon that all animals are equal. He would be very happy to let you decide things yourselves. But sometimes you might make wrong choices, friends, and then where would we be? What if you had chosen to follow Snowball and his silly windmill ideas — Snowball, who we now know was little better than a criminal?' 'He fought bravely at the Battle of the Cowshed,' someone said. 'Bravery is not enough,' said Squealer. 'Loyalty and obedience matter more. And as for the Battle of the Cowshed, I believe one day we'll see that Snowball's role was greatly overstated. Discipline, friends, strict discipline! That's the key word now. One mistake, and our enemies would attack. Surely you don't want Jones back?' Once again, this argument couldn't be answered. Of course the animals didn't want Jones back; if Sunday debates might bring him back, then debates must stop. Boxer, who had had time to think, spoke for everyone: 'If Comrade Napoleon says it, it must be right.' From then on, along with his personal motto 'I will work harder,' he also followed 'Napoleon is always right.'",
              "simpZh": "之后尖啸者被派到农场各处解释新规矩。“朋友们，”他说，“我相信大家都明白拿破仑同志接下这额外担子做了多大牺牲。别以为当领导是享福！不，这是极重极深的担子。没人比拿破仑同志更信所有动物平等。他巴不得让你们自己决定。可有时候你们会选错，朋友们，那咱可咋办？要是你们当初跟了雪球，信他那风车的瞎想——雪球，咱现在知道，跟罪犯差不多？”“他在牛棚战役里很勇敢。”有人说。“光勇敢不够，”尖啸者说，“忠诚和服从更要紧。至于那场仗，我相信有一天咱会发现雪球那点功劳被夸大了。纪律，朋友们，铁纪律！这是今天的口令。走错一步，敌人就扑过来。想必你们不要琼斯回来吧？”这说法又没法反驳。动物们当然不要琼斯回来；如果星期天辩论可能把他招回来，那就得停。拳击手这会儿想过了，说出了大家的心声：“拿破仑同志说的，准没错。”从此，除了自己的“我要更卖力干活”，他又加上一条：“拿破仑永远正确。”"
            }

        {
          "sectionId": 7,
          "heading": "The New Order and the Windmill Resurrected",
          "paragraphs": [
            {
              "en": "By this time the weather had <span class=\"vocab-trigger\" data-vocab=\"broken\">broken<\/span> and the spring ploughing had begun. The shed where Snowball had drawn his plans of the windmill had been shut up and it was assumed that the plans had been rubbed off the floor. Every Sunday morning at ten o’clock the animals assembled in the big barn to receive their orders for the week. The <span class=\"vocab-trigger\" data-vocab=\"skull\">skull<\/span> of old Major, now clean of flesh, had been <span class=\"vocab-trigger\" data-vocab=\"disinterred\">disinterred<\/span> from the orchard and set up on a <span class=\"vocab-trigger\" data-vocab=\"stump\">stump<\/span> at the foot of the flagstaff, beside the gun. After the hoisting of the flag, the animals were required to <span class=\"vocab-trigger\" data-vocab=\"file past the skull in a reverent manner\">file past the skull in a reverent manner<\/span> before entering the barn. Nowadays they did not sit all together as they had done in the past. Napoleon, with Squealer and another pig named Minimus, who had a remarkable gift for composing songs and poems, sat on the front of the raised platform, with the nine young dogs forming a <span class=\"vocab-trigger\" data-vocab=\"semicircle\">semicircle<\/span> round them, and the other pigs sitting behind. The rest of the animals sat facing them in the main body of the barn. Napoleon read out the orders for the week in a <span class=\"vocab-trigger\" data-vocab=\"gruff soldierly style\">gruff soldierly style<\/span>, and after a single singing of ‘Beasts of England’, all the animals <span class=\"vocab-trigger\" data-vocab=\"dispersed\">dispersed<\/span>.",
              "zh": "这时候，天气已转，春耕也开始了。雪球画风车设计图的那间棚子被关了起来，大家以为地板上那些图纸已经被擦掉了。每个星期天早上十点钟，动物们到大谷仓集合，领受一周的指令。老麦哲的头骨，如今已经剔净了肉，从果园里挖了出来，安放在旗杆脚下一截树桩上，紧挨着那杆枪。升旗之后，动物们必须排成队，恭恭敬敬地从那头骨前走过，才能进入谷仓。如今他们已经不像过去那样坐在一起了。拿破仑带着尖啸者和另一头名叫梅尼缪斯的猪——那头猪作诗谱曲有非凡的天赋——坐在高台的前面，九条年轻的大狗在他们周围排成半圆形，其余的猪坐在后面。别的动物则面对他们，坐在谷仓中大部分区域。拿破仑用沙哑而富于军人气概的腔调宣读一周的指令，只唱一遍《英格兰兽》，所有的动物便各自散去了。",
              "simpEn": "By now the weather had changed and spring ploughing had started. The shed where Snowball drew his windmill plans was locked up, and it was thought the plans had been wiped off the floor. Every Sunday at ten, the animals met in the big barn to get their weekly orders. Old Major's skull, now clean of flesh, had been dug up from the orchard and placed on a stump at the bottom of the flagpole, next to the gun. After raising the flag, the animals had to walk past the skull in a respectful manner before entering the barn. They no longer sat together as before. Napoleon, with Squealer and another pig named Minimus, who had a gift for making songs and poems, sat at the front of the platform, with the nine young dogs forming a half-circle around them and the other pigs behind. The other animals sat facing them. Napoleon read the week's orders in a rough, military way, and after singing 'Beasts of England' just once, all the animals left.",
              "simpZh": "这时天气转好，春耕开始了。雪球画图那间棚子被锁了，大家以为地板上的图已经抹掉。每星期天十点，动物们到大谷仓领一周命令。老麦哲的头骨，已经刮净了肉，从果园挖出来，摆在旗杆脚下一截树桩上，挨着枪。升完旗，动物们必须恭恭敬敬地从头骨前排着队走过，才能进谷仓。如今他们不再像过去那样混坐。拿破仑带着尖啸者和另一只叫米尼姆斯的猪——那猪很会编歌作诗——坐在台前，九条大狗围着他们排成半圆，别的猪坐在后面。其他动物面对着他们坐在谷仓中部。拿破仑用粗哑的军人腔调宣读一周命令，只唱一遍《英格兰野兽》，所有动物就散了。"

            {
              "en": "On the third Sunday after Snowball’s expulsion, the animals were somewhat surprised to hear Napoleon announce that the windmill was to be built after all. He did not give any reason for having changed his mind, but merely warned the animals that this extra task would mean very hard work, it might even be necessary to <span class=\"vocab-trigger\" data-vocab=\"reduce their rations\">reduce their rations<\/span>. The plans, however, had all been prepared, down to the last detail. A special committee of pigs had been at work upon them for the past three weeks. The building of the windmill, with various other improvements, was expected to take two years.",
              "zh": "雪球被逐后第三个星期天，动物们有些吃惊地听到拿破仑宣布，风车终究还是要建造的。他并没有解释改变主意的理由，只是警告动物们，这项额外的任务将意味着极其艰苦的劳作，甚至有可能需要削减他们的口粮。不过，计划却早已准备好了，连最后的细节都订好了。一个猪的特别委员会在过去三周里一直在忙这事。建造风车，连同其他几项改进，预计需要两年的时间。",
              "simpEn": "On the third Sunday after Snowball was driven out, the animals were a bit surprised when Napoleon announced that the windmill would be built after all. He didn't explain why he changed his mind, only warned them this extra work would be very hard and might even mean cutting their food. But the plans were already complete, down to the smallest detail. A special pig committee had been working on them for the past three weeks. Building the windmill, plus other improvements, was expected to take two years.",
              "simpZh": "雪球被赶走后第三个星期天，动物们有点吃惊，拿破仑宣布风车终究还是要造。他没说为什么改了主意，只警告这额外活计会非常苦，甚至可能减少口粮。可计划已经全弄好了，细到每一点。一个猪特别委员会过去三周一直在忙这个。造风车，加上别的改进，预计要两年。"

          "heading": "Squealer Explains Napoleon’s ‘Tactics’",
          "paragraphs": [
            {
              "en": "That evening Squealer explained privately to the other animals that Napoleon had never in reality been opposed to the windmill. On the contrary, it was he who had <span class=\"vocab-trigger\" data-vocab=\"advocated\">advocated<\/span> it in the beginning, and the plan which Snowball had drawn on the floor of the incubator shed had actually been stolen from among Napoleon’s papers. The windmill was, in fact, Napoleon’s own <span class=\"vocab-trigger\" data-vocab=\"creation\">creation<\/span>. Why, then, asked somebody, had he spoken so strongly against it? Here Squealer looked very sly. That, he said, was Comrade Napoleon’s <span class=\"vocab-trigger\" data-vocab=\"cunning\">cunning<\/span>. He had SEEMED to oppose the windmill, simply as a <span class=\"vocab-trigger\" data-vocab=\"manoeuvre\">manoeuvre<\/span> to get rid of Snowball, who was a dangerous character and a bad influence. Now that Snowball was out of the way, the plan could go forward without his <span class=\"vocab-trigger\" data-vocab=\"interference\">interference<\/span>. This, said Squealer, was something called <span class=\"vocab-trigger\" data-vocab=\"tactics\">tactics<\/span>. He repeated a number of times, “Tactics, comrades, tactics!” skipping round and whisking his tail with a merry laugh. The animals were not certain what the word meant, but Squealer spoke so <span class=\"vocab-trigger\" data-vocab=\"persuasively\">persuasively<\/span>, and the three dogs who happened to be with him growled so <span class=\"vocab-trigger\" data-vocab=\"threateningly\">threateningly<\/span>, that they accepted his explanation without further questions.",
              "zh": "那天傍晚，尖啸者私下里向其他动物解释说，拿破仑其实从来就没有反对过风车。恰恰相反，一开始就是他主张建风车的，雪球在孵蛋棚地板上画的那套设计图，实际上是从拿破仑的文件里偷走的。风车其实是拿破仑自己的创造。那么，为什么他又那么激烈地公开反对呢？有动物问。说到这儿，尖啸者露出了非常狡猾的表情。他说，这就是拿破仑同志的谋略。他表面装出反对风车的样子，纯粹是为了除掉雪球这个危险分子和坏影响。现在雪球已经被排挤走了，计划就能在没有他干扰的情况下推进。这，尖啸者说，就叫做策略。他反复说了好几遍，“策略，同志们，策略！”一边蹦蹦跳跳，甩着尾巴，发出快活的笑声。动物们并不确定这个词是什么意思，但尖啸者说得那么令人信服，而碰巧跟着他的三条狗又咆哮得那么凶恶，他们便不再多问，接受了这番解释。",
              "simpEn": "That evening Squealer explained privately that Napoleon had never really been against the windmill. In fact, it was he who first supported it, and the plan Snowball drew was actually stolen from Napoleon's papers. The windmill was Napoleon's own idea. Then why had he spoken so strongly against it? someone asked. Squealer looked very sly. That, he said, was Napoleon's clever trick. He pretended to oppose it only as a scheme to get rid of Snowball, who was dangerous and a bad influence. Now that Snowball was gone, the plan could move forward without his meddling. This, Squealer said, was called tactics. He repeated, 'Tactics, friends, tactics!' jumping around and swinging his tail with a merry laugh. The animals weren't sure what the word meant, but Squealer spoke so convincingly, and the three dogs with him growled so threateningly, that they accepted his explanation without more questions.",
              "simpZh": "当天傍晚尖啸者私下跟大家解释，拿破仑其实从来没反对过风车。相反，一开始就是他主张造的，雪球画的那图是从拿破仑文件里偷的。风车其实是拿破仑自己的主意。那为啥之前又那么大声反对？有动物问。尖啸者一脸狡猾。他说，这就是拿破仑同志的妙计。他假装反对，纯是为了除掉雪球，那家伙危险又带坏头。现在雪球没了，计划可以不受干扰地推进。尖啸者说，这就叫策略。他连说了好几遍，“策略，同志们，策略！”蹦蹦跳跳甩着尾巴，乐得直笑。动物们不大懂这词什么意思，可尖啸者说得那么中听，跟着的三条狗又咆哮得那么凶，他们就不再问了，接受了这说法。"

          "sectionId": 1,
          "heading": "A Year of Hard Labour",
          "paragraphs": [
            {
              "en": "All that year the animals worked like slaves. But they were happy in their work; they <span class=\"vocab-trigger\" data-vocab=\"grudged no effort or sacrifice\">grudged no effort or sacrifice<\/span>, well aware that everything that they did was for the benefit of themselves and those of their kind who would come after them, and not for a <span class=\"vocab-trigger\" data-vocab=\"pack of idle, thieving human beings\">pack of idle, thieving human beings<\/span>.",
              "zh": "整整一年，动物们像奴隶一样干活。但他们干得高兴；他们不吝惜力气，也不怕牺牲，清楚地知道他们做的一切都是为了自己以及后代的福祉，而不是为了一群懒惰、偷窃的人类。",
              "simpEn": "All year the animals worked like slaves. But they were happy, giving their full effort and not minding sacrifices, because they knew everything they did helped themselves and their future families, not a bunch of lazy, stealing humans.",
              "simpZh": "一整年，动物们像奴隶一样干活。可他们干得开心，肯出力气不怕牺牲，知道做的一切都是为了自己和后代，不是为了那群懒散偷窃的人。"
            },
            {
              "en": "Throughout the spring and summer they worked a <span class=\"vocab-trigger\" data-vocab=\"sixty-hour week\">sixty-hour week<\/span>, and in August Napoleon announced that there would be work on Sunday afternoons as well. This work was strictly <span class=\"vocab-trigger\" data-vocab=\"voluntary\">voluntary<\/span>, but any animal who <span class=\"vocab-trigger\" data-vocab=\"absented himself from it\">absented himself from it<\/span> would have his <span class=\"vocab-trigger\" data-vocab=\"rations reduced by half\">rations reduced by half<\/span>. Even so, it was found necessary to leave certain tasks undone. The harvest was a little less successful than in the previous year, and two fields which should have been <span class=\"vocab-trigger\" data-vocab=\"sown with roots\">sown with roots<\/span> in the early summer were not sown because the <span class=\"vocab-trigger\" data-vocab=\"ploughing\">ploughing<\/span> had not been completed early enough. It was possible to <span class=\"vocab-trigger\" data-vocab=\"foresee\">foresee<\/span> that the coming winter would be a hard one.",
              "zh": "整个春夏两季，他们每周工作六十个小时，到了八月，拿破仑又宣布星期天下午也得干活。这项劳动完全是自愿的，但任何无故缺席的动物口粮将被减去一半。尽管如此，有些活计还是不得不放着不做。收成比前一年略差了些，有两片本应在初夏种上块根作物的地没有种，因为耕翻没有及时完成。可以预见，接下来的冬天将会很艰难。",
              "simpEn": "Through spring and summer they worked sixty hours a week, and in August Napoleon added Sunday afternoons. The extra work was said to be voluntary, but anyone who missed it would have their food cut in half. Even then, some jobs couldn't be finished. The harvest was slightly worse, and two fields meant for root crops weren't planted because ploughing wasn't done in time. It was clear the coming winter would be tough.",
              "simpZh": "整个春夏，他们每星期干六十个钟头，八月拿破仑又加星期天下午的活。说是自愿，可不来的口粮减半。就这也有些活没干完。收成比去年轻微差些，两块该种根菜的地没种上，因为地没及时耕好。看得出冬天会很难过。"

        {
          "sectionId": 2,
          "heading": "The Quarry and Boxer’s Strength",
          "paragraphs": [
            {
              "en": "The windmill presented <span class=\"vocab-trigger\" data-vocab=\"unexpected difficulties\">unexpected difficulties<\/span>. There was a good <span class=\"vocab-trigger\" data-vocab=\"quarry of limestone\">quarry of limestone<\/span> on the farm, and plenty of sand and cement had been found in one of the <span class=\"vocab-trigger\" data-vocab=\"outhouses\">outhouses<\/span>, so that all the materials for building were <span class=\"vocab-trigger\" data-vocab=\"at hand\">at hand<\/span>. But the problem the animals could not at first solve was how to break up the stone into pieces of suitable size. There seemed no way of doing this except with <span class=\"vocab-trigger\" data-vocab=\"picks and crowbars\">picks and crowbars<\/span>, which no animal could use, because no animal could stand on his hind legs. Only after weeks of <span class=\"vocab-trigger\" data-vocab=\"vain effort\">vain effort<\/span> did the right idea occur to somebody — namely, to <span class=\"vocab-trigger\" data-vocab=\"utilise the force of gravity\">utilise the force of gravity<\/span>. Huge <span class=\"vocab-trigger\" data-vocab=\"boulders\">boulders<\/span>, far too big to be used as they were, were lying all over the bed of the quarry. The animals <span class=\"vocab-trigger\" data-vocab=\"lashed ropes\">lashed ropes<\/span> round these, and then all together, cows, horses, sheep, any animal that could <span class=\"vocab-trigger\" data-vocab=\"lay hold of the rope\">lay hold of the rope<\/span> — even the pigs sometimes joined in at critical moments — they dragged them with <span class=\"vocab-trigger\" data-vocab=\"desperate slowness\">desperate slowness<\/span> up the slope to the top of the quarry, where they were <span class=\"vocab-trigger\" data-vocab=\"toppled over the edge\">toppled over the edge<\/span>, to <span class=\"vocab-trigger\" data-vocab=\"shatter to pieces\">shatter to pieces<\/span> below. Transporting the stone when it was once broken was comparatively simple. The horses carried it off in <span class=\"vocab-trigger\" data-vocab=\"cart-loads\">cart-loads<\/span>, the sheep dragged single blocks, even Muriel and Benjamin <span class=\"vocab-trigger\" data-vocab=\"yoked themselves\">yoked themselves<\/span> into an old <span class=\"vocab-trigger\" data-vocab=\"governess-cart\">governess-cart<\/span> and did their share. By late summer a sufficient store of stone had accumulated, and then the building began, under the <span class=\"vocab-trigger\" data-vocab=\"superintendence of the pigs\">superintendence of the pigs<\/span>.",
              "zh": "风车带来了意想不到的困难。农场里本来有一个很好的石灰石采石场，一间外屋里又找到了大量沙子和水泥，建筑材料倒是齐备。可动物们一开始解决不了的问题，是怎样把石头破碎成大小合适的块料。除了用镐和撬棍，似乎别无他法，但动物没法用这些工具，因为没有谁能后腿直立。白费了几星期的力气之后，才有一个动物想到正确的主意——就是利用重力的力量。采石场底部到处横卧着巨大的圆石，太大没法直接使用。动物们用绳子绑住这些石头，然后所有的动物——牛、马、羊，凡能抓住绳子的——全都一起上，在紧要关头连猪有时也加入——拼命地把巨石沿着斜坡一寸一寸拖到采石场顶部，再从边缘推下去，在底下摔成碎块。石头一旦碎裂，运输就相对简单了。马儿们成车成车地运走，绵羊拖运单个的块石，就连穆丽尔和本杰明也给自己套上一辆旧的儿童马车，尽了一份力。到了夏末，石料已经攒够了，建风车的工程于是开始了，由猪负责监工。",
              "simpEn": "The windmill brought unexpected problems. The farm had a good limestone quarry and plenty of sand and cement in a shed, so building materials were ready. But at first the animals couldn't figure out how to break the stone into usable sizes. Only picks and iron bars could do it, but no animal could use those because none could stand on hind legs. After weeks of useless trying, someone thought of using gravity. Huge rocks too big to use lay everywhere in the quarry. The animals tied ropes around them and all together — cows, horses, sheep, anyone who could grab the rope, even pigs sometimes — dragged them slowly up the slope to the top. Then they pushed the rocks over the edge to smash below. Once broken, moving the stone was easier. Horses carted it, sheep pulled single pieces, even Muriel and Benjamin pulled a little cart. By late summer enough stone was gathered and building started, with the pigs in charge.",
              "simpZh": "风车出了没想到的困难。农场有个好石场，棚子里沙子水泥也够，材料不愁。可动物一开始不知道怎样把石头弄碎。只有镐和撬棍行，可动物没法用，因为谁也不能后腿站着。白费了几星期力气，才有个想到用重力的法子。石场底到处都是大石头，大到没法直接用。动物们用绳子捆住，然后牛、马、羊，凡是能抓住绳子的，连猪有时也上来，拼命地把石头慢慢拖上坡顶，从边上推下去，在下面摔碎。石头碎了再运就简单了。马一车车拉，羊拖单块，连穆丽尔和本杰明也套了辆小童车出力。到夏末石头攒够了，就开始建，猪管着。"
            },
            {
              "en": "But it was a slow, <span class=\"vocab-trigger\" data-vocab=\"laborious process\">laborious process<\/span>. Frequently it took a whole day of <span class=\"vocab-trigger\" data-vocab=\"exhausting effort\">exhausting effort<\/span> to drag a single boulder to the top of the quarry, and sometimes when it was pushed over the edge it failed to break. Nothing could have been achieved without Boxer, whose strength seemed equal to that of all the rest of the animals put together. When the boulder began to slip and the animals cried out in <span class=\"vocab-trigger\" data-vocab=\"despair\">despair<\/span> at finding themselves dragged down the hill, it was always Boxer who <span class=\"vocab-trigger\" data-vocab=\"strained himself against the rope\">strained himself against the rope<\/span> and brought the boulder to a stop. To see him <span class=\"vocab-trigger\" data-vocab=\"toiling up the slope inch by inch\">toiling up the slope inch by inch<\/span>, his breath coming fast, the tips of his hoofs <span class=\"vocab-trigger\" data-vocab=\"clawing at the ground\">clawing at the ground<\/span>, and his great sides <span class=\"vocab-trigger\" data-vocab=\"matted with sweat\">matted with sweat<\/span>, filled everyone with admiration. Clover warned him sometimes to be careful not to <span class=\"vocab-trigger\" data-vocab=\"overstrain\">overstrain<\/span> himself, but Boxer would never listen to her. His two <span class=\"vocab-trigger\" data-vocab=\"slogans\">slogans<\/span>, “I will work harder” and “Napoleon is always right,” seemed to him a <span class=\"vocab-trigger\" data-vocab=\"sufficient answer to all problems\">sufficient answer to all problems<\/span>. He had made arrangements with the <span class=\"vocab-trigger\" data-vocab=\"cockerel\">cockerel<\/span> to call him three-quarters of an hour earlier in the mornings instead of half an hour. And in his spare moments, of which there were not many nowadays, he would go alone to the quarry, collect a load of broken stone, and drag it down to the site of the windmill <span class=\"vocab-trigger\" data-vocab=\"unassisted\">unassisted<\/span>.",
              "zh": "然而这个过程既缓慢又费力。往往要把一块巨石拖到采石场顶部就得花上一整天的力气，而且有时从崖边推下去之后，它还摔不碎。没有拳击手，什么也干不成。他的力气好像抵得上所有其他动物加在一起。每当石头开始往下溜，动物们发现自己被拖得跌下山坡而绝望大叫时，总是拳击手拼命拽住绳子，硬把石头拉住。看着他一步一步挣扎着爬坡，喘得上气不接下气，蹄尖死抠着地面，巨大的两胁被汗水湿成一片，所有的动物都满心钦佩。苜蓿有时提醒他小心，别把自己累垮了，但拳击手从来听不进去。他那两句口号——“我要更加努力地干活”和“拿破仑永远正确”——在他看来足以回答一切问题。他已经跟小公鸡约好，早晨提前三刻钟叫醒他，而不是原来的半小时。而在如今已经不多了的闲暇时间里，他还会独自到采石场去，装上一车碎石头，不用人帮忙，自己拖到风车工地上去。",
              "simpEn": "But the process was slow and very hard. Often it took a whole day of tiring work to drag one boulder to the top, and sometimes it didn't even break when pushed over. Nothing could have been done without Boxer, who seemed as strong as all the other animals combined. When a boulder started slipping and animals cried out in hopelessness as they were pulled downhill, Boxer always pushed against the rope with all his might and stopped it. Watching him struggle up the slope little by little, breathing fast, hoof tips digging into the ground, his big sides wet with sweat, everyone admired him. Clover warned him not to push too hard, but he never listened. His two sayings — 'I will work harder' and 'Napoleon is always right' — seemed to solve everything for him. He had the rooster wake him forty-five minutes earlier now instead of thirty. And in his few free moments, he would go alone to the quarry, gather broken stone, and pull it to the windmill site by himself.",
              "simpZh": "可这活儿又慢又苦。常常拖一块大石头到顶就得一整天力气，有时推下去还摔不碎。没拳击手什么也干不成，他的力气像别的动物全加起来。石头往下溜，动物们被拖下山吓得大叫时，总是拳击手拼命顶住绳子让石头停住。看他一点一点挣扎上坡，喘得急，蹄尖抠进地里，大身子汗得湿淋淋的，大家都佩服。苜蓿有时叫他别太拼，可他从不听。他那两句口号——“我要更卖力”和“拿破仑永远正确”——他觉得能答所有问题。他跟公鸡约好，早上提前三刻钟叫他，原来只提前半个钟头。如今少有的空闲，他还自己去采石场装一车碎石头，一个人拖到风车工地。"
            }

          "paragraphs": [
            {
              "en": "The animals were <span class=\"vocab-trigger\" data-vocab=\"not badly off\">not badly off<\/span> throughout that summer, in spite of the hardness of their work. If they had no more food than they had had in Jones's day, at least they did not have less. The advantage of only having to feed themselves, and not having to support five <span class=\"vocab-trigger\" data-vocab=\"extravagant human beings\">extravagant human beings<\/span> as well, was so great that it would have taken a lot of failures to <span class=\"vocab-trigger\" data-vocab=\"outweigh it\">outweigh it<\/span>. And in many ways the animal method of doing things was more efficient and saved labour. Such jobs as <span class=\"vocab-trigger\" data-vocab=\"weeding\">weeding<\/span>, for instance, could be done with a <span class=\"vocab-trigger\" data-vocab=\"thoroughness\">thoroughness<\/span> impossible to human beings. And again, since no animal now stole, it was unnecessary to <span class=\"vocab-trigger\" data-vocab=\"fence off pasture from arable land\">fence off pasture from arable land<\/span>, which saved a lot of labour on the <span class=\"vocab-trigger\" data-vocab=\"upkeep\">upkeep<\/span> of hedges and gates. Nevertheless, as the summer <span class=\"vocab-trigger\" data-vocab=\"wore on\">wore on<\/span>, various <span class=\"vocab-trigger\" data-vocab=\"unforeseen shortages\">unforeseen shortages<\/span> began to make themselves felt. There was need of <span class=\"vocab-trigger\" data-vocab=\"paraffin oil\">paraffin oil<\/span>, nails, string, dog biscuits, and iron for the horses' shoes, none of which could be produced on the farm. Later there would also be need for seeds and <span class=\"vocab-trigger\" data-vocab=\"artificial manures\">artificial manures<\/span>, besides various tools and, finally, the machinery for the windmill. How these were to be <span class=\"vocab-trigger\" data-vocab=\"procured\">procured<\/span>, no one was able to imagine.",
              "zh": "那个夏天，尽管活儿很重，动物们过得倒还不坏。就算他们的食物不比琼斯时代多，至少也不比那时少。只喂饱自己，而不必再供养五个挥霍无度的人，这好处太大了，就算许多失败也抵消不了。而且在很多方面，动物的做事方式效率更高，也更省力。比如除草这样的活计，就能做到人类无法达到的彻底程度。再者，既然动物如今不再偷窃，也就不必用栅栏把牧草地和庄稼地隔开，这又省去了大量修护树篱和大门的劳力。然而，随着夏天渐渐过去，各种未预见到的短缺开始被感觉到了。煤油、钉子、绳子、狗饼干，以及钉马掌用的铁，这些农场里都生产不了。往后还需要种子、人造肥料，外加各种工具，最后还有风车的机器。这些东西怎么弄到手，谁也想不出办法。",
              "simpEn": "That summer, despite the hard work, the animals were not in a bad state. Their food was no less than under Jones. Feeding only themselves, without also supporting five wasteful humans, was such a huge advantage that many failures would be needed to cancel it. Animal methods were often better and saved work. Weeding could be done more completely than any human could. And since no animal stole, there was no need to fence off grass fields from crop fields, saving work on hedges and gates. But as summer passed, unexpected shortages appeared. They needed oil, nails, string, dog biscuits, and iron for horseshoes — none made on the farm. Later they'd need seeds, chemical fertilizers, tools, and the windmill machinery. No one knew how to get these things.",
              "simpZh": "那个夏天虽说活重，动物们日子倒不算差。吃的比琼斯时没少。光喂饱自己，不用再养五个奢侈的人，这好处太大，好多失败也抵不了。动物的做法往往更高效省工。比如除草能干得人没法比的彻底。再说没有动物偷，也不用把草场和庄稼地隔开，省了修树篱和大门的工夫。可夏天慢慢过去，各种没料到的短缺来了。需要煤油、钉子、绳子、狗饼干、马蹄铁用的铁，这些农场产不出。以后还要种子、人造肥料、工具和风车机器。这些东西怎么弄来，谁也想不出。"
            },
            {
              "en": "One Sunday morning, when the animals assembled to receive their orders, Napoleon announced that he had decided upon a new <span class=\"vocab-trigger\" data-vocab=\"policy\">policy<\/span>. From now onwards Animal Farm would <span class=\"vocab-trigger\" data-vocab=\"engage in trade\">engage in trade<\/span> with the neighbouring farms: not, of course, for any commercial purpose, but simply in order to obtain certain materials which were <span class=\"vocab-trigger\" data-vocab=\"urgently necessary\">urgently necessary<\/span>. The needs of the windmill must <span class=\"vocab-trigger\" data-vocab=\"override\">override<\/span> everything else, he said. He was therefore making arrangements to sell a <span class=\"vocab-trigger\" data-vocab=\"stack of hay\">stack of hay<\/span> and part of the current year's wheat crop, and later on, if more money were needed, it would have to be made up by the sale of eggs, for which there was always a market in Willingdon. The hens, said Napoleon, should welcome this <span class=\"vocab-trigger\" data-vocab=\"sacrifice\">sacrifice<\/span> as their own special contribution towards the building of the windmill.",
              "zh": "一个星期天早上，动物们集合领受指令时，拿破仑宣布他决定采取一项新政策。从今往后，动物农场要跟邻近农场做生意了：当然不是为了什么商业目的，而仅仅是为了获得某些急需的物资。他说，风车的需要必须压倒一切。因此他正着手安排卖掉一堆干草和一部分当季的小麦，往后如果需要更多的钱，就得靠卖鸡蛋来补足，鸡蛋在威灵顿是永远有销路的。拿破仑说，母鸡们应当欢迎这一牺牲，看作是她们对建造风车所做的特殊贡献。",
              "simpEn": "One Sunday at orders, Napoleon announced a new plan. From now on Animal Farm would trade with neighboring farms — not for profit, but only to get urgently needed supplies. The windmill's needs came first, he said. He was arranging to sell a haystack and some of the year's wheat. Later, if more money was needed, they'd sell eggs, which always had buyers in Willingdon. The hens, he said, should welcome this sacrifice as their contribution to the windmill.",
              "simpZh": "一个星期天领命令时，拿破仑宣布新政策。从今往后动物农场要跟邻近农场做买卖：不为赚钱，就为弄到急需的东西。风车的需要压倒一切。他正安排卖掉一堆干草和今年一部分麦子。以后钱不够，就卖鸡蛋，威灵顿总有人买。拿破仑说，母鸡们该高兴做这个牺牲，算是对风车的特殊贡献。"

<span class=\"vocab-trigger\" data-vocab=\"intermediary\">intermediary<\/span> between Animal Farm and the outside world, and would visit the farm every Monday morning to receive his instructions. Napoleon ended his speech with his usual cry of “Long live Animal Farm!” and after the singing of ‘Beasts of England’ the animals were <span class=\"vocab-trigger\" data-vocab=\"dismissed\">dismissed<\/span>.",
              "zh": "动物们再次感觉到一种隐隐约约的不安。永不跟人打交道，永不做买卖，永不用钱——这些不正是琼斯被驱逐后那场胜利大会上通过的最初几条决议吗？所有的动物都记得通过过这些决议：或者至少他们以为自己记得。当初拿破仑废除大会时抗议过的那四只年轻猪，又怯生生地提了出来，但马上被狗一阵凶恶的咆哮镇了下去。接着，跟往常一样，绵羊们喊起了“四条腿好，两条腿坏！”，片刻的尴尬就被遮掩了过去。最后拿破仑抬起蹄子示意安静，宣布一切安排他都已经做好了。任何动物都不需要跟人接触，这显然是非常不可取的。他打算自己一力承担。一位住在威灵顿的律师温珀先生，同意充当动物农场与外界之间的中间人，每星期一上午将到农场来领受指示。拿破仑用他惯常的“动物农场万岁！”结束了讲话，唱完《英格兰兽》后，动物们便解散了。",
              "simpEn": "Again the animals felt a slight worry. No dealings with humans, no trade, no money — weren't these passed at the first victory Meeting after Jones was thrown out? All remembered these resolutions, or thought they did. The four young pigs who had protested when Meetings were stopped spoke up nervously, but the dogs' growls quickly shut them up. Then the sheep started 'Four legs good, two legs bad!' and the awkward moment was covered. Napoleon raised his foot for quiet and said he'd arranged everything. No animal would need to meet humans, which would be very bad. He'd carry the load himself. A Mr. Whymper, a lawyer in Willingdon, would act as go-between, visiting every Monday for instructions. Napoleon ended with 'Long live Animal Farm!' and after the song, the animals were sent away.",
              "simpZh": "动物们又感到隐隐不安。不和人打交道，不做买卖，不用钱——这些不正是赶走琼斯后第一次胜利大会上通过的决议吗？大家记得通过过，至少以为记得。当初废除大会时抗议的四只小猪怯怯地提了提，可马上被狗的一阵咆哮压下去。接着羊喊起“四条腿好，两条腿坏！”，一会的尴尬就抹过去了。拿破仑抬蹄子叫静下，说一切他已经全安排好。任何动物不必跟人接触，那很不好。他打算自己扛。一个威灵顿的律师温珀先生，同意当中间人，每星期一上午来领指示。拿破仑照常喊“动物农场万岁！”唱完歌，动物们解散了。"

            {
              "en": "Afterwards Squealer made a <span class=\"vocab-trigger\" data-vocab=\"round of the farm\">round of the farm<\/span> and <span class=\"vocab-trigger\" data-vocab=\"set the animals’ minds at rest\">set the animals’ minds at rest<\/span>. He <span class=\"vocab-trigger\" data-vocab=\"assured them\">assured them<\/span> that the resolution against engaging in trade and using money had never been passed, or even suggested. It was <span class=\"vocab-trigger\" data-vocab=\"pure imagination\">pure imagination<\/span>, probably <span class=\"vocab-trigger\" data-vocab=\"traceable\">traceable<\/span> in the beginning to lies <span class=\"vocab-trigger\" data-vocab=\"circulated by Snowball\">circulated by Snowball<\/span>. A few animals still felt <span class=\"vocab-trigger\" data-vocab=\"faintly doubtful\">faintly doubtful<\/span>, but Squealer asked them <span class=\"vocab-trigger\" data-vocab=\"shrewdly\">shrewdly<\/span>, “Are you certain that this is not something that you have dreamed, comrades? Have you any <span class=\"vocab-trigger\" data-vocab=\"record\">record<\/span> of such a resolution? Is it written down anywhere?” And since it was certainly true that nothing of the kind existed in writing, the animals were satisfied that they had been <span class=\"vocab-trigger\" data-vocab=\"mistaken\">mistaken<\/span>.",
              "zh": "过后尖啸者绕农场走了一圈，让动物们安下心来。他向他们保证，反对做买卖和使用钱币的决议从来就没有通过过，甚至没有提出过。这纯粹是凭空想象，追根溯源的话，很可能是雪球散布的谎言。有几只动物仍隐约觉得不太对劲，但尖啸者狡黠地问他们：“同志们，你们能肯定这不是你们做过的梦吗？这种决议你们有什么记录吗？它写在什么地方吗？”既然的确没有任何白纸黑字的凭证，动物们也就信了，以为是自己搞错了。",

            {
              "en": "Every Monday Mr. Whymper visited the farm as had been arranged. He was a <span class=\"vocab-trigger\" data-vocab=\"sly-looking\">sly-looking<\/span> little man with <span class=\"vocab-trigger\" data-vocab=\"side whiskers\">side whiskers<\/span>, a solicitor in a very small way of business, but <span class=\"vocab-trigger\" data-vocab=\"sharp enough\">sharp enough<\/span> to have realised earlier than anyone else that Animal Farm would need a <span class=\"vocab-trigger\" data-vocab=\"broker\">broker<\/span> and that the <span class=\"vocab-trigger\" data-vocab=\"commissions\">commissions<\/span> would be worth having. The animals watched his coming and going with a kind of <span class=\"vocab-trigger\" data-vocab=\"dread\">dread<\/span>, and avoided him as much as possible. Nevertheless, the sight of Napoleon, <span class=\"vocab-trigger\" data-vocab=\"on all fours\">on all fours<\/span>, delivering orders to Whymper, who stood on two legs, <span class=\"vocab-trigger\" data-vocab=\"roused their pride\">roused their pride<\/span> and partly <span class=\"vocab-trigger\" data-vocab=\"reconciled\">reconciled<\/span> them to the new arrangement. Their relations with the human race were now not quite the same as they had been before. The human beings did not hate Animal Farm any less now that it was <span class=\"vocab-trigger\" data-vocab=\"prospering\">prospering<\/span>; indeed, they hated it more than ever. Every human being held it as an <span class=\"vocab-trigger\" data-vocab=\"article of faith\">article of faith<\/span> that the farm would go <span class=\"vocab-trigger\" data-vocab=\"bankrupt\">bankrupt<\/span> sooner or later, and, above all, that the windmill would be a failure. They would meet in the <span class=\"vocab-trigger\" data-vocab=\"public-houses\">public-houses<\/span> and prove to one another by means of <span class=\"vocab-trigger\" data-vocab=\"diagrams\">diagrams<\/span> that the windmill was bound to fall down, or that if it did stand up, then that it would never work. And yet, <span class=\"vocab-trigger\" data-vocab=\"against their will\">against their will<\/span>, they had developed a certain respect for the <span class=\"vocab-trigger\" data-vocab=\"efficiency\">efficiency<\/span> with which the animals were managing their own affairs. One <span class=\"vocab-trigger\" data-vocab=\"symptom\">symptom<\/span> of this was that they had begun to call Animal Farm by its proper name and ceased to pretend that it was called the Manor Farm. They had also dropped their <span class=\"vocab-trigger\" data-vocab=\"championship of Jones\">championship of Jones<\/span>, who had <span class=\"vocab-trigger\" data-vocab=\"given up hope\">given up hope<\/span> of getting his farm back and gone to live in another part of the county. Except through Whymper, there was <span class=\"vocab-trigger\" data-vocab=\"as yet\">as yet<\/span> no contact between Animal Farm and the outside world, but there were <span class=\"vocab-trigger\" data-vocab=\"constant rumours\">constant rumours<\/span> that Napoleon was about to enter into a <span class=\"vocab-trigger\" data-vocab=\"definite business agreement\">definite business agreement<\/span> either with Mr. Pilkington of Foxwood or with Mr. Frederick of Pinchfield — but never, it was noticed, with both <span class=\"vocab-trigger\" data-vocab=\"simultaneously\">simultaneously<\/span>.",
              "zh": "每星期一，温珀先生按照安排来访农场。他是个模样狡诈的小个子男人，蓄着连鬓胡子，一个生意做得很小的律师，但他足够精明，比谁都更早看出动物农场需要一个代理人，而且佣金颇为可观。动物们看着他的来去，有一种畏惧，尽量躲着他。不过，见到拿破仑用四条腿趴在地上，向两脚站立的温珀发号施令，也激起了他们的自豪感，使他们对这种新安排有了几分接受。他们与人类之间的关系如今已不完全是从前那样了。人类并没有因为动物农场日渐兴旺而少恨它一些；其实他们恨得比以前更厉害了。每一个人都坚信，这个农场迟早会破产，尤其是风车，一定会失败。他们会在酒馆里聚会，用图表互相证明风车肯定要塌，或者即便立住了，也绝不可能转。然而，不由自主地，他们对动物管理自身事务的效率已经产生了一定的敬意。一个迹象就是，他们开始称呼动物农场的正名，不再假装它叫庄园农场了。他们也放弃了为琼斯撑腰，琼斯早已断了夺回农场的念头，搬到郡里另一处去住了。除了通过温珀，动物农场和外界还尚无联系，但是有不断的传闻说，拿破仑即将与福克斯伍德的皮尔金顿先生，或者平奇菲尔德的弗雷德里克先生，签订一份明确的商业协议——但大家注意到，从来没有同时跟两人。",
              "simpEn": "Every Monday Mr. Whymper came as planned. He was a cunning-looking little man with hair on the sides of his face, a small-time lawyer, but smart enough to know Animal Farm would need a middleman and the payments would be worth it. The animals watched him come and go with fear and kept away. Yet seeing Napoleon on all fours giving orders to two-legged Whymper made them proud and partly okay with the new system. Humans didn't hate the farm less because it was doing well; they hated it more. Every human believed the farm would eventually fail and the windmill would collapse. They met in pubs and used drawings to prove it must fall or never work. Still, unwillingly, they respected how well the animals managed things. One sign was they now called it Animal Farm, not Manor Farm. They also stopped supporting Jones, who had given up and moved away. Only through Whymper was there contact with the world, but there were constant rumors that Napoleon was about to sign a business deal with either Pilkington or Frederick — but never both at once.",
              "simpZh": "每星期一温珀按约定来。他是个模样狡猾的小个子，腮边有胡子，小本生意的律师，但人够精明，早看出动物农场需要中间人，佣金值得赚。动物们怕兮兮地看着他来去，尽量躲开。可看到拿破仑四条腿趴着，给两腿站着的温珀下命令，心里又自豪了几分，有点接受了。人类没因为农场兴旺就少恨一点，反倒更恨了。人人都坚信农场早晚破产，风车一定垮。他们在酒馆聚会，用图证明风车准塌，要不就算立着也转不了。可不由自主地，他们对动物管事的效率有了些敬意。一个迹象就是他们开始叫动物农场的正名，不再假装叫庄园农场。也不再替琼斯撑腰了，琼斯早死了心，搬到别处住了。除了通过温珀，动物农场还没跟外界有往来，但不断有传闻，拿破仑快要跟福克斯伍德的皮尔金顿或平奇菲尔德的弗雷德里克签正式买卖协议——可大家注意到，从不跟两个同时。"
            },
            {
              "en": "It was about this time that the pigs suddenly <span class=\"vocab-trigger\" data-vocab=\"moved into the farmhouse\">moved into the farmhouse<\/span> and took up their <span class=\"vocab-trigger\" data-vocab=\"residence\">residence<\/span> there. Again the animals seemed to remember that a resolution against this had been passed in the early days, and again Squealer was able to <span class=\"vocab-trigger\" data-vocab=\"convince\">convince<\/span> them that this was not the case. It was absolutely necessary, he said, that the pigs, who were the <span class=\"vocab-trigger\" data-vocab=\"brains\">brains<\/span> of the farm, should have a quiet place to work in. It was also more suited to the <span class=\"vocab-trigger\" data-vocab=\"dignity\">dignity<\/span> of the Leader (for of late he had taken to speaking of Napoleon under the title of “<span class=\"vocab-trigger\" data-vocab=\"Leader\">Leader<\/span>”) to live in a house than in a mere <span class=\"vocab-trigger\" data-vocab=\"sty\">sty<\/span>. Nevertheless, some of the animals were <span class=\"vocab-trigger\" data-vocab=\"disturbed\">disturbed<\/span> when they heard that the pigs not only took their meals in the kitchen and used the <span class=\"vocab-trigger\" data-vocab=\"drawing-room\">drawing-room<\/span> as a <span class=\"vocab-trigger\" data-vocab=\"recreation room\">recreation room<\/span>, but also slept in the beds. Boxer <span class=\"vocab-trigger\" data-vocab=\"passed it off\">passed it off<\/span> as usual with “Napoleon is always right!”, but Clover, who thought she remembered a <span class=\"vocab-trigger\" data-vocab=\"definite ruling\">definite ruling<\/span> against beds, went to the end of the barn and tried to <span class=\"vocab-trigger\" data-vocab=\"puzzle out\">puzzle out<\/span> the Seven Commandments which were <span class=\"vocab-trigger\" data-vocab=\"inscribed\">inscribed<\/span> there. Finding herself unable to read more than individual letters, she <span class=\"vocab-trigger\" data-vocab=\"fetched\">fetched<\/span> Muriel.",
              "zh": "大概就在这个时候，猪突然搬进了农庄住宅，在那里定居了。动物们又依稀记得，在早期好像通过了一条反对这样做的决议，而尖啸者又再次成功地说服他们并非如此。他说，猪是农场的脑子，绝对需要一个安静的地方工作。再者，让领袖（近来他已惯于用“领袖”这一头衔称呼拿破仑）住在一所房子里，也更合乎他的尊严，而不是仅仅住在一个猪圈里。尽管如此，当动物们听说猪不但使用厨房吃饭，把客厅当作娱乐室，而且还在床上睡觉时，有些动物还是感到不安。拳击手照常用“拿破仑永远正确！”把这事打发过去，可苜蓿觉得自己记得有一条明确禁止睡床铺的规定，便走到谷仓尽头，想尽力把写在那儿的七条诫律拼读出来。她发现自己只认得单个字母，于是把穆丽尔叫了过来。",
              "simpEn": "Around this time the pigs suddenly moved into the farmhouse and lived there. Again the animals thought they remembered an early rule against it, but Squealer convinced them otherwise. The pigs, the brains of the farm, needed a quiet place to work, he said. And it suited the Leader's dignity (lately Napoleon was called 'Leader') to live in a house, not just a pigsty. Still, some animals were upset hearing the pigs ate in the kitchen, used the sitting room for fun, and slept in the beds. Boxer brushed it aside with 'Napoleon is always right!' But Clover, thinking she remembered a clear rule against beds, went to the barn wall to try to read the Commandments. Unable to read more than single letters, she got Muriel.",
              "simpZh": "大概这时猪突然搬进住宅住下了。动物们又像记得早先有过反对的决议，可尖啸者又让他们信了不是那回事。他说猪是农场的脑子，非得有安静地方办公。再说让领袖（近来他管拿破仑叫“领袖”）住房子，不住猪圈，才合乎他的尊严。可动物们听说猪在厨房吃饭、把客厅当娱乐室、还睡床，有些不安了。拳击手照常用“拿破仑永远正确”打发过去，苜蓿却记得好像有条明确不准睡床的规矩，就走到谷仓那头，想拼读墙上写的七戒。她除了单个字母什么也认不了，就去叫穆丽尔。"
            },
            {
              "en": "“Muriel,” she said, “read me the Fourth Commandment. Does it not say something about never sleeping in a bed?”<br>With some difficulty Muriel <span class=\"vocab-trigger\" data-vocab=\"spelt it out\">spelt it out<\/span>.<br>“It says, ‘No animal shall sleep in a bed with <span class=\"vocab-trigger\" data-vocab=\"sheets\">sheets<\/span>,’” she announced finally.<br>Curiously enough, Clover had not remembered that the Fourth Commandment mentioned sheets; but as it was there on the wall, it must have done so. And Squealer, who happened to be passing at this moment, attended by two or three dogs, was able to put the whole matter in its <span class=\"vocab-trigger\" data-vocab=\"proper perspective\">proper perspective<\/span>.",
              "zh": "“穆丽尔，”她说，“给我念念第四条诫律。上面是不是说了不准在床铺上睡觉？”<br>穆丽尔勉勉强强地一个字母一个字母拼了出来。<br>“上面写的是，‘任何动物不得在有床单的床上睡觉。’”她最后念道。<br>说来也怪，苜蓿不记得第四条诫律提到了床单；不过既然墙上白纸黑字写着，那肯定就是了。恰巧这时候尖啸者正带着两三条狗经过，便把这个问题的方方面面讲了个通透。",
              "simpEn": "'Muriel,' she said, 'read me the Fourth Commandment. Doesn't it say something about never sleeping in a bed?' With some trouble Muriel read it letter by letter. 'It says, \"No animal shall sleep in a bed with sheets,\"' she finally announced. Strangely, Clover hadn't remembered the mention of sheets, but since it was on the wall, it must be true. Squealer, passing by with two or three dogs, was able to explain the whole matter correctly.",
              "simpZh": "“穆丽尔，”她说，“给我念第四条戒。是不是说了不准在床上睡觉？”穆丽尔费力地一个个字母拼出来。她说：“上面是‘任何动物不得睡在有床单的床上。’”真奇怪，苜蓿不记得第四条提了床单；可既然墙上写着，那肯定有。正好尖啸者带着两三条狗路过，就把这事说得明明白白。"
            },
            {
              "en": "“You have heard then, comrades,” he said, “that we pigs now sleep in the beds of the farmhouse? And why not? You did not suppose, surely, that there was ever a ruling against beds? A bed merely means a place to sleep in. A pile of straw in a stall is a bed, <span class=\"vocab-trigger\" data-vocab=\"properly regarded\">properly regarded<\/span>. The rule was against <span class=\"vocab-trigger\" data-vocab=\"sheets\">sheets<\/span>, which are a human invention. We have removed the sheets from the farmhouse beds, and sleep between <span class=\"vocab-trigger\" data-vocab=\"blankets\">blankets<\/span>. And very comfortable beds they are too! But not more comfortable than we need, I can tell you, comrades, with all the <span class=\"vocab-trigger\" data-vocab=\"brainwork\">brainwork<\/span> we have to do nowadays. You would not <span class=\"vocab-trigger\" data-vocab=\"rob us of our repose\">rob us of our repose<\/span>, would you, comrades? You would not have us too tired to carry out our duties? Surely none of you wishes to see Jones back?”<br>The animals <span class=\"vocab-trigger\" data-vocab=\"reassured him\">reassured him<\/span> on this point immediately, and no more was said about the pigs sleeping in the farmhouse beds. And when, some days afterwards, it was announced that from now on the pigs would get up an hour later in the mornings than the other animals, no complaint was made about that either.",
              "zh": "“那你们已经听说了，同志们，”他说，“我们猪如今睡在农庄住宅的床铺上？为什么不呢？你们总不会认为当真有过一条禁止睡床铺的规矩吧？床只不过是一个睡觉的地方罢了。如果正确看待的话，厩栏里的一堆干草就是一张床。当初的规矩是反对床单，那才是人类的发明。我们已经把农庄住宅床上的床单都拿掉了，盖着毯子睡。那可是非常舒服的床啊！不过，同志们，我可以告诉你们，眼下我们猪要动这么多脑子，那些床并不比我们需要的更舒服。你们总不会想剥夺我们的休息吧，同志们？你们总不愿意看见我们累得没法履行职责吧？想必谁也不希望琼斯回来吧？”<br>在这一点上动物们立刻叫他放心，于是关于猪在农庄住宅床上睡觉的事便再也没有被提起。几天后，又宣布从今以后猪早晨起床要比别的动物晚一个钟头，对此也没有谁抱怨。",
              "simpEn": "'So you've heard we pigs sleep in the house beds? And why not? Surely you didn't think there was ever a rule against beds? A bed just means a place to sleep. A straw pile in a stall is a bed, if you look at it right. The rule was against sheets, a human invention. We took the sheets off and sleep in blankets. Very comfortable beds! But not more than we need, friends, with all the thinking we do now. You wouldn't take away our rest, would you? You wouldn't want us too tired to do our duties? Surely no one wants Jones back?' The animals quickly calmed him on this, and no more was said about the pigs sleeping in beds. And a few days later, when it was announced that pigs would now get up an hour later than the other animals, no one complained about that either.",
              "simpZh": "“那你们听说了，同志们，我们猪现在睡在住宅床铺上？有什么不行呢？你们总不会以为真有规矩不准睡床吧？床不就是个睡觉的地方嘛。栏里一堆草也是床，看你咋看。规矩是反对床单，那是人发明的。我们把床单拿掉了，盖毯子睡。床很舒服！可同志们，我们猪现在动这么多脑筋，再舒服也是该的。你们不会不让我们休息吧？不会想我们累得干不了活吧？没人想琼斯回来吧？”动物们赶紧让他宽心，猪睡床这事就再没提了。几天后宣布猪今后早上比别的动物晚起一个钟头，也没谁抱怨。"
            }
          ],
          "quiz": [

        {
          "sectionId": 5,
          "heading": "The Windmill Destroyed",
          "paragraphs": [
            {
              "en": "By the autumn the animals were tired but happy. They had had a hard year, and after the sale of part of the hay and corn, the <span class=\"vocab-trigger\" data-vocab=\"stores of food\">stores of food<\/span> for the winter were <span class=\"vocab-trigger\" data-vocab=\"none too plentiful\">none too plentiful<\/span>, but the windmill <span class=\"vocab-trigger\" data-vocab=\"compensated for everything\">compensated for everything<\/span>. It was almost half built now. After the harvest there was a <span class=\"vocab-trigger\" data-vocab=\"stretch of clear dry weather\">stretch of clear dry weather<\/span>, and the animals <span class=\"vocab-trigger\" data-vocab=\"toiled harder than ever\">toiled harder than ever<\/span>, thinking it <span class=\"vocab-trigger\" data-vocab=\"well worth while\">well worth while<\/span> to <span class=\"vocab-trigger\" data-vocab=\"plod to and fro\">plod to and fro<\/span> all day with blocks of stone if by doing so they could raise the walls another foot. Boxer would even come out at nights and work for an hour or two on his own by the light of the <span class=\"vocab-trigger\" data-vocab=\"harvest moon\">harvest moon<\/span>. In their spare moments the animals would walk round and round the half-finished mill, admiring the strength and <span class=\"vocab-trigger\" data-vocab=\"perpendicularity\">perpendicularity<\/span> of its walls and <span class=\"vocab-trigger\" data-vocab=\"marvelling\">marvelling<\/span> that they should ever have been able to build anything so <span class=\"vocab-trigger\" data-vocab=\"imposing\">imposing<\/span>. Only old Benjamin refused to grow <span class=\"vocab-trigger\" data-vocab=\"enthusiastic\">enthusiastic<\/span> about the windmill, though, as usual, he would <span class=\"vocab-trigger\" data-vocab=\"utter nothing\">utter nothing<\/span> beyond the <span class=\"vocab-trigger\" data-vocab=\"cryptic remark\">cryptic remark<\/span> that donkeys live a long time.",
              "zh": "到了秋天，动物们都累，但很快乐。一年过得很苦，卖掉一部分干草和玉米之后，过冬的存粮并不很充裕，但风车弥补了一切。如今它已经差不多建成一半了。收获过后，出现了持续干爽的天气，动物们干得比什么时候都卖力，心想，如果一整天一趟趟搬石头能让墙再高上一英尺，那也是完全值得的。拳击手甚至夜里也出来，借着秋月的光亮独自干上一两个钟头。闲下来的时候，动物们会绕着半建成的风车转圈子，赞叹它墙壁的坚固与垂直，惊奇自己居然能造出如此壮观的东西。只有老本杰明不肯对风车产生热情，不过，他照例除了那句驴子活得久的隐晦之语，什么也不多说。",
              "simpEn": "By autumn the animals were tired but happy. The year had been hard, and after selling some hay and grain, winter food wasn't very much, but the windmill made up for everything. It was nearly half built. After harvest, a long dry spell came, and the animals worked harder than ever, feeling it was worth walking back and forth all day with stones to raise the walls another foot. Boxer even came out at night to work alone by the full moon's light. In free moments they circled the half-finished mill, admiring the strong, straight walls and wondering that they could build something so grand. Only Benjamin refused to be excited, saying only his mysterious line about donkeys living a long time.",
              "simpZh": "到秋天动物们又累又开心。一年很苦，卖了点干草和玉米后，过冬存粮不算多，可风车抵得上一切。已经差不多建了一半。收成后来了连晴天气，动物们干得最拼，觉得整天一趟趟搬石头能让墙再高上一英尺也值。拳击手甚至夜里也出来，借着秋月自个干一两个钟头。闲下来时，动物们绕着半成的风车转，欣赏墙又结实又直溜，惊奇自己竟能造这么壮观的东西。只有老本杰明对风车不热乎，还是只说那句驴子活得久的怪话。"
            },
            {
              "en": "November came, with <span class=\"vocab-trigger\" data-vocab=\"raging south-west winds\">raging south-west winds<\/span>. Building had to stop because it was now too wet to mix the cement. Finally there came a night when the <span class=\"vocab-trigger\" data-vocab=\"gale\">gale<\/span> was so violent that the farm buildings <span class=\"vocab-trigger\" data-vocab=\"rocked on their foundations\">rocked on their foundations<\/span> and several <span class=\"vocab-trigger\" data-vocab=\"tiles\">tiles<\/span> were blown off the roof of the barn. The hens woke up <span class=\"vocab-trigger\" data-vocab=\"squawking with terror\">squawking with terror<\/span> because they had all dreamed <span class=\"vocab-trigger\" data-vocab=\"simultaneously\">simultaneously<\/span> of hearing a gun go off in the distance. In the morning the animals came out of their stalls to find that the flagstaff had been blown down and an elm tree at the foot of the orchard had been <span class=\"vocab-trigger\" data-vocab=\"plucked up like a radish\">plucked up like a radish<\/span>. They had just noticed this when a <span class=\"vocab-trigger\" data-vocab=\"cry of despair\">cry of despair<\/span> broke from every animal's throat. A <span class=\"vocab-trigger\" data-vocab=\"terrible sight\">terrible sight<\/span> had met their eyes. The windmill was <span class=\"vocab-trigger\" data-vocab=\"in ruins\">in ruins<\/span>.",
              "zh": "十一月来临，刮起了猛烈的西南风。建造不得不停下来，因为气候太潮湿，没法搅拌水泥。终于有一夜，狂风刮得如此凶猛，农场的房屋从根基上摇晃起来，谷仓屋顶上的好几片瓦被吹掉了。母鸡们惊恐地嘎嘎乱叫，醒来时都说梦见了远处有枪响。到了早上，动物们走出厩栏，发现旗杆被吹倒了，果园脚下一棵榆树像拔萝卜似的被拔了起来。他们刚注意到这些，一声绝望的惨叫便从所有动物的喉咙里迸了出来。一个可怕的景象映入他们的眼帘。风车成了一片废墟。",
              "simpEn": "November came with fierce south-west winds. Building stopped because it was too wet for cement. One night the storm was so wild that farm buildings shook on their bases and several roof tiles blew off the barn. The hens woke squawking in fear, all having dreamed of a distant gunshot. In the morning, the animals found the flagpole down and an elm tree pulled up like a weed. Then a cry of hopelessness rose from every throat. A terrible sight met their eyes: the windmill was in ruins.",
              "simpZh": "十一月来了，刮起猛烈的西南大风。建风车停了，因为太湿搅不了水泥。终于有一夜暴风猛得农场房子从地基上晃，谷仓屋顶好几片瓦吹掉了。母鸡们吓得嘎嘎乱叫醒来，都梦见了远处枪响。早上动物们出来，发现旗杆倒了，果园脚下一棵榆树像拔萝卜一样被拔起。刚看见这个，一片绝望惨叫从大家喉咙里迸出。可怕的一幕就在眼前：风车成了废墟。"
            }

        {
          "sectionId": 6,
          "heading": "Blame and Rebuilding",
          "paragraphs": [
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"With one accord\">With one accord<\/span> they dashed down to the spot. Napoleon, who seldom moved out of a walk, raced ahead of them all. Yes, there it lay, the <span class=\"vocab-trigger\" data-vocab=\"fruit of all their struggles\">fruit of all their struggles<\/span>, <span class=\"vocab-trigger\" data-vocab=\"levelled to its foundations\">levelled to its foundations<\/span>, the stones they had broken and carried so <span class=\"vocab-trigger\" data-vocab=\"laboriously\">laboriously<\/span> <span class=\"vocab-trigger\" data-vocab=\"scattered\">scattered<\/span> all around. Unable at first to speak, they stood gazing <span class=\"vocab-trigger\" data-vocab=\"mournfully\">mournfully<\/span> at the <span class=\"vocab-trigger\" data-vocab=\"litter\">litter<\/span> of fallen stone. Napoleon paced to and fro in silence, occasionally <span class=\"vocab-trigger\" data-vocab=\"snuffing\">snuffing<\/span> at the ground. His tail had grown <span class=\"vocab-trigger\" data-vocab=\"rigid\">rigid<\/span> and <span class=\"vocab-trigger\" data-vocab=\"twitched sharply\">twitched sharply<\/span> from side to side, a sign in him of <span class=\"vocab-trigger\" data-vocab=\"intense mental activity\">intense mental activity<\/span>. Suddenly he halted as though his mind were made up.",
              "zh": "他们不约而同地飞奔到现场。拿破仑平时极少跑，这次却冲在大家前头。是的，他们所有奋斗的果实就躺在那儿，被夷为平地，那些千辛万苦砸碎搬运的石头散落在四周。起初，动物们说不出话，只是悲伤地凝望着那一大片倒塌的碎石。拿破仑来回踱着步，一言不发，偶尔在地上嗅嗅。他的尾巴变得僵硬，猛烈地左右抽搐，这是他剧烈脑力活动的迹象。突然，他停下脚步，仿佛下定了决心。",
              "simpEn": "All together they raced to the spot. Napoleon, who usually never ran, went ahead of everyone. There it was, the result of all their work, flattened to the ground, the stones they had broken and carried so painfully now spread everywhere. At first too shocked to speak, they stood sadly staring at the fallen stones. Napoleon walked back and forth silently, sometimes sniffing the ground. His tail had become stiff and jerked sharply from side to side, a sign he was thinking hard. Suddenly he stopped as if he had decided.",
              "simpZh": "大家一齐冲到现场。拿破仑平时从不跑，这回却跑在最前头。他们所有辛苦的果实就躺在那儿，夷成了平地，砸碎搬运来的石头散得四处都是。起先动物们说不出话，只伤心地盯着那一大片碎石。拿破仑来回踱步，不作声，有时在地上闻闻。他的尾巴变得僵硬，猛地左右抽动，这是他苦思苦想的迹象。忽然他停住，好像下定了决心。"
            },
            {
              "en": "“Comrades,” he said quietly, “do you know who is responsible for this? Do you know the enemy who has come in the night and <span class=\"vocab-trigger\" data-vocab=\"overthrown\">overthrown<\/span> our windmill? SNOWBALL!” he suddenly <span class=\"vocab-trigger\" data-vocab=\"roared in a voice of thunder\">roared in a voice of thunder<\/span>. “Snowball has done this thing! <span class=\"vocab-trigger\" data-vocab=\"In sheer malignity\">In sheer malignity<\/span>, thinking to <span class=\"vocab-trigger\" data-vocab=\"set back our plans\">set back our plans<\/span> and <span class=\"vocab-trigger\" data-vocab=\"avenge himself\">avenge himself<\/span> for his <span class=\"vocab-trigger\" data-vocab=\"ignominious expulsion\">ignominious expulsion<\/span>, this <span class=\"vocab-trigger\" data-vocab=\"traitor\">traitor<\/span> has crept here <span class=\"vocab-trigger\" data-vocab=\"under cover of night\">under cover of night<\/span> and destroyed our work of nearly a year. Comrades, here and now I <span class=\"vocab-trigger\" data-vocab=\"pronounce the death sentence\">pronounce the death sentence<\/span> upon Snowball. ‘Animal Hero, Second Class,’ and half a <span class=\"vocab-trigger\" data-vocab=\"bushel\">bushel<\/span> of apples to any animal who <span class=\"vocab-trigger\" data-vocab=\"brings him to justice\">brings him to justice<\/span>. A full bushel to anyone who <span class=\"vocab-trigger\" data-vocab=\"captures him alive\">captures him alive<\/span>!”",
              "zh": "“同志们，”他平静地说，“你们知道这事是谁干的吗？你们知道昨夜来推倒我们风车的敌人是谁吗？雪球！”他突然以雷鸣般的声音吼道，“这件事是雪球干的！纯粹出于恶毒，想挫败我们的计划，为他可耻的被逐报仇，这个叛徒趁着黑夜摸过来，毁掉了我们将近一年的成果。同志们，此刻此地，我宣判雪球死刑。凡将他绳之以法的动物，授予‘二级动物英雄’勋章和半蒲式耳苹果。活捉他的，赏一整蒲式耳！”",
              "simpEn": "'Friends,' he said quietly, 'do you know who did this? The enemy who came in the night and knocked down our windmill? SNOWBALL!' he suddenly roared like thunder. 'Snowball did this! Out of pure hate, to ruin our plans and get revenge for his shameful expulsion, this traitor crept here in the dark and destroyed almost a year of our work. Friends, right now I sentence Snowball to death. \"Animal Hero, Second Class,\" and half a basket of apples to anyone who catches him. A full basket to anyone who takes him alive!'",
              "simpZh": "“同志们，”他轻声说，“知道谁干的吗？知道夜里来推倒我们风车的敌人是谁吗？雪球！”他突然吼得像打雷，“是雪球干的！纯粹出于恶毒，想破坏我们的计划，替他可耻被逐报仇，这个叛徒趁天黑摸过来，毁了我们将近一年的成果。同志们，就在这，我判雪球死刑。‘二级动物英雄’，再加半筐苹果，给谁把他逮住。活捉的给一整筐！”"
            },
            {
              "en": "The animals were <span class=\"vocab-trigger\" data-vocab=\"shocked beyond measure\">shocked beyond measure<\/span> to learn that even Snowball could be <span class=\"vocab-trigger\" data-vocab=\"guilty\">guilty<\/span> of such an action. There was a <span class=\"vocab-trigger\" data-vocab=\"cry of indignation\">cry of indignation<\/span>, and everyone began thinking out ways of catching Snowball if he should ever come back. Almost immediately the <span class=\"vocab-trigger\" data-vocab=\"footprints\">footprints<\/span> of a pig were discovered in the grass at a little distance from the <span class=\"vocab-trigger\" data-vocab=\"knoll\">knoll<\/span>. They could only be <span class=\"vocab-trigger\" data-vocab=\"traced\">traced<\/span> for a few yards, but appeared to lead to a hole in the hedge. Napoleon <span class=\"vocab-trigger\" data-vocab=\"snuffed deeply\">snuffed deeply<\/span> at them and <span class=\"vocab-trigger\" data-vocab=\"pronounced\">pronounced<\/span> them to be Snowball's. He gave it as his opinion that Snowball had probably come from the <span class=\"vocab-trigger\" data-vocab=\"direction of Foxwood Farm\">direction of Foxwood Farm<\/span>.",
              "zh": "动物们震惊得无以复加，没想到就连雪球也能犯下这样的罪行。一阵愤慨的喊声响起，大家开始琢磨，要是雪球再回来，该怎么抓住他。几乎同时，离小丘不远的草地上发现了一行猪的足迹。那脚印只能追踪几码，似乎是通向树篱上的一个洞。拿破仑深深地嗅了嗅，断定那就是雪球的足迹。他的看法是，雪球很可能来自福克斯伍德农场的方向。",
              "simpEn": "The animals were beyond shocked to think even Snowball could do such a thing. A cry of anger rose, and everyone began thinking of ways to catch Snowball if he returned. Almost at once, pig footprints were found in the grass near the little hill. They could only be followed a short way, but seemed to go toward a hole in the hedge. Napoleon sniffed them deeply and declared they were Snowball's. He said Snowball probably came from the direction of Foxwood Farm.",
              "simpZh": "动物们震惊到极点，没想到连雪球也能犯这种罪。一片愤怒的喊声，大家开始想怎么逮住雪球要是他再来。几乎马上，小丘不远的草地上发现了猪脚印。只跟了几码，像是通往树篱上的一个洞。拿破仑深深地闻了闻，断定是雪球的。他说雪球大概是从福克斯伍德农场那边来的。"
            },
            {
              "en": "“No more delays, comrades!” cried Napoleon when the footprints had been examined. “There is work to be done. This very morning we begin rebuilding the windmill, and we will build all through the winter, <span class=\"vocab-trigger\" data-vocab=\"rain or shine\">rain or shine<\/span>. We will teach this <span class=\"vocab-trigger\" data-vocab=\"miserable traitor\">miserable traitor<\/span> that he cannot <span class=\"vocab-trigger\" data-vocab=\"undo our work\">undo our work<\/span> so easily. Remember, comrades, there must be no <span class=\"vocab-trigger\" data-vocab=\"alteration\">alteration<\/span> in our plans: they shall be <span class=\"vocab-trigger\" data-vocab=\"carried out to the day\">carried out to the day<\/span>. Forward, comrades! Long live the windmill! Long live Animal Farm!”",
              "zh": "“别再耽搁了，同志们！”拿破仑察看过足迹后喊道，“还有活要干呢。今天早上我们就开始重建风车，整个冬天都要建，风雨无阻。我们要教训这个卑鄙的叛徒，让他知道他没那么容易毁掉我们的工作。记住，同志们，我们的计划不准有任何改变：一定要如期完成。前进，同志们！风车万岁！动物农场万岁！”",
              "simpEn": "'No more delays, friends!' cried Napoleon after the footprints were checked. 'There's work to do. This very morning we start rebuilding the windmill, and we'll build through the whole winter, no matter the weather. We'll teach this wretched traitor he can't so easily destroy our work. Remember, no changes to our plans: they will be done exactly on time. Forward, friends! Long live the windmill! Long live Animal Farm!'",
              "simpZh": "“别再耽搁了，同志们！”拿破仑察看完脚印后喊道，“还有活要干。今天早上就动手重建风车，整个冬天都要建，风雨无阻。我们要教训这个卑鄙叛徒，他别想那么容易毁掉我们的成果。记住，计划一点不能改：要一天不差地完成。前进，同志们！风车万岁！动物农场万岁！”"
            }
