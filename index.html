            {
              "text": "Boxer's only concern was to accumulate enough stone before retirement.",
              "answer": true
            }
          ]
        },
        {
          "sectionId": 5,
          "heading": "The Fall of Boxer and the Arrival of the Van",
          "paragraphs": [
            {
              "en": "Late one evening in the summer, a sudden <span class=\"vocab-trigger\" data-vocab=\"rumour\">rumour<\/span> ran round the farm that something had happened to Boxer. He had gone out alone to drag a load of stone down to the windmill. And sure enough, the rumour was true. A few minutes later two pigeons came racing in with the news; “Boxer has fallen! He is lying on his side and can't get up!” About half the animals on the farm rushed out to the knoll where the windmill stood. There lay Boxer, between the <span class=\"vocab-trigger\" data-vocab=\"shafts\">shafts<\/span> of the cart, his neck stretched out, unable even to raise his head. His eyes were <span class=\"vocab-trigger\" data-vocab=\"glazed\">glazed<\/span>, his sides <span class=\"vocab-trigger\" data-vocab=\"matted with sweat\">matted with sweat<\/span>. A thin stream of blood had <span class=\"vocab-trigger\" data-vocab=\"trickled\">trickled<\/span> out of his mouth. Clover dropped to her knees at his side.<br>“Boxer!” she cried, “how are you?”<br>“It is my lung,” said Boxer in a weak voice. “It does not matter. I think you will be able to finish the windmill without me. There is a pretty good store of stone accumulated. I had only another month to go in any case. To tell you the truth, I had been looking forward to my retirement. And perhaps, as Benjamin is growing old too, they will let him retire at the same time and be a companion to me.”<br>“We must get help at once,” said Clover. “Run, somebody, and tell Squealer what has happened.”",
              "zh": "那年夏天的一个深夜，农场里突然传开一道谣言，说拳击手出事了。他独自拖着一车石头到风车那边去了。果然，谣言是真的。几分钟后，两只鸽子急急飞来报告：“拳击手倒下了！他侧躺在地上，站不起来了！”农场里大约一半的动物冲到了矗立着风车的小丘。拳击手就躺在车辕中间，脖子伸得长长的，连头都抬不起来。他的眼睛已经失了神，两胁汗湿得发黏。嘴里淌出一道细细的血流。苜蓿跪倒在他身旁。<br>“拳击手！”她喊道，“你怎么样了？”<br>“是我的肺，”拳击手声音微弱地说，“不要紧。我想你们没有我也能修成风车。石头已经积下不少了。反正我本来就只剩一个月了。说实话，我一直盼着退休呢。再说，本杰明也老了，也许他们能让他跟我同时退休，也好做个伴儿。”<br>“我们必须立刻找人帮忙，”苜蓿说，“谁快跑去告诉尖啸者出了什么事。”",
              "simpEn": "Late one summer evening, a sudden rumor spread that something had happened to Boxer. He had gone alone to drag a load of stone to the windmill. Sure enough, it was true. Two pigeons soon raced in: 'Boxer has fallen! He's lying on his side and can't get up!' About half the animals rushed to the hill where the windmill stood. There lay Boxer, between the cart shafts, neck stretched out, unable to lift his head. His eyes were glassy, his sides wet with sweat. A thin stream of blood trickled from his mouth. Clover knelt beside him. 'Boxer! How are you?' 'It's my lung,' he said weakly. 'It doesn't matter. I think you'll finish the windmill without me. There's a good pile of stone already. I only had another month anyway. Truth is, I was looking forward to retiring. And maybe, since Benjamin is old too, they'll let him retire with me and be a companion.' 'We must get help at once,' said Clover. 'Somebody run and tell Squealer what's happened.'",
              "simpZh": "夏天一个深夜，突然传言说拳击手出事了。他独自拖一车石头去风车了。果然是真的。两只鸽子很快飞来报信：“拳击手倒了！侧躺着起不来了！”大约一半动物冲到风车小丘那。拳击手躺在车辕中间，脖子伸着，头都抬不起。眼睛没神，两胁汗湿了。嘴角淌出一道细细的血。苜蓿跪在他旁边。“拳击手！你怎么样了？”“是肺，”他声音很弱，“不要紧。我想你们没我也能修好风车。石头攒了不少了。反正我本就剩一个月。说实话，我一直盼退休。也许本杰明也老了，让他们准他一块退，好做个伴儿。”“我们马上去找人帮忙，”苜蓿说，“谁快跑去告诉尖啸者。”"
            },
            {
              "en": "All the other animals immediately raced back to the farmhouse to give Squealer the news. Only Clover remained, and Benjamin who lay down at Boxer's side, and, without speaking, kept the flies off him with his long tail. After about a quarter of an hour Squealer appeared, full of <span class=\"vocab-trigger\" data-vocab=\"sympathy and concern\">sympathy and concern<\/span>. He said that Comrade Napoleon had learned with the very deepest <span class=\"vocab-trigger\" data-vocab=\"distress\">distress<\/span> of this <span class=\"vocab-trigger\" data-vocab=\"misfortune\">misfortune<\/span> to one of the most loyal workers on the farm, and was already making arrangements to send Boxer to be treated in the hospital at Willingdon. The animals felt a little uneasy at this. Except for Mollie and Snowball, no other animal had ever left the farm, and they did not like to think of their sick comrade in the hands of human beings. However, Squealer easily convinced them that the <span class=\"vocab-trigger\" data-vocab=\"veterinary surgeon\">veterinary surgeon<\/span> in Willingdon could treat Boxer's case more <span class=\"vocab-trigger\" data-vocab=\"satisfactorily\">satisfactorily<\/span> than could be done on the farm. And about half an hour later, when Boxer had somewhat recovered, he was with difficulty got on to his feet, and managed to limp back to his stall, where Clover and Benjamin had prepared a good bed of straw for him.",
              "zh": "其他动物立刻全跑回农庄住宅去向尖啸者报信。只有苜蓿留下，本杰明也卧在拳击手身边，一声不吭，用长尾巴替他赶苍蝇。大约一刻钟后，尖啸者来了，满怀同情和关切。他说，拿破仑同志得悉农场上最忠心的工人之一遭遇这般不幸，心中无比沉痛，并且已在着手安排将拳击手送到威灵顿的医院去治疗。动物们听了这话，有点不安。除了莫丽和雪球之外，还没有哪只动物离开过农场，想到生病的同志要落到人类手里，他们并不好受。然而，尖啸者毫不费力地就让他们相信，威灵顿的兽医比在农场里更能妥善地治疗拳击手的病。大约半小时后，拳击手稍稍恢复了一些，他们费了好大劲才扶他站起来，勉强跛着脚走回他的厩栏，苜蓿和本杰明已经在那里给他铺好了一层舒服的干草。",
              "simpEn": "All the other animals raced back to tell Squealer. Only Clover stayed, and Benjamin lay beside Boxer, silently keeping flies off with his tail. About a quarter of an hour later Squealer appeared, full of sympathy and concern. He said Comrade Napoleon had learned with deepest distress of this misfortune to one of the farm's most loyal workers, and was already arranging to send Boxer to the hospital in Willingdon. The animals felt a little uneasy. Except Mollie and Snowball, no animal had ever left the farm, and they didn't like their sick comrade in human hands. But Squealer easily convinced them that the veterinary surgeon in Willingdon could treat Boxer better than they could on the farm. About half an hour later, Boxer had recovered a little, and with difficulty got to his feet and limped back to his stall, where Clover and Benjamin had made a good straw bed.",
              "simpZh": "别的动物全跑回去告诉尖啸者。只有苜蓿留下，本杰明卧在拳击手身边，不出声地用长尾巴赶苍蝇。大约一刻钟后尖啸者来了，满是同情和关切。说拿破仑同志得悉农场最忠心的工人遭此不幸，心里沉痛极了，已经在安排送拳击手去威灵顿医院。动物们有点不安。除了莫丽和雪球，没动物离开过农场，不想让病同志落到人手里。可尖啸者轻易说服了他们，说威灵顿的兽医比农场治得好。大约半小时后，拳击手稍微好了点，费劲站起来，跛着脚回了厩栏，苜蓿和本杰明已铺好干草床。"
            },
            {
              "en": "For the next two days Boxer remained in his stall. The pigs had sent out a large bottle of pink medicine which they had found in the <span class=\"vocab-trigger\" data-vocab=\"medicine chest\">medicine chest<\/span> in the bathroom, and Clover <span class=\"vocab-trigger\" data-vocab=\"administered\">administered<\/span> it to Boxer twice a day after meals. In the evenings she lay in his stall and talked to him, while Benjamin kept the flies off him. Boxer <span class=\"vocab-trigger\" data-vocab=\"professed\">professed<\/span> not to be sorry for what had happened. If he made a good recovery, he might expect to live another three years, and he looked forward to the peaceful days that he would spend in the corner of the big pasture. It would be the first time that he had had leisure to study and improve his mind. He intended, he said, to devote the rest of his life to learning the remaining twenty-two letters of the alphabet.",
              "zh": "接下来的两天，拳击手都待在自己的厩栏里。猪送来了一大瓶从浴室药柜里找到的粉红色药水，苜蓿每天在饭后喂他两次。晚上她就卧在他的厩栏里跟他说话，本杰明替他赶苍蝇。拳击手声称他对发生的事并不觉得难过。如果他康复得好，也许还能再活三年，他期盼着在大牧场角落里度过的宁静日子。那将是他头一次有空闲来学习和提高自己的心智。他说，他打算把余生用来学完字母表上剩下的那二十二个字母。",
              "simpEn": "For the next two days Boxer stayed in his stall. The pigs had sent a large bottle of pink medicine from the bathroom cabinet, and Clover gave it to Boxer twice a day after meals. In the evenings she lay in his stall and talked to him while Benjamin kept flies off. Boxer claimed he wasn't sorry about what happened. If he recovered well, he might live another three years and looked forward to peaceful days in a corner of the big pasture. It would be his first chance to study and improve his mind. He intended, he said, to spend the rest of his life learning the remaining twenty-two letters of the alphabet.",
              "simpZh": "接下来两天拳击手待在厩栏里。猪送来一大瓶从浴室药柜里找的粉红药水，苜蓿每天饭后喂他两次。晚上她就卧在他栏里跟他说话，本杰明赶苍蝇。拳击手说他并不为这事难过。要是恢复得好，也许还能活三年，他盼着在大草场角落里过宁静日子。那将是他头一回有空学习、长心智。他说，打算用余生学完字母表剩下的二十二个字母。"
            },
            {
              "en": "However, Benjamin and Clover could only be with Boxer after working hours, and it was in the middle of the day when the van came to take him away. The animals were all at work weeding turnips under the supervision of a pig, when they were astonished to see Benjamin come galloping from the direction of the farm buildings, <span class=\"vocab-trigger\" data-vocab=\"braying at the top of his voice\">braying at the top of his voice<\/span>. It was the first time that they had ever seen Benjamin excited — indeed, it was the first time that anyone had ever seen him gallop. “Quick, quick!” he shouted. “Come at once! They're taking Boxer away!” Without waiting for orders from the pig, the animals broke off work and raced back to the farm buildings. Sure enough, there in the yard was a large closed van, drawn by two horses, with <span class=\"vocab-trigger\" data-vocab=\"lettering\">lettering<\/span> on its side and a <span class=\"vocab-trigger\" data-vocab=\"sly-looking man\">sly-looking man<\/span> in a <span class=\"vocab-trigger\" data-vocab=\"low-crowned bowler hat\">low-crowned bowler hat<\/span> sitting on the driver's seat. And Boxer's stall was empty.",
              "zh": "可是，本杰明和苜蓿只能在收工以后才陪在拳击手身边，而那辆来接他的车却是中午来的。动物们正在一头猪的监督下给萝卜地除草，忽然惊讶地看见本杰明从农舍方向飞跑过来，扯着喉咙大叫。他们头一回看见本杰明这么激动——说实在的，那也是头一回有人看见他奔跑。“快，快！”他喊道，“快来！他们把拳击手弄走了！”动物们不等那头猪下令，便扔下工作，飞奔回农舍。果然，院子里停着一辆封闭式大货车，由两匹马拉着的，车厢侧面漆有文字，赶车座上坐着一个戴低顶圆礼帽、模样狡诈的男人。拳击手的厩栏已经空了。",
              "simpEn": "But Benjamin and Clover could only be with Boxer after working hours, and the van came to take him away in the middle of the day. The animals were weeding turnips under a pig's supervision when they were astonished to see Benjamin galloping from the farm buildings, braying loudly. It was the first time they'd ever seen Benjamin excited — indeed, the first time anyone had ever seen him gallop. 'Quick, quick!' he shouted. 'Come at once! They're taking Boxer away!' Without waiting for the pig's order, the animals stopped work and raced back. Sure enough, there in the yard was a large closed van pulled by two horses, with writing on its side and a sly-looking man in a low bowler hat on the driver's seat. And Boxer's stall was empty.",
              "simpZh": "可本杰明和苜蓿只能收工后陪拳击手，车却是中午来的。动物们正由一头猪看着给萝卜地除草，突然吃惊地看见本杰明从农舍那边飞跑过来，扯着嗓门大叫。他们头回见本杰明这么激动——也是头回见谁看见他跑。“快，快！”他喊，“快来！他们把拳击手弄走了！”不等猪下令，动物们扔下活跑回农舍。果然，院子里停着一辆封闭式大货车，两匹马拉的，车侧有字，赶车座上坐着一个戴低顶圆帽、模样狡诈的男人。拳击手的栏空了。"
            },
            {
              "en": "The animals crowded round the van. “Good-bye, Boxer!” they <span class=\"vocab-trigger\" data-vocab=\"chorused\">chorused<\/span>. “Fools! Fools!” shouted Benjamin, <span class=\"vocab-trigger\" data-vocab=\"prancing\">prancing<\/span> round them and stamping the earth with his small hoofs. “Fools! Do you not see what is written on the side of that van?” That gave the animals pause, and there was a hush. Muriel began to spell out the words. But Benjamin pushed her aside and in the midst of a deadly silence he read: “‘Alfred Simmonds, Horse <span class=\"vocab-trigger\" data-vocab=\"Slaughterer\">Slaughterer<\/span> and <span class=\"vocab-trigger\" data-vocab=\"Glue Boiler\">Glue Boiler<\/span>, Willingdon. <span class=\"vocab-trigger\" data-vocab=\"Dealer in Hides and Bone-Meal\">Dealer in Hides and Bone-Meal<\/span>. <span class=\"vocab-trigger\" data-vocab=\"Kennels Supplied\">Kennels Supplied<\/span>.’ Do you not understand what that means? They are taking Boxer to the <span class=\"vocab-trigger\" data-vocab=\"knacker's\">knacker's<\/span>!”",
              "zh": "动物们围在货车周围。“再见，拳击手！”他们齐声喊道。“蠢货！蠢货！”本杰明喊道，绕着他们又蹦又跳，小蹄子跺着地。“蠢货！你们看不见那辆车侧面写的什么吗？”动物们听了停了下来，一片肃静。穆丽尔开始拼读那些字。可本杰明把她推到一边，在死一般的寂静中念道：“‘阿尔弗雷德·西蒙兹，威灵顿屠马及熬胶商。皮革及骨粉商。供应狗棚。’你们不明白这是什么意思吗？他们要把拳击手送到屠马场去！”",
              "simpEn": "The animals crowded around the van. 'Good-bye, Boxer!' they chanted together. 'Fools! Fools!' shouted Benjamin, jumping around them and stamping the ground with his small hoofs. 'Fools! Don't you see what's written on the side of that van?' That made the animals pause, and a hush fell. Muriel started to spell out the words. But Benjamin pushed her aside, and in dead silence he read: 'Alfred Simmonds, Horse Slaughterer and Glue Boiler, Willingdon. Dealer in Hides and Bone-Meal. Kennels Supplied.' Do you not understand what that means? They are taking Boxer to the knacker's!'",
              "simpZh": "动物们围着货车。“再见，拳击手！”他们齐声喊。“蠢货！蠢货！”本杰明喊着，绕着他们又蹦又跳，小蹄子跺地。“蠢货！看不见车侧写的是什么吗？”动物们一静，肃静一片。穆丽尔开始拼字，可本杰明把她推到一边，在死静中念道：“‘阿尔弗雷德·西蒙兹，威灵顿屠马及熬胶商。皮革及骨粉商。供应狗棚。’你们不明白吗？他们要把拳击手送到屠马场去！”"
            },
            {
              "en": "A cry of horror burst from all the animals. At this moment the man on the box whipped up his horses and the van moved out of the yard at a <span class=\"vocab-trigger\" data-vocab=\"smart trot\">smart trot<\/span>. All the animals followed, crying out at the tops of their voices. Clover forced her way to the front. The van began to gather speed. Clover tried to <span class=\"vocab-trigger\" data-vocab=\"stir her stout limbs\">stir her stout limbs<\/span> to a gallop, and achieved a <span class=\"vocab-trigger\" data-vocab=\"canter\">canter<\/span>. “Boxer!” she cried. “Boxer! Boxer! Boxer!” And just at this moment, as though he had heard the <span class=\"vocab-trigger\" data-vocab=\"uproar\">uproar<\/span> outside, Boxer's face, with the white stripe down his nose, appeared at the small window at the back of the van.<br>“Boxer!” cried Clover in a terrible voice. “Boxer! Get out! Get out quickly! They're taking you to your death!”<br>All the animals took up the cry of “Get out, Boxer, get out!” But the van was already gathering speed and drawing away from them. It was uncertain whether Boxer had understood what Clover had said. But a moment later his face disappeared from the window and there was the sound of a tremendous <span class=\"vocab-trigger\" data-vocab=\"drumming of hoofs\">drumming of hoofs<\/span> inside the van. He was trying to kick his way out. The time had been when a few kicks from Boxer's hoofs would have smashed the van to <span class=\"vocab-trigger\" data-vocab=\"matchwood\">matchwood<\/span>. But alas! his strength had left him; and in a few moments the sound of drumming hoofs grew fainter and died away. In desperation the animals began appealing to the two horses which drew the van to stop. “Comrades, comrades!” they shouted. “Don't take your own brother to his death!” But the stupid <span class=\"vocab-trigger\" data-vocab=\"brutes\">brutes<\/span>, too ignorant to realise what was happening, merely set back their ears and quickened their pace. Boxer's face did not reappear at the window. Too late, someone thought of racing ahead and shutting the <span class=\"vocab-trigger\" data-vocab=\"five-barred gate\">five-barred gate<\/span>; but in another moment the van was through it and rapidly disappearing down the road. Boxer was never seen again.",
              "zh": "一阵惊骇的叫喊从所有动物嘴里迸出。就在这时，赶车的人抽了马一鞭，货车轻快地驶出了院子。所有的动物都跟在后面，拼着命地喊叫。苜蓿挤到最前头。货车开始加速。苜蓿使劲驱动她粗壮的四肢想飞跑起来，也只不过做到了慢跑。“拳击手！”她喊道，“拳击手！拳击手！拳击手！”恰在这时，仿佛听到了外面的喧嚷，拳击手的脸，带着鼻子上那道白纹，出现在货车后的小窗口上。<br>“拳击手！”苜蓿用可怕的声音喊道，“拳击手！出来！快出来！他们要把你拉去送死！”<br>所有的动物都跟着喊起来：“出来，拳击手，出来！”可是货车已经加快速度，离他们越来越远了。不知道拳击手是否听懂了苜蓿的话。但过了一会儿，他的脸从窗口消失了，车厢里响起了密集如擂鼓般的踢打声。他是在拼命想踢出一条路来。曾几何时，拳击手踢上几脚就能把货车踢成碎片。然而，他的力气已经离他而去；不一会儿，擂鼓般的蹄声便渐渐弱下去，终于消失了。绝望之中，动物们开始央求拉车的那两匹马停下来。“同志，同志！”他们喊道，“别把你们自己的兄弟送去死啊！”但那两头蠢牲口，脑子太笨，根本弄不清发生了什么事，只是向后抿了抿耳朵，加快了脚步。拳击手的脸再也没有出现在窗口上。有动物想到了跑到前头去关上那道五道横木的大门，可是太晚了；转眼间货车已经穿过大门，迅速消失在大路上。拳击手再也没有谁见到过。",
              "simpEn": "A cry of horror broke from all the animals. At that moment the driver whipped up his horses, and the van moved off at a brisk trot. All the animals followed, screaming at the top of their lungs. Clover pushed to the front. The van picked up speed. Clover tried to force her stout legs into a gallop, managing only a canter. 'Boxer!' she cried. 'Boxer! Boxer! Boxer!' Just then, as if he'd heard the uproar, Boxer's face, with the white stripe down his nose, appeared at the small back window. 'Boxer!' cried Clover in a terrible voice. 'Boxer! Get out! Get out quickly! They're taking you to your death!' All the animals took up the cry: 'Get out, Boxer, get out!' But the van was already speeding away. It was unclear if Boxer understood. Then his face vanished from the window, and there was the sound of tremendous drumming of hoofs inside. He was trying to kick his way out. Once, a few kicks from Boxer would have smashed the van to splinters. But his strength had left him; soon the drumming faded and died. Desperately, the animals begged the two horses pulling the van to stop. 'Comrades, comrades! Don't take your own brother to his death!' But the stupid brutes, too ignorant to understand, merely laid back their ears and sped up. Boxer's face didn't reappear. Too late, someone thought of running ahead to shut the five-barred gate; the van was through it and disappearing down the road. Boxer was never seen again.",
              "simpZh": "一阵惊骇的叫喊从所有动物嘴里迸出。这时赶车人一鞭抽马，货车轻快地出了院子。动物们跟着，拼命喊。苜蓿挤到前头。货车加速了。苜蓿使劲驱动粗壮四肢想飞跑，却只做到慢跑。“拳击手！”她喊，“拳击手！拳击手！拳击手！”恰在这时，仿佛听到外面喧嚷，拳击手的脸，带着鼻梁上白纹，出现在车后小窗口。“拳击手！”苜蓿可怕地喊着，“拳击手！出来！快出来！他们要把你拉去送死！”所有动物齐喊：“出来，拳击手，出来！”可货车已加速远去。不知拳击手听懂了没。一会儿他的脸不见了，车厢里响起擂鼓般蹄声。他在拼命踢。曾几何时，拳击手踢几脚能把货车踢成碎片。可他的力气没了；一会儿蹄声弱下去，消失了。绝望中动物们央求拉车的两匹马停下。“同志，同志！别把你们兄弟送去死啊！”但那两头蠢牲口太笨，不懂发生什么，只抿了抿耳朵加快脚步。拳击手的脸再没出现。太晚了，有动物想到跑前面关五道杠大门；可转眼货车穿过门，消失在路上。拳击手再没见到了。"
            }

          "sectionId": 6,
          "heading": "Squealer's Cover-up and the Memorial Banquet",
          "paragraphs": [
            {
              "en": "Three days later it was announced that he had died in the hospital at Willingdon, in spite of receiving every attention a horse could have. Squealer came to announce the news to the others. He had, he said, been present during Boxer's last hours. “It was the most <span class=\"vocab-trigger\" data-vocab=\"affecting sight\">affecting sight<\/span> I have ever seen!” said Squealer, lifting his trotter and wiping away a tear. “I was at his bedside at the very last. And at the end, almost too weak to speak, he whispered in my ear that his <span class=\"vocab-trigger\" data-vocab=\"sole sorrow\">sole sorrow<\/span> was to have passed on before the windmill was finished. ‘Forward, comrades!’ he whispered. ‘Forward in the name of the Rebellion. Long live Animal Farm! Long live Comrade Napoleon! Napoleon is always right.’ Those were his very last words, comrades.”",
              "zh": "三天后，上面宣布说，尽管他受到了一匹马所能得到的一切照料，还是在威灵顿的医院里去世了。尖啸者来向大家宣布了这个消息。他说，他曾在拳击手临终的时刻守在他身边。“那是我见过的最感人的一幕！”尖啸者说着，抬起蹄子抹了抹眼泪。“我守在他床边，直到最后。临终时，他几乎虚弱得说不出话，附在我耳边低语说，他唯一的遗憾是没能在风车建成前死去。‘前进，同志们！’他低声说，‘以造反的名义前进。动物农场万岁！拿破仑同志万岁！拿破仑永远正确。’同志们，这就是他最后的遗言。”",
              "simpEn": "Three days later it was announced that Boxer had died in the hospital in Willingdon, despite receiving every care a horse could have. Squealer brought the news. He said he had been at Boxer's side during his last hours. 'It was the most touching sight I've ever seen!' said Squealer, lifting his trotter to wipe away a tear. 'I was at his bedside at the very end. At the last, almost too weak to speak, he whispered in my ear that his only sorrow was to pass on before the windmill was finished. \"Forward, comrades!\" he whispered. \"Forward in the name of the Rebellion. Long live Animal Farm! Long live Comrade Napoleon! Napoleon is always right.\" Those were his very last words, comrades.'",
              "simpZh": "三天后宣布，拳击手在威灵顿医院死了，尽管受到了一匹马能得到的一切照料。尖啸者来宣布消息。他说他陪到了拳击手最后时刻。“是我见过最感人的！”尖啸者抬蹄子抹眼泪。“我守在他床边到最后。临终时，他几乎说不出话，附在我耳边低语，说他唯一的遗憾是没看到风车建成。‘前进，同志们！’他低语，‘以造反的名义前进。动物农场万岁！拿破仑同志万岁！拿破仑永远正确。’同志们，这是他最后的遗言。”"
            },
            {
              "en": "Here Squealer's <span class=\"vocab-trigger\" data-vocab=\"demeanour\">demeanour<\/span> suddenly changed. He fell silent for a moment, and his little eyes <span class=\"vocab-trigger\" data-vocab=\"darted suspicious glances\">darted suspicious glances<\/span> from side to side before he proceeded. It had come to his knowledge, he said, that a foolish and wicked rumour had been <span class=\"vocab-trigger\" data-vocab=\"circulated\">circulated<\/span> at the time of Boxer's removal. Some of the animals had noticed that the van which took Boxer away was marked “Horse Slaughterer,” and had actually <span class=\"vocab-trigger\" data-vocab=\"jumped to the conclusion\">jumped to the conclusion<\/span> that Boxer was being sent to the knacker's. It was almost unbelievable, said Squealer, that any animal could be so stupid. Surely, he cried <span class=\"vocab-trigger\" data-vocab=\"indignantly\">indignantly<\/span>, whisking his tail and skipping from side to side, surely they knew their <span class=\"vocab-trigger\" data-vocab=\"beloved Leader, Comrade Napoleon\">beloved Leader, Comrade Napoleon<\/span>, better than that? But the explanation was really very simple. The van had previously been the property of the knacker, and had been bought by the veterinary surgeon, who had not yet painted the old name out. That was how the mistake had arisen.",
              "zh": "说到这里，尖啸者的神色突然变了。他沉默了一瞬，两只小眼睛左右闪出疑虑的目光，才又接着说下去。他说，据他所知，在拳击手被运走的时候，有一个愚蠢而恶毒的谣言在流传。有些动物注意到运走拳击手的那辆车上标着“屠马商”，就当真跳到了拳击手被送到屠马场的结论。尖啸者说，简直不敢相信会有动物这么蠢。他愤慨地叫着，甩着尾巴，来回蹦跳着——难道他们还不够了解他们敬爱的领袖拿破仑同志吗？不过，解释其实非常简单。那辆货车以前是屠马商的财产，后来被兽医买了下来，还没来得及把旧名字涂掉。误会就是这么来的。",
              "simpEn": "At that, Squealer's expression suddenly changed. He paused, his little eyes shooting suspicious glances from side to side before he went on. A foolish and wicked rumor had been spread, he said, when Boxer was taken away. Some animals had noticed the van was marked 'Horse Slaughterer' and had actually jumped to the conclusion that Boxer was being sent to the knacker's. It was almost unbelievable, Squealer said, that any animal could be so stupid. Surely, he cried indignantly, whisking his tail and skipping about, surely they knew their beloved Leader, Comrade Napoleon, better than that? But the explanation was very simple. The van had once belonged to the knacker and had been bought by the veterinary surgeon, who hadn't yet painted out the old name. That was how the mistake happened.",
              "simpZh": "这时尖啸者脸色突然变了。他停了停，小眼睛向左右扫着怀疑的目光，才接着说。他说，拳击手被运走时，有一个又蠢又坏的谣言在传。有些动物注意到那辆车写着“屠马商”，就真跳到拳击手被送进屠马场的结论。尖啸者说简直不敢相信有动物这么蠢。他愤慨地叫着，甩尾巴蹦着——难道他们还不够了解敬爱的领袖拿破仑同志吗？但解释很简单。那车以前是屠马商的，被兽医买下，还没涂掉旧名字。误会就这么来的。"
            },
            {
              "en": "The animals were <span class=\"vocab-trigger\" data-vocab=\"enormously relieved\">enormously relieved<\/span> to hear this. And when Squealer went on to give further graphic details of Boxer's death-bed, the admirable care he had received, and the expensive medicines for which Napoleon had paid without a thought as to the cost, their last doubts disappeared and the sorrow that they felt for their comrade's death was <span class=\"vocab-trigger\" data-vocab=\"tempered\">tempered<\/span> by the thought that at least he had died happy.",
              "zh": "动物们听了这番话，大大松了一口气。接着，尖啸者又继续绘声绘色地描述了拳击手临终时的情景、他所得到的无微不至的照料，以及拿破仑不计成本为他买来的昂贵药品，他们最后的疑虑便消失了，对同志之死的悲伤也因想到他至少死得幸福而有所缓和。",
              "simpEn": "The animals were enormously relieved to hear this. And when Squealer went on to give vivid details of Boxer's deathbed, the wonderful care he had received, and the costly medicines Napoleon had paid for without a thought of the cost, their last doubts disappeared. Their sorrow for their comrade's death was softened by the thought that at least he had died happy.",
              "simpZh": "动物们听了大大松了口气。尖啸者又绘声绘色讲了拳击手临终细节、受到的极好照料和拿破仑不计本钱买的贵重药，他们最后的疑虑消失了。对同志之死的悲伤，因为想到他至少死得幸福而缓和了些。"
            },
            {
              "en": "Napoleon himself appeared at the meeting on the following Sunday morning and pronounced a short <span class=\"vocab-trigger\" data-vocab=\"oration\">oration<\/span> in Boxer's honour. It had not been possible, he said, to bring back their <span class=\"vocab-trigger\" data-vocab=\"lamented comrade's remains\">lamented comrade's remains<\/span> for <span class=\"vocab-trigger\" data-vocab=\"interment\">interment<\/span> on the farm, but he had ordered a large <span class=\"vocab-trigger\" data-vocab=\"wreath\">wreath<\/span> to be made from the laurels in the farmhouse garden and sent down to be placed on Boxer's grave. And in a few days' time the pigs intended to hold a <span class=\"vocab-trigger\" data-vocab=\"memorial banquet\">memorial banquet<\/span> in Boxer's honour. Napoleon ended his speech with a reminder of Boxer's two favourite maxims, “I will work harder” and “Comrade Napoleon is always right” — maxims, he said, which every animal would do well to <span class=\"vocab-trigger\" data-vocab=\"adopt as his own\">adopt as his own<\/span>.",
              "zh": "下一个星期天早上，拿破仑亲自出席了大会，并发表了一篇简短的悼词，追念拳击手。他说，没能把他们深切悼念的同志的遗体运回农场安葬，但已经吩咐人用农庄花园里的月桂编了一只大花圈，送到拳击手的墓前。过几天，猪们还打算为拳击手举办一场纪念宴会。拿破仑在演讲的末尾，再次提起拳击手最喜欢的那两句格言——“我要更加努力地干活”和“拿破仑同志永远正确”——他说，这两句格言，每一个动物都应当把它当成自己的座右铭。",
              "simpEn": "Napoleon himself appeared at the meeting the following Sunday and gave a short speech in Boxer's honour. It hadn't been possible, he said, to bring back their dear departed comrade's body for burial on the farm, but he had ordered a large wreath made from the laurels in the garden to be placed on Boxer's grave. In a few days the pigs would hold a memorial banquet for Boxer. Napoleon ended by reminding everyone of Boxer's two favourite sayings: 'I will work harder' and 'Comrade Napoleon is always right' — sayings, he said, that every animal should make their own.",
              "simpZh": "下个星期天拿破仑亲自到会，为拳击手念了短悼词。他说没办法把大家悼念的同志遗体运回农场安葬，但已叫人用花园里的月桂扎了大花圈送到拳击手坟上。过几天猪们还要为拳击手办纪念宴会。拿破仑最后又提起拳击手最喜欢的两句格言：“我要更卖力干活”和“拿破仑同志永远正确”——他说，每个动物都该把这两句当成自己的座右铭。"
            },
            {
              "en": "On the day appointed for the banquet, a grocer's van drove up from Willingdon and delivered a large wooden <span class=\"vocab-trigger\" data-vocab=\"crate\">crate<\/span> at the farmhouse. That night there was the sound of <span class=\"vocab-trigger\" data-vocab=\"uproarious singing\">uproarious singing<\/span>, which was followed by what sounded like a violent quarrel and ended at about eleven o’clock with a tremendous crash of glass. No one stirred in the farmhouse before noon on the following day, and the word went round that from somewhere or other the pigs had acquired the money to buy themselves another case of whisky.",
              "zh": "在预定的宴会那天，一辆食品杂货店的货车从威灵顿驶来，给农庄住宅送来了一只大木条箱。那天夜里，农庄住宅里传出了喧嚣的唱歌声，随后像是发生了猛烈的争吵，到大约十一点钟时，以一阵巨大的玻璃摔碎声告终。第二天中午之前，住宅里没有谁出来走动，于是消息便传开了，说猪们不知又从哪儿弄到了钱，给自己又买了一箱威士忌。",
              "simpEn": "On the day set for the banquet, a grocer's van from Willingdon delivered a large wooden crate to the farmhouse. That night there was the sound of loud, rowdy singing, followed by what sounded like a violent quarrel, ending around eleven with a loud crash of glass. No one in the farmhouse stirred before noon the next day, and word spread that somehow the pigs had gotten the money to buy themselves another case of whisky.",
              "simpZh": "宴会的日子，一辆杂货店货车从威灵顿驶来，给住宅送了一只大木条箱。那晚传出喧闹的唱歌声，接着像是大吵大闹，到十一点左右以一声巨大的玻璃破碎声收场。第二天中午之前住宅里没动静，消息传开，猪们不知又从哪弄到钱给自己买了一箱威士忌。"

            {
              "en": "Somehow it seemed as though the farm had grown richer without making the animals themselves any richer — except, of course, for the pigs and the dogs. Perhaps this was partly because there were so many pigs and so many dogs. It was not that these creatures did not work, after their fashion. There was, as Squealer was never tired of explaining, endless work in the <span class=\"vocab-trigger\" data-vocab=\"supervision and organisation\">supervision and organisation<\/span> of the farm. Much of this work was of a kind that the other animals were too ignorant to understand. For example, Squealer told them that the pigs had to <span class=\"vocab-trigger\" data-vocab=\"expend enormous labours\">expend enormous labours<\/span> every day upon mysterious things called “<span class=\"vocab-trigger\" data-vocab=\"files\">files<\/span>,” “<span class=\"vocab-trigger\" data-vocab=\"reports\">reports<\/span>,” “<span class=\"vocab-trigger\" data-vocab=\"minutes\">minutes<\/span>,” and “<span class=\"vocab-trigger\" data-vocab=\"memoranda\">memoranda<\/span>.” These were large sheets of paper which had to be closely covered with writing, and as soon as they were so covered, they were burnt in the <span class=\"vocab-trigger\" data-vocab=\"furnace\">furnace<\/span>. This was of the highest importance for the <span class=\"vocab-trigger\" data-vocab=\"welfare of the farm\">welfare of the farm<\/span>, Squealer said. But still, neither pigs nor dogs produced any food by their own labour; and there were very many of them, and their appetites were always good.",

              "simpEn": "Somehow, the farm seemed richer without the animals themselves being any richer — except, of course, for the pigs and the dogs. Maybe that was partly because there were so many pigs and so many dogs. It was not that these creatures didn't work, in their own way. There was, as Squealer never tired of explaining, endless work in supervising and organizing the farm. Much of this was work the other animals were too ignorant to understand. For example, Squealer told them the pigs had to spend huge efforts every day on mysterious things called 'files,' 'reports,' 'minutes,' and 'memoranda.' These were large sheets of paper that had to be filled with writing and then were immediately burned in the furnace. This was very important for the farm's welfare, Squealer said. Yet neither pigs nor dogs produced any food by their own work; and there were very many of them, and their appetites were always good.",
              "simpZh": "不知怎么，农场好像变富了，动物们自己却没富——当然，猪和狗除外。也许一部分是因为猪和狗太多了。不是说它们不干活，有它们自己的干法。尖啸者总不厌其烦地解释，农场的监督和组织有没完没了的工作。很多活其他动物太笨不懂。比如，尖啸者说猪每天要花大力气在什么“档案”、“报告”、“会议记录”、“备忘录”这些神秘东西上。这些是大张纸，要写得密密麻麻，写满就立刻塞炉子里烧掉。这对农场福祉很重要，尖啸者说。可是猪和狗都没靠自己的劳动产粮食，而且它们数量很多，胃口总是很好。"

            {
              "en": "As for the others, their life, so far as they knew, was as it had always been. They were generally hungry, they slept on straw, they drank from the pool, they laboured in the fields; in winter they were troubled by the cold, and in summer by the flies. Sometimes the older ones among them <span class=\"vocab-trigger\" data-vocab=\"racked their dim memories\">racked their dim memories<\/span> and tried to determine whether in the early days of the Rebellion, when Jones's <span class=\"vocab-trigger\" data-vocab=\"expulsion\">expulsion<\/span> was still recent, things had been better or worse than now. They could not remember. There was nothing with which they could compare their present lives: they had nothing to go upon except Squealer's lists of figures, which <span class=\"vocab-trigger\" data-vocab=\"invariably\">invariably<\/span> demonstrated that everything was getting better and better. The animals found the problem <span class=\"vocab-trigger\" data-vocab=\"insoluble\">insoluble<\/span>; in any case, they had little time for <span class=\"vocab-trigger\" data-vocab=\"speculating\">speculating<\/span> on such things now. Only old Benjamin <span class=\"vocab-trigger\" data-vocab=\"professed\">professed<\/span> to remember every detail of his long life and to know that things never had been, nor ever could be much better or much worse — hunger, hardship, and disappointment being, so he said, the <span class=\"vocab-trigger\" data-vocab=\"unalterable law of life\">unalterable law of life<\/span>.",

              "simpEn": "As for the others, their life, as far as they knew, was as it had always been. They were usually hungry, slept on straw, drank from the pool, and worked the fields; in winter they suffered cold, in summer flies. Sometimes the older ones searched their fading memories to try to figure out if the early days after Jones was thrown out were better or worse than now. They couldn't remember. They had nothing to compare with their present lives except Squealer's lists of figures, which always showed that everything was getting better and better. The animals found the problem impossible to solve; anyway, they had little time to think about such things now. Only old Benjamin claimed to remember every detail of his long life and to know that things had never been, and never could be, much better or much worse — hunger, hardship, and disappointment being, he said, the unchangeable law of life.",
              "simpZh": "至于别的动物，他们过的日子，就他们知道的，跟一直来一样。总是饿，睡干草，喝池水，在地里干活；冬天受冻，夏天挨苍蝇烦。有时上年纪的会搜搜模糊的记忆，想弄明白刚赶走琼斯那阵子比现在好还是差。他们记不清了。没东西可跟现在比，除了尖啸者的数字，那些数字总证明一切越来越好。动物们觉得这问题没答案；再说，现在也没多少工夫琢磨这些了。只有老本杰明自称记得一辈子每个细节，知道日子从没变好、也永远不会变好多少或差多少——饥饿、苦累和失望，他说，是生活不变的老规矩。"

        {
          "sectionId": 4,
          "heading": "Undying Hope and the Legend of the Rebellion",
          "paragraphs": [
            {
              "en": "And yet the animals never gave up hope. More, they never lost, even for an instant, their sense of honour and <span class=\"vocab-trigger\" data-vocab=\"privilege\">privilege<\/span> in being members of Animal Farm. They were still the only farm in the whole county — in all England! — owned and operated by animals. Not one of them, not even the youngest, not even the newcomers who had been brought from farms ten or twenty miles away, ever ceased to <span class=\"vocab-trigger\" data-vocab=\"marvel at that\">marvel at that<\/span>. And when they heard the gun booming and saw the green flag fluttering at the <span class=\"vocab-trigger\" data-vocab=\"masthead\">masthead<\/span>, their hearts swelled with <span class=\"vocab-trigger\" data-vocab=\"imperishable pride\">imperishable pride<\/span>, and the talk turned always towards the old heroic days, the expulsion of Jones, the writing of the Seven Commandments, the great battles in which the human invaders had been defeated. None of the old dreams had been <span class=\"vocab-trigger\" data-vocab=\"abandoned\">abandoned<\/span>. The Republic of the Animals which Major had <span class=\"vocab-trigger\" data-vocab=\"foretold\">foretold<\/span>, when the green fields of England should be <span class=\"vocab-trigger\" data-vocab=\"untrodden\">untrodden<\/span> by human feet, was still believed in. Some day it was coming: it might not be soon, it might not be with in the lifetime of any animal now living, but still it was coming. Even the tune of ‘Beasts of England’ was perhaps hummed secretly here and there: at any rate, it was a fact that every animal on the farm knew it, though no one would have dared to sing it aloud. It might be that their lives were hard and that not all of their hopes had been <span class=\"vocab-trigger\" data-vocab=\"fulfilled\">fulfilled<\/span>; but they were conscious that they were not as other animals. If they went hungry, it was not from feeding <span class=\"vocab-trigger\" data-vocab=\"tyrannical\">tyrannical<\/span> human beings; if they worked hard, at least they worked for themselves. No creature among them went upon two legs. No creature called any other creature “Master.” All animals were equal.",
              "zh": "可是动物们从未放弃希望。不止如此，他们更从未有一刻失去过身为动物农场成员的光荣感和特权感。他们依然是整个郡——整个英格兰！——唯一由动物拥有和经营的农场。他们中没有一个，哪怕最年幼的，哪怕那些从十英里、二十英里外买来的新来的，都不曾停止对此惊叹。当他们听见枪声隆隆，看见绿旗在杆头飘扬时，他们的心便因不灭的自豪感而膨胀，话题总是转向昔日的英雄岁月，琼斯的被逐，七条诫律的书写，那些击败人类入侵者的伟大战役。昔日的梦想一个也没有被抛弃。麦哲预言的动物共和国，到那时英格兰的绿色田野上将没有人类的足迹，仍然被信奉着。那一天终会到来：也许不会很快，也许在现在活着的任何动物有生之年都等不到，但终会到来。就连《英格兰兽》的曲调，也许仍有人偷偷地哼唱：不管怎样，农场上每一个动物都会唱它是事实，尽管谁也不敢大声唱出来。也许他们的日子很苦，他们的希望也没有全部实现；但他们清醒地知道，他们与别的动物不同。如果他们挨饿，并不是因为喂养了暴虐的人类；如果他们卖力干活，至少是在为自己而干。他们中间没有谁是两条腿走路的。没有谁管谁叫“主人”。所有动物一律平等。",
              "simpEn": "Yet the animals never gave up hope. Even more, they never lost for a single moment their sense of honor and special pride in belonging to Animal Farm. They were still the only farm in the whole county — in all England! — owned and run by animals. None of them, not even the youngest, not even the newcomers bought from farms ten or twenty miles away, ever stopped being amazed by that. When they heard the gun boom and saw the green flag flying at the top of the pole, their hearts filled with lasting pride, and they always talked of the old heroic days, the throwing out of Jones, the writing of the Seven Commandments, the great battles where the human invaders were beaten. None of the old dreams had been given up. Major's vision of a Republic of the Animals, where England's green fields would be untouched by human feet, was still believed in. It was coming someday: maybe not soon, maybe not while any animal now alive was living, but it was coming. Even the tune of 'Beasts of England' was perhaps secretly hummed here and there: in any case, every animal on the farm knew it, though no one dared sing it aloud. Their lives might be hard, and not all their hopes had come true, but they knew they were different from other animals. If they went hungry, it wasn't to feed cruel humans; if they worked hard, at least they worked for themselves. No creature among them walked on two legs. No creature called another 'Master.' All animals were equal.",
              "simpZh": "但动物们从没放弃希望。甚至，他们一刻也没丢掉过身为动物农场一员的光荣感和特殊自豪。他们还是全郡——全英格兰！——唯一由动物拥有和管理的农场。没有一个，哪怕最小的，哪怕从十英里、二十英里外买来的新来的，不为此惊叹。听到枪响，看到绿旗在杆头飘扬，他们心里就充满不会磨灭的自豪，话题总转到从前的英雄岁月，赶走琼斯，写七戒，打退人类进攻的伟大战役。过去的梦想一个都没丢掉。麦哲预言的动物共和国，英格兰绿色田野上没有人类踏足，他们仍然信。那一天迟早会来：也许不会很快，也许现在活着的动物等不到，可终会来。就连《英格兰野兽》的调子，也许还偷偷有人哼：反正农场里每个动物都会唱，只是没人敢大声唱。也许日子苦，希望也没全实现；可他们清楚自己跟别的动物不一样。如果挨饿，不是喂了暴虐的人；如果卖力干活，至少是为自己干。他们中间没谁两条腿走路。没谁叫谁“主人”。所有动物一律平等。"
            }

            {
              "en": "One day in early summer Squealer ordered the sheep to follow him, and led them out to a piece of <span class=\"vocab-trigger\" data-vocab=\"waste ground\">waste ground<\/span> at the other end of the farm, which had become overgrown with <span class=\"vocab-trigger\" data-vocab=\"birch saplings\">birch saplings<\/span>. The sheep spent the whole day there <span class=\"vocab-trigger\" data-vocab=\"browsing\">browsing<\/span> at the leaves under Squealer's supervision. In the evening he returned to the farmhouse himself, but, as it was warm weather, told the sheep to stay where they were. It ended by their remaining there for a whole week, during which time the other animals saw nothing of them. Squealer was with them for the greater part of every day. He was, he said, teaching them to sing a new song, for which <span class=\"vocab-trigger\" data-vocab=\"privacy\">privacy<\/span> was needed.",
              "zh": "初夏的一天，尖啸者命令绵羊们跟着他，领他们走到农场另一头的一片荒地上，那里已经长满了白桦苗。绵羊们在那里花了一整天，在尖啸者的监督下啃食树叶。到了晚上，他自己回农庄住宅去了，因为天气暖和，就让羊们待在原地。结果他们在那里待了整整一个星期，其他动物根本见不到他们。尖啸者每天大部分时间都和他们在一起。他说，他正在教他们唱一支新歌，这需要安静的环境。",
              "simpEn": "One day in early summer, Squealer told the sheep to follow him and led them to an abandoned piece of land at the far end of the farm, now covered with young birch trees. The sheep spent the whole day there feeding on leaves under Squealer's supervision. In the evening he went back to the farmhouse, but since the weather was warm, he told the sheep to stay where they were. They ended up staying there a whole week, during which the other animals saw nothing of them. Squealer was with them most of every day. He said he was teaching them to sing a new song, and privacy was needed.",

        {
          "sectionId": 6,
          "heading": "The Pigs Walk on Two Legs",
          "paragraphs": [
            {
              "en": "It was just after the sheep had returned, on a pleasant evening when the animals had finished work and were making their way back to the farm buildings, that the terrified <span class=\"vocab-trigger\" data-vocab=\"neighing\">neighing<\/span> of a horse sounded from the yard. <span class=\"vocab-trigger\" data-vocab=\"Startled\">Startled<\/span>, the animals stopped in their tracks. It was Clover's voice. She neighed again, and all the animals broke into a <span class=\"vocab-trigger\" data-vocab=\"gallop\">gallop<\/span> and rushed into the yard. Then they saw what Clover had seen.<br>It was a pig walking on his hind legs.",
              "zh": "绵羊们刚回来，就在一个宜人的傍晚，动物们收工后正朝农舍走回去，院子里忽然传来一匹马受惊的嘶鸣。动物们惊住了，停下了脚步。那是苜蓿的声音。她又嘶叫了一声，所有的动物便撒腿飞奔，冲进院子。这时，他们看见了苜蓿所看到的情景。<br>那是一只用后腿走路的猪。",
              "simpEn": "Just after the sheep returned, on a pleasant evening when the animals had finished work and were heading back to the farm buildings, a terrified horse's neigh came from the yard. Startled, the animals stopped in their tracks. It was Clover. She neighed again, and all the animals broke into a gallop and raced into the yard. Then they saw what Clover had seen. It was a pig walking on its hind legs.",
              "simpZh": "羊们刚回来，一个舒服的傍晚，动物们收工往农舍走，院子里传来一匹马吓坏了的嘶叫。动物们一惊，全站住了。是苜蓿的声音。她又嘶了一声，所有动物撒腿就跑，冲进院子。然后看见了苜蓿看见的东西。是一只猪在用后腿走路。"
            },
            {
              "en": "Yes, it was Squealer. A little <span class=\"vocab-trigger\" data-vocab=\"awkwardly\">awkwardly<\/span>, as though not quite used to supporting his considerable <span class=\"vocab-trigger\" data-vocab=\"bulk\">bulk<\/span> in that position, but with perfect balance, he was <span class=\"vocab-trigger\" data-vocab=\"strolling\">strolling<\/span> across the yard. And a moment later, out from the door of the farmhouse came a <span class=\"vocab-trigger\" data-vocab=\"long file\">long file<\/span> of pigs, all walking on their hind legs. Some did it better than others, one or two were even a <span class=\"vocab-trigger\" data-vocab=\"trifle unsteady\">trifle unsteady<\/span> and looked as though they would have liked the support of a stick, but every one of them made his way right round the yard successfully. And finally there was a tremendous <span class=\"vocab-trigger\" data-vocab=\"baying\">baying<\/span> of dogs and a <span class=\"vocab-trigger\" data-vocab=\"shrill crowing\">shrill crowing<\/span> from the black cockerel, and out came Napoleon himself, <span class=\"vocab-trigger\" data-vocab=\"majestically upright\">majestically upright<\/span>, <span class=\"vocab-trigger\" data-vocab=\"casting haughty glances\">casting haughty glances<\/span> from side to side, and with his dogs <span class=\"vocab-trigger\" data-vocab=\"gambolling\">gambolling<\/span> round him.<br>He carried a whip in his trotter.",
              "zh": "没错，是尖啸者。他有点笨拙，似乎还不太习惯用这种姿势支撑他那庞大的躯体，但却平衡得很好，正悠然地踱着步穿过院子。过了一小会儿，农庄住宅的门里走出一长队猪，全都用后腿走路。有的走得比别个好些，有一两只甚至有点摇摇晃晃，仿佛想要一根棍子支撑，但每一只都成功地绕着院子走了一圈。最后，传来一阵犬类凶猛的狂吠和黑色小公鸡尖锐的啼鸣，拿破仑亲自出来了，他威严地直立着，朝两侧投去傲慢的目光，狗在他身边欢蹦乱跳。<br>他的蹄子里攥着一根鞭子。",
              "simpEn": "Yes, it was Squealer. A bit awkwardly, as if not fully used to holding up his large body in that position, but in perfect balance, he was strolling across the yard. A moment later, a long line of pigs came out from the farmhouse door, all walking on their hind legs. Some did it better than others, one or two were a little unsteady and looked as if they'd like a stick for support, but every one of them successfully made its way around the yard. Finally, with a tremendous baying of dogs and a shrill crow from the black rooster, out came Napoleon himself, standing majestically upright, throwing haughty looks from side to side, with his dogs gambolling around him. He carried a whip in his trotter.",
              "simpZh": "没错，是尖啸者。有点笨拙，好像还不大习惯这样撑着他那大身量，但平衡得很好，正慢慢在院子里踱步。过一会儿，住宅门里走出一长队猪，全用后腿走路。有的走得好些，有一两只还有点摇摇晃晃，像是想要根棍子扶着，可每一只都成功地绕院走了一圈。最后，传来狗凶猛的狂叫和黑公鸡尖锐的啼声，拿破仑自己出来了，威风凛凛地直站着，傲气地向两边扫视，狗在他周围欢蹦。<br>他蹄子里攥着根鞭子。"
            },
            {
              "en": "There was a deadly silence. Amazed, terrified, <span class=\"vocab-trigger\" data-vocab=\"huddling together\">huddling together<\/span>, the animals watched the long line of pigs march slowly round the yard. It was as though the world had turned <span class=\"vocab-trigger\" data-vocab=\"upside-down\">upside-down<\/span>. Then there came a moment when the first shock had worn off and when, in spite of everything — in spite of their terror of the dogs, and of the <span class=\"vocab-trigger\" data-vocab=\"habit\">habit<\/span>, developed through long years, of never complaining, never criticising, no matter what happened — they might have <span class=\"vocab-trigger\" data-vocab=\"uttered some word of protest\">uttered some word of protest<\/span>. But just at that moment, as though at a signal, all the sheep burst out into a tremendous bleating of —<br>“Four legs good, two legs <span class=\"vocab-trigger\" data-vocab=\"BETTER\">BETTER<\/span>! Four legs good, two legs BETTER! Four legs good, two legs BETTER!”<br>It went on for five minutes without stopping. And by the time the sheep had quieted down, the chance to <span class=\"vocab-trigger\" data-vocab=\"utter any protest\">utter any protest<\/span> had passed, for the pigs had marched back into the farmhouse.",
              "zh": "一片死寂。动物们又惊又怕，挤作一团，望着那长长的一列猪绕着院子缓慢行进。仿佛世界已经颠倒了过来。后来，当最初的震惊消褪下去，尽管面对一切——尽管害怕那些狗，尽管多少年来养成了从不抱怨、从不批评、不管发生什么都不吭声的习惯——他们或许会发出几句抗议。可恰恰在这个时刻，仿佛是接到了信号，所有的绵羊突然爆发出雷鸣般的咩叫：<br>“四条腿好，两条腿更好！四条腿好，两条腿更好！四条腿好，两条腿更好！”<br>这喊声持续了五分钟没有停。等到绵羊安静下来，发出任何抗议的机会都已错失，因为猪们已经列队走回农庄住宅里去了。",
              "simpEn": "There was a dead silence. Amazed, terrified, and huddling together, the animals watched the long line of pigs march slowly around the yard. It was as if the world had turned upside-down. Then came a moment when the first shock faded and when, despite everything — despite their fear of the dogs and the habit built over long years of never complaining, never criticizing, no matter what — they might have spoken some word of protest. But just then, as if on a signal, all the sheep burst out into a huge bleating of — 'Four legs good, two legs BETTER! Four legs good, two legs BETTER!' It went on without stopping for five minutes. By the time the sheep quieted down, the chance to protest was gone, because the pigs had marched back into the farmhouse.",
              "simpZh": "一片死一样的静。动物们又惊又怕，挤在一起，看着那长长一队猪慢慢绕着院子走。好像世界倒了个个儿。后来，刚惊吓的劲过了，尽管怕狗，尽管多少年养成了啥也不说、啥也不批评的习惯，他们也许会冒几句抗议。可就在这时，像得了信号一样，所有绵羊突然爆出震耳的咩叫：“四条腿好，两条腿更好！四条腿好，两条腿更好！”一连喊了五分钟没停。等羊安静下来，抗议的机会已经没了，因为猪已经列队走回住宅去了。"
            }

        {
          "sectionId": 7,
          "heading": "The Single Commandment",
          "paragraphs": [
            {
              "en": "Benjamin felt a nose <span class=\"vocab-trigger\" data-vocab=\"nuzzling\">nuzzling<\/span> at his shoulder. He looked round. It was Clover. Her old eyes looked <span class=\"vocab-trigger\" data-vocab=\"dimmer than ever\">dimmer than ever<\/span>. Without saying anything, she tugged gently at his mane and led him round to the end of the big barn, where the Seven Commandments were written. For a minute or two they stood gazing at the <span class=\"vocab-trigger\" data-vocab=\"tarred wall\">tarred wall<\/span> with its white <span class=\"vocab-trigger\" data-vocab=\"lettering\">lettering<\/span>.<br>“My sight is failing,” she said finally. “Even when I was young I could not have read what was written there. But it appears to me that that wall looks different. Are the Seven Commandments the same as they used to be, Benjamin?”<br>For once Benjamin <span class=\"vocab-trigger\" data-vocab=\"consented to break his rule\">consented to break his rule<\/span>, and he read out to her what was written on the wall. There was nothing there now except a single Commandment. It ran:<br>ALL ANIMALS ARE EQUAL<br>BUT SOME ANIMALS ARE MORE EQUAL THAN OTHERS",
              "zh": "本杰明感觉到有鼻子在他肩头轻蹭。他转过头去。是苜蓿。她那双老眼看上去比任何时候都更昏暗。她什么也没说，只是轻轻拽了拽他的鬃毛，领着他绕到大谷仓的尽头，那面写着七条诫律的墙跟前。他们站在那里，望着焦黑的墙壁上白色的字迹，足足有一两分钟。<br>“我的眼力不济了，”她终于开口说，“就算我年轻的时候，也读不出那上面写的什么。但我觉得这面墙看起来不一样了。那七条诫律还跟从前一样吗，本杰明？”<br>这一回，本杰明竟破例答应了，他把墙上所写的东西念给她听。那上面现在除了单独一条诫律外，什么也没有了。上面写的是：<br>所有动物一律平等<br>但有些动物比其他动物更加平等",
              "simpEn": "Benjamin felt a nose nuzzling at his shoulder. He looked around. It was Clover. Her old eyes looked even dimmer than before. Without a word, she gently tugged at his mane and led him to the end of the big barn, where the Seven Commandments were written. For a minute or two they stood looking at the tarred wall with its white letters. 'My sight is failing,' she said finally. 'Even when I was young I couldn't have read what's there. But it seems to me that the wall looks different. Are the Seven Commandments the same as they used to be, Benjamin?' For once Benjamin agreed to break his rule, and he read out to her what was on the wall. There was nothing there now except a single Commandment. It said: ALL ANIMALS ARE EQUAL BUT SOME ANIMALS ARE MORE EQUAL THAN OTHERS",
              "simpZh": "本杰明觉得有鼻子蹭他肩膀。他回头。是苜蓿。她老眼比什么时候都昏。她没出声，轻轻拽拽他的鬃毛，领着他绕到大谷仓那头，七戒写着的墙根。他们站了一两分钟望着黑墙上白字。“我眼不行了，”她最后说，“年轻时也读不懂那上头写的。可我觉得墙看着不一样了。七戒还跟以前一样吗，本杰明？”这一回本杰明破了自己的规矩，把墙上的字念给她听。那上头现在什么都没有了，只有一条戒律。写的是：所有动物一律平等，但有些动物比其他动物更平等。"

            {
              "en": "Mr. Pilkington, of Foxwood, had stood up, his mug in his hand. In a moment, he said, he would ask the present company to drink a toast. But before doing so, there were a few words that he felt it <span class=\"vocab-trigger\" data-vocab=\"incumbent upon him\">incumbent upon him<\/span> to say.<br>It was a source of great satisfaction to him, he said — and, he was sure, to all others present — to feel that a long period of <span class=\"vocab-trigger\" data-vocab=\"mistrust and misunderstanding\">mistrust and misunderstanding<\/span> had now come to an end. There had been a time — not that he, or any of the present company, had shared such <span class=\"vocab-trigger\" data-vocab=\"sentiments\">sentiments<\/span> — but there had been a time when the respected <span class=\"vocab-trigger\" data-vocab=\"proprietors\">proprietors<\/span> of Animal Farm had been regarded, he would not say with <span class=\"vocab-trigger\" data-vocab=\"hostility\">hostility<\/span>, but perhaps with a certain measure of <span class=\"vocab-trigger\" data-vocab=\"misgiving\">misgiving<\/span>, by their human neighbours. Unfortunate incidents had occurred, mistaken ideas had been <span class=\"vocab-trigger\" data-vocab=\"current\">current<\/span>. It had been felt that the existence of a farm owned and operated by pigs was somehow <span class=\"vocab-trigger\" data-vocab=\"abnormal\">abnormal<\/span> and was <span class=\"vocab-trigger\" data-vocab=\"liable to have an unsettling effect\">liable to have an unsettling effect<\/span> in the neighbourhood. Too many farmers had <span class=\"vocab-trigger\" data-vocab=\"assumed, without due enquiry\">assumed, without due enquiry<\/span>, that on such a farm a spirit of <span class=\"vocab-trigger\" data-vocab=\"licence and indiscipline\">licence and indiscipline<\/span> would <span class=\"vocab-trigger\" data-vocab=\"prevail\">prevail<\/span>. They had been nervous about the effects upon their own animals, or even upon their human employees. But all such doubts were now <span class=\"vocab-trigger\" data-vocab=\"dispelled\">dispelled<\/span>. Today he and his friends had visited Animal Farm and inspected every inch of it with their own eyes, and what did they find? Not only the most up-to-date methods, but a discipline and an <span class=\"vocab-trigger\" data-vocab=\"orderliness\">orderliness<\/span> which should be an example to all farmers everywhere. He believed that he was right in saying that the lower animals on Animal Farm did more work and received less food than any animals in the county. Indeed, he and his fellow-visitors today had observed many features which they intended to introduce on their own farms immediately.",
              "zh": "福克斯伍德的皮尔金顿先生站了起来，手里握着杯子。他说，一会儿他将请在座的各位干一杯。但在此之前，他觉得有义务说几句。<br>他说，漫长的互不信任和彼此误解的时期如今已经结束了，这使他感到极为满意——并且他相信，在座的每一位都有同感。曾有一段时间——并不是他或今天在座的哪位怀有这种情绪——但曾有一段时间，人类邻居对可敬的动物农场经营者们，他不想说怀有敌意，但或许带有几分疑虑。不幸的事件发生过，错误的观念曾流传过。人们曾觉得，一座由猪拥有和经营的农场，其存在在某种程度上是不正常的，并且容易给邻近地区带来不安定的影响。太多的农场主在未做恰当调查的情况下，就想当然地认为在这样的农场里，放纵和目无纪律的风气会盛行。他们曾担心这会影响到他们自己的动物，甚至影响到他们的人类雇工。但是，如今所有这些疑虑都烟消云散了。今天他和他的朋友们参观了动物农场，亲眼观察了每一寸土地，他们发现的是什么？不仅是最先进的生产方法，还有一种纪律和秩序，这应该成为各地所有农场主的典范。他相信他可以这么说：动物农场的下层动物比本郡任何动物的活干得更多，而得到的食物却更少。的确，他和他的同行者今天看到了许多特点，打算立刻在自己的农场上推行。",
              "simpEn": "Mr. Pilkington of Foxwood stood up, his mug in hand. In a moment, he said, he would ask everyone to drink a toast. But first, there were a few words he felt he must say. It gave him great satisfaction, he said — and he was sure it gave it to everyone present — to feel that a long period of distrust and misunderstanding was now over. There had been a time — not that he or anyone present had shared such feelings — but there had been a time when the respected owners of Animal Farm were viewed, he wouldn't say with hostility, but perhaps with some doubt, by their human neighbors. Unfortunate incidents had occurred, mistaken ideas had spread. It had been felt that a farm owned and run by pigs was somehow abnormal and likely to have an unsettling effect in the area. Too many farmers had assumed, without proper investigation, that a spirit of lawlessness and lack of discipline would rule on such a farm. They had worried about the effects on their own animals, or even on their human workers. But all such doubts were now gone. Today he and his friends had visited Animal Farm and inspected every inch themselves, and what did they find? Not only the most modern methods, but a discipline and order that should be an example to all farmers everywhere. He believed he was right in saying that the lower animals on Animal Farm did more work and got less food than any animals in the county. Indeed, he and his fellow visitors had seen many things they intended to introduce on their own farms right away.",
              "simpZh": "福克斯伍德的皮尔金顿先生站起来，手里拿着杯子。他说，一会儿他要请在座各位干杯。但干杯之前，他觉得有义务说几句话。他说，漫长的互不信任和误解时期终于结束了，这让他非常满意——他相信在座各位也一样。曾经有一阵子——不是他或在座哪位有这样的想法——但曾经有一阵子，人类邻居对动物农场可敬的业主们，他不愿说有敌意，但也许有几分疑虑。发生过不幸事件，流传过错误想法。人们曾觉得，一个由猪拥有和经营的农场存在本身就不正常，可能给周围带来不安影响。太多农场主没好好调查就想当然，以为这种农场会充满放纵和无纪律的风气。他们曾担心对自己动物甚至对人类雇工的影响。但现在所有这些疑虑都消除了。今天他和朋友们参观了动物农场，亲眼看了每一寸，他们发现了什么？不仅是最先进的方法，还有纪律和秩序，这该成为各地所有农场主的榜样。他相信这么说没错：动物农场的下层动物比本郡任何动物活干得多、吃得少。的确，他和今天同来的人看到了好多特点，打算马上在自己的农场上用。"

            {
              "en": "He would end his remarks, he said, by emphasising once again the friendly feelings that <span class=\"vocab-trigger\" data-vocab=\"subsisted\">subsisted<\/span>, and ought to subsist, between Animal Farm and its neighbours. Between pigs and human beings there was not, and there need not be, any <span class=\"vocab-trigger\" data-vocab=\"clash of interests\">clash of interests<\/span> whatever. Their struggles and their difficulties were one. Was not the labour problem the same everywhere? Here it became apparent that Mr. Pilkington was about to <span class=\"vocab-trigger\" data-vocab=\"spring some carefully prepared witticism\">spring some carefully prepared witticism<\/span> on the company, but for a moment he was too <span class=\"vocab-trigger\" data-vocab=\"overcome by amusement\">overcome by amusement<\/span> to be able to utter it. After much <span class=\"vocab-trigger\" data-vocab=\"choking\">choking<\/span>, during which his various <span class=\"vocab-trigger\" data-vocab=\"chins\">chins<\/span> turned purple, he managed to get it out: “If you have your lower animals to <span class=\"vocab-trigger\" data-vocab=\"contend with\">contend with<\/span>,” he said, “we have our lower classes!” This <span class=\"vocab-trigger\" data-vocab=\"BON MOT\">BON MOT<\/span> set the table in a roar; and Mr. Pilkington once again congratulated the pigs on the low rations, the long working hours, and the general absence of <span class=\"vocab-trigger\" data-vocab=\"pampering\">pampering<\/span> which he had observed on Animal Farm.",
              "zh": "他说，在结束发言时，他要再次强调存在于、也应当存在于动物农场和邻里之间的友好感情。猪和人类之间没有、也不可能有任何利害冲突。他们的斗争和困难是共同的。劳工问题不是到处都一样吗？这时，显然皮尔金顿先生准备向在座众人抛出他精心准备的一句俏皮话了，但一时他笑得说不出话来。他噎了好一阵，好几个下巴都涨成了紫色，终于把话挤了出来：“如果说你们有下等动物要对付，”他说，“我们也有我们的下等阶级！”这句妙语引得满桌哄堂大笑；皮尔金顿先生再次就他观察到的低口粮、长工时和普遍不娇惯动物的现象，向猪们表示了祝贺。",

              "simpZh": "他最后说，要再次强调存在于、也应当存在于动物农场和邻里之间的友好感情。猪和人类之间没有、也不必有丝毫利益冲突。他们的斗争和困难是一样的。劳工问题不是到处都一样吗？这时能看出皮尔金顿先生要抛出他精心准备的俏皮话了，可他一下子笑得太厉害说不出。噎了好一阵，几个下巴都憋紫了，他才挤出来：“要说你们有下等动物要对付，”他说，“我们也有下等阶级！”这句妙语让全桌哄堂大笑；皮尔金顿先生再次对他在动物农场看到的低口粮、长工时和普遍不娇惯动物表示祝贺。"

  (function() {
    const errorBox = document.getElementById("error-message");
    function showError(msg) {
      errorBox.textContent = "❌ " + msg;
      errorBox.style.display = "block";
    }
    const dataEl = document.getElementById("bookDataScript");
    if (!dataEl) { showError("bookDataScript critical execution asset element missing."); return; }
    let bookData;
    try {
      bookData = JSON.parse(dataEl.textContent);
    } catch (e) {
      showError("Data block payload verification failure: " + e.message);
      return;
    }
    if (!bookData.chapters || !Array.isArray(bookData.chapters)) {
      showError("Chapters index layout error or configuration parameters empty.");
      return;
    }

    let currentChapterIndex = null;
    let currentChapter = null;
    let currentSection = 0;
    let currentQuiz = [];
    let isSimplified = false;
    let readingMode = 'sections';
    let currentVocabTrigger = null;

    const READING_MODE_KEY = bookData.title + "_readingMode";
    const PROGRESS_KEY = bookData.title + "_progress";

    const placeholderQuiz = [{ text: "This reading segment does not contain comprehension checkpoints yet.", answer: true, rationale: "Default system placeholder state." }];

    function detectReadingMode(ch) {
      const stored = localStorage.getItem(READING_MODE_KEY);
      if (stored && ['sections','full','pages'].includes(stored)) readingMode = stored;
      else if (ch.sections && ch.sections.length > 0) readingMode = 'sections';
      else readingMode = 'full';
    }

    const readingModeSelect = document.getElementById('readingModeSelect');
    readingModeSelect.addEventListener('change', () => {
      readingMode = readingModeSelect.value;
      localStorage.setItem(READING_MODE_KEY, readingMode);
      if (currentChapter) renderWithMode();
    });

    function populateChapterSelector() {
      const select = document.getElementById("chapterSelect");
      select.innerHTML = "";
      bookData.chapters.forEach((ch, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = "Ch. " + ch.id + ": " + ch.title;
        select.appendChild(opt);
      });
      select.addEventListener("change", (e) => loadChapter(parseInt(e.target.value)));
    }

    function loadChapter(index) {
      currentChapterIndex = index;
      currentChapter = bookData.chapters[index];
      currentSection = 0;
      document.querySelector(".title").textContent = "📖 " + bookData.title + " – Ch. " + currentChapter.id;
      detectReadingMode(currentChapter);
      readingModeSelect.value = readingMode;
      renderWithMode();
      saveFullProgress();
    }

    function renderWithMode() {
      const ch = currentChapter;
      if (!ch) return;
      if (readingMode === 'sections' && ch.sections && ch.sections.length > 0) {
        renderSectionsMode();
      } else if (readingMode === 'pages') {
        renderPagesMode();
      } else {
        renderFullMode();
      }
    }

    function renderFullMode() {
      document.getElementById('sectionTabs').innerHTML = '';
      document.getElementById('sectionProgress').textContent = '';
      const paragraphs = currentChapter.paragraphs || (currentChapter.sections ? currentChapter.sections.flatMap(s => s.paragraphs) : []);
      renderParagraphs(paragraphs);
      const quiz = currentChapter.quiz || [];
      renderQuiz(quiz);
    }

    function renderPagesMode() {
      document.getElementById('sectionTabs').innerHTML = '';
      const paragraphs = currentChapter.paragraphs || (currentChapter.sections ? currentChapter.sections.flatMap(s => s.paragraphs) : []);
      const pageSize = 6;
      const totalPages = Math.ceil(paragraphs.length / pageSize);
      document.getElementById('sectionProgress').textContent = '📄 Page 1 of ' + totalPages + ' (automated content normalization layout bounds)';
      const enDiv = document.getElementById('enContent');
      const zhDiv = document.getElementById('zhContent');
      enDiv.innerHTML = ''; zhDiv.innerHTML = '';
      paragraphs.forEach((p, i) => {
        if (i > 0 && i % pageSize === 0) {
          const pageBreakEn = document.createElement('div');
          pageBreakEn.className = 'page-break';
          pageBreakEn.textContent = '📄 Page ' + (Math.floor(i/pageSize)+1);
          enDiv.appendChild(pageBreakEn);
          const pageBreakZh = document.createElement('div');
          pageBreakZh.className = 'page-break';
          pageBreakZh.textContent = '📄 Page ' + (Math.floor(i/pageSize)+1);
          zhDiv.appendChild(pageBreakZh);
        }
        const enP = document.createElement('p');
        enP.innerHTML = isSimplified ? (p.simpEn || '').replace(/<[^>]*>/g, '') : p.en;
        enDiv.appendChild(enP);
        const zhP = document.createElement('p');
        zhP.textContent = isSimplified ? p.simpZh : p.zh;
        zhDiv.appendChild(zhP);
      });
      const quiz = currentChapter.quiz || [];
      renderQuiz(quiz);
    }

    function renderSectionsMode() {
      const sections = currentChapter.sections;
      if (!sections || sections.length === 0) {
        renderFullMode();
        return;
      }
      const tabContainer = document.getElementById('sectionTabs');
      tabContainer.innerHTML = '';
      sections.forEach((sec, idx) => {
        const tab = document.createElement('button');
        tab.className = 'section-tab';
        if (idx === currentSection) tab.classList.add('active');
        tab.textContent = (idx+1) + '. ' + sec.heading;
        tab.setAttribute('role', 'tab');
        tab.setAttribute('aria-selected', idx === currentSection ? 'true' : 'false');
        tab.setAttribute('tabindex', idx === currentSection ? '0' : '-1');
        tab.addEventListener('click', () => {
          currentSection = idx;
          renderSectionsMode();
          saveFullProgress();
        });
        tabContainer.appendChild(tab);
      });
      const tabs = Array.from(tabContainer.querySelectorAll('.section-tab'));
      tabContainer.addEventListener('keydown', (e) => {
        const idx = tabs.indexOf(document.activeElement);
        if (idx === -1) return;
        if (e.key === 'ArrowRight' && idx < tabs.length-1) {
          e.preventDefault();
          tabs[idx+1].focus();
          tabs[idx+1].click();
        } else if (e.key === 'ArrowLeft' && idx > 0) {
          e.preventDefault();
          tabs[idx-1].focus();
          tabs[idx-1].click();
        }
      });

      document.getElementById('sectionProgress').textContent = 'Section ' + (currentSection+1) + ' of ' + sections.length;

      const sec = sections[currentSection];
      renderParagraphs(sec.paragraphs);
      renderQuiz(sec.quiz || []);
    }

    function renderParagraphs(paragraphs) {
      const enDiv = document.getElementById('enContent');
      const zhDiv = document.getElementById('zhContent');
      enDiv.innerHTML = '';
      zhDiv.innerHTML = '';
      paragraphs.forEach(p => {
        const enP = document.createElement('p');
        enP.innerHTML = isSimplified ? (p.simpEn || '').replace(/<[^>]*>/g, '') : p.en;
        enDiv.appendChild(enP);
        const zhP = document.createElement('p');
        zhP.textContent = isSimplified ? p.simpZh : p.zh;
        zhDiv.appendChild(zhP);
      });
    }

    function renderQuiz(quizArr) {
      const tfContainer = document.getElementById('tfQuestions');
      tfContainer.innerHTML = '';
      const quizToUse = (quizArr && quizArr.length) ? quizArr : placeholderQuiz;
      quizToUse.forEach((q, i) => {
        const div = document.createElement('div');
        div.className = 'quiz-item-wrapper';
        div.innerHTML = `
          <div><strong>${i+1}.</strong> ${q.text} 
            <select class='tf-sel' style='width:auto; display:inline-block; margin-left:0.5rem; padding:0.2rem 0.5rem;'>
              <option value=''>--</option>
              <option value='true'>True</option>
              <option value='false'>False</option>
            </select>
          </div>
          <div class='rationale-container'></div>
        `;
        tfContainer.appendChild(div);
      });
      document.getElementById('tfFeedback').textContent = '';
    }

    document.getElementById('simplifyToggle').addEventListener('click', () => {
      isSimplified = !isSimplified;
      document.getElementById('simpActiveLabel').classList.toggle('active', isSimplified);
      if (currentChapter) renderWithMode();
      document.getElementById('simplifyToggle').textContent = isSimplified ? '📖 Switch back to Original Prose' : '📖 Switch to Simplified Prose';
      hidePopup();
    });

    const popup = document.getElementById('vocabPopup');
    function showPopup(trigger, vocabKey) {
      const def = vocabDefinitions[vocabKey];
      if (!def) return;
      document.getElementById('popupZh').textContent = def.zh;
      document.getElementById('popupExplain').textContent = '📘 ' + def.explain;
      document.getElementById('popupSimple').textContent = '💬 Simple Context: ' + def.simple;
      const rect = trigger.getBoundingClientRect();
      let top = rect.bottom + 8, left = rect.left;
      if (left + 320 > window.innerWidth) left = window.innerWidth - 330;
      if (top + 180 > window.innerHeight) top = rect.top - 180;
      popup.style.top = top + 'px'; popup.style.left = left + 'px';
      popup.classList.add('show'); currentVocabTrigger = trigger;
    }
    function hidePopup() { popup.classList.remove('show'); currentVocabTrigger = null; }
    document.addEventListener('click', function(e) {
      const trig = e.target.closest('.vocab-trigger');
      if (trig && trig !== currentVocabTrigger) {
        e.stopPropagation();
        showPopup(trig, trig.getAttribute('data-vocab'));
      } else if (trig === currentVocabTrigger) hidePopup();
      else if (!e.target.closest('#vocabPopup')) hidePopup();
    });
    document.getElementById('closePopup').addEventListener('click', (e) => { e.stopPropagation(); hidePopup(); });
    window.addEventListener('scroll', () => { if (currentVocabTrigger) hidePopup(); });

    document.getElementById('speakBtn').addEventListener('click', () => {
      if (!window.speechSynthesis) return alert('Local TTS execution context unavailable inside this environment environment framework.');
      speechSynthesis.cancel();
      const paragraphs = currentChapter.paragraphs || (currentChapter.sections ? currentChapter.sections.flatMap(s => s.paragraphs) : []);
      const text = paragraphs.map(p => p.en.replace(/<[^>]*>/g, '')).join(' ');
      const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
      speechSynthesis.speak(u);
    });

    // IMPROVED: Quiz rationale feedback presentation runtime script engine integration.
    document.getElementById('checkTfBtn').addEventListener('click', () => {
      const quizArr = currentChapter.sections && readingMode==='sections' ? (currentChapter.sections[currentSection]?.quiz || []) : (currentChapter.quiz || []);
      const quizToUse = quizArr.length ? quizArr : placeholderQuiz;
      let correct = 0;
      
      const selectors = document.querySelectorAll('.tf-sel');
      selectors.forEach((sel, i) => {
        const val = sel.value;
        const currentItem = quizToUse[i];
        const wrapper = sel.closest('.quiz-item-wrapper');
        const ratBox = wrapper.querySelector('.rationale-container');
        
        if (val === '') {
          sel.style.border = '1px solid #ccc';
          ratBox.style.display = 'none';
          return;
        }

        const userTrue = (val === 'true');
        const correctChoice = (userTrue === currentItem.answer);

        ratBox.style.display = 'block';
        if (correctChoice) {
          sel.style.border = '2px solid green';
          correct++;
          ratBox.style.borderLeft = '4px solid green';
          ratBox.innerHTML = `<span style="color:green; font-weight:bold;">✓ Correct.</span> ${currentItem.rationale ? currentItem.rationale : ''}`;
        } else {
          sel.style.border = '2px solid red';
          ratBox.style.borderLeft = '4px solid red';
          ratBox.innerHTML = `<span style="color:red; font-weight:bold;">✗ Incorrect.</span> ${currentItem.rationale ? currentItem.rationale : ''}`;
        }
      });
      document.getElementById('tfFeedback').textContent = '📊 Processing Complete! Score: ' + correct + ' / ' + quizToUse.length;
    });

    function saveFullProgress() {
      const state = {
        chapterIndex: currentChapterIndex,
        sectionIndex: (readingMode === 'sections' && currentChapter.sections) ? currentSection : 0,
        readingMode: readingMode
      };
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(state));
      updateProgressIndicator();
    }

    function updateProgressIndicator() {
      const saved = localStorage.getItem(PROGRESS_KEY);
      if (saved) {
        try {
          const state = JSON.parse(saved);
          const ch = bookData.chapters[state.chapterIndex];
          if (ch) {
            let info = '📌 Bookmarked Position: Ch. ' + ch.id;
            if (ch.sections && state.sectionIndex) info += ' · ' + ch.sections[state.sectionIndex].heading;
            info += ' | ' + (state.chapterIndex+1) + '/' + bookData.chapters.length + ' modules';
            document.getElementById('progressBox').textContent = info;
          }
        } catch(e) {}
      }
    }

    function restoreProgress() {
      const saved = localStorage.getItem(PROGRESS_KEY);
      if (saved) {
        try {
          const state = JSON.parse(saved);
          const chIndex = state.chapterIndex;
          if (chIndex >= 0 && chIndex < bookData.chapters.length) {
            document.getElementById('chapterSelect').value = chIndex;
            readingMode = state.readingMode || 'sections';
            readingModeSelect.value = readingMode;
            loadChapter(chIndex);
            if (readingMode === 'sections' && bookData.chapters[chIndex].sections) {
              currentSection = state.sectionIndex || 0;
              renderSectionsMode();
            }
            return;
          }
        } catch(e) {}
      }
      loadChapter(0);
    }

    populateChapterSelector();
    restoreProgress();
    updateProgressIndicator();
  })();
</script>
